<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>软考中项知识库 · 刷题实战</title>
<style>
/* ================= 基础 ================= */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:#06080f;color:#e8ecf8;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  min-height:100vh;overflow-x:hidden;font-size:15px;line-height:1.65;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:#0a0d18}
::-webkit-scrollbar-thumb{background:#2a2f4a;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#3d4470}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}

/* ================= 背景特效 ================= */
.bg-fx{position:fixed;inset:0;z-index:-2;overflow:hidden;background:
  radial-gradient(ellipse 80% 50% at 50% -10%, rgba(109,90,224,.16), transparent 60%),
  radial-gradient(ellipse 60% 50% at 100% 100%, rgba(34,211,238,.07), transparent 60%),#06080f}
.bg-fx::before{content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(139,122,255,.045) 1px,transparent 1px),
  linear-gradient(90deg,rgba(139,122,255,.045) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 72%);
  mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 72%)}
.orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:.22;animation:float 22s ease-in-out infinite}
.orb.o1{width:520px;height:520px;background:#6d5ae0;top:-180px;left:-120px}
.orb.o2{width:420px;height:420px;background:#22d3ee;bottom:-140px;right:-120px;animation-delay:-11s;opacity:.12}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.06)}}

/* ================= 顶栏 ================= */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;
  padding:14px 26px;background:rgba(6,8,15,.82);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(139,122,255,.14)}
.logo{display:flex;flex-direction:column;line-height:1.2;flex:none}
.logo b{font-size:19px;background:linear-gradient(90deg,#a78bfa,#22d3ee,#a78bfa);background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:shine 5s linear infinite;letter-spacing:.5px}
.logo span{font-size:11px;color:#7a82a3;letter-spacing:2px}
@keyframes shine{to{background-position:200% center}}
.nav{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.nav button{position:relative;background:transparent;border:1px solid transparent;color:#98a0c0;
  padding:8px 16px;border-radius:999px;font-size:14px;transition:.22s}
.nav button:hover{color:#e8ecf8;background:rgba(139,122,255,.1)}
.nav button.on{color:#fff;background:linear-gradient(135deg,rgba(139,92,246,.28),rgba(34,211,238,.16));
  border-color:rgba(139,122,255,.5);box-shadow:0 0 18px rgba(139,92,246,.28)}
.nav button .nbadge{position:absolute;top:-6px;right:-4px;min-width:17px;height:17px;padding:0 4px;
  border-radius:9px;background:#f87171;color:#fff;font-size:11px;line-height:17px;font-weight:600}
.top-progress{flex:none;text-align:right;font-size:12px;color:#8a92b0}
.top-progress b{display:block;font-size:17px;color:#a78bfa}

/* ================= 布局 ================= */
main{max-width:1180px;margin:0 auto;padding:26px 22px 80px}
.view{display:none;animation:vfade .35s ease}
.view.on{display:block}
@keyframes vfade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* 通用卡片 */
.panel{background:rgba(15,19,36,.72);backdrop-filter:blur(14px);border:1px solid rgba(139,122,255,.16);
  border-radius:16px;padding:22px;transition:.25s}
.panel:hover{border-color:rgba(139,122,255,.34)}
.grad-text{background:linear-gradient(90deg,#a78bfa,#22d3ee);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border-radius:11px;
  border:1px solid rgba(139,122,255,.4);background:rgba(139,92,246,.14);color:#cfc8ff;
  font-size:14px;transition:.2s}
.btn:hover{background:rgba(139,92,246,.3);box-shadow:0 0 16px rgba(139,92,246,.3);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,#6d5ae0,#7c6cf0);color:#fff;border-color:transparent;
  box-shadow:0 4px 20px rgba(109,90,224,.4)}
.btn.primary:hover{box-shadow:0 6px 26px rgba(109,90,224,.6)}
.btn.ghost{background:transparent;border-color:rgba(140,150,200,.25);color:#98a0c0}
.btn.danger{border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.12);color:#fca5a5}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important}

/* ================= 仪表盘 ================= */
.hero{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.hero-info{flex:1;min-width:280px}
.hero-info h1{font-size:26px;margin-bottom:8px;letter-spacing:.5px}
.hero-info p{color:#8a92b0;font-size:14px;max-width:560px}
.hero-exam{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.exam-pill{padding:6px 13px;border-radius:999px;font-size:12.5px;color:#a5b4fc;
  border:1px solid rgba(139,122,255,.3);background:rgba(139,92,246,.09)}
.ring{width:132px;height:132px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ring-in{width:104px;height:104px;border-radius:50%;background:#0b0e1c;display:flex;flex-direction:column;
  align-items:center;justify-content:center;box-shadow:inset 0 0 14px rgba(139,122,255,.18)}
.ring-in b{font-size:24px;color:#fff;font-family:ui-monospace,Consolas,monospace}
.ring-in span{font-size:11px;color:#8a92b0}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{background:rgba(15,19,36,.72);border:1px solid rgba(139,122,255,.16);border-radius:14px;padding:16px 18px;
  transition:.22s;position:relative;overflow:hidden}
.stat:hover{border-color:rgba(139,122,255,.4);transform:translateY(-2px)}
.stat::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,#6d5ae0,#22d3ee)}
.stat b{display:block;font-size:24px;font-family:ui-monospace,Consolas,monospace;color:#fff}
.stat span{font-size:12.5px;color:#8a92b0}
.dash-sec-title{font-size:17px;font-weight:600;margin:26px 0 14px;display:flex;align-items:center;gap:9px}
.dash-sec-title::before{content:'';width:4px;height:18px;border-radius:2px;background:linear-gradient(180deg,#a78bfa,#22d3ee)}
.sec-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.sec-card{background:rgba(15,19,36,.72);border:1px solid rgba(139,122,255,.16);border-radius:16px;padding:18px}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sec-head b{font-size:15.5px}
.sec-head span{font-size:11.5px;color:#8a92b0}
.sec-desc{font-size:12.5px;color:#7a82a3;margin-bottom:12px}
.sec-bar{height:7px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden;margin-bottom:14px}
.sec-bar i{display:block;height:100%;border-radius:99px;transition:width .6s ease}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:5px 11px;border-radius:9px;font-size:12px;color:#98a0c0;border:1px solid rgba(140,150,200,.18);
  cursor:pointer;transition:.18s;background:rgba(255,255,255,.02)}
.chip:hover{color:#fff;border-color:rgba(139,122,255,.5)}
.chip.locked{cursor:not-allowed;opacity:.45;border-style:dashed}
.chip.done{color:#6ee7b7;border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.07)}
.route-card{margin-top:6px}
.route-card ol{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.route-step{padding:13px 15px;border-radius:12px;background:rgba(255,255,255,.03);
  border:1px solid rgba(140,150,200,.14);font-size:13px;color:#a9b1cf}
.route-step b{display:block;color:#e8ecf8;font-size:13.5px;margin-bottom:5px}
.route-step i{font-style:normal;color:#7a82a3;font-size:12px;display:block;margin-top:4px}
.cta-row{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap}

/* ================= 章节学习 ================= */
.learn-wrap{display:grid;grid-template-columns:262px minmax(0,1fr);gap:20px;align-items:start}
.sidebar{position:sticky;top:76px;max-height:calc(100vh - 100px);overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.side-group{background:rgba(15,19,36,.72);border:1px solid rgba(139,122,255,.14);border-radius:14px;padding:14px}
.side-group h4{font-size:12.5px;color:#8a92b0;margin-bottom:9px;display:flex;justify-content:space-between;letter-spacing:1px}
.side-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;font-size:13.5px;
  color:#98a0c0;cursor:pointer;transition:.18s;border:1px solid transparent;margin-bottom:3px}
.side-item:hover{background:rgba(139,92,246,.1);color:#e8ecf8}
.side-item.on{background:linear-gradient(135deg,rgba(139,92,246,.24),rgba(34,211,238,.1));
  color:#fff;border-color:rgba(139,122,255,.5)}
.side-item .num{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#7a82a3;flex:none;width:22px}
.side-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-item .cnt{font-size:11px;color:#7a82a3;font-family:ui-monospace,Consolas,monospace}
.side-item.locked{opacity:.42;cursor:not-allowed}
.side-item.done .cnt{color:#6ee7b7}
.ch-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.ch-head h2{font-size:21px;display:flex;align-items:center;gap:11px}
.ch-head h2 .chno{font-size:12px;font-weight:600;color:#a5b4fc;padding:3px 9px;border-radius:7px;
  border:1px solid rgba(139,122,255,.4);background:rgba(139,92,246,.12);font-family:ui-monospace,Consolas,monospace}
.ch-meta{font-size:12.5px;color:#8a92b0;margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.ch-prog{display:flex;align-items:center;gap:10px;font-size:12.5px;color:#8a92b0}
.ch-prog .sec-bar{width:130px;margin:0}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.fchip{padding:6px 14px;border-radius:999px;font-size:13px;color:#98a0c0;background:rgba(255,255,255,.03);
  border:1px solid rgba(140,150,200,.2);transition:.18s}
.fchip.on{color:#fff;background:rgba(139,92,246,.22);border-color:rgba(139,122,255,.55)}
.kd-card{background:rgba(15,19,36,.72);backdrop-filter:blur(12px);border:1px solid rgba(139,122,255,.16);
  border-radius:16px;padding:20px 22px;margin-bottom:14px;transition:.25s;position:relative}
.kd-card:hover{border-color:rgba(139,122,255,.42);box-shadow:0 0 26px rgba(139,92,246,.12);transform:translateY(-2px)}
.kd-card.mastered{border-color:rgba(52,211,153,.35)}
.kd-card.mastered .kd-title{color:#8aa6b5}
.kd-card.flash{animation:flash 1.6s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 2px rgba(167,139,250,.85),0 0 34px rgba(139,92,246,.5)}100%{box-shadow:none}}
.kd-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.badge{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;letter-spacing:1px;flex:none}
.badge.high{color:#fda4af;background:rgba(248,113,113,.13);border:1px solid rgba(248,113,113,.45);text-shadow:none}
.badge.mid{color:#67e8f9;background:rgba(34,211,238,.11);border:1px solid rgba(34,211,238,.4)}
.badge.low{color:#a1a1b5;background:rgba(160,160,180,.09);border:1px solid rgba(160,160,180,.3)}
.kd-title{font-size:16.5px;font-weight:600;flex:1;min-width:180px}
.stars{color:#fbbf24;font-size:13px;letter-spacing:2px;flex:none}
.kd-acts{display:flex;gap:7px;flex:none}
.kd-acts button{font-size:12px;padding:4px 11px;border-radius:8px;transition:.18s;
  background:transparent;border:1px solid rgba(140,150,200,.25);color:#8a92b0}
.kd-acts button:hover{border-color:rgba(139,122,255,.55);color:#cfc8ff}
.kd-acts button.m-on{border-color:rgba(52,211,153,.55);color:#6ee7b7;background:rgba(52,211,153,.09)}
.kd-acts button.f-on{border-color:rgba(251,191,36,.55);color:#fcd34d;background:rgba(251,191,36,.09)}
.kd-body{color:#c4cbe4;font-size:14.5px}
.kd-body p{margin-bottom:10px}
.kd-body ul,.kd-body ol{margin:8px 0 12px 20px}
.kd-body li{margin-bottom:7px}
.kd-body b{color:#e8ecf8}
.kd-body .pit{border-left:3px solid #f87171;background:rgba(248,113,113,.06);border-radius:0 10px 10px 0;
  padding:10px 14px;margin:12px 0;font-size:13.5px;color:#d6b4bc}
.kd-body .tip{border-left:3px solid #22d3ee;background:rgba(34,211,238,.05);border-radius:0 10px 10px 0;
  padding:10px 14px;margin:12px 0;font-size:13.5px;color:#a9c6d3}
table.kt{width:100%;border-collapse:collapse;margin:12px 0;font-size:13.5px}
table.kt th{background:rgba(139,92,246,.14);color:#cfc8ff;padding:8px 12px;text-align:left;
  border:1px solid rgba(139,122,255,.2);font-weight:600}
table.kt td{padding:8px 12px;border:1px solid rgba(139,122,255,.14);color:#b8c0da}
.mnemo{margin-top:14px;padding:11px 15px;border-radius:11px;font-size:13.5px;
  background:linear-gradient(135deg,rgba(139,92,246,.13),rgba(34,211,238,.07));
  border:1px dashed rgba(139,122,255,.4);color:#c4b5fd}
.mnemo::before{content:'助记';font-size:11px;font-weight:700;letter-spacing:2px;color:#a78bfa;
  border:1px solid rgba(139,122,255,.5);border-radius:6px;padding:1px 7px;margin-right:10px;vertical-align:1px}
.empty-ch{padding:60px 30px;text-align:center;color:#7a82a3}
.empty-ch b{display:block;font-size:17px;color:#a5b4fc;margin-bottom:10px}
.empty-ch .btn{margin-top:16px}

/* ================= 刷题实战 ================= */
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.mode-card{background:rgba(15,19,36,.72);border:1px solid rgba(139,122,255,.18);border-radius:16px;
  padding:24px;cursor:pointer;transition:.25s;position:relative;overflow:hidden}
.mode-card::after{content:'';position:absolute;top:0;left:-70%;width:50%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(167,139,250,.09),transparent);transition:.6s}
.mode-card:hover{border-color:rgba(139,122,255,.5);transform:translateY(-3px);box-shadow:0 8px 30px rgba(109,90,224,.22)}
.mode-card:hover::after{left:120%}
.mode-card h3{font-size:17px;margin-bottom:8px;color:#e8ecf8}
.mode-card p{font-size:13px;color:#8a92b0;margin-bottom:12px}
.mode-card .go{font-size:13px;color:#a78bfa;font-weight:600}
.mode-card.hot{border-color:rgba(34,211,238,.4);background:linear-gradient(160deg,rgba(15,19,36,.8),rgba(24,26,58,.7))}
.quiz-pick h3{font-size:16px;margin-bottom:14px;color:#c4cbe4}
.pick-list{display:flex;flex-direction:column;gap:9px}
.pick-item{display:flex;align-items:center;gap:12px;padding:13px 17px;border-radius:12px;
  background:rgba(255,255,255,.025);border:1px solid rgba(140,150,200,.16);cursor:pointer;transition:.2s}
.pick-item:hover{border-color:rgba(139,122,255,.55);background:rgba(139,92,246,.08)}
.pick-item .pno{font-family:ui-monospace,Consolas,monospace;color:#a78bfa;font-size:13px;flex:none;width:26px}
.pick-item .pnm{flex:1;font-size:14.5px}
.pick-item .pct{font-size:12px;color:#7a82a3;font-family:ui-monospace,Consolas,monospace}
.pick-item.locked{opacity:.4;cursor:not-allowed}
.pick-item.locked:hover{border-color:rgba(140,150,200,.16);background:rgba(255,255,255,.025)}
.qbar{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.qbar .qm{font-size:13px;color:#a78bfa;font-weight:600}
.qbar .qi{font-size:13px;color:#8a92b0;font-family:ui-monospace,Consolas,monospace}
.qbar .qtimer{margin-left:auto;font-family:ui-monospace,Consolas,monospace;color:#67e8f9;font-size:13px;
  padding:3px 11px;border-radius:8px;border:1px solid rgba(34,211,238,.35);background:rgba(34,211,238,.07)}
.qbar .quit{font-size:12.5px;color:#98a0c0;background:none;border:1px solid rgba(248,113,113,.35);
  border-radius:8px;padding:4px 12px;transition:.18s}
.qbar .quit:hover{color:#fca5a5;background:rgba(248,113,113,.09)}
.qprog{height:6px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden;margin-bottom:22px}
.qprog i{display:block;height:100%;background:linear-gradient(90deg,#6d5ae0,#22d3ee);border-radius:99px;transition:width .4s}
.qcard{background:rgba(15,19,36,.72);border:1px solid rgba(139,122,255,.2);border-radius:16px;padding:26px}
.qtext{font-size:16.5px;line-height:1.75;margin-bottom:22px;color:#eef1fb}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{display:flex;align-items:flex-start;gap:13px;padding:14px 16px;border-radius:12px;cursor:pointer;
  border:1px solid rgba(140,150,200,.2);background:rgba(255,255,255,.025);transition:.2s;font-size:14.5px;color:#c4cbe4}
.opt:hover{border-color:rgba(139,122,255,.6);background:rgba(139,92,246,.09)}
.opt .ol{flex:none;width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;color:#98a0c0;border:1px solid rgba(140,150,200,.3);font-family:ui-monospace,Consolas,monospace}
.opt.correct{border-color:rgba(52,211,153,.65);background:rgba(52,211,153,.1);animation:okp .4s ease}
.opt.correct .ol{background:#34d399;color:#06281c;border-color:#34d399}
.opt.wrong{border-color:rgba(248,113,113,.65);background:rgba(248,113,113,.1);animation:shake .35s ease}
.opt.wrong .ol{background:#f87171;color:#3d0a0a;border-color:#f87171}
.opt.dim{opacity:.5}
@keyframes okp{0%{transform:scale(.98)}50%{transform:scale(1.01)}100%{transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.explain{margin-top:18px;padding:16px 19px;border-radius:13px;animation:vfade .3s ease;
  background:rgba(255,255,255,.03);border:1px solid rgba(139,122,255,.25)}
.explain .er{font-weight:700;margin-bottom:7px;font-size:14.5px}
.explain .er.ok{color:#6ee7b7}
.explain .er.no{color:#fda4af}
.explain p{font-size:13.5px;color:#b8c0da;margin-bottom:6px}
.explain .kpoint{display:inline-block;font-size:12px;color:#67e8f9;border:1px solid rgba(34,211,238,.4);
  padding:2px 10px;border-radius:7px;margin-top:6px}
.qnext{margin-top:18px;display:flex;justify-content:flex-end}
.kb-hint{margin-top:14px;font-size:12px;color:#7a82a3;text-align:right}
/* 成绩页 */
.sum-wrap{display:flex;gap:30px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
.sum-info{flex:1;min-width:260px}
.sum-info h2{font-size:22px;margin-bottom:14px}
.sum-stats{display:grid;grid-template-columns:repeat(4,minmax(110px,1fr));gap:12px}
.sum-stats .stat b{font-size:20px}
.review-item{padding:15px 18px;border-radius:12px;border:1px solid rgba(140,150,200,.16);
  background:rgba(255,255,255,.02);margin-bottom:10px;font-size:13.5px}
.review-item.ok{border-color:rgba(52,211,153,.3)}
.review-item.no{border-color:rgba(248,113,113,.35)}
.review-item .rq{color:#d4dbee;margin-bottom:6px}
.review-item .ra{color:#8a92b0;font-size:12.5px}
.review-item .ra b.good{color:#6ee7b7}
.review-item .ra b.bad{color:#fda4af}

/* ================= 错题本 ================= */
.wrong-item{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:13px;
  border:1px solid rgba(248,113,113,.22);background:rgba(248,113,113,.04);margin-bottom:11px;transition:.2s}
.wrong-item:hover{border-color:rgba(248,113,113,.5)}

<script>

====================================================== */
const SECTIONS = [

  {key:'aux', name:'辅助知识',     range:'第15–18章', color:'#fbbf24', desc:'考前突击 · 高性价比'},
];

const CHAPTERS = [
  {id:1,  title:'信息化发展',         sec:'it',  page:1, cards:[
    {t:'信息的定义——香农与比特', f:'high', s:3, m:'1948香农：信息是消除随机不定性的东西；信息是负熵。', b:`
<p><b>经典定义：</b>1948年，数学家<b>香农</b>（Claude E. Shannon）在《通信的数学理论》中提出——<b>信息是用来消除随机不定性的东西</b>。</p>
<ul>
<li><b>信息量的单位：比特（bit）</b>。1比特 = 变异度为2时，消除"非此即彼"不确定性所需的信息量。</li>
<li><b>与熵的关系：</b>熵是系统<b>无序</b>程度的度量；信息是系统<b>有序</b>程度的度量，表现为<b>负熵</b>。</li>
<li><b>数据是信息的基础</b>：信息不是物质也不是能量，它以普遍形式表达物质运动规律，在客观世界中大量存在、产生和传递。</li>
</ul>
<div class="pit"><b>考题坑点：</b>"信息是____"→消除随机不定性的东西。干扰项"信息是不确定性的东西"（少了"消除"二字）、"信息是系统无序程度的度量"（那是熵）都是错的。</div>`},
    {t:'信息的11个特征', f:'high', s:3, m:'客普无动相，依变传层系转——11个一个不能少。', b:`
<table class="kt"><tr><th>特征</th><th>一句话理解</th></tr>
<tr><td>客观性</td><td>客观事物在人脑中的反映；分主观信息（决策、指令、计划）与客观信息（国际形势、经济发展、一年四季）</td></tr>
<tr><td>普遍性</td><td>物质的普遍性决定信息的普遍存在</td></tr>
<tr><td>无限性</td><td>信息总量无限，每个具体事物产生的信息也可以是无限的</td></tr>
<tr><td>动态性</td><td>信息随时间变化而变化</td></tr>
<tr><td>相对性</td><td>不同认识主体从同一事物获取的信息及信息量可能不同</td></tr>
<tr><td>依附性</td><td>不存在无源的信息；信息要依附于一定载体而存在</td></tr>
<tr><td>变换性</td><td>通过处理实现变换或转换</td></tr>
<tr><td>传递性</td><td><b>时间上的传递=存储；空间上的传递=转移或扩散</b></td></tr>
<tr><td>层次性</td><td>客观世界分层次，信息也分层次</td></tr>
<tr><td>系统性</td><td>不同类别信息可形成不同整体，构成信息系统</td></tr>
<tr><td>转化性</td><td>有效使用信息可将信息转化为物质或能量</td></tr></table>
<div class="pit"><b>选择题最爱：</b>"下列不属于信息特征的是"——11个特征里没有的（如"不可存储性""保密性"）就是答案。</div>`},
    {t:'信息的7个质量属性', f:'high', s:3, m:'精完可及经可安；金融重安全，经济重及时。', b:`
<table class="kt"><tr><th>属性</th><th>说明</th><th>应用侧重</th></tr>
<tr><td>精确性</td><td>对事物状态描述的精准程度</td><td>—</td></tr>
<tr><td>完整性</td><td>对事物状态描述的全面程度</td><td>—</td></tr>
<tr><td>可靠性</td><td>来源、采集方法、传输过程可信任</td><td>—</td></tr>
<tr><td>及时性</td><td>获得信息的时刻与事件发生时刻的间隔长短</td><td><b>经济与社会信息最重要</b></td></tr>
<tr><td>经济性</td><td>信息获取、传输成本在可接受范围</td><td>—</td></tr>
<tr><td>可验证性</td><td>信息的主要质量属性可被证实或证伪</td><td>—</td></tr>
<tr><td>安全性</td><td>被非授权访问的可能性越低，安全性越高</td><td><b>金融信息最重要</b></td></tr></table>
<div class="tip">信息价值的大小取决于信息的质量——质量越高，价值越大。两个"最重要"是高频考题。</div>`},
    {t:'信息传输模型六要素', f:'high', s:3, m:'源宿道、编译噪；性能高低看编码。', b:`
<figure class="kd-fig">
<div class="dg">
  <div class="dg-row">
    <div class="dg-box"><b>信源</b><span>产生信息的实体</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>编码器</b><span>量化器 · 压缩编码器 · 调制器 · 加密设备</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box" style="border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.05)"><b style="color:#fda4af">信道 + 噪声</b><span>光纤 / 同轴电缆 / 双绞线 / 移动通信 / 卫星 / 微波</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>译码器</b><span>解调器 · 译码器 · 数模转换器（编码的逆变换）</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>信宿</b><span>信息的归宿 / 接收者</span></div>
  </div>
</div>
<figcaption>信息传输模型：噪声可来自信息系统分层结构的任何一层</figcaption>
</figure>
<ul>
<li>信息系统性能指标：<b>有效性</b>和<b>可靠性</b>。</li>
<li>当信源、信宿、信道确定后，<b>决定信息系统性能的关键是编码器和译码器</b>。</li>
<li>增加冗余编码（"重要的话说三遍"）可提高可靠性，但过量冗余编码会<b>降低有效性和传输速率</b>。</li>
</ul>
<div class="pit"><b>易混点：</b>编码器泛指所有变换信号的设备，不是一台机器；译码器是编码器的<b>逆变换</b>设备。</div>`},
    {t:'系统的9个特性', f:'mid', s:2, m:'目整层稳突，自相相环。', b:`
<table class="kt"><tr><th>特性</th><th>一句话理解</th></tr>
<tr><td>目的性</td><td>定义/组成/抽象一个系统都有明确目标，目标性决定系统功能</td></tr>
<tr><td>整体性</td><td>元素按一定原则有序排列，产生系统特定功能</td></tr>
<tr><td>层次性</td><td>系统和元素是相对概念，系统可成为更高一级系统的元素（子系统）</td></tr>
<tr><td>稳定性</td><td>受规则约束，内部结构和秩序可预见</td></tr>
<tr><td>突变性</td><td>通过失稳从一种状态进入另一种状态的剧烈变化（质变的基本形式）</td></tr>
<tr><td>自组织性</td><td>开放系统自发组织，从无序到有序、从低级有序到高级有序</td></tr>
<tr><td>相似性</td><td>系统具有同构和同态性质</td></tr>
<tr><td>相关性</td><td>元素可分且相互联系，有明确边界</td></tr>
<tr><td>环境适应性</td><td>系统与环境发生物质和能量交换</td></tr></table>
<div class="pit"><b>数字考点：</b>系统特性9个、信息特征11个、质量属性7个——"数字本身"就能出选择题。</div>`},
    {t:'信息系统定义与三大特性', f:'high', s:3, m:'信息系统=管理模型+信息处理模型+系统实现条件。', b:`
<p><b>定义：</b>信息系统是通过对输入的数据进行加工处理，产生信息的系统。</p>
<figure class="kd-fig">
<div class="dg dg-3">
  <div class="dg-box" style="border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.05)"><b style="color:#a5e8f5">开放性</b><span>系统的可访问性 · 体现在有清晰描述并被准确识别和理解的接口层</span></div>
  <div class="dg-box" style="border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.05)"><b style="color:#fda4af">脆弱性</b><span>可能丧失结构、功能、秩序 · 隐蔽且不易被外界感知</span></div>
  <div class="dg-box" style="border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.05)"><b style="color:#6ee7b7">健壮性（鲁棒性）</b><span>抵御非预期状态的能力 · 高可用系统采用冗余、容错、身份识别、可靠性技术</span></div>
</div>
<figcaption>信息系统三大突出特性——"开放、脆弱、健壮"三个名字必背</figcaption>
</figure>
<p><b>按用途分类：</b>电子商务系统、事务处理系统、管理信息系统、生产制造系统、电子政务系统、决策支持系统等。</p>`},
    {t:'信息系统生命周期', f:'high', s:3, m:'规分设施维五阶段；立项开发运维消亡四阶段。', b:`
<table class="kt"><tr><th>阶段</th><th>核心任务</th><th>输出文档</th></tr>
<tr><td>系统规划（立项）</td><td>初步调查、确定发展战略、可行性研究</td><td>可行性研究报告 → 系统设计任务书</td></tr>
<tr><td>系统分析（需求分析）</td><td>详细调查、描述业务流程、建立<b>逻辑模型</b>（关键阶段）</td><td><b>系统说明书</b>（确认需求的基础、设计依据、验收依据）</td></tr>
<tr><td>系统设计</td><td>设计<b>物理模型</b>（概要设计+详细设计）</td><td>系统设计说明书</td></tr>
<tr><td>系统实施</td><td>设备购置安装调试、程序编写调试、人员培训、数据转换</td><td>实施进展报告、系统测试分析报告</td></tr>
<tr><td>系统运行和维护</td><td>维护、评价、记录运行情况</td><td>—</td></tr></table>
<ul>
<li>简化四阶段：<b>立项 → 开发 → 运维 → 消亡</b>。</li>
<li>从项目管理角度：项目生命周期划分为<b>启动、计划、执行、收尾</b>四个典型阶段。</li>
</ul>
<div class="pit"><b>两大坑：</b>① 系统分析又称<b>逻辑设计</b>阶段，回答"做什么"；系统设计又称<b>物理设计</b>阶段，回答"怎么做"。② 系统分析是信息系统建设与一般工程项目的重要区别，是<b>关键阶段</b>。</div>`},
    {t:'信息化内涵四要素', f:'mid', s:2, m:'网络体系、产业基础、运行环境、效用积累。', b:`
<p><b>信息化定义：</b>培育、发展以计算机为主的智能化工具为代表的新生产力，并使之造福于社会的历史过程。</p>
<ul>
<li><b>信息网络体系</b>——信息资源、各种信息系统和公用通信网络平台等。</li>
<li><b>信息产业基础</b>——信息科学技术研究与开发、信息装备制造和信息咨询服务等。</li>
<li><b>社会运行环境</b>——现代工农业、管理体制、政策法律、规章制度、文化教育和道德观念等。</li>
<li><b>效用积累过程</b>——劳动者素质、国家现代化水平和人民生活质量的不断提高等。</li>
</ul>
<p><b>组织信息化趋势：</b>产品信息化、产业信息化、社会生活信息化、国民经济信息化。</p>
<p><b>国家信息化"三步走"（2016年《国家信息化发展战略纲要》）：</b>2020年核心关键技术部分领域达到国际先进水平 → 2025年建成国际领先的移动通信网络 → 21世纪中叶信息化全面支撑社会主义现代化国家建设。《"十四五"国家信息化规划》发展重点聚焦：数据治理、密码区块链技术、信息互联互通、智能网联、网络安全。</p>`},
    {t:'国家信息化体系六要素', f:'high', s:3, m:'资源核心、网络基础、应用龙头、产业物质、人才根本、法规保障。', b:`
<p>1997年首届全国信息化工作会议定义，六要素构成有机整体：</p>
<table class="kt"><tr><th>要素</th><th>地位 / 作用</th></tr>
<tr><td>信息资源</td><td><b>核心任务</b>，国家信息化建设取得实效的关键，衡量国家信息化水平的重要标志</td></tr>
<tr><td>信息网络</td><td>信息资源开发利用的<b>基础设施</b>（电信网、广播电视网、计算机网络）</td></tr>
<tr><td>信息技术应用</td><td><b>龙头</b>，国家信息化建设的<b>主阵地</b>，集中体现需求和效益</td></tr>
<tr><td>信息技术和产业</td><td>信息化的<b>物质基础</b></td></tr>
<tr><td>信息化人才</td><td><b>成功之本</b>，合理的人才结构是核心和关键</td></tr>
<tr><td>信息化政策法规和标准规范</td><td>快速、有序、健康和持续发展的<b>保障</b></td></tr></table>
<div class="pit"><b>高频陷阱：</b>"龙头"与"核心任务"最易互换——<b>信息技术应用是龙头</b>，<b>信息资源是核心任务</b>。"主阵地、集中体现需求和效益"说的都是信息技术应用。</div>`},
    {t:'新型基础设施建设（新基建）', f:'high', s:3, m:'信息技新、融合用新、创新台新。', b:`
<p>2018年<b>中央经济工作会议</b>首次提出。七大领域：5G基建、特高压、城际高速铁路和城际轨道交通、新能源汽车充电桩、大数据中心、人工智能、工业互联网。</p>
<table class="kt"><tr><th>三大类</th><th>内容</th><th>特点</th></tr>
<tr><td>信息基础设施</td><td>①通信网络基础设施（5G、物联网、工业互联网、卫星互联网）；②新技术基础设施（人工智能、云计算、区块链）；③算力基础设施（数据中心、智能计算中心）</td><td>凸显"<b>技术新</b>"</td></tr>
<tr><td>融合基础设施</td><td>深度应用互联网、大数据、人工智能等技术支撑传统基础设施转型升级——智能交通基础设施、智慧能源基础设施等</td><td>重在"<b>应用新</b>"</td></tr>
<tr><td>创新基础设施</td><td>支撑科学研究、技术开发、产品研制的具有公益属性的基础设施——重大科技基础设施、科教基础设施、产业技术创新基础设施</td><td>强调"<b>平台新</b>"</td></tr></table>
<div class="tip"><b>归类技巧：</b>看到"5G/AI/云计算/数据中心"→信息基础设施；"智慧交通/智慧能源"→融合基础设施；"重大科技/科教设施"→创新基础设施。</div>`},
    {t:'工业互联网四大层级', f:'high', s:3, m:'网络基础、平台中枢、数据要素、安全保障。', b:`
<p><b>定义：</b>新一代信息通信技术与工业经济深度融合的新型基础设施、应用模式和工业生态，通过对人、机、物、系统等的全面连接，构建覆盖全产业链、全价值链的全新制造和服务体系，是<b>第四次工业革命的重要基石</b>。</p>
<figure class="kd-fig">
<div class="dg dg-2">
  <div class="dg-box" style="border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.05)"><b style="color:#a5e8f5">网络体系 · 基础</b><span>网络互联 · 数据互通 · 标识解析；我国标识解析体系含五大国家顶级节点；企业内网 IT 与 OT 走向融合</span></div>
  <div class="dg-box" style="border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)"><b style="color:#cfc8ff">平台体系 · 中枢</b><span>边缘层 / IaaS / PaaS / SaaS 四层级 · 工业互联网的"操作系统" · 四大作用：数据汇聚、建模分析、知识复用、应用创新</span></div>
  <div class="dg-box" style="border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.05)"><b style="color:#fde68a">数据体系 · 要素</b><span>数据三特性：重要性 · 专业性 · 复杂性</span></div>
  <div class="dg-box" style="border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.05)"><b style="color:#fda4af">安全体系 · 保障</b><span>安全三大特点：涉及范围广 · 造成影响大 · 企业防护基础弱</span></div>
</div>
<figcaption>"网络是基础、平台是中枢、数据是要素、安全是保障"——四词配对是必考点</figcaption>
</figure>
<div class="pit"><b>经典错配陷阱：</b>选项常把四词交叉错配（如"平台为基础、网络为中枢"），牢记固定搭配：网基、平中、数要、安保。</div>`},
    {t:'工业互联网六大应用模式', f:'high', s:3, m:'平智网个服数：设计、制造、协同、定制、延伸、管理。', b:`
<table class="kt"><tr><th>模式</th><th>关键词</th></tr>
<tr><td>平台化设计</td><td>依托平台汇聚设计资源</td></tr>
<tr><td>智能化制造</td><td>机器代替人工生产，代表制造业未来发展趋势</td></tr>
<tr><td>网络化协同</td><td>跨部门、跨层级、跨企业的数据互通和业务互联</td></tr>
<tr><td>个性化定制</td><td><b>用户在产品全生命周期深度参与</b></td></tr>
<tr><td>服务化延伸</td><td>从出售产品向出售"<b>产品+服务</b>"转变</td></tr>
<tr><td>数字化管理</td><td>打通核心数据链，数据驱动的高效运营管理新模式</td></tr></table>
<div class="tip">场景判断题眼：看到"用户深度参与"选个性化定制；"卖产品变卖服务"选服务化延伸；"跨企业协同"选网络化协同。</div>`},
    {t:'城市物联网与八大应用', f:'mid', s:2, m:'通信识别、智能化、互联性。', b:`
<p><b>物联网定义：</b>通过信息传感设备，按约定的协议，将任意物体与网络相连接，实现智能化识别、定位、跟踪、监管等功能。<b>主要特征：通信与识别、智能化、互联性</b>。智慧城市重要特征：系统感知、传递可靠、高度智能。</p>
<table class="kt"><tr><th>八大领域</th><th>典型应用</th></tr>
<tr><td>智慧物流</td><td>仓储管理、运输监测、冷链物流</td></tr>
<tr><td>智能交通</td><td>智能公交车、共享单车、车联网、智慧停车、智能红绿灯、汽车电子标识（RFID）、充电桩、高速无感收费</td></tr>
<tr><td>智能安防</td><td>门禁、监控（以视频监控为主）、报警三大系统</td></tr>
<tr><td>智慧能源环保</td><td>智能水表、智能电表、智能燃气表、智慧路灯、智慧井盖</td></tr>
<tr><td>智能医疗</td><td>对人的智能化管理（可穿戴设备）、对物的智能化管理（RFID）</td></tr>
<tr><td>智慧建筑</td><td>照明用电、消防监测、智慧电梯、楼宇监测、白蚁监测</td></tr>
<tr><td>智能家居</td><td>单品连接 → 物联动 → 平台集成三阶段</td></tr>
<tr><td>智能零售</td><td>无人便利店和自动售货机（近场零售）</td></tr></table>`},
    {t:'乡村振兴与数字乡村', f:'mid', s:2, m:'2035基本实现，21世纪中叶全面建成。', b:`
<p>2019年《数字乡村发展战略纲要》：数字乡村是乡村振兴的战略方向，也是数字中国建设的重要内容。</p>
<ul>
<li><b>到2035年</b>：数字乡村建设取得长足进展，城乡"数字鸿沟"大幅缩小，<b>农业农村现代化基本实现</b>。</li>
<li><b>到21世纪中叶</b>：全面建成数字乡村，助力乡村全面振兴。</li>
</ul>
<p><b>十项重点任务：</b>加快乡村信息基础设施建设、发展农村数字经济、强化农业农村科技创新供给、建设智慧绿色乡村、繁荣发展乡村网络文化、推进乡村治理能力现代化、深化信息惠民服务、激发乡村振兴内生动力、推动网络扶贫向纵深发展、统筹推动城乡信息化融合发展。</p>`},
    {t:'两化融合', f:'high', s:3, m:'技术、产品、业务、产业衍生。', b:`
<p><b>定义：</b>信息化和工业化的<b>高层次深度结合</b>，以信息化带动工业化、以工业化促进信息化，走新型工业化道路。<b>核心是信息化支撑，追求可持续发展模式</b>。</p>
<table class="kt"><tr><th>四个方面</th><th>含义</th><th>例子</th></tr>
<tr><td>技术融合</td><td>工业技术与信息技术融合产生新技术</td><td>汽车电子技术、工业控制技术</td></tr>
<tr><td>产品融合</td><td>电子信息技术渗透到产品中</td><td>数控机床、智能家电、遥控飞机</td></tr>
<tr><td>业务融合</td><td>信息技术应用到研发设计、生产制造、经营管理、市场营销等环节</td><td>管理信息化建设</td></tr>
<tr><td>产业衍生</td><td>催生新产业</td><td>工业电子、工业软件、工业信息服务业</td></tr></table>
<div class="tip"><b>关联考点：</b>《中国制造2025》把<b>智能制造</b>作为两化深度融合的<b>主攻方向</b>。</div>`},
    {t:'智能制造与能力成熟度', f:'high', s:3, m:'五自新生产；五级：规划、规范、集成、优化、引领。', b:`
<p><b>定义：</b>基于新一代信息通信技术与先进制造技术深度融合，具有<b>自感知、自学习、自决策、自执行、自适应</b>等功能的新型生产方式。</p>
<p><b>能力要素四方面（GB/T 39116）：</b>人员（组织战略、人员技能）、技术（数据、集成、信息安全）、资源（装备、网络）、制造（设计、生产、物流、销售、服务）。</p>
<figure class="kd-fig">

  <div class="dg-bar"><span class="dg-blab">一级 规划级</span><div class="dg-btrack"><i style="width:20%"></i></div><span class="dg-bval">流程化</span></div>
  <div class="dg-bar"><span class="dg-blab">二级 规范级</span><div class="dg-btrack"><i style="width:40%"></i></div><span class="dg-bval">单点共享</span></div>
  <div class="dg-bar"><span class="dg-blab">三级 集成级</span><div class="dg-btrack"><i style="width:60%"></i></div><span class="dg-bval">跨业务共享</span></div>

    {t:'服务现代化与消费互联网', f:'mid', s:2, m:'结合、绑定、延伸三融合。', b:`
<p><b>现代服务业四大类：</b>基础服务（通信服务和信息服务）、生产和市场服务（金融、物流、批发、电子商务、农业支撑服务、中介和咨询等专业服务）、个人消费服务（教育、医疗保健、住宿、餐饮、文化娱乐、旅游、房地产、商品零售）、公共服务（政府公共管理服务、基础教育、公共卫生、医疗、公益性信息服务）。</p>
<table class="kt"><tr><th>三大融合形态</th><th>含义</th><th>例子</th></tr>
<tr><td>结合型融合</td><td>中间投入品中服务/制造投入比例越来越大</td><td>生产性服务业</td></tr>
<tr><td>绑定型融合</td><td>制造业产品必须与相应服务绑定使用</td><td>电脑与操作系统软件</td></tr>
<tr><td>延伸型融合</td><td>服务业引导周边衍生产品生产</td><td>电影、动漫、体育赛事的衍生品</td></tr></table>
<p><b>消费互联网：</b>本质是个人虚拟化和增强个人生活消费体验。两大属性：<b>媒体属性</b>（自媒体、社会媒体、资讯为主的门户网站）+ <b>产业属性</b>（在线旅行、为消费者提供生活服务的电子商务等）。社交网络信息传输特征：<b>永生性、无限性、即时性、方向性</b>。</p>`},
    {t:'数字经济四大构成', f:'high', s:3, m:'数字产业化打基础，产业数字化是主体。', b:`
<p>数字中国主要包括：<b>数字经济、数字社会、数字政府、数字生态</b>，核心是以数字化转型整体驱动生产方式、生活方式和治理方式变革。数字经济本质是建立在信息与通信技术重大突破基础上的<b>新的技术经济范式</b>。</p>
<figure class="kd-fig">
<div class="dg dg-2">
  <div class="dg-box" style="border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.05)"><b style="color:#a5e8f5">数字产业化（基础）</b><span>统计分类前4大类：数字产品制造业、数字产品服务业、数字技术应用业、数字要素驱动业；重点：云计算、大数据、物联网、工业互联网、区块链、人工智能、VR/AR</span></div>
  <div class="dg-box" style="border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)"><b style="color:#cfc8ff">产业数字化（第5大类）</b><span>以数据为关键要素、以价值释放为核心、以数据赋能为主线，对产业链上下游全要素数字化升级、转型和再造</span></div>
  <div class="dg-box" style="border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.05)"><b style="color:#fde68a">数字化治理</b><span>用数据说话、用数据决策、用数据管理、用数据创新；三方面内涵：对数据的治理、运用数字技术进行治理、对数字融合空间进行治理</span></div>
  <div class="dg-box" style="border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.05)"><b style="color:#6ee7b7">数据价值化</b><span>数据资源化 → 数据资产化 → 数据资本化</span></div>
</div>
<figcaption>《数字经济及其核心产业统计分类(2021)》：数字经济四大构成</figcaption>
</figure>
<p><b>产业数字化典型特征：</b>以数字科技变革生产工具、以数据资源为关键生产要素、以数字内容重构产品结构、以信息网络为市场配置纽带、以服务平台为产业生态载体、以数字善治为发展机制条件。"六链融合"：产业链、创新链、供应链、要素链、资金链、政策链。</p>`},
    {t:'数据价值化"三化"框架', f:'high', s:3, m:'资源化用值，资产化换值（核心），资本化配置。', b:`
<table class="kt"><tr><th>阶段</th><th>内容</th><th>本质</th></tr>
<tr><td>数据资源化</td><td>使无序、混乱的原始数据成为有序、有使用价值的数据资源</td><td>提升数据质量，形成<b>使用价值</b></td></tr>
<tr><td>数据资产化</td><td>数据通过流通交易带来经济利益</td><td>形成<b>交换价值</b>，实现价值的核心</td></tr>

    {t:'数字政府', f:'high', s:3, m:'共享、互通、便利；一网通办、跨省通办、一网统管。', b:`
<p><b>定义：</b>以新一代信息技术为支撑，以"<b>业务数据化、数据业务化</b>"为着力点，通过数据驱动重塑政务信息化管理架构、业务架构和组织架构，形成"用数据决策、数据服务、数据创新"的现代化治理模式。</p>
<ul>
<li><b>新特征五项：</b>协同化、云端化、智能化、数据化、动态化。</li>
<li><b>三个关键词：共享、互通、便利</b>——没有"交易"（经典陷阱）。</li>
<li><b>一网通办：</b>打通不同政府部门的信息系统，群众只需操作一个办事系统就能办成不同领域的事项，"线上办事只登录一次即可全网通办"。</li>
<li><b>跨省通办三种办理模式：</b>全程网办、代收代办、多地联办。</li>
<li><b>一网统管：</b>重点强调一网（政务云、政务网、政务大数据中心）、一屏（城市运行情况反映）、联动、预警、创新。</li>
</ul>
<p><b>能力体系七个方面：</b>经济运行大数据监测分析提升经济调节能力、智慧监管提升市场监管能力、数字化治理模式创新提升社会管理能力、利企便民数字化服务提升公共服务能力、动态感知和立体防控提升生态环境保护能力、数字机关建设提升政务运行效能、公开平台智能集约发展提升政务公开水平。</p>`},
    {t:'数字社会与智慧城市五要素', f:'high', s:3, m:'数治孪生、边际融合态势；规划管协优引。', b:`
<p><b>数字民生三个重点：</b>普惠、赋能、利民。数字生活三个方面：生活工具数字化、生活方式数字化、生活内容数字化。数字乡村是乡村振兴的战略方向和数字中国建设的重要内容。</p>
<table class="kt"><tr><th>智慧城市五个核心能力要素</th><th>要点</th></tr>
<tr><td>数据治理</td><td>围绕数据这一新的生产要素进行能力构建</td></tr>
<tr><td>数字孪生</td><td>围绕现实世界与信息世界的互动融合进行能力构建</td></tr>
<tr><td>边际决策</td><td>基于决策算法和信息应用，强化执行端的决策能力</td></tr>
<tr><td>多元融合</td><td>强调社会关系和社会活动的动态性及融合的高效性</td></tr>
<tr><td>态势感知</td><td>围绕对社会状态的本质反映及模拟预测进行能力构建</td></tr></table>
<p><b>智慧城市成熟度五级：</b>规划级（策划、明确职责分工、初步数据采集）→ 管理级（明确发展战略、基础设施智能化改造、信息系统单项应用）→ 协同级（多业务、多层级、跨领域应用系统集成，信息资源共享交换）→ 优化级（基于数据与知识模型实施精准化治理，数据要素价值挖掘）→ 引领级（敏捷发展能力，物理空间、社会空间、信息空间融合演进）。</p>
<div class="pit"><b>对比坑：</b>智慧城市第二级是<b>管理级</b>；智能制造第二级是<b>规范级</b>。第四、五级（优化级、引领级）两者名称相同。</div>`},
    {t:'数字生态', f:'mid', s:2, m:'数据要素：劳动工具+劳动对象双重属性。', b:`
<ul>
<li><b>数据要素市场：</b>数据作为新型生产要素，具有<b>劳动工具和劳动对象双重属性</b>；数据流通是核心环节。</li>
<li><b>数字营商环境：</b>全球数字营商环境评价指标体系 5 个一级指标——数字支撑体系、数据开发利用与安全、数字市场准入、数字市场规则、数字创新环境。</li>
<li><b>网络安全保护五大举措：</b>健全法律法规制度标准、加强风险评估和审查、加强基础设施建设、推动教育技术产业融合发展、加强国际交流合作。</li>
</ul>`},
    {t:'数字化转型', f:'mid', s:2, m:'四大驱动：生产力、生产要素、传播效率、智慧主体。', b:`
<p><b>定义：</b>建立在数字化转换、数字化升级基础上，进一步触及组织核心业务，以新建一种业务模式为目标的高层次转型。</p>
<ul>
<li><b>四大驱动因素：</b>①生产力飞升（第四次科技革命）；②生产要素变化（数据要素诞生，与土地、劳动力、资本、技术并列）；③信息传播效率突破（社会互联网新格局）；④社会"智慧主体"规模扩容（快速复制与"智能+"）。</li>
<li><b>四个科学范式：</b>经验范式 → 理论范式 → 模拟范式 → <b>数据密集型研究范式</b>（第四范式）。</li>
<li><b>传统发展模式四大瓶颈：</b>决策瓶颈、变革制约、知识资产流失、需求响应延迟。</li>
<li><b>三项核心工作：</b>能力因子定义和数字化"封装"（实现"智能+"）、基于"互联网+"的调度和决策（让调度和决策脱离"自然人"）、转型控制（持续建设、优化和改进的过程）。</li>
</ul>`},
    {t:'智慧转移（S8D）与持续迭代（CPSD）', f:'mid', s:2, m:'智慧—数据：结模过平；数据—智慧：数孪架计。', b:`

<tr><td>④数据平台化——实现数据的采集、存储和共享</td><td>⑧计算智能化——实现多元条件下的调度和决策</td></tr></table>
<p><b>持续迭代（CPSD）四项活动：</b>①信息物理世界建设（实施数字孪生建设）；②决策能力边际化部署（装备智能化，提高决策效能）；③科学社会物理赛博机制构筑（灵活组合机制，动态调度能力）；④数字框架与信息调制设计（提升数据采集精准度，增强应急与动员能力）。</p>`},
    {t:'元宇宙', f:'low', s:1, m:'沉浸、身份、经济、治理。', b:`
<p><b>定义（北京大学陈刚教授）：</b>元宇宙是利用科技手段进行链接与创造的，与现实世界映射与交互的虚拟世界，具备新型社会体系的数字生活空间。</p>

  {t:'计算机组成与操作系统基础', f:'mid', s:2, m:'运控存入出，进存文设作。', b:`
<p><b>计算机硬件五大部件：</b>运算器、控制器、存储器、输入设备、输出设备。</p>
<ul>
<li><b>CPU = 运算器 + 控制器</b>（含内部寄存器与高速缓存），是计算机的"大脑"。</li>
<li>指令系统两大流派：<b>CISC 复杂指令集</b>与<b>RISC 精简指令集</b>。</li>
<li>存储层次由快到慢、由贵到廉：<b>寄存器 → 高速缓存Cache → 内存（主存）→ 外存</b>（硬盘、磁带）。</li>
<li>软件分<b>系统软件</b>（操作系统、数据库管理系统、中间件）与<b>应用软件</b>；中间件位于操作系统与应用之间，起"承上启下"的桥梁作用。</li>
</ul>
<p><b>操作系统五大管理功能：</b>进程管理、存储管理、文件管理、设备管理、作业管理。</p>
<div class="pit"><b>坑点：</b>① 问"CPU的组成"时，选项中混入"存储器"是经典陷阱——主存储器不属于CPU。② 五大管理功能里没有"网络管理""安全管理"，选项里出现即是干扰项。</div>`},
  {t:'OSI七层模型', f:'high', s:3, m:'物数网传会表应，从下往上一层一层记。', b:`
<p><b>一句话理解：</b>OSI是国际标准化组织提出的网络互连<b>参考模型</b>，把复杂的通信任务拆成7层，下层为上层提供服务。</p>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-box" style="border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.05)"><b style="color:#a5e8f5">7 应用层</b><span>HTTP · FTP · SMTP · DNS · DHCP · Telnet · SNMP，为应用程序提供网络服务</span></div>
  <div class="dg-varrow">▼</div>
  <div class="dg-box"><b>6 表示层</b><span>数据格式转换 · 加密解密 · 压缩</span></div>
  <div class="dg-varrow">▼</div>
  <div class="dg-box"><b>5 会话层</b><span>建立 · 管理 · 终止会话</span></div>
  <div class="dg-varrow">▼</div>
  <div class="dg-box" style="border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)"><b style="color:#cfc8ff">4 传输层</b><span>TCP · UDP，端到端可靠/不可靠传输，传输单位：段</span></div>
  <div class="dg-varrow">▼</div>
  <div class="dg-box" style="border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.05)"><b style="color:#fde68a">3 网络层</b><span>IP · ICMP · ARP，逻辑寻址与路由，传输单位：分组/包</span></div>
  <div class="dg-varrow">▼</div>
  <div class="dg-box"><b>2 数据链路层</b><span>成帧 · MAC寻址 · 差错控制，传输单位：帧</span></div>
  <div class="dg-varrow">▼</div>
  <div class="dg-box"><b>1 物理层</b><span>比特流透明传输 · 电气特性，传输单位：比特</span></div>
</div>
<figcaption>OSI七层：物数网传会表应（自下而上）；TCP/IP四层把上三层并为应用层、下两层并为网络接口层</figcaption>
</figure>
<div class="pit"><b>坑点：</b>① 传输层是"端到端"，网络层是"点到点（逐跳）"。② DNS、DHCP是<b>应用层</b>协议，常被误选为网络层。③ 各层传输单位口诀：比特、帧、包、段，自下而上别串层。</div>`},
  {t:'TCP/IP与TCP/UDP', f:'mid', s:2, m:'TCP握手三次可靠流，UDP无连接快不保。', b:`
<p><b>TCP/IP四层：</b>应用层、传输层、网际层（网络层）、网络接口层——互联网事实上的工业标准。</p>
<table class="kt"><tr><th>维度</th><th>TCP（传输控制协议）</th><th>UDP（用户数据报协议）</th></tr>
<tr><td>连接</td><td>面向连接（三次握手建连、四次挥手断连）</td><td>无连接，直接发送</td></tr>
<tr><td>可靠性</td><td>可靠：确认应答、超时重传、按序交付</td><td>尽力交付，不保证可靠、不保证顺序</td></tr>
<tr><td>传输单位</td><td>面向字节流</td><td>面向报文（数据报）</td></tr>
<tr><td>开销与速度</td><td>开销大、速度较慢，有流量与拥塞控制</td><td>开销小、时延低</td></tr>
<tr><td>典型应用</td><td>HTTP/HTTPS、FTP、SMTP、Telnet</td><td>DNS、DHCP、SNMP、实时音视频</td></tr></table>
<p><b>常用端口号：</b>FTP 21、SSH 22、Telnet 23、SMTP 25、DNS 53、HTTP 80、POP3 110、HTTPS 443。</p>
<div class="pit"><b>坑点：</b>① "UDP不可靠所以没用"是错误说法——它以牺牲可靠性换低时延，适合直播、语音。② 发邮件用SMTP（25），收邮件用POP3（110），方向别搞反。</div>`},
  {t:'网络设备与IPv6', f:'mid', s:2, m:'中继集线物理层，网桥交换链路层，路由器在网络层。', b:`
<p><b>设备与层次配对</b>是选择题高频考法，牢记下表：</p>
<table class="kt"><tr><th>设备</th><th>工作层次</th><th>核心作用</th></tr>
<tr><td>中继器、集线器</td><td>物理层</td><td>信号放大再生，向所有端口广播比特流</td></tr>
<tr><td>网桥、交换机、网卡</td><td>数据链路层</td><td>按MAC地址表转发帧</td></tr>
<tr><td>路由器、三层交换机</td><td>网络层</td><td>按IP地址选路、跨网段转发分组</td></tr>
<tr><td>网关</td><td>传输层及以上</td><td>协议转换，连接异构网络</td></tr></table>
<p><b>IPv6要点：</b>地址长度<b>128位</b>（IPv4为32位），地址空间极大；地址类型分为<b>单播、组播、任播</b>——<b>取消了广播</b>，用组播与任播替代。</p>
<div class="pit"><b>坑点：</b>① 三层交换机工作在<b>网络层</b>，别因为名字带"交换机"就选数据链路层。② "IPv6支持广播地址"是错误选项，广播已被取消。</div>`},
  {t:'RAID磁盘阵列', f:'mid', s:2, m:'0条带1镜像，5校验6双保险，10先镜后条。', b:`
<p><b>RAID（独立磁盘冗余阵列）：</b>把多块磁盘组合成逻辑卷，兼顾性能与可靠性。</p>
<table class="kt"><tr><th>级别</th><th>冗余方式</th><th>最少磁盘</th><th>容错能力</th><th>磁盘利用率</th></tr>
<tr><td>RAID 0</td><td>无冗余（条带化）</td><td>2</td><td>无，坏1盘全毁</td><td>100%</td></tr>
<tr><td>RAID 1</td><td>镜像（一份数据写两盘）</td><td>2</td><td>允许坏1盘</td><td>50%</td></tr>
<tr><td>RAID 5</td><td>分布式奇偶校验</td><td>3</td><td>允许坏1盘</td><td>(n-1)/n</td></tr>
<tr><td>RAID 6</td><td>双重奇偶校验</td><td>4</td><td>允许坏2盘</td><td>(n-2)/n</td></tr>
<tr><td>RAID 10</td><td>先镜像后条带（1+0）</td><td>4</td><td>允许坏不同镜像组的盘</td><td>50%</td></tr></table>
<div class="pit"><b>坑点：</b>① RAID 0性能最高但<b>没有容错</b>，题目问"不具备冗余能力的是"选它。② RAID 5<b>至少3块盘</b>，选项给2块即错。③ RAID 10是"先镜像、后条带"，顺序反了就是RAID 0+1。</div>`},
  {t:'存储架构：DAS/NAS/SAN', f:'high', s:3, m:'DAS直连、NAS文件走以太、SAN块级走专网。', b:`
<p><b>网络存储三大架构</b>——考试常给场景让你判断，抓住"连接方式+存储级别"两个题眼：</p>
<figure class="kd-fig">
<div class="dg dg-3">
  <div class="dg-box" style="border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.05)"><b style="color:#a5e8f5">DAS 直连式存储</b><span>存储设备通过线缆直接连服务器 · 依附于服务器 · 结构简单、扩展性与共享性差 · 适合小型单机应用</span></div>
  <div class="dg-box" style="border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)"><b style="color:#cfc8ff">NAS 网络附加存储</b><span><b>文件级</b>共享 · 走以太网（TCP/IP） · 协议NFS/CIFS · 自带文件系统、即插即用 · 像一台"文件服务器"</span></div>
  <div class="dg-box" style="border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.05)"><b style="color:#fde68a">SAN 存储区域网络</b><span><b>块级</b>存储 · 专用高速存储网络 · FC-SAN（光纤通道）/ IP-SAN · 高性能高可靠，成本高 · 适合数据库、核心业务</span></div>
</div>
<figcaption>记忆锚点：DAS连得近、NAS传文件、SAN传数据块</figcaption>
</figure>
<div class="pit"><b>坑点：</b>① 最经典对比——<b>NAS文件级、SAN块级</b>，两者互换是高频陷阱。② NAS走以太网共享，SAN走专用存储网络（FC或IP-SAN），"NAS采用光纤通道组网"是错误选项。</div>`},
  {t:'云计算：三种服务模式', f:'high', s:3, m:'IaaS租硬件、PaaS租平台、SaaS租软件。', b:`
<p><b>云计算：</b>通过网络按需、弹性地获取计算资源，像用水用电一样付费。三种服务模式按"租的东西"区分：</p>
<figure class="kd-fig">
<div class="dg dg-3">
  <div class="dg-box" style="border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.05)"><b style="color:#a5e8f5">IaaS 基础设施即服务</b><span>出租计算、存储、网络等<b>基础资源</b>（云服务器、云硬盘、虚拟网络），用户自己装系统与软件</span></div>
  <div class="dg-box" style="border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)"><b style="color:#cfc8ff">PaaS 平台即服务</b><span>出租<b>开发运行平台</b>（云数据库、中间件、容器运行环境），开发者专注写代码，不管基础设施</span></div>
  <div class="dg-box" style="border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.05)"><b style="color:#6ee7b7">SaaS 软件即服务</b><span>出租<b>开箱即用的软件</b>（在线办公、CRM、企业邮箱），多租户、按订阅付费，浏览器即用</span></div>
</div>
<figcaption>判别题眼：租虚拟机=IaaS，用云数据库=PaaS，打开网页直接用软件=SaaS</figcaption>
</figure>
<p><b>部署模式：</b>公有云（面向公众）、私有云（组织专享）、混合云（公私结合）、社区云。</p>
<p><b>虚拟化与容器：</b>虚拟机带完整客户操作系统、较重；容器（Docker）共享宿主机内核、秒级启动；Kubernetes负责容器编排。</p>
<div class="pit"><b>坑点：</b>① "云数据库服务"是PaaS不是IaaS——用户拿到的是平台能力而非基础设施。② 私有云强调的是"专享"而非"位置"。</div>`},
  {t:'大数据特征与关键技术', f:'high', s:3, m:'海量、多样、价低、速度快。', b:`
<p><b>定义：</b>大数据是指无法在一定时间内用传统软件工具对其进行捕捉、管理和处理的数据集合。</p>
<table class="kt"><tr><th>特征（4V）</th><th>含义</th><th>题眼</th></tr>
<tr><td>Volume 海量</td><td>体量巨大，从TB级跃升至PB、EB甚至ZB级</td><td>单位换算题</td></tr>
<tr><td>Variety 多样</td><td>类型繁多：结构化、半结构化、非结构化（文本/图片/视频/位置）</td><td>"图片视频属于非结构化"</td></tr>
<tr><td>Value 价值密度低</td><td>价值密度与数据总量成反比，需挖掘"提纯"</td><td>≠ 数据质量差</td></tr>
<tr><td>Velocity 高速</td><td>获取与处理速度快，要求实时/准实时</td><td>区别于传统数据挖掘的显著特征</td></tr></table>
<p><b>关键技术：</b>HDFS分布式文件系统、MapReduce分布式计算模型、HBase面向列的数据库（适合非结构化数据）、Spark内存计算、Flink流计算、Kafka分布式消息队列。</p>
<div class="pit"><b>坑点：</b>① "数据价值密度低"说的是有用信息占比小，不等于数据错误或质量差。② 部分资料补充Veracity（真实性）扩展为5V，教材主线按"海量、多样、低价值密度、高速"四个特征掌握，遇到"数据准确度"类描述先判断是不是混入真实性维度。</div>`},
  {t:'物联网三层架构', f:'high', s:3, m:'下感上用中间传：感知、网络、应用。', b:`
<p><b>定义：</b>物联网通过信息传感设备，按约定协议把任何物品与网络连接起来，进行信息交换和通信，实现智能化识别、定位、跟踪、监管。</p>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-box" style="border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.05)"><b style="color:#fde68a">应用层 · 大脑</b><span>与用户（人、组织和其他系统）的接口：智慧物流、智能交通、智能安防、智能医疗 · 结合行业需求实现智能应用</span></div>
  <div class="dg-varrow">▲ 传送数据</div>
  <div class="dg-box" style="border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)"><b style="color:#cfc8ff">网络层 · 神经</b><span>传递并处理感知数据：互联网、移动通信网、卫星通信网、网络管理系统、云计算平台 · 物联网的中枢</span></div>
  <div class="dg-varrow">▲ 采集数据</div>
  <div class="dg-box" style="border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.05)"><b style="color:#a5e8f5">感知层 · 皮肤五官</b><span>识别与感知：RFID、传感器、二维码、摄像头、GPS定位 · 物联网的起点</span></div>
</div>
<figcaption>物联网三层：感知层采集 → 网络层传递处理 → 应用层智能应用</figcaption>
</figure>
<p><b>关键技术：</b>感知技术（RFID、传感器、二维码）、网络技术（各类通信网络）、处理技术（云计算与海量数据处理）。</p>
<div class="pit"><b>坑点：</b>① RFID、传感器、二维码归<b>感知层</b>，出题率最高。② <b>云计算平台、网络管理系统属于网络层</b>——网络层不只传递数据，还负责处理，真题考过"云计算平台属于哪层"，别划给应用层。③ "摄像头采集图像"是感知层，"根据图像识别车牌并放行"是应用层的事。</div>`},
  {t:'人工智能核心技术', f:'mid', s:2, m:'机器学习是基础，深度学习是分支。', b:`
<p><b>定义：</b>人工智能是研究、开发用于模拟、延伸和扩展人类智能的理论、方法、技术及应用系统的一门学科。1956年达特茅斯会议首次提出"人工智能"术语；更早的1950年，图灵提出<b>图灵测试</b>——判断机器智能的经典方法。</p>
<ul>
<li><b>机器学习：</b>让计算机从数据中自动学习规律。三大类：监督学习（有标签训练）、无监督学习（无标签聚类）、强化学习（奖惩反馈中试错学习）。</li>
<li><b>深度学习：</b>机器学习的重要分支，基于多层神经网络，擅长图像识别、语音识别。</li>
<li><b>自然语言处理（NLP）：</b>让机器理解与生成人类语言，如机器翻译、智能问答。</li>
<li>其他常见方向：计算机视觉、知识图谱、专家系统。</li>
</ul>
<div class="pit"><b>坑点：</b>① 包含关系不能反：<b>人工智能 ⊃ 机器学习 ⊃ 深度学习</b>，"机器学习属于深度学习的分支"是典型错误选项。② 图灵测试判断的是"机器能否表现出与人无法区分的智能"，不是"机器能否通过考试"。</div>`},
  {t:'区块链特征与共识机制', f:'mid', s:2, m:'去中心、难篡改、可追溯、够透明。', b:`
<p><b>定义：</b>区块链是按时间顺序将数据区块以链式结构连接，并通过密码学方式保证不可篡改、不可伪造的<b>分布式账本</b>技术。</p>
<p><b>主要特征：</b>去中心化（多方共同维护、无中心机构）、不可篡改（哈希链式结构+共识机制）、可追溯（时间戳记录全过程）、公开透明、匿名性。</p>
<table class="kt"><tr><th>共识机制</th><th>依据</th><th>备注</th></tr>
<tr><td>PoW 工作量证明</td><td>算力竞争（挖矿）</td><td>比特币采用，耗能高</td></tr>
<tr><td>PoS 权益证明</td><td>持币量与持币时间</td><td>比PoW节能</td></tr>
<tr><td>DPoS 委托权益证明</td><td>投票选出代表节点记账</td><td>效率更高</td></tr>
<tr><td>PBFT 实用拜占庭容错</td><td>节点多轮投票达成一致</td><td>联盟链常用</td></tr></table>
<p><b>按准入分类：</b>公有链（任何人可参与）、联盟链（授权准入）、私有链（单一组织内部使用）。<b>智能合约：</b>部署在链上、条件触发即自动执行的程序代码。</p>
<div class="pit"><b>坑点：</b>① "去中心化"是区块链最本质的特征，与"中心化信任机构"对立。② 智能合约不是法律意义上的合同，是一段自动执行的代码。</div>`},
  {t:'5G三大应用场景', f:'high', s:3, m:'增超海：eMBB、uRLLC、mMTC。', b:`
<p><b>5G三大应用场景</b>是新一代信息技术里最稳定的数字类考点：</p>
<table class="kt"><tr><th>场景</th><th>含义</th><th>关键指标</th><th>典型应用</th></tr>
<tr><td>eMBB</td><td>增强移动宽带</td><td>峰值速率可达20Gbps</td><td>超高清视频、VR/AR、云游戏</td></tr>
<tr><td>uRLLC</td><td>超高可靠低时延通信</td><td>空口时延低至1ms级</td><td>自动驾驶、工业控制、远程手术</td></tr>
<tr><td>mMTC</td><td>海量机器类通信</td><td>每平方公里百万级连接</td><td>智能家居、智慧城市、大规模物联网</td></tr></table>
<p><b>VR/AR/MR速辨：</b>VR虚拟现实——完全沉浸的虚拟世界；AR增强现实——在真实画面上叠加虚拟信息；MR混合现实——虚实融合、可实时交互。</p>
<div class="pit"><b>坑点：</b>① 看到"自动驾驶、远程医疗、工业控制"选<b>uRLLC</b>，别被"高清、大流量"迷惑选成eMBB。② "海量机器类通信"对应用海量连接，如海量传感器抄表；eMBB主打速率快、mMTC主打连接多、uRLLC主打又快又稳，三个卖点一一对应。</div>`}

  {q:'在OSI七层参考模型中，路由器主要工作在（ ）', o:['物理层','数据链路层','网络层','传输层'], a:2, k:'网络设备层次', e:'路由器根据IP地址进行选路和跨网段转发，工作在网络层。中继器、集线器工作在物理层，网桥、交换机工作在数据链路层，网关工作在传输层及以上层次。'},
  {q:'关于TCP和UDP，以下叙述正确的是（ ）', o:['TCP面向连接，通过确认与重传机制提供可靠传输','UDP面向连接，传输效率高于TCP','TCP无连接，适用于实时音视频传输','UDP提供流量控制和拥塞控制机制'], a:0, k:'TCP与UDP', e:'TCP是面向连接的可靠传输协议，通过三次握手建立连接，以确认应答、超时重传保证可靠，并具备流量与拥塞控制。UDP无连接、尽力交付、开销小，适合实时音视频和DNS等场景。'},

  {q:'通过局域网向客户端提供文件级共享存储服务，并采用NFS、CIFS协议访问，该存储架构是（ ）', o:['DAS','NAS','SAN','RAID'], a:1, k:'存储架构', e:'NAS网络附加存储提供文件级存储服务，走以太网，使用NFS、CIFS协议，自带文件系统即插即用。SAN提供块级存储且走专用存储网络，DAS是存储设备直连服务器。'},
  {q:'某企业从云服务商处租用了云服务器、云硬盘和虚拟网络等基础资源，并自行安装操作系统和应用软件，该服务模式属于（ ）', o:['SaaS','PaaS','IaaS','DaaS'], a:2, k:'云计算服务模式', e:'租用计算、存储、网络等基础设施资源属于IaaS。PaaS提供开发运行平台如云数据库、中间件，SaaS提供开箱即用的应用软件。判别题眼是看用户拿到的是硬件资源、平台能力还是成品软件。'},
  {q:'以下不属于大数据典型特征的是（ ）', o:['数据体量巨大，从TB级跃升到PB、EB甚至ZB级','数据价值密度高，单位数据蕴含价值极大','数据类型多样，包括结构化与非结构化数据','数据处理速度快，要求实时或准实时处理'], a:1, k:'大数据特征', e:'大数据的价值特征是价值密度低，与数据总量成反比，需要通过挖掘分析从海量数据中提炼价值。价值密度高与教材表述相反；海量、多样、高速均为大数据典型特征。'},
  {q:'在物联网体系架构中，RFID射频识别、传感器和二维码属于（ ）', o:['感知层','网络层','应用层','传输层'], a:0, k:'物联网三层架构', e:'物联网分感知层、网络层、应用层三层。RFID、传感器、二维码、摄像头负责识别与采集信息，属于感知层；网络层负责传输，应用层负责数据处理与行业应用。'},
  {q:'5G面向自动驾驶、工业自动化控制、远程手术等场景提供的服务属于（ ）', o:['增强移动宽带','超高可靠低时延通信','海量机器类通信','增强型多媒体广播'], a:1, k:'5G应用场景', e:'自动驾驶、工业控制、远程手术对可靠性和时延要求极高，对应uRLLC超高可靠低时延通信场景。eMBB对应超高清视频等大流量业务，mMTC对应海量设备连接的物联网业务，增强型多媒体广播为杜撰干扰项。'},
