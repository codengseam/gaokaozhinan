<figcaption>生命周期三规律：投入像山峰 · 风险往下走 · 变更代价往上走</figcaption>
</figure>`},
    {t:'生命周期五种类型', f:'high', s:3, m:'明确用预测，多变用敏捷，部分明确用混合；迭代管打磨，增量管交付。', b:`
<table class="kt"><tr><th>类型</th><th>适用场景</th><th>关键词</th></tr>
<tr><td>预测型（瀑布）</td><td>需求明确、技术成熟、范围稳定</td><td>前期计划做足、一次交付</td></tr>
<tr><td>迭代型</td><td>需求不确定，需反复细化</td><td>多轮循环、先粗后精</td></tr>
<tr><td>增量型</td><td>可分批交付价值</td><td>小步快跑、逐批增加功能</td></tr>
<tr><td>适应型（敏捷）</td><td>需求多变、环境不确定</td><td>短迭代、快速反馈、拥抱变化</td></tr>
<tr><td>混合型</td><td>部分明确、部分多变</td><td>预测 + 敏捷组合</td></tr></table>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-row dg-spectrum">
    <div class="dg-box" style="flex:1;border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)">
      <b style="color:#cfc8ff">预测型（瀑布）</b><span>需求明确 · 计划做足 · 一次交付</span>
    </div>
    <div class="dg-varrow" style="display:flex;align-items:center;padding:0 4px">需求不确定性递增 ⟶</div>
    <div class="dg-box" style="flex:1;border-color:rgba(34,211,238,.55);background:rgba(34,211,238,.06)">
      <b style="color:#a5e8f5">适应型（敏捷）</b><span>需求多变 · 短迭代 · 拥抱变化</span>
    </div>
  </div>
  <div class="dg-row" style="justify-content:center">
    <span class="dg-pill">迭代型 · 反复打磨</span>
    <span class="dg-pill">增量型 · 分批交付</span>
    <span class="dg-pill">混合型 · 两者组合</span>
  </div>
</div>
<figcaption>越往右，需求越不确定、迭代周期越短</figcaption>
</figure>
<div class="tip"><b>迭代 vs 增量：</b>迭代是"同一个东西反复打磨得越来越好"；增量是"每批多交付一块可用的功能"。敏捷 = 迭代 + 增量。</div>`},
    {t:'项目立项管理三部曲', f:'high', s:3, m:'先建议、再可研、后评估决策。', b:`
<ol>
<li><b>项目建议与立项申请</b>：论证项目的<b>必要性</b>，形成项目建议书，向上级 / 投资方提出立项申请。</li>
<li><b>项目可行性研究</b>：从技术、经济、社会效益、运行环境等维度论证"值不值得做、能不能做成"，输出可行性研究报告。</li>
<li><b>项目评估与决策</b>：一般由<b>第三方</b>对可研报告进行评估，输出评估报告，供决策者最终决定是否立项。</li>
</ol>
<div class="pit"><b>顺序不能乱：</b>先建议（为什么做）→ 再可研（能不能做）→ 后评估决策（决定做不做）。立项通过后，项目才进入正式启动阶段（制定项目章程）。</div>`},
    {t:'可行性研究的三个层次', f:'mid', s:2, m:'由粗到细：机会 → 初步 → 详细。', b:`
<ul>
<li><b>机会研究</b>：鉴别投资方向，寻找投资可能性（最粗略）。</li>
<li><b>初步可行性研究</b>：初步判断项目是否值得进入详细研究，识别重大风险。</li>
<li><b>详细可行性研究</b>：深入、系统的技术经济论证，是最终决策的<b>主要依据</b>（最细致）。</li>
</ul>
<p><b>可研核心内容：</b>技术可行性、经济可行性、社会效益可行性、运行环境可行性（此外还有法律、安全等维度）。</p>`},
    {t:'五大过程组', f:'high', s:3, m:'启规执监收；规划最大、监控贯穿。', b:`
<ol>
<li><b>启动</b>：制定项目章程、识别干系人——"授权干活"。</li>
<li><b>规划</b>：编制各分项计划并整合为项目管理计划——包含的过程<b>数量最多</b>。</li>
<li><b>执行</b>：按计划开展工作、交付成果，消耗资源最多。</li>
<li><b>监控</b>：测量绩效、纠偏、控制变更——<b>贯穿项目始终</b>，不是执行完才监控。</li>
<li><b>收尾</b>：验收、移交、总结、归档、释放资源。</li>
</ol>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-row dg-pg">
    <div class="dg-box"><b style="color:#cfc8ff">启动</b><span>章程 · 干系人</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box" style="border-color:rgba(139,92,246,.8);background:rgba(139,92,246,.13)"><b style="color:#e0d9ff">规划</b><span>过程数量最多</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b style="color:#a5e8f5">执行</b><span>交付 · 耗资源最多</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b style="color:#fde68a">收尾</b><span>验收 · 移交 · 总结</span></div>
  </div>
  <div class="dg-box" style="border-style:dashed;border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.04)">
    <b style="color:#fda4af">监控过程组 · 贯穿项目始终</b><span>测量绩效 · 纠偏 · 控制变更，与其余四个过程组并行</span>
  </div>
  <div class="dg-note">过程组之间存在交叠，并非严格串行</div>
</div>
<figcaption>五大过程组："四步走 + 一条贯穿线"</figcaption>
</figure>
<div class="pit"><b>两大坑：</b>① 过程组之间<b>有交叠</b>，并非严格串行；② 过程组 ≠ 项目阶段——一个项目阶段内部可能经历启动、规划、执行、监控等多个过程组。</div>`},
    {t:'12 项项目管理原则', f:'high', s:3, m:'4人 4法 4环境，管家打头阵。', b:`
<p>第7版的 12 项原则按 4+4+4 分组记忆：</p>
<ul>
<li><b>人与协作（4）</b>：成为勤勉、尊重和关心他人的管家 / 营造协作的团队环境 / 有效地与干系人参与 / 展现领导力行为。</li>
<li><b>价值与方法（4）</b>：聚焦价值 / 识别并响应系统交互 / 根据环境进行裁剪 / 将质量融入过程和可交付物。</li>
<li><b>环境与变革（4）</b>：驾驭复杂性 / 优化风险应对 / 拥抱适应性和韧性 / 为实现预期的未来状态而推动变革。</li>
</ul>
<div class="tip">选择题常用错误表述当干扰项，如"拒绝一切变更""严格按计划绝不调整"——与原则精神（适应、拥抱变化、聚焦价值）相悖的都是错的。</div>`},
    {t:'8 大绩效域', f:'high', s:3, m:'干团方法规划，工作交付测量不确定。', b:`
<p>第7版的 8 个绩效域：</p>
<p><b>干系人 / 团队 / 开发方法和生命周期 / 规划 / 项目工作 / 交付 / 测量 / 不确定性</b></p>
<div class="pit"><b>易混点：</b>没有"风险绩效域"——叫<b>不确定性</b>绩效域，涵盖风险、模糊性、复杂性等更广范围；也没有单独的"采购""沟通"绩效域（相关内容并入项目工作、交付等绩效域）。这是数字型考点的经典陷阱。</div>`},
    {t:'十大知识领域', f:'high', s:3, m:'整范进成质，资沟风采干。', b:`
<p>口诀逐字展开（第6版框架，过程组考题仍高频使用）：</p>
<ul>
<li><b>整</b>合管理：把所有要素拧成一股绳（总协调）。</li>
<li><b>范</b>围管理：做什么、不做什么。</li>
<li><b>进</b>度管理：什么时候做完。</li>
<li><b>成</b>本管理：花多少钱。</li>
<li><b>质</b>量管理：做到什么标准。</li>
<li><b>资</b>源管理：人和物从哪来、怎么管。</li>
<li><b>沟</b>通管理：信息怎么传、传给谁。</li>
<li><b>风</b>险管理：不确定性怎么应对。</li>
<li><b>采</b>购管理：外包和合同怎么管。</li>
<li><b>干</b>系人管理：让相关方满意并参与。</li>
</ul>`},
    {t:'价值交付系统', f:'mid', s:2, m:'项目是价值的搬运工，系统保证价值不断流。', b:`
<p><b>定义：</b>为业务和干系人<b>创造价值</b>的一系列工作组件（项目、项目集、运营等）及其治理与交互机制构成的系统。</p>
<ul>
<li>项目不再只是"交付产品"，而是<b>价值流动</b>中的一环。</li>
<li>价值是多维的：财务回报、社会效益、干系人收益等。</li>
<li>系统通过治理机制和工作组件间的流程协同，保证价值持续流动。</li>
</ul>`}
  ], quiz:[
    {q:'下列关于项目特性的说法，不正确的是（ ）', o:['项目工作具有明确的起点和终点，这是项目的临时性','项目交付的成果通常也是临时性的，项目结束后成果随之消失','项目的可交付成果具有独特性','项目具有渐进明细的特性，即随着信息增加而逐步细化'], a:1, k:'项目的定义与特性', e:'临时性指的是"项目工作"是临时的，但项目成果（如信息系统）往往是长期存在、持续使用的。"项目临时、成果长久"是本考点最经典的坑。'},
    {q:'下列工作中，属于"项目"的是（ ）', o:['流水线上日常的产品装配','银行柜台每天的存取款业务','开发一套图书馆管理信息系统','公司每月例行的财务报表编制'], a:2, k:'项目与运营的区别', e:'项目的判断标准是"临时性 + 独特性"。A、B、D 都是持续性、重复性的日常运营工作；只有 C 有明确的起止时间且成果独特。'},
    {q:'《项目管理知识体系指南》（PMBOK）第7版的核心框架是（ ）', o:['5大过程组、10大知识领域','12项项目管理原则、8个项目绩效域','6大过程组、13个知识领域','10项原则、5个绩效域'], a:1, k:'PMBOK的发展', e:'第6版是"5大过程组 + 10大知识领域（49个过程）"；第7版转向"原则 + 绩效域"框架，共12项原则、8个绩效域。注意数字对应不要记混。'},
    {q:'一组相互关联且被协调管理的项目、子项目集和运营活动，通过协调管理获得单独管理时无法获得的效益，称为（ ）', o:['项目组合','项目集','大项目','项目群计划'], a:1, k:'项目、项目集与项目组合', e:'抓住关键词"相互关联 + 协调管理 + 1+1>2 的协同效益"——这是项目集。项目组合内的项目之间可以毫不相关，只为战略目标服务。'},
    {q:'项目组合管理的核心目标是（ ）', o:['使每个项目的收益都最大化','实现组织的战略目标','协调项目之间的资源共享','降低单个项目的风险'], a:1, k:'项目、项目集与项目组合', e:'项目组合站在战略层面，关心"做哪些项目才能实现战略目标"，而不是替单个项目操心收益、资源或风险。'},
    {q:'下列各项中，属于事业环境因素（EEF）的是（ ）', o:['组织的变更管理流程','以往项目的经验教训文档','政府颁布的行业法律法规','组织内部的历史项目模板'], a:2, k:'EEF与OPA', e:'EEF 是团队"控制不了"的因素，政府法规是典型的外部 EEF。A、B、D 都来自组织内部积累、团队可以主动使用和更新，属于 OPA。'},
    {q:'下列各项中，属于组织过程资产（OPA）的是（ ）', o:['组织文化与组织结构','员工的休假政策','历史项目的进度计划模板','市场环境与竞争状况'], a:2, k:'EEF与OPA', e:'OPA 是组织内部积累的"家底"：模板、流程、历史信息、经验教训库。组织文化、休假政策虽来自内部，但属于团队无法更改的客观条件，划入 EEF；市场状况是外部 EEF。'},
    {q:'关于事业环境因素（EEF）和组织过程资产（OPA），下列说法不正确的是（ ）', o:['EEF 是项目团队通常无法直接控制的因素','OPA 可由项目团队在项目过程中使用并更新','政府法规和市场条件属于 OPA','历史信息和经验教训库属于 OPA'], a:2, k:'EEF与OPA', e:'政府法规、市场条件是外部 EEF。判断口诀：改不了的是"环境"（EEF），能用能改的是"家底"（OPA）。'},
    {q:'在下列组织结构中，项目经理权力最大的是（ ）', o:['职能型','弱矩阵型','强矩阵型','项目型'], a:3, k:'组织结构类型', e:'PM 权力排序：项目型 > 强矩阵 > 平衡矩阵 > 弱矩阵 > 职能型。项目型组织中全职项目经理对人和资源有近乎完全的控制权。'},
    {q:'关于矩阵型组织结构，下列说法正确的是（ ）', o:['弱矩阵中项目经理的权力大于职能经理','平衡矩阵中项目经理与职能经理权力大体相当','强矩阵中职能经理拥有最高权力','矩阵型组织中不存在职能经理'], a:1, k:'组织结构类型', e:'矩阵型的权力天平：弱矩阵偏职能经理，平衡矩阵两者相当，强矩阵偏项目经理。"弱—平衡—强"描述的是项目经理权力由小到大。'},
    {q:'当项目需求明确、技术方案成熟、范围相对稳定时，最适合采用的生命周期类型是（ ）', o:['预测型（瀑布型）','适应型（敏捷）','迭代型','混合型'], a:0, k:'生命周期类型', e:'需求明确、变更少 → 预测型：前期做足计划，按部就班执行，适合建筑、传统 IT 集成类项目。需求多变才考虑敏捷。'},
    {q:'需求高度不确定、环境变化快、需要快速响应客户反馈的项目，宜采用（ ）', o:['预测型','适应型','增量型','职能型'], a:1, k:'生命周期类型', e:'适应型（敏捷 / 变更驱动）通过短迭代快速交付、持续收集反馈、拥抱变化，专门对付"需求不确定"。职能型是组织结构，不是生命周期，注意别被干扰项带偏。'},
    {q:'项目先交付一批核心功能，随后每隔一段时间增加一批新功能，逐渐做全，这种生命周期属于（ ）', o:['预测型','增量型','迭代型','混合型'], a:1, k:'生命周期类型', e:'增量型的关键词是"分批交付可用成果"：每一批都是可用的，逐步加功能。迭代型的关键词是"反复打磨同一批成果"，先粗后细，注意区分。'},
    {q:'项目立项管理的正确工作顺序是（ ）', o:['可行性研究 → 项目建议书 → 项目评估','项目建议与立项申请 → 可行性研究 → 项目评估与决策','项目评估 → 项目建议书 → 可行性研究','项目建议书 → 项目评估 → 可行性研究'], a:1, k:'项目立项管理', e:'记住主线："先建议（说明有必要做）、再可研（论证能不能做）、后评估决策（决定做不做）"。'},
    {q:'项目可行性研究由浅入深的正确顺序是（ ）', o:['详细可行性研究 → 初步可行性研究 → 机会研究','机会研究 → 初步可行性研究 → 详细可行性研究','初步可行性研究 → 机会研究 → 详细可行性研究','机会研究 → 详细可行性研究 → 初步可行性研究'], a:1, k:'可行性研究', e:'由粗到细三步走：机会研究（找方向）→ 初步可研（值不值得深入）→ 详细可研（最终立项的主要依据）。'},
    {q:'项目管理五大过程组的正确顺序是（ ）', o:['启动 → 规划 → 执行 → 监控 → 收尾','规划 → 启动 → 执行 → 监控 → 收尾','启动 → 规划 → 监控 → 执行 → 收尾','启动 → 执行 → 规划 → 监控 → 收尾'], a:0, k:'五大过程组', e:'口诀"启规执监收"。注意监控过程组贯穿项目始终，不是排在执行之后才开始的。'},
    {q:'下列关于项目管理过程组的说法，不正确的是（ ）', o:['五大过程组之间存在交叠，并非严格串行','监控过程组贯穿项目始终','规划过程组包含的过程数量最多','各过程组与项目阶段一一对应，每个阶段只经历一个过程组'], a:3, k:'五大过程组', e:'过程组 ≠ 项目阶段。一个项目阶段内部可能会经历启动、规划、执行、监控等多个过程组；过程组是"做事的逻辑分组"，阶段是"时间上的分段"。'},
    {q:'下列不属于 PMBOK 第7版 12 项项目管理原则的是（ ）', o:['营造协作的团队环境','聚焦价值','严格按照计划执行，拒绝一切变更','驾驭复杂性'], a:2, k:'12项项目管理原则', e:'第7版强调适应性和拥抱变化（"拥抱适应性和韧性""优化风险应对"），"拒绝一切变更"与原则精神完全相悖。'},
    {q:'下列不属于 PMBOK 第7版 8 大绩效域的是（ ）', o:['干系人绩效域','交付绩效域','风险绩效域','测量绩效域'], a:2, k:'8大绩效域', e:'第7版没有"风险绩效域"，取而代之的是"不确定性绩效域"，涵盖风险、模糊性、复杂性等更广的范围。这是数字型考点的经典陷阱。'},
    {q:'下列不属于十大知识领域的是（ ）', o:['整合管理','范围管理','需求管理','采购管理'], a:2, k:'十大知识领域', e:'十大知识领域口诀"整范进成质，资沟风采干"：整合、范围、进度、成本、质量、资源、沟通、风险、采购、干系人。没有独立的"需求管理"，需求属于范围管理的一部分。'},
    {q:'关于项目成功的标准，下列说法正确的是（ ）', o:['只要按期、按预算完成，项目就算成功','成功标准由项目经理单方面确定','成功标准是多维的，应尽早与干系人达成共识','成功标准一经确定就不能改变'], a:2, k:'项目成功的标准', e:'按期按预算但没人用、干系人不买账的项目照样算失败。成功标准是多维的，需尽早明确共识并随项目演进而复审。选项过于绝对的表述一般是错的。'},
    {q:'项目阶段结束时，对项目进行审查并决策"继续、调整或提前终止"的时间点，称为（ ）', o:['里程碑','阶段关口','关键路径节点','可交付物评审会'], a:1, k:'项目生命周期', e:'阶段关口（里程碑决策点）是阶段末的正式审查决策机制。里程碑只是时间轴上的事件标记，本身不做"继续 / 终止"这类决策。'},
    {q:'关于项目生命周期中成本与人力投入的变化规律，正确的是（ ）', o:['开始时最高，之后逐渐下降','全程保持不变','开始和结束时较低，中间执行阶段最高','结束时最高'], a:2, k:'项目生命周期', e:'典型的"山峰曲线"：启动低 → 执行期达到峰值 → 收尾回落。同时记住另外两条曲线：风险与不确定性开始最高、逐渐降低；变更的代价开始最低、逐渐升高。'},
    {q:'价值交付系统的核心目标是（ ）', o:['交付符合规格的产品','为组织和干系人创造价值','控制项目成本','缩短项目工期'], a:1, k:'价值交付系统', e:'价值交付系统把项目、项目集、运营等工作视为一体，强调它们共同为组织创造价值（包括财务回报和社会效益），而不是孤立地交付产品。'},
    {q:'控制程度最低、主要扮演顾问和服务角色的 PMO 类型是（ ）', o:['支持型','控制型','指令型','战略型'], a:0, k:'PMO的类型', e:'PMO 三种类型控制度递增：支持型（给模板、培训、当顾问）→ 控制型（定规矩、要求合规）→ 指令型（直接接管管理项目）。'},
    {q:'随着项目进展和信息不断增加，项目计划和文件逐步细化和完善的特性，称为（ ）', o:['范围蔓延','渐进明细','滚动式规划','敏捷开发'], a:1, k:'项目的特性', e:'渐进明细是项目的基本特性：早期信息少、计划粗，随进展逐步细化。注意与"范围蔓延"（未经批准擅自扩大范围，是坏事）区分，与"滚动式规划"（近期细、远期粗的规划方法）区分。'}
  ]},
  {id:10, title:'启动过程组',         sec:'pm',  page:354, cards:[
    {t:'启动过程组全貌——只有两个过程', f:'high', s:3, m:'启动两件事：一立章程给授权，二找干系人摸底。', b:`
<p><b>定位：</b>启动过程组定义一个新项目或现有项目的一个新阶段，<b>授权开始</b>该项目或阶段，仅包含两个过程：项目整合管理中的<b>制定项目章程</b> + 项目干系人管理中的<b>识别干系人</b>。</p>
<figure class="kd-fig">
<div class="dg dg-2">
  <div class="dg-box" style="border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)"><b style="color:#cfc8ff">制定项目章程</b><span>整合管理 · 输出项目章程 + 假设日志 · 仅开展一次</span></div>
  <div class="dg-box" style="border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.05)"><b style="color:#a5e8f5">识别干系人</b><span>干系人管理 · 输出干系人登记册 · 全程定期开展</span></div>
</div>
<figcaption>启动过程组 = 章程（给权）+ 干系人（找人）</figcaption>
</figure>
<ul>
<li>两大作用：确保只有<b>符合组织战略目标</b>的项目才被立项；在项目开始时就认真考虑商业论证、项目效益和干系人。</li>
<li>项目通常分多个阶段，<b>每个阶段开始时</b>可重新开展启动过程，保持项目符合商业需求并核实成功标准。</li>
</ul>
<div class="pit"><b>考题坑点：</b>把"任命项目经理""定义范围""组建项目团队"混进启动过程组——任命项目经理在章程中完成；定义范围、组建团队属于<b>规划过程组</b>。（2024年11月真题）</div>`},
    {t:'制定项目章程——定义与三大作用', f:'high', s:3, m:'章程三作用：连战略、正式立、表承诺。', b:`
<p><b>定义：</b>制定项目章程是编写一份<b>正式批准项目</b>并授权项目经理在项目活动中<b>使用组织资源</b>的文件的过程。</p>
<table class="kt"><tr><th>三大作用</th><th>通俗理解</th></tr>
<tr><td>明确项目与组织战略目标之间的直接联系</td><td>回答"为什么做"——把项目挂到战略上</td></tr>
<tr><td>确立项目的正式地位</td><td>章程一经批准，标志项目正式启动</td></tr>
<tr><td>展示组织对项目的承诺</td><td>高层背书，调资源有了制度依据</td></tr></table>
<ul>
<li>本过程<b>仅开展一次</b>或仅在项目的预定义点开展。</li>
<li>项目经理<b>应在规划开始之前任命</b>，越早越好，最好在制定项目章程时就任命。</li>
</ul>
<div class="tip">一句话记章程：项目的<b>"出生证明 + 尚方宝剑"</b>——证明项目合法存在，授权项目经理调用组织资源。</div>`},
    {t:'谁编制、谁签发——章程的权力来源', f:'high', s:3, m:'编制可合作，签发在外面；章程管内部，合同管外部。', b:`
<table class="kt"><tr><th>角色</th><th>能做什么</th></tr>
<tr><td>项目经理</td><td>可与发起机构<b>合作编制</b>章程、起草内容</td></tr>
<tr><td>发起人 / PMO / 项目组合治理委员会</td><td><b>签发和修订</b>章程（项目由项目以外的机构启动）</td></tr></table>
<div class="pit"><b>高频坑：</b>"项目章程由项目经理签发/批准"是错误表述——<b>编制可以，签发不行</b>。谁立项、谁出钱，谁来签发。</div>
<p>再记三组边界关系：</p>
<ul>
<li><b>章程 ≠ 合同：</b>合同具有法律约束力，用于<b>外部</b>合作（为外部客户做项目需签合同）；章程用于建立<b>组织内部</b>合作关系，确保正确交付合同内容。</li>
<li><b>章程 ≠ 项目管理计划：</b>章程批准立项（高层级）；计划回答怎么做（详细），在规划过程组产生。</li>
<li>章程授权项目经理开展规划、执行和控制工作，并使用组织资源。</li>
</ul>`},
    {t:'制定项目章程的主要输入', f:'high', s:3, m:'章程输入四件套：立项文件、协议、环境、家底。', b:`
<table class="kt"><tr><th>输入</th><th>要点</th></tr>
<tr><td>立项管理文件</td><td>项目建议书、可行性研究报告、项目评估报告等；从<b>业务视角</b>论证必要性与投资价值，是高层立项决策的依据</td></tr>
<tr><td>协议</td><td>合同、谅解备忘录（MOU）、服务水平协议（SLA）、协议书、意向书、口头协议等书面形式</td></tr>
<tr><td>事业环境因素（EEF）</td><td>组织文化、市场条件、法律法规、行业标准等</td></tr>
<tr><td>组织过程资产（OPA）</td><td>章程模板、历史项目档案、变更控制程序等</td></tr></table>
<div class="pit"><b>两大坑：</b>① 立项管理文件<b>不是项目文件</b>，项目经理<b>不能修改</b>、只能提出建议，且需<b>定期审核</b>；② 干扰项常拿"需求文件、范围说明书、WBS"（都是规划过程组的输出）冒充输入。（2023下真题，错误率61%）</div>`},
    {t:'项目章程12项内容（必背）', f:'high', s:3, m:'目的目标成果，进度财务风险，干系人审批退出要职权。', b:`
<table class="kt"><tr><th>#</th><th>内容</th><th>记忆要点</th></tr>
<tr><td>1</td><td>项目目的</td><td>抽象、回答为什么做</td></tr>
<tr><td>2</td><td>可测量的项目目标和相关的成功标准</td><td>具体、可测量</td></tr>
<tr><td>3</td><td>高层级需求</td><td>—</td></tr>
<tr><td>4</td><td>高层级项目描述、边界定义以及主要可交付成果</td><td>如"一套CRM系统"</td></tr>
<tr><td>5</td><td>整体项目风险</td><td>—</td></tr>
<tr><td>6</td><td>总体里程碑进度计划</td><td>进度</td></tr>
<tr><td>7</td><td>预先批准的财务资源</td><td>财务</td></tr>
<tr><td>8</td><td>关键干系人名单</td><td>如客户方领导</td></tr>
<tr><td>9</td><td>项目审批要求</td><td>谁对成功下结论、谁签署项目结束</td></tr>
<tr><td>10</td><td>项目退出标准</td><td>何种条件下关闭或取消项目</td></tr>
<tr><td>11</td><td>委派的项目经理及其职责和职权</td><td>职权</td></tr>
<tr><td>12</td><td>发起人或其他批准项目章程的人员的姓名和职权</td><td>职权</td></tr></table>
<div class="tip">看到"<b>主要、总体、整体、高层级、预先批准</b>"这类粗粒度词就是章程内容；带"详细、完整、精确"的一律不是。</div>`},
    {t:'章程里有什么、没什么——"高层级"判分原则', f:'high', s:3, m:'章程高层级，细节靠边站；带"详细"的都出局。', b:`
<p>章程只记录<b>高层级</b>信息，选择题最爱考"包括 / 不包括"：</p>
<figure class="kd-fig">
<div class="dg dg-2">
  <div class="dg-box" style="text-align:left;border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.04)">
    <b style="color:#6ee7b7">✓ 章程里有的</b>
    <span style="display:block;line-height:2">· 目的 / 可测量目标与成功标准<br>· 高层级需求、边界、主要可交付成果<br>· 整体项目风险、总体里程碑<br>· 预先批准的财务资源、关键干系人名单<br>· 审批要求、退出标准、PM与发起人权责</span>
  </div>
  <div class="dg-box" style="text-align:left;border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.04)">
    <b style="color:#fda4af">✗ 章程里没有的</b>
    <span style="display:block;line-height:2">· 详细的项目管理计划<br>· 项目范围说明书 / 完整WBS<br>· 详细成本预算 / 成本基准<br>· 精确到每日的任务清单<br>· 项目生命周期（规划阶段才细化定义）</span>
  </div>
</div>
<figcaption>判分口诀：凡带"详细、完整、精确"字样的选项，一律不属于章程</figcaption>
</figure>
<div class="pit"><b>2024年11月真题：</b>"项目章程内容不包括（项目生命周期）"—— lifecycle 属于规划阶段才详细定义的内容，很多考生误选。</div>`},
    {t:'假设日志——章程的"孪生输出"', f:'mid', s:2, m:'章程带两娃：章程定调子，假设日志记前提。', b:`
<p><b>定义：</b>假设日志记录<b>整个项目生命周期</b>中的所有<b>假设条件和制约因素</b>。</p>
<ul>
<li>项目启动<b>之前</b>进行可行性研究和论证时，就开始识别<b>高层级</b>的战略和运营假设条件与制约因素，纳入章程；</li>
<li>较低层级的假设和制约因素在项目期间陆续生成，记入假设日志持续维护——它是<b>"活"的文档</b>；</li>
<li>假设一旦失效常转化为风险，联动风险登记册；与问题日志（记录已发生问题）、变更日志（记录已批准变更）性质不同。</li>
</ul>
<div class="pit"><b>输出辨析（2023年11月真题）：</b>制定项目章程的输出只有<b>项目章程 + 假设日志</b>两个。"变更日志、问题日志、风险登记册、协议"都是干扰项。</div>`},
    {t:'制定项目章程的工具与技术', f:'mid', s:2, m:'专数人会：专家、数据收集、人际技能、会议。', b:`
<table class="kt"><tr><th>类别</th><th>具体技术</th></tr>
<tr><td>专家判断</td><td>借鉴具备专业知识的个人或小组的经验</td></tr>
<tr><td>数据收集</td><td>头脑风暴、焦点小组、访谈</td></tr>
<tr><td>人际关系与团队技能</td><td>冲突管理、引导、会议管理</td></tr>
<tr><td>会议</td><td>与关键干系人开会识别目标、成功标准等</td></tr></table>
<div class="tip">对比记忆：识别干系人的"数据收集"是<b>问卷调查、头脑风暴</b>（没有访谈、焦点小组）——两个过程的数据收集清单略有差异，考试爱交叉设坑。</div>`},
    {t:'识别干系人——定义与开展时机', f:'high', s:3, m:'章程之前或同时找，阶段开始再扫一遍。', b:`
<p><b>定义：</b>定期识别项目干系人，分析和记录他们的<b>利益、参与度、相互依赖性、影响力和对项目成功的潜在影响</b>。主要作用：使项目团队能够建立对每个干系人或干系人群体的<b>适度关注</b>。</p>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-row">
    <div class="dg-box"><b>首次开展</b><span>编制和批准项目章程<b>之前或同时</b></span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box" style="border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)"><b style="color:#cfc8ff">重复开展</b><span>至少每个阶段开始时 + 项目或组织出现重大变化时</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>全程贯穿</b><span>整个项目期间根据需要定期开展</span></div>
  </div>
</div>
<figcaption>识别干系人是"进行时"，不是启动阶段的一次性动作</figcaption>
</figure>
<div class="pit"><b>易错点：</b>"识别干系人仅在启动阶段开展一次"是错误说法。项目团队还应把<b>干系人满意程度</b>作为关键项目目标来管理。</div>`},
    {t:'项目干系人六大类别', f:'mid', s:2, m:'客户团队发起人，职能供应商其他。', b:`
<p>系统集成项目的干系人典型分为六大类：</p>
<figure class="kd-fig">
<div class="dg dg-3">
  <div class="dg-box"><b>① 客户和用户</b><span>客户方项目负责人 · 项目管理部门 · 具体使用用户 · 项目监督部门</span></div>
  <div class="dg-box"><b>② 团队及成员</b><span>项目管理人员 · 工程技术人员 · 相关支持人员</span></div>
  <div class="dg-box"><b>③ 项目发起人</b><span>为项目提供<b>资金或资源</b>支持的个人或组织</span></div>
  <div class="dg-box"><b>④ 资源/职能部门</b><span>矩阵型组织中提供研发、测试等支持的部门</span></div>
  <div class="dg-box"><b>⑤ 供应商</b><span>提供产品或服务的<b>外部</b>组织</span></div>
  <div class="dg-box"><b>⑥ 其他组织/个人</b><span>监理机构 · 公众等</span></div>
</div>
<figcaption>系统集成项目干系人六大类——分类判断题常客</figcaption>
</figure>`},
    {t:'识别干系人的主要输入', f:'mid', s:2, m:'计划看沟通参与，文件盯变更问题需求。', b:`
<table class="kt"><tr><th>输入</th><th>要点</th></tr>
<tr><td>项目章程</td><td>其中含关键干系人名单等信息</td></tr>
<tr><td>立项管理文件</td><td>帮助识别潜在干系人及其利益</td></tr>
<tr><td>项目管理计划</td><td><b>沟通管理计划</b>（了解干系人的主要依据）、<b>干系人参与计划</b>（确定引导策略）——首次识别时计划尚不存在</td></tr>
<tr><td>项目文件</td><td><b>变更日志</b>（可能引入新干系人）、问题日志、需求文件（提供潜在干系人信息）</td></tr>
<tr><td>协议 / EEF / OPA</td><td>—</td></tr></table>
<div class="tip"><b>题眼：</b>"批准的变更可能带来新干系人 → 需要重新识别干系人"是高频出题逻辑，也是识别干系人要全程定期开展的直接原因。</div>`},
    {t:'识别干系人的数据收集与分析', f:'mid', s:2, m:'收集靠问卷风暴，分析出清单，表现用方格。', b:`
<ul>
<li><b>数据收集</b>：问卷调查、头脑风暴——先把人"找全"。</li>
<li><b>数据分析</b>：干系人分析（产生<b>干系人清单</b>及干系人信息）、文件分析（审查现有文档识别干系人及其利益）。</li>
<li><b>数据表现</b>：即干系人映射分析/表现——权力利益方格、凸显模型等（见下方专卡）。</li>
</ul>
<div class="pit"><b>分类坑：</b>问卷调查、头脑风暴属于<b>数据收集</b>，不是数据表现；"干系人映射分析"才是数据表现技术族的名称。题目常把两者互换当干扰项。</div>`},
    {t:'权力利益方格——四象限策略（必考）', f:'high', s:3, m:'高权高利重点盯，高权低利哄开心；低权高利常通报，低权低利偶尔瞧。', b:`
<p>权力利益方格按<b>权力</b>（决策影响力）与<b>利益</b>（关心程度）两个维度，把干系人分入四象限，分别采取不同管理策略：</p>
<figure class="kd-fig kd-fig-scroll">
<svg viewBox="0 0 560 386" role="img" aria-label="权力利益方格四象限示意图">
  <line x1="90" y1="310" x2="532" y2="310" stroke="#5f6784" stroke-width="1.5"/>
  <path d="M532 310 l-9 -4 v8 z" fill="#5f6784"/>
  <line x1="90" y1="314" x2="90" y2="28" stroke="#5f6784" stroke-width="1.5"/>
  <path d="M90 28 l-4 9 h8 z" fill="#5f6784"/>
  <line x1="310" y1="30" x2="310" y2="310" stroke="#5f6784" stroke-width="1" stroke-dasharray="5 5"/>
  <line x1="90" y1="170" x2="530" y2="170" stroke="#5f6784" stroke-width="1" stroke-dasharray="5 5"/>

    {t:'凸显模型——三维度定位关键干系人', f:'high', s:3, m:'权法紧三高是关键；复杂群体用它分。', b:`
<p><b>凸显模型</b>（Salience Model）从<b>权力、合法性、紧迫性</b>三个维度对干系人评估分类，三者皆高者为<b>关键干系人</b>，须最优先管理。</p>
<figure class="kd-fig">
<svg viewBox="0 0 460 360" role="img" aria-label="凸显模型三维度韦恩图">
  <circle cx="160" cy="130" r="90" fill="rgba(139,92,246,.13)" stroke="rgba(139,92,246,.6)" stroke-width="1.4"/>
  <circle cx="300" cy="130" r="90" fill="rgba(34,211,238,.1)" stroke="rgba(34,211,238,.55)" stroke-width="1.4"/>
  <circle cx="230" cy="240" r="90" fill="rgba(251,191,36,.1)" stroke="rgba(251,191,36,.55)" stroke-width="1.4"/>
  <text x="98" y="72" fill="#cfc8ff" font-size="14" font-weight="700">权力</text>
  <text x="98" y="90" fill="#8a92b0" font-size="11.5">影响项目的能力</text>
  <text x="330" y="72" fill="#a5e8f5" font-size="14" font-weight="700">合法性</text>
  <text x="330" y="90" fill="#8a92b0" font-size="11.5">关系正当性</text>
  <text x="230" y="306" text-anchor="middle" fill="#8a92b0" font-size="11.5">诉求时间敏感</text>
  <text x="230" y="345" text-anchor="middle" fill="#fde68a" font-size="14" font-weight="700">紧迫性</text>
  <text x="230" y="163" text-anchor="middle" fill="#fff" font-size="13.5" font-weight="700">关键干系人</text>
  <text x="230" y="182" text-anchor="middle" fill="#d9d5f0" font-size="11">三高 · 优先管理</text>
</svg>
<figcaption>三圈交集 = 权 + 法 + 紧三高的"关键干系人"</figcaption>
</figure>
<ul>
<li><b>权力</b>：影响项目结果的能力（如政府领导给资源）；<b>合法性</b>：参与关系的正当性（如分包商有合同约束）；<b>紧迫性</b>：诉求的时间敏感性（如环保组织要求立即回应）。</li>
<li><b>适用场景（2025年真题）：</b>干系人<b>大型群体、内部关系网络复杂</b>的项目（如多政府部门参与的智慧城市项目），用于确定已识别干系人的<b>相对重要性</b>。</li>
</ul>
<div class="pit"><b>两个坑：</b>① "<b>紧迫性</b>"维度最常被漏选；② "<b>利益</b>"不是凸显模型维度——那是权力利益方格的。两模型的维度千万别串。</div>`},
    {t:'数据表现工具全家福', f:'mid', s:2, m:'方格立方体，凸显影响方向，人多排优先。', b:`
<table class="kt"><tr><th>工具</th><th>维度 / 要点</th><th>适用</th></tr>
<tr><td>权力利益方格</td><td>权力 × 利益，四象限</td><td>小型、关系简单的项目</td></tr>
<tr><td>作用影响方格</td><td>作用 × 影响</td><td>—</td></tr>
<tr><td>干系人立方体</td><td>权力/作用/影响 三维组合</td><td>—</td></tr>
<tr><td>凸显模型</td><td>权力、合法性、紧迫性</td><td>复杂大型干系人群体、关系网络复杂</td></tr>
<tr><td>影响方向</td><td>向上（高管/发起人）、向下（团队/专家）、向外（供应商/政府/公众/最终用户）、横向（同级项目经理）</td><td>—</td></tr>
<tr><td>优先级排序</td><td>干系人多、成员频繁变化、关系复杂时排序</td><td>大量干系人</td></tr></table>
<div class="tip">出题套路：题干出现"<b>复杂、大型群体、关系网络</b>"→ 凸显模型；出现"<b>二维、简单、小型</b>"→ 权力利益方格。</div>`},
    {t:'干系人登记册——识别干系人的唯一新输出', f:'high', s:3, m:'登记册三块：身份、评估、分类。', b:`
<table class="kt"><tr><th>三大块</th><th>内容</th></tr>
<tr><td>身份信息</td><td>姓名、组织职位、地点、联系方式、项目中的角色</td></tr>
<tr><td>评估信息</td><td>主要需求、期望、潜在影响、利益最大阶段、与项目生命周期哪个阶段最密切相关</td></tr>
<tr><td>干系人分类</td><td>内部/外部；支持者/中立者/反对者；上/下/外围或横向</td></tr></table>
<div class="pit"><b>输出辨析（高频）：</b>识别干系人的输出是<b>干系人登记册</b>；<b>干系人参与计划</b>、干系人参与评估矩阵是规划过程组"规划干系人参与"的输出——两者年年互为干扰项。另注意变更日志、问题日志、风险登记册是本过程的"更新"而非新产出。</div>`},
    {t:'项目启动会议——章程的"发布会"', f:'high', s:3, m:'启动会公布章程定责权，开工会计划批准再动员。', b:`
<p><b>性质：</b>项目正式启动的工作会议，通常<b>由项目经理负责组织和召开</b>，标志着项目经理责权定义结果的正式公布。</p>
<p><b>主要目的：</b>使各方干系人明确项目的<b>目标、范围、需求、背景</b>及各自的<b>职责与权限</b>，<b>正式公布项目章程</b>。</p>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-row">
    <div class="dg-box" style="flex:1;border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)"><b style="color:#cfc8ff">项目启动会议</b><span>项目章程批准后 · 详细计划制定<b>前</b> · PM 主持 · 公布章程、明确职责权限</span></div>
    <div class="dg-harrow">≠</div>
    <div class="dg-box" style="flex:1;border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.05)"><b style="color:#a5e8f5">开工会议</b><span>项目管理计划批准后 · 执行开始<b>前</b>（执行过程组）· 动员团队按计划开工</span></div>
  </div>
</div>
<figcaption>启动会议 ≠ 开工会议：时点不同、主持定位不同、内容不同</figcaption>
</figure>
<div class="pit"><b>案例题典型踩分点：</b>缺少启动会议 → 干系人对项目目标认知不一致、职责不清。参会人员通常包括发起人、组织高层领导、客户及用户代表、资源和职能部门负责人等。</div>`},
    {t:'启动会议五步骤——"目准参议记"', f:'high', s:3, m:'目准参议记：目标→准备→参会→议题→记录。', b:`
<figure class="kd-fig kd-fig-scroll">
<div class="dg">
  <div class="dg-row" style="flex-wrap:nowrap;min-width:560px">
    <div class="dg-box" style="flex:1"><b>① 定目标</b><span>初始沟通 · 相互了解 · 达成共识</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box" style="flex:1"><b>② 会准备</b><span>审阅文件 · 明确议题 · 编初步计划</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box" style="flex:1"><b>③ 定参会</b><span>发起人 · 高层 · 客户用户代表</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box" style="flex:1"><b>④ 明议题</b><span>开发过程 · 产出物 · 资源进度</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box" style="flex:1"><b>⑤ 做记录</b><span>纪要分发归档 · 跟踪承诺依据</span></div>
  </div>
</div>
<figcaption>五步顺序是真题最爱；会议输出必须是"会议纪要"并正式分发</figcaption>
</figure>
<div class="pit"><b>热门陷阱：</b>"识别项目目标和价值"属于立项论证/章程层面的工作，<b>不是</b>启动会议的步骤——它是选择题里最假的"第六步"。也别把"确定会议目标"（沟通目标）与"识别项目目标"（商业论证）混淆。</div>`},
    {t:'关注价值和目标', f:'mid', s:2, m:'价值看论证，成果看指标，约束看资源。', b:`
<p><b>项目价值：</b>项目对组织或客户产生的实际收益——经济效益（成本节约）、战略价值（市场拓展）、社会价值（合规提升）。<b>最终衡量依据：是否实现商业论证中的预期收益</b>。</p>
<table class="kt"><tr><th>目标类型</th><th>含义</th><th>示例</th></tr>
<tr><td>成果性目标</td><td>项目交付物的具体指标</td><td>产品功能、性能（响应≤2秒）、质量标准</td></tr>
<tr><td>约束性目标</td><td>项目的限制条件</td><td>预算、进度、资源</td></tr></table>
<figure class="kd-fig kd-fig-scroll">
<div class="dg-row" style="flex-wrap:nowrap;min-width:540px">
  <div class="dg-box"><b>战略需求</b></div><div class="dg-harrow">→</div>
  <div class="dg-box"><b>商业论证</b></div><div class="dg-harrow">→</div>
  <div class="dg-box"><b>项目章程</b></div><div class="dg-harrow">→</div>
  <div class="dg-box"><b>目标分解</b></div><div class="dg-harrow">→</div>
  <div class="dg-box"><b>执行监控</b></div>
</div>
<figcaption>价值逻辑链：战略 → 论证 → 章程 → 分解 → 监控</figcaption>
</figure>
<ul>
<li><b>价值主张明确：</b>通过商业论证（成本效益分析、战略匹配度评估）论证价值；建立价值监控机制（里程碑评审、收益跟踪）。</li>
<li><b>目标分解与对齐：</b>高层级目标分解为可执行目标，通过启动会议或章程签署确保干系人共识。</li>
<li><b>生命周期差异：</b>预测型先完整定义范围再执行；敏捷型/适应型通过迭代评审会快速验证价值实现（第3版强调价值驱动与裁剪）。</li>
</ul>`},
    {t:'本章易错易混速查表', f:'high', s:3, m:'两过程一会议；章程方格凸显模型，拿下就是送分题。', b:`

<tr><td>章程由谁签发</td><td>发起人 / PMO 等项目外机构；PM 可参与编制但不能签发</td></tr>
<tr><td>章程内容边界</td><td>只含高层级；详细计划、范围说明书、WBS、成本基准、项目生命周期都不在</td></tr>
<tr><td>制定章程的输出</td><td>项目章程 + 假设日志（变更/问题/风险日志均为干扰项）</td></tr>

<tr><td>章程 vs 合同</td><td>章程=内部合作关系；合同=外部、有法律约束力</td></tr>
<tr><td>识别干系人时机</td><td>章程之前或同时首次，之后全程定期（非一次性）</td></tr>
<tr><td>权力利益方格策略</td><td>高权高利重点管理；高权低利令其满意；低权高利随时告知；低权低利监督</td></tr>
<tr><td>凸显模型三维度</td><td>权力、合法性、紧迫性——没有"利益"</td></tr>
<tr><td>数据表现 vs 数据收集</td><td>方格/立方体/凸显模型=数据表现；问卷/头脑风暴=数据收集</td></tr>
<tr><td>识别干系人的输出</td><td>干系人登记册；干系人参与计划是"规划干系人参与"的输出</td></tr>
<tr><td>启动会议 vs 开工会议</td><td>章程批准后（启动会、PM主持）vs 计划批准后（开工会）</td></tr>
<tr><td>启动会议五步骤</td><td>目准参议记；不含"识别项目目标和价值"</td></tr></table>
<div class="tip"><b>考情：</b>本章上午选择题约 1~2 分，章程内容与干系人分析工具是绝对主力；案例题爱考"缺少启动会议/章程"的场景分析，按"缺什么→会导致什么→应补什么"三步作答。</div>`}
  ], quiz:[
    {q:'启动过程组包括两个过程，分别为（ ）', o:['制定项目章程和任命项目经理','制定项目章程和识别干系人','定义范围和组建项目团队','定义范围和识别干系人'], a:1, k:'启动过程组概述', e:'启动过程组仅包含两个过程：项目整合管理中的"制定项目章程"和项目干系人管理中的"识别干系人"。任命项目经理在章程中完成，不是独立过程；定义范围、组建项目团队属于规划过程组。（2024年11月真题）'},
    {q:'以下不属于制定项目章程输入的是（ ）', o:['立项管理文件','协议','需求文件','事业环境因素'], a:2, k:'制定项目章程的输入', e:'输入为：立项管理文件（项目建议书、可行性研究报告、项目评估报告）、协议（合同、MOU、SLA等）、事业环境因素、组织过程资产。需求文件是规划过程组"收集需求"的输出。（2023年下半年真题，错误率61%）'},

    {q:'（ ）是正式批准一个项目的文档，或者是批准现行项目是否进入下一阶段的文档', o:['项目合同','项目章程','项目范围说明书','项目管理计划'], a:1, k:'项目章程的定义', e:'项目章程由项目以外的机构（如发起人、PMO）签发，一经批准即标志项目正式启动，并授权项目经理在项目活动中使用组织资源。范围说明书和项目管理计划都是规划阶段产物。（2025年下半年真题）'},
    {q:'关于项目章程的编制与签发，正确的说法是（ ）', o:['项目章程必须由项目经理签发','项目章程可由项目经理与发起机构合作编制，由发起人等项目以外的机构签发','项目章程由客户签发','项目章程一经批准，任何情况下都不能修订'], a:1, k:'项目章程的编制与签发', e:'项目经理可以参与甚至牵头起草章程，但签发和修订权在项目外部的发起人、PMO或项目组合治理委员会手中——"编制可以，签发不行"。当项目目标、预算等高层级参数发生重大变化时章程可以修订。'},
    {q:'制定项目章程的主要输出包括项目章程和（ ）', o:['变更日志','问题日志','假设日志','风险登记册'], a:2, k:'制定项目章程的输出', e:'制定项目章程的输出只有两个：项目章程和假设日志。假设日志记录整个项目生命周期中的所有假设条件和制约因素，是"活"的文档。变更/问题/风险日志是其他过程的输出，常作干扰项。（2023年11月真题）'},
    {q:'关于立项管理文件，以下描述正确的是（ ）', o:['项目经理可以随时修改立项管理文件以适应项目变化','立项管理文件不是项目文件，项目经理不能修改，只能提出建议，且需定期审核','立项管理文件属于项目文件的一部分','立项管理文件在项目启动后无需再审核'], a:1, k:'立项管理文件', e:'立项管理文件（项目建议书、可研报告、评估报告）不是项目文件，项目经理不可以更新或修改，只能提出相关建议；虽然制定于项目之前，但需要定期审核。它是组织高层立项决策的依据。'},
    {q:'关于项目章程与合同的区别，正确的说法是（ ）', o:['项目章程是具有法律约束力的文件','为外部客户做项目时，通常用项目章程代替合同','项目章程用于建立组织内部合作关系，合同用于外部合作且具有法律约束力','合同由项目经理签发，项目章程由客户签发'], a:2, k:'项目章程与合同', e:'合同具有法律约束力，为外部客户做项目时需要签订正式合同；项目章程用于建立组织内部合作关系，确保正确交付合同内容。（2024年下半年考过此辨析）'},
    {q:'关于识别干系人过程，正确的描述是（ ）', o:['仅在启动阶段开展一次','通常在编制和批准项目章程之前或同时首次开展，之后必要时重复开展','只在项目收尾时开展','由项目发起人负责开展'], a:1, k:'识别干系人的开展时机', e:'识别干系人不是启动阶段的一次性活动：首次通常在编制和批准项目章程之前或同时开展，之后至少在每个阶段开始时、项目或组织出现重大变化时重复开展，整个项目期间根据需要定期开展。'},
    {q:'某项目干系人权力高但利益低（如监管部门），对其应采取的管理策略是（ ）', o:['重点管理','随时告知','令其满意','监督'], a:2, k:'权力利益方格', e:'四象限策略：高权高利→重点管理（发起人）；高权低利→令其满意（监管部门）；低权高利→随时告知（终端用户）；低权低利→监督（外围人员）。对高权低利者"哄开心"，防止其暗中阻挠项目。'},
    {q:'（ ）适用于复杂的干系人大型群体，或在干系人群体内部存在复杂的关系网络，可用于确定已识别干系人的相对重要性', o:['权力利益方格','凸显模型','问卷调查','优先级排序'], a:1, k:'凸显模型', e:'凸显模型从权力、合法性、紧迫性三个维度评估分类，适用于复杂干系人大型群体或复杂关系网络。权力利益方格适用于小型、关系简单的项目；问卷调查属于数据收集技术，不是分类模型。（2025年真题）'},
    {q:'凸显模型评估干系人的三个属性是（ ）', o:['权力、利益、影响','权力、合法性、紧迫性','权力、利益、紧迫性','合法性、紧迫性、依赖性'], a:1, k:'凸显模型', e:'凸显模型三维度：权力（影响能力）、合法性（参与关系的正当性）、紧迫性（诉求的时间敏感性），三者皆高为"关键干系人"。"利益"是权力利益方格的维度，不要混入凸显模型。'},
    {q:'以下属于识别干系人过程"数据表现"技术的是（ ）', o:['问卷调查','头脑风暴','干系人映射分析/表现','访谈'], a:2, k:'识别干系人的工具与技术', e:'数据表现即干系人映射分析/表现，包括权力利益方格、作用影响方格、干系人立方体、凸显模型、影响方向、优先级排序等。问卷调查、头脑风暴属于"数据收集"技术，注意分类别混。'},
    {q:'识别干系人过程的主要输出是（ ）', o:['干系人参与计划','干系人登记册','干系人参与评估矩阵','沟通管理计划'], a:1, k:'识别干系人的输出', e:'识别干系人输出干系人登记册（身份信息、评估信息、干系人分类三大块）。干系人参与计划和参与评估矩阵属于后续"规划干系人参与"过程的输出，是经典混淆项。'},
    {q:'干系人登记册中"评估信息"包括的内容是（ ）', o:['姓名、组织职位、地点和联系方式','主要需求、期望、潜在影响以及利益最大阶段','内部/外部、支持者/中立者/反对者','项目审批要求和退出标准'], a:1, k:'干系人登记册', e:'三大块记忆：身份信息（姓名、职位、地点、联系方式、角色）→ 评估信息（需求、期望、潜在影响、利益最大阶段）→ 干系人分类（内外部、支持/中立/反对、上/下/外围/横向）。A是身份信息，C是分类信息，D是项目章程内容。'},
    {q:'在识别干系人时，（ ）可能引入新的干系人，因而其更新常触发干系人的重新识别', o:['变更日志','活动清单','质量测量指标','采购工作说明书'], a:0, k:'识别干系人的输入', e:'项目文件中的变更日志（批准的变更可能带来新干系人）、问题日志、需求文件都是识别干系人的重要输入。这也是识别干系人要在整个项目期间定期开展的原因之一。'},
    {q:'在系统集成项目中，为项目提供资金或资源支持的个人或组织属于（ ）类干系人', o:['项目客户和用户','项目发起人','资源或职能部门','供应商'], a:1, k:'项目干系人的类别', e:'六大类：项目客户和用户、项目团队及成员、项目发起人（提供资金/资源）、资源或职能部门（矩阵型组织中提供研发测试支持）、供应商（外部产品服务提供方）、其他相关组织或个人（监理、公众）。'},
    {q:'关于项目启动会议，正确的描述是（ ）', o:['在项目管理计划批准后、执行开始前召开','由项目发起人负责组织和召开','在项目章程批准后召开，用于正式公布项目章程、明确各方职责与权限','与开工会议只是同一个会议的两种叫法'], a:2, k:'项目启动会议', e:'启动会议由项目经理负责组织和召开，在章程批准后、详细计划制定前召开，目的是使干系人明确目标、范围、需求、背景及职责权限，正式公布章程。开工会议则在项目管理计划批准后召开（执行过程组），两者时点、主持人、内容都不同。'},
    {q:'项目启动会议的5个工作步骤的正确顺序是（ ）', o:['识别参会人员→确定会议目标→会议准备→明确议题→会议记录','确定会议目标→会议准备→识别参会人员→明确议题→会议记录','会议准备→确定会议目标→识别参会人员→明确议题→会议记录','确定会议目标→识别参会人员→会议准备→明确议题→会议记录'], a:1, k:'项目启动会议的步骤', e:'口诀"目准参议记"：先定会议目标→会前准备（审阅文件、明确关键议题、编制初步计划）→识别参会人员（关键干系人）→明确议题（开发过程、产出物、资源进度）→最后做会议记录形成纪要分发归档。'},
    {q:'以下不属于项目启动会议工作步骤的是（ ）', o:['确定会议目标','会议准备','识别项目目标和价值','进行会议记录'], a:2, k:'项目启动会议的步骤', e:'5步为：确定会议目标、会议准备、识别参会人员、明确议题、进行会议记录。"识别项目目标和价值"属于立项论证/章程层面的工作，不是启动会议的步骤——这是最热门的陷阱选项。'},
    {q:'项目价值的最终衡量依据是（ ）', o:['项目是否按期完成','是否实现商业论证中的预期收益','项目预算结余的多少','客户验收报告是否签署'], a:1, k:'关注价值和目标', e:'项目价值包括经济效益、战略价值和社会价值，最终以是否实现商业论证中的预期收益来衡量。按期完成、验收签署只是过程性节点，商业价值实现才是终极标尺。'},
    {q:'某信息系统项目的目标描述为"系统上线后查询响应时间不超过2秒"，该目标属于（ ）', o:['约束性目标','成果性目标','管理性目标','阶段性目标'], a:1, k:'项目目标分类', e:'成果性目标指项目交付物的具体指标（功能、性能、质量标准），如响应时间、并发用户数；约束性目标指项目的限制条件（预算、进度、资源）。性能指标→成果性；时间费用约束→约束性。'}
  ]},
  {id:11, title:'规划过程组',         sec:'pm',  page:365, cards:[
    {t:'规划过程组全貌——24个过程', f:'high', s:3, m:'整1范4进5成3，质1资2沟1风5，采1干1，合计24。', b:`
<p><b>定位：</b>规划过程组包含<b>24个过程</b>，覆盖十大知识领域，为执行过程组提供项目管理计划和项目文件。主要作用：<b>明确总范围、定义目标、制订行动方案</b>。</p>
<figure class="kd-fig kd-fig-scroll">
<div class="dg dg-3">
  <div class="dg-box" style="border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)"><b style="color:#cfc8ff">整合 ×1</b><span>制订项目管理计划</span></div>
  <div class="dg-box" style="border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.05)"><b style="color:#a5e8f5">范围 ×4</b><span>规划范围管理 → 收集需求 → 定义范围 → 创建WBS</span></div>
  <div class="dg-box" style="border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.05)"><b style="color:#a5e8f5">进度 ×5</b><span>规划进度管理 → 定义活动 → 排序 → 估算历时 → 制订进度计划</span></div>
  <div class="dg-box" style="border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.05)"><b style="color:#fde68a">成本 ×3</b><span>规划成本管理 → 估算成本 → 制定预算</span></div>
  <div class="dg-box"><b>质量 ×1</b><span>规划质量管理</span></div>
  <div class="dg-box"><b>资源 ×2</b><span>规划资源管理 → 估算活动资源</span></div>
  <div class="dg-box"><b>沟通 ×1</b><span>规划沟通管理</span></div>
  <div class="dg-box" style="border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.04)"><b style="color:#fda4af">风险 ×5</b><span>规划风险管理 → 识别风险 → 定性分析 → 定量分析 → 规划应对</span></div>
  <div class="dg-box"><b>采购 ×1</b><span>规划采购管理</span></div>
  <div class="dg-box"><b>干系人 ×1</b><span>规划干系人参与</span></div>
</div>
<figcaption>十大领域过程数口诀：整1范4进5成3，质1资2沟1风5，采1干1 = 24</figcaption>
</figure>
<div class="pit"><b>考题坑点：</b>"规划过程组包含的过程数量"直接出选择题；风险领域5个过程最多（与范围并列时注意：范围4个、进度5个、风险5个）。</div>
<div class="tip">规划各过程<b>相互迭代</b>，并非严格按顺序一次性完成——计划是"活文件"，随信息增加渐进明细。</div>`},
    {t:'制订项目管理计划——10子计划+3基准', f:'high', s:3, m:'十个子计划，三大基准，外加变更配置生命周期。', b:`
<p><b>定义：</b>定义、准备和协调所有子计划，并把它们整合为一份<b>综合项目管理计划</b>。作用：生成一份综合文件，确定所有项目工作的基础及执行方式。</p>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-box" style="border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)">
    <b style="color:#cfc8ff">10 大子管理计划</b>
    <span style="display:block;line-height:1.9">范围 · 需求 · 进度 · 成本 · 质量 · 资源 · 沟通 · 风险 · 采购 · 干系人参与</span>
  </div>
  <div class="dg-row" style="margin-top:9px">
    <div class="dg-box" style="flex:1;border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.05)"><b style="color:#fde68a">3 大基准</b><span>范围基准 · 进度基准 · 成本基准</span></div>
    <div class="dg-box" style="flex:1"><b>其他组件</b><span>变更管理计划 · 配置管理计划 · 绩效测量基准 · 项目生命周期 · 开发方法</span></div>
  </div>
</div>
<figcaption>项目管理计划 = 10 子计划 + 3 基准 + 其他组件</figcaption>
</figure>
<ul>
<li><b>输入：</b>项目章程、其他过程的输出、事业环境因素、组织过程资产。</li>
<li><b>关键原则：</b>计划应<b>足够稳健</b>以应对变化；<b>基准只有经过正式变更控制程序才能变更</b>。</li>
</ul>
<div class="pit"><b>两大坑：</b>① 三大基准是"范围/进度/成本"，没有"质量基准"；② 项目章程是制订计划的<b>输入</b>，不是计划组件。</div>`},
    {t:'规划范围管理——两份"怎么管"的计划', f:'mid', s:2, m:'范围计划管范围，需求计划管需求，里面都没有范围本身。', b:`
<table class="kt"><tr><th>输出</th><th>回答的问题</th><th>内容要点</th></tr>
<tr><td>范围管理计划</td><td>范围"怎么管"</td><td>如何定义、创建、确认和控制项目范围及产品范围</td></tr>
<tr><td>需求管理计划</td><td>需求"怎么管"</td><td>如何分析、记录、管理需求</td></tr></table>
<div class="pit"><b>易错点：</b>两份计划里<b>只有方法程序，没有具体范围/需求内容</b>——具体内容在需求文件、范围说明书里。输入为项目章程、项目管理计划（质量管理计划、项目生命周期、开发方法）、EEF、OPA。</div>`},
    {t:'收集需求——12类工具与两大输出', f:'high', s:3, m:'访谈焦点问卷标杆收需求，投票独裁多标准来决策。', b:`
<p><b>定义：</b>为实现项目目标而确定、记录并管理干系人的需要和需求。作用：为定义产品范围和项目范围<b>奠定基础</b>。</p>
<table class="kt"><tr><th>工具类别</th><th>具体技术（高频）</th></tr>
<tr><td>数据收集</td><td><b>头脑风暴、访谈、焦点小组、问卷调查、标杆对照</b></td></tr>
<tr><td>数据分析</td><td>备选方案分析</td></tr>
<tr><td>决策</td><td><b>投票（一致同意 / 大多数同意 / 相对多数原则）、独裁型决策制定、多标准决策分析</b></td></tr>
<tr><td>数据表现</td><td>亲和图、思维导图</td></tr>
<tr><td>人际关系与团队技能</td><td><b>名义小组技术</b>、观察/交谈、引导</td></tr>
<tr><td>其他</td><td>系统交互图（产品范围可视化）、<b>原型法</b>（先造实用模型再征求反馈）</td></tr></table>
<p><b>输出① 需求文件</b>：业务需求、干系人需求、<b>解决方案需求（功能需求 + 非功能需求）</b>、过渡和就绪需求、项目需求、质量需求。</p>
<p><b>输出② 需求跟踪矩阵</b>：把产品需求从其<b>来源连接到可交付成果</b>的表格，记录每个需求的唯一标识、描述、理由、所有者、来源、优先级、版本、状态等属性。</p>
<div class="tip"><b>矩阵的价值：</b>防止"需求掉链子"——每个需求都能追溯到来源并链接到验收，是控制范围、验收交付的依据。</div>`},
    {t:'定义范围——项目范围说明书', f:'high', s:3, m:'描述成果定边界，验收标准除外责。', b:`
<p><b>作用：</b>描述产品、服务或成果的<b>边界和验收标准</b>。输出<b>项目范围说明书</b>，内容包括：</p>
<ul>
<li><b>产品范围描述</b>（逐步细化章程和需求文件中的内容）</li>
<li><b>可交付成果</b></li>
<li><b>验收标准</b></li>
<li><b>项目的除外责任</b>——明确哪些<b>不属于</b>项目范围，防止范围蔓延</li>
</ul>
<figure class="kd-fig">
<div class="dg dg-2">
  <div class="dg-box" style="border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)"><b style="color:#cfc8ff">项目章程</b><span>高层级信息 · 目的/目标/边界粗线条 · 启动过程组输出</span></div>
  <div class="dg-box" style="border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.05)"><b style="color:#a5e8f5">项目范围说明书</b><span>详细描述 · 边界+可交付成果+验收标准+除外责任 · 规划过程组输出</span></div>
</div>
<figcaption>章程"高层级" vs 范围说明书"详细"——最经典的选择题对比</figcaption>
</figure>
<div class="pit"><b>2025年真题坑：</b>"定义范围的输入项目文件是（风险登记册）"——范围基准和WBS是本过程<b>输出</b>（经创建WBS整合）而非输入，别选反。</div>`},
    {t:'创建WBS——分解5步骤（重中之重）', f:'high', s:3, m:'识别→结构→细化→编码→核实。', b:`
<p><b>定义：</b>把项目可交付成果和项目工作分解成<b>较小、更易于管理</b>的组件。作用：对所要交付的内容提供<b>结构化的视图</b>。</p>
<figure class="kd-fig kd-fig-scroll">
<div class="dg">
  <div class="dg-row" style="flex-wrap:nowrap;min-width:600px">
    <div class="dg-box" style="flex:1"><b>① 识别</b><span>识别和分析可交付成果及相关工作</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box" style="flex:1"><b>② 定结构</b><span>确定WBS的结构和编排方法</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box" style="flex:1"><b>③ 细化</b><span>自上而下逐层细化分解</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box" style="flex:1"><b>④ 编码</b><span>为WBS组件制定和分配标识编码</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box" style="flex:1"><b>⑤ 核实</b><span>核实分解程度是否恰当</span></div>
  </div>
</div>
<figcaption>分解五步骤顺序是真题最爱——"识别→结构→细化→编码→核实"</figcaption>
</figure>
<div class="tip"><b>主要输出：</b>范围基准（详见下方专卡）。WBS第二层可以是<b>生命周期阶段</b>，也可以是<b>主要可交付成果</b>。</div>`},
    {t:'WBS编制原则（真题陷阱密集区）', f:'high', s:3, m:'百分百、唯成果、唯一负责人；四到六层、八十小时。', b:`
<table class="kt"><tr><th>原则</th><th>说明</th></tr>
<tr><td><b>100%原则</b></td><td>下层所有工作包之和<b>完全覆盖</b>上层全部范围——不遗漏、不超出</td></tr>
<tr><td><b>面向可交付成果</b></td><td>分解的是可交付成果，<b>不是活动</b>——活动清单在"定义活动"中产生</td></tr>
<tr><td><b>唯一负责人</b></td><td>每个工作包必须指定<b>唯一</b>负责人（不是"一个或多个"）</td></tr>
<tr><td><b>粒度均衡</b></td><td>同一层级粒度尽量一致；通常<b>4~6层</b>；工作包"<b>80小时原则</b>"（不超过两周）</td></tr>
<tr><td><b>包含项目管理工作</b></td><td>项目管理本身也是工作，须纳入WBS</td></tr>
<tr><td><b>分包也要纳入</b></td><td>分包出去的工作仍属项目范围，必须包含在WBS中</td></tr>
<tr><td><b>干系人参与</b></td><td>由用户和项目干系人共同完成并<b>一致确认</b></td></tr>
<tr><td><b>并非一成不变</b></td><td>合理范围变更时，可通过<b>正式变更控制程序</b>修改</td></tr></table>
<div class="pit"><b>经典真题坑（2025上）：</b>"WBS的元素必须指定<b>一个或多个</b>负责人"——错误！只能<b>唯一</b>负责人。"每个分支必须分解到相同层次"——错误，<b>不必同层</b>。"分解越细越好"——错误，过细增加管理成本。"WBS元素须考虑时间顺序"——错误，面向成果不面向时间。</div>`},
    {t:'范围基准与工作包/规划包/控制账户', f:'high', s:3, m:'基准三件套：说明书+WBS+字典；账上包下是规划包。', b:`
<p><b>范围基准 = 项目范围说明书 + WBS + WBS字典</b>（三个组件缺一不可）。</p>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-box" style="border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.05)">
    <b style="color:#fde68a">控制账户（CA）</b><span>管理控制点 · 一个控制账户包含<b>多个</b>工作包 · 挣值管理的基石</span>
  </div>
  <div class="dg-varrow">▼ 以下可有</div>
  <div class="dg-box" style="border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)">
    <b style="color:#cfc8ff">规划包</b><span>控制账户以下、工作包以上 · 工作内容已知但<b>详细进度未知</b></span>
  </div>
  <div class="dg-varrow">▼ 最低层</div>
  <div class="dg-box" style="border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.05)">
    <b style="color:#a5e8f5">工作包</b><span>WBS的<b>最低层</b> · 可估算和管理成本与持续时间 · 只能属于<b>一个</b>控制账户</span>
  </div>
</div>
<figcaption>层级关系：控制账户 ⊃ 规划包（可选）⊃ 工作包</figcaption>
</figure>
<p><b>WBS字典</b>：对WBS每个组件的详细描述——账户编码、工作描述、假设条件、负责人、进度里程碑、资源、成本估算、质量要求、验收标准等。</p>
<div class="pit"><b>2025上真题：</b>"WBS的最低层次称为工作包，一个工作包只能属于<b>一个</b>控制账户"——正确表述。范围基准经批准后成为后续成本、进度计划的基础。</div>`},
    {t:'规划进度管理与定义活动', f:'mid', s:2, m:'工作包变活动，里程碑零工期。', b:`
<p><b>规划进度管理</b>输出<b>进度管理计划</b>：项目进度模型制定、发布与迭代长度、准确度、计量单位、控制临界值、绩效测量规则、报告格式等。</p>
<p><b>定义活动</b>：识别和记录为完成可交付成果而须采取的<b>具体行动</b>——把<b>工作包分解为活动</b>。输出3项：</p>
<table class="kt"><tr><th>输出</th><th>要点</th></tr>
<tr><td>活动清单</td><td>包含项目所需的全部进度活动</td></tr>
<tr><td>活动属性</td><td>ID、名称、紧前紧后活动、逻辑关系、提前量与滞后量、资源需求、强制日期、制约因素和假设条件等</td></tr>
<tr><td>里程碑清单</td><td>指明是强制性还是选择性；<b>里程碑持续时间为零</b></td></tr></table>
<div class="tip"><b>滚动式规划：</b>近期工作详细分解、远期工作粗略分解——是一种<b>渐进明细</b>的规划方式，与敏捷理念相通。</div>`},
    {t:'排列活动顺序——PDM与4种逻辑关系', f:'high', s:3, m:'FS最常用，SS看齐走，FF同收尾，SF最罕见。', b:`
<table class="kt"><tr><th>工具</th><th>要点</th></tr>
<tr><td><b>紧前关系绘图法（PDM）</b></td><td>又称<b>单代号网络图</b>：节点=活动，箭线=逻辑关系。支持4种关系</td></tr>
<tr><td><b>箭线图法（ADM）</b></td><td>又称<b>双代号网络图</b>：箭线=活动，节点=事件。<b>只有FS一种关系</b>；可用<b>虚活动</b>（不耗时）表示依赖</td></tr>
<tr><td><b>提前量和滞后量</b></td><td>提前量是<b>负值</b>（如测试提前2天介入），滞后量是<b>正值</b>（如养护3天后才能验收）</td></tr>
<tr><td>项目管理信息系统</td><td>进度规划软件</td></tr></table>
<figure class="kd-fig">
<div class="dg dg-2">
  <div class="dg-box"><b>FS 完成→开始</b><span>前序完成后，后续才能开始（<b>最常用</b>）</span></div>
  <div class="dg-box"><b>SS 开始→开始</b><span>前序开始后，后续才能开始</span></div>
  <div class="dg-box"><b>FF 完成→完成</b><span>前序完成后，后续才能完成</span></div>
  <div class="dg-box"><b>SF 开始→完成</b><span>前序开始后，后续才能完成（最少见）</span></div>
</div>
<figcaption>PDM四种逻辑关系——"完成-开始"是默认逻辑</figcaption>
</figure>
<p><b>输出：</b>项目进度网络图（表示活动间逻辑关系的图形）。</p>`},
    {t:'估算方法四兄弟——类比/参数/三点/自下而上', f:'high', s:3, m:'类比粗、参数模、三点摇、自下而上最准最累。', b:`
<table class="kt"><tr><th>方法</th><th>原理</th><th>特点</th></tr>
<tr><td><b>类比估算</b></td><td>使用类似项目的<b>历史数据</b>估算</td><td>成本低、耗时少、<b>准确性低</b>；适用于<b>详细信息不足</b>时（项目早期）</td></tr>
<tr><td><b>参数估算</b></td><td>历史数据 + <b>参数模型</b>（如每平方米工时×面积）</td><td>准确性取决于<b>模型的成熟度和数据的可靠性</b></td></tr>
<tr><td><b>三点估算</b></td><td>考虑不确定性：乐观O、最可能M、悲观P</td><td>详见公式卡</td></tr>
<tr><td><b>自下而上估算</b></td><td>活动细化估算后<b>逐层向上汇总</b></td><td><b>最准确但最耗时</b></td></tr></table>
<div class="tip"><b>场景题眼：</b>题干出现"参考以前类似项目"→类比；"每单位产量×数量"→参数；"乐观/悲观"→三点；"逐项估算再汇总"→自下而上。</div>`},
    {t:'三点估算与PERT公式（必考计算）', f:'high', s:3, m:'贝塔除以六，三角除以三；标准差悲观减乐观再除六。', b:`
<figure class="kd-fig">
<div class="dg dg-2">
  <div class="dg-box" style="border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)"><b style="color:#cfc8ff">贝塔分布（PERT）</b><span style="font-family:ui-monospace,Consolas,monospace;font-size:15px">Te = (O + 4M + P) / 6</span><span>最可能值M权重为4 · 未指明分布时<b>默认用它</b></span></div>
  <div class="dg-box" style="border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.05)"><b style="color:#a5e8f5">三角分布</b><span style="font-family:ui-monospace,Consolas,monospace;font-size:15px">Te = (O + M + P) / 3</span><span>三个值等权重 · 题干明确写"三角分布"才用</span></div>
</div>
</figure>
<ul>
<li><b>标准差：</b>σ = (P − O) / 6（悲观减乐观再除六）。</li>
<li><b>置信概率：</b>±1σ = 68.26%，±2σ = 95.43%（约95.4%），±3σ = 99.73%。</li>
</ul>
<div class="pit"><b>2025年真题：</b>计划工期15天、最快8天、最慢25天，按β分布估算工期 = (8 + 4×15 + 25) / 6 = <b>15.5天</b>。审题三查：①除以6还是3？②M乘了几倍？③最后别忘记验算数量级。</div>`},

    {t:'资源平衡 vs 资源平滑（必考辨析）', f:'high', s:3, m:'平衡动路径延工期，平滑蹭浮动不误期。', b:`
<figure class="kd-fig">

  <div class="dg-box" style="text-align:left;border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.04)">
    <b style="color:#fda4af">资源平衡</b>
    <span style="display:block;line-height:2">· 根据资源制约因素调整活动日期<br>· <b>通常改变关键路径</b><br>· <b>工期可能延长</b><br>· 适用于资源超负荷、必须解决冲突时</span>
  </div>
  <div class="dg-box" style="text-align:left;border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.04)">

    <span style="display:block;line-height:2">· 利用<b>浮动时间</b>调整活动安排<br>· <b>不改变关键路径</b><br>· <b>不影响工期</b><br>· 无法实现全部资源的优化（受浮动时间限制）</span>
  </div>
</div>
<figcaption>一句话区分：平衡"动真格会延期"，平滑"蹭浮动不误期"</figcaption>
</figure>
<div class="pit"><b>出题套路：</b>题干说"不改变关键路径、利用时差调整资源"→<b>平滑</b>；说"资源冲突导致日期重排、工期延长"→<b>平衡</b>。两者都属于<b>资源优化技术</b>。</div>`},
    {t:'进度压缩——赶工 vs 快速跟进（必考）', f:'high', s:3, m:'赶工加钱加人赶，快速跟进并行干；赶工涨成本，跟进易返工。', b:`
<figure class="kd-fig">

  <div class="dg-box" style="text-align:left;border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)">
    <b style="color:#cfc8ff">赶工 Crashing</b>
    <span style="display:block;line-height:2">· <b>增加资源</b>（加班、加人、加设备）压缩关键活动工期<br>· 以<b>最小成本代价</b>为原则<br>· 代价：<b>可能增加成本和风险</b><br>· 只对<b>关键路径</b>上的活动赶工才有意义</span>
  </div>

<p><b>规划成本管理</b>输出<b>成本管理计划</b>：计量单位、精确度、准确度、<b>组织程序链接</b>（控制账户与会计制度关联）、控制临界值、绩效测量规则（挣值管理EVM）、报告格式等。</p>

    {t:'规划质量管理', f:'high', s:3, m:'计划定怎么管，指标定衡什么；预防评估是一致性，内外失败是非一致性。', b:`
<p><b>定义：</b>识别项目及可交付成果的质量要求/标准，并书面描述<b>如何证明符合</b>。输出：</p>

<p><b>质量成本（COQ）四类：</b></p>

    {t:'规划资源管理与RACI矩阵', f:'high', s:3, m:'层级看高层，矩阵配工作，文本写细节；RACI只有一个A。', b:`

    {t:'规划风险管理——风险属性与分类', f:'mid', s:2, m:'随机相对又可变；纯粹只损，投机兼得。', b:`
<p><b>风险三大属性：</b></p>
<ul>
<li><b>随机性</b>：风险事件发生及后果具有偶然性；</li>
<li><b>相对性</b>：同样风险对不同主体影响不同——受<b>收益大小、投入大小、主体地位</b>影响承受能力；</li>
<li><b>可变性</b>：风险性质变化、后果变化、出现新风险。</li>
</ul>
<table class="kt"><tr><th>分类标准</th><th>类型</th></tr>
<tr><td>按后果</td><td><b>纯粹风险</b>（只有损失机会）/ <b>投机风险</b>（既有损失可能又有获利机会）</td></tr>
<tr><td>按来源</td><td>自然风险 / 人为风险</td></tr>
<tr><td>按可管理性</td><td>可管理 / 不可管理风险</td></tr>
<tr><td>按影响范围</td><td>局部风险 / 总体风险</td></tr>
<tr><td>按可预测性</td><td><b>已知风险 / 可预测风险 / 不可预测风险</b></td></tr></table>
<p><b>风险管理计划内容：</b>风险管理策略、方法论、角色与职责、资金、时间安排、<b>风险类别（常用风险分解结构RBS）</b>、干系人风险偏好、<b>风险概率和影响定义</b>、<b>概率和影响矩阵</b>、报告格式、跟踪。</p>`},

<p><b>适用范围：</b><b>并非所有项目都需要</b>——通常适用于大型、复杂、战略重要、有合同或干系人要求的项目。</p>

<tr><td><b>决策树分析</b></td><td>在不同备选方案中选择最优路径</td><td><b>预期货币价值 EMV</b></td></tr>

<tr><td>影响图</td><td>图形辅助决策</td><td>影响图</td></tr></table>
<p><b>EMV = Σ（每个结果的价值 × 发生概率）</b>；<b>机会取正、威胁取负</b>。</p>
<div class="pit"><b>EMV例题：</b>新项目成功概率60%可获利100万，失败概率40%将损失50万，EMV = 0.6×100 + 0.4×(−50) = 60 − 20 = <b>40万</b>。符号别弄反：损失必须带负号参与计算。</div>`},
    {t:'规划风险应对——威胁/机会策略（必考）', f:'high', s:3, m:'威胁：规上转减轻接受；机会：开分提接受。', b:`

    {t:'规划采购管理——合同类型', f:'high', s:3, m:'固定总价范围明，成本补偿风险买方担，工料合同居中间。', b:`
<p><b>核心工具：</b><b>自制或外购分析</b>（比较内制成本与采购成本）。输出：采购管理计划、<b>采购工作说明书（SOW）</b>、采购文件/招标文件（RFP建议书征求、RFQ报价征求）、供方选择标准、独立成本估算、自制或外购决策。</p>
<table class="kt"><tr><th>合同类型</th><th>特点</th><th>风险承担</th><th>适用场景</th></tr>
<tr><td><b>固定总价合同（FFP）</b></td><td>总价封死，范围变更需合同修改</td><td>风险主要在<b>卖方</b></td><td><b>范围明确、需求稳定</b>的项目</td></tr>
<tr><td><b>成本补偿合同</b></td><td>买方报销实际成本+酬金（成本加固定费用CPFF、成本加激励费用CPIF等）</td><td>风险主要在<b>买方</b></td><td>范围不明、研发探索类</td></tr>
<tr><td><b>工料合同（T&amp;M）</b></td><td>按工时和材料计价，兼具两者特点</td><td>双方共担</td><td>短期、快速增派人手、范围未定的小额采购</td></tr></table>
<div class="tip"><b>2025年真题：</b>"固定总价合同适用于（需求稳定明确）的场景"。记忆锚点：范围越清楚越往固定总价走；越模糊越往成本补偿走；工料合同是中间地带。</div>`},
    {t:'规划干系人参与——参与评估矩阵', f:'mid', s:2, m:'不知晓到领导五级跳；C是当前D是期望。', b:`
<p><b>干系人参与评估矩阵</b>：按5个参与程度给干系人定位——<b>不知晓、抵制、中立、支持、领导</b>。</p>
<figure class="kd-fig">
<div class="dg dg-3">
  <div class="dg-box"><b>不知晓</b><span>不了解项目及其潜在影响</span></div>
  <div class="dg-box" style="border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.04)"><b style="color:#fda4af">抵制</b><span>了解项目但抵制变更</span></div>
  <div class="dg-box"><b>中立</b><span>了解但不支持也不反对</span></div>
  <div class="dg-box" style="border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.04)"><b style="color:#6ee7b7">支持</b><span>了解并支持项目</span></div>
  <div class="dg-box" style="border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)"><b style="color:#cfc8ff">领导</b><span>积极参与推动项目成功</span></div>
</div>
<figcaption>矩阵中用 C 标记当前参与度、D 标记所需（期望）参与度——C 与 D 的差距就是参与计划要填补的空间</figcaption>
</figure>
<p><b>输出：</b>干系人参与计划（激发干系人参与的策略与行动）。输入核心是干系人登记册、干系人参与计划相关组件。</p>
<div class="pit"><b>衔接辨析：</b>识别干系人（第10章）输出<b>登记册</b>；规划干系人参与（本章）输出<b>参与计划</b>。别把矩阵当输出——矩阵是工具。</div>`},
    {t:'本章易错易混速查表', f:'high', s:3, m:'基准三件套、浮动两算法、储备内外分、风险策略辨。', b:`
<table class="kt"><tr><th>易混点</th><th>辨析关键</th></tr>
<tr><td>规划过程组过程数</td><td>24个：整1范4进5成3质1资2沟1风5采1干1</td></tr>
<tr><td>三大基准</td><td>范围/进度/成本基准——无"质量基准"</td></tr>
<tr><td>范围基准构成</td><td>项目范围说明书 + WBS + WBS字典</td></tr>
<tr><td>WBS vs 活动清单</td><td>WBS面向可交付成果（工作包）；活动清单面向过程（定义活动的输出）</td></tr>
<tr><td>工作包负责人</td><td>唯一负责人——"一个或多个"是错误表述</td></tr>
<tr><td>工作包/规划包/控制账户</td><td>包=最低层；规划包=账下包上；控制账户=管理控制点（可含多个工作包）</td></tr>
<tr><td>PDM vs ADM</td><td>PDM单代号支持4种关系；ADM双代号只有FS、有虚活动</td></tr>
<tr><td>提前量/滞后量</td><td>提前量为负、滞后量为正</td></tr>
<tr><td>资源平衡 vs 平滑</td><td>平衡改变关键路径、可能延长工期；平滑不改变关键路径、不影响工期</td></tr>
<tr><td>赶工 vs 快速跟进</td><td>赶工加资源→成本↑风险↑；快速跟进并行→返工风险↑</td></tr>
<tr><td>应急储备 vs 管理储备</td><td>应急=已知-未知、基准内、PM支配；管理=未知-未知、基准外、需变更批准</td></tr>
<tr><td>质量管理计划 vs 测量指标</td><td>前者"怎么管"（程序），后者"衡什么"（缺陷率等数值）</td></tr>
<tr><td>RACI的A</td><td>负责——每个活动只能有一个A</td></tr>
<tr><td>沟通三法</td><td>会议电话=互动；邮件报告=推式；门户知识库=拉式</td></tr>
<tr><td>纯粹风险 vs 投机风险</td><td>纯粹只有损失；投机损益兼有可能</td></tr>
<tr><td>登记册 vs 风险报告</td><td>登记册记单个风险；报告讲整体项目风险</td></tr>
<tr><td>定性 vs 定量工具</td><td>定性：概率影响矩阵；定量：蒙特卡洛(S曲线)、龙卷风图(敏感性)、决策树(EMV)</td></tr>
<tr><td>威胁 vs 机会策略</td><td>威胁：规避/上报/转移/减轻/接受；机会：开拓/分享/提高/接受；整体风险策略无"上报"</td></tr>
<tr><td>合同三型</td><td>固定总价(范围明、卖方担险)、成本补偿(范围糊、买方担险)、工料(中间)</td></tr>
<tr><td>参与评估矩阵</td><td>不知晓/抵制/中立/支持/领导；C=当前，D=所需</td></tr></table>
<div class="tip"><b>考情：</b>规划过程组是案例题最大分仓（进度计算、WBS改错、风险应对几乎年年考）；上午选择题约5~8分，计算题（三点估算/渠道/EMV/关键路径）是必拿分。</div>`}
  ], quiz:[
    {q:'规划过程组共包含（ ）个过程', o:['20','22','24','25'], a:2, k:'规划过程组概述', e:'规划过程组包含24个过程：整合1、范围4、进度5、成本3、质量1、资源2、沟通1、风险5、采购1、干系人1，合计24个。口诀"整1范4进5成3，质1资2沟1风5，采1干1"。'},
    {q:'项目管理计划的组件不包括（ ）', o:['范围管理计划','成本基准','项目章程','变更管理计划'], a:2, k:'项目管理计划的组件', e:'项目管理计划=10大子计划+3大基准（范围/进度/成本）+其他组件（变更管理计划、配置管理计划、绩效测量基准、项目生命周期、开发方法）。项目章程是制订项目管理计划的输入，不是组件。'},
    {q:'以下不属于三大基准的是（ ）', o:['范围基准','进度基准','成本基准','质量基准'], a:3, k:'三大基准', e:'三大基准是范围基准、进度基准、成本基准——没有"质量基准"。基准只有经过正式变更控制程序才能变更。'},
    {q:'把产品需求从其来源连接到能满足需求的可交付成果的表格是（ ）', o:['需求文件','需求跟踪矩阵','WBS字典','干系人登记册'], a:1, k:'收集需求的输出', e:'需求跟踪矩阵记录每个需求的唯一标识、描述、理由、所有者、来源、优先级、版本、状态等属性，确保每个需求都能追溯并链接到验收。需求文件是需求的分类记载，两者常互为干扰项。'},
    {q:'项目范围说明书的内容不包括（ ）', o:['产品范围描述','可交付成果','项目的除外责任','活动清单'], a:3, k:'定义范围', e:'项目范围说明书包括：产品范围描述、可交付成果、验收标准、项目的除外责任（明确哪些不属于项目范围，防止范围蔓延）。活动清单是定义活动过程的输出。'},
    {q:'创建WBS时，分解活动的正确步骤顺序是（ ）', o:['确定结构→识别成果→细化分解→编码→核实','识别和分析可交付成果→确定WBS结构→自上而下细化分解→分配标识编码→核实分解程度','识别成果→细化分解→确定结构→编码→核实','核实→识别→结构→细化→编码'], a:1, k:'创建WBS的分解步骤', e:'五步骤口诀"识别→结构→细化→编码→核实"：①识别和分析可交付成果及相关工作②确定WBS的结构和编排方法③自上而下逐层细化分解④制定和分配标识编码⑤核实分解程度是否恰当。'},
    {q:'关于WBS的描述，不正确的是（ ）', o:['分包出去的工作也应纳入WBS中','WBS应该由全体项目成员、用户和项目干系人一致确认','WBS的元素必须指定一个或多个负责人','WBS必须且只能包括100%的工作'], a:2, k:'WBS编制原则', e:'WBS中的元素必须有人负责，而且"只由一个人负责"——唯一负责人原则。"一个或多个负责人"违背责任唯一性，是经典错误表述。A、B、D均为正确原则。'},
    {q:'WBS的最低层次称为（ ），它只能属于一个控制账户', o:['规划包','工作包','控制账户','活动'], a:1, k:'工作包与控制账户', e:'工作包是WBS的最低层，可估算和管理成本与持续时间，一个工作包只能属于一个控制账户。规划包位于控制账户以下、工作包以上，工作内容已知但详细进度未知。（2025年上半年真题）'},
    {q:'关于100%原则，描述最准确的是（ ）', o:['WBS中所有工作包的预算总和必须等于项目总预算','WBS下一级元素之和必须100%覆盖上一级元素的工作范围','每个WBS层级必须包含100个以上的工作包','团队成员必须100%参与WBS编制'], a:1, k:'WBS的100%原则', e:'100%原则针对的是工作范围覆盖：下层所有工作包之和必须完全覆盖上层全部范围，不遗漏、不超出。与预算总和、工作包数量、参与度无关。'},
    {q:'关于里程碑的描述，正确的是（ ）', o:['里程碑是持续时间为一天的活动','里程碑持续时间为零','里程碑必须由客户设定','里程碑只能出现在项目收尾'], a:1, k:'定义活动的输出', e:'里程碑清单列出所有里程碑，指明是强制性还是选择性的，里程碑持续时间为零——它是时间轴上的事件标记，不消耗时间。'},
    {q:'某项目经理近期详细分解，远期粗略分解，随进展逐步细化，这种规划方式是（ ）', o:['滚动式规划','自下而上估算','渐进式预算','快速跟进'], a:0, k:'滚动式规划', e:'滚动式规划：近期工作详细分解、远期工作粗略分解，是一种渐进明细的规划方式，与敏捷理念相通。'},
    {q:'在PDM（单代号网络图）支持的四种逻辑关系中，最常用的是（ ）', o:['完成-开始（FS）','开始-开始（SS）','完成-完成（FF）','开始-完成（SF）'], a:0, k:'排列活动顺序', e:'FS（完成-开始）是最常用的逻辑关系：前序活动完成后，后续活动才能开始。箭线图（ADM）则只支持FS一种关系，并可通过虚活动表示依赖。'},
    {q:'关于提前量与滞后量，正确的说法是（ ）', o:['提前量为正值，滞后量为负值','提前量为负值，滞后量为正值','两者均为正值','两者均为负值'], a:1, k:'提前量与滞后量', e:'提前量是负值（如逻辑关系中加入-2天表示后续活动可提前2天开始），滞后量为正值（如养护3天后才能开展下一道工序）。'},
    {q:'某项目计划工期15天，最快8天完成，最慢25天完成，按β分布估算的工期为（ ）', o:['15天','15.5天','16天','17天'], a:1, k:'三点估算', e:'PERT公式 Te=(O+4M+P)/6 =（8+4×15+25）/6 = 93/6 = 15.5天。未指明分布时默认用贝塔分布（除以6）；若明确写三角分布则用(O+M+P)/3。（2025年真题）'},
    {q:'三点估算中，标准差σ的计算公式为（ ）', o:['(P-O)/6','(P-O)/3','(P+O)/6','(M-O)/6'], a:0, k:'三点估算', e:'标准差 σ=(悲观-乐观)/6=(P-O)/6。例如乐观8天、悲观25天，σ=(25-8)/6≈2.83天。置信概率：±1σ=68.26%，±2σ≈95.4%，±3σ=99.73%。'},
    {q:'在详细信息不足、项目早期阶段进行估算，通常采用的方法是（ ）', o:['类比估算','参数估算','自下而上估算','三点估算'], a:0, k:'估算方法', e:'类比估算使用类似项目的历史数据，成本低、耗时少，但准确性低，适用于详细信息不足时（项目早期）。参数估算依赖参数模型；自下而上估算最准确但最耗时，需要详细信息支撑。'},
    {q:'四种估算方法中，最准确但最耗时的是（ ）', o:['类比估算','参数估算','三点估算','自下而上估算'], a:3, k:'估算方法', e:'自下而上估算从活动级估算逐层向上汇总到工作包再汇总到项目，粒度最细因而最准确，但过程最耗时、成本最高。'},
    {q:'某项目有两条路径：路径1为A-B-C（3+5+2=10天），路径2为A-D-E（3+3+2=8天），则该项目的工期和D活动的总浮动时间分别为（ ）', o:['8天、2天','10天、0天','10天、2天','8天、0天'], a:2, k:'关键路径法', e:'关键路径是最长路径（10天），决定项目最短工期。D所在路径8天，D的总浮动时间TF=LS-ES=LF-EF=10-8=2天。关键路径上的活动总浮动时间为零。'},
    {q:'总浮动时间（TF）与自由浮动时间（FF）的计算公式分别是（ ）', o:['TF=LS-ES；FF=紧后活动ES-本活动EF','TF=ES-LS；FF=本活动EF-紧后活动ES','TF=EF-ES；FF=LF-EF','TF=LF-EF；FF=本活动LS-紧后活动LS'], a:0, k:'关键路径法', e:'总浮动时间TF=LS-ES=LF-EF（不影响项目总工期的前提下可延迟的时间）；自由浮动时间FF=紧后活动最早开始-本活动最早完成（不影响任何紧后活动的延迟时间）。FF≤TF。'},
    {q:'某项目资源超负荷，项目经理在不改变关键路径的前提下利用浮动时间调整活动安排，该技术是（ ）', o:['资源平衡','资源平滑','赶工','快速跟进'], a:1, k:'资源优化技术', e:'资源平滑利用浮动时间调整活动，不改变关键路径、不影响工期，但无法实现全部资源优化。资源平衡根据资源制约调整日期，通常改变关键路径、可能延长工期。'},
    {q:'可能导致关键路径改变、项目工期延长的资源优化技术是（ ）', o:['资源平滑','资源平衡','快速跟进','蒙特卡洛分析'], a:1, k:'资源优化技术', e:'资源平衡在资源供需矛盾下强制调整活动日期，通常改变关键路径并可能延长工期；平滑只在浮动时间内做文章，不误工期。'},
    {q:'通过增加资源（如额外调配开发人员）压缩关键活动工期，但可能增加成本和风险，该技术是（ ）', o:['赶工','快速跟进','资源平滑','提前量'], a:0, k:'进度压缩', e:'赶工通过增加资源以最小成本代价压缩关键路径上的工期，代价是可能增加成本和风险。快速跟进是将顺序活动改并行，代价是可能返工和风险增加。（2025年案例真题考点）'},
    {q:'将原本顺序进行的活动改为并行执行以压缩进度，可能带来的主要问题是（ ）', o:['成本必然增加','可能造成返工和风险增加','关键路径必然消失','必须签订新合同'], a:1, k:'进度压缩', e:'快速跟进让顺序活动并行，一旦先行活动产出变化，后续并行活动可能需要返工，风险显著增加。它不一定增加直接成本（赶工才会明显增加成本）。'},
    {q:'项目进度计划的3种图形形式是（ ）', o:['横道图（甘特图）、里程碑图、项目进度网络图','横道图、饼图、直方图','网络图、流程图、SIPOC图','甘特图、龙卷风图、S曲线'], a:0, k:'制订进度计划的输出', e:'项目进度计划可用横道图（甘特图）、里程碑图、项目进度网络图三种图形呈现。S曲线、龙卷风图属于定量风险分析工具，别混。'},
    {q:'关于应急储备与管理储备，正确的说法是（ ）', o:['应急储备应对未知-未知风险，位于成本基准之外','管理储备应对已知-未知风险，位于成本基准之内','应急储备应对已知-未知风险，包含在成本基准内，项目经理可直接支配','管理储备由项目经理直接支配，无需变更批准'], a:2, k:'制定预算', e:'口诀"应急管已知在基准内，管理管未知在基准外"：应急储备应对已知-未知风险、在成本基准内、PM可直接支配；管理储备应对未知-未知风险、在基准之外、动用需变更批准。'},
    {q:'规划成本管理过程的输入不包括（ ）', o:['项目章程','进度管理计划','成本基准','风险管理计划'], a:2, k:'规划成本管理', e:'成本基准是制定预算过程的输出，不是规划成本管理的输入。输入包括项目章程、项目管理计划组件（进度管理计划、风险管理计划）、EEF、OPA。（2025年真题）'},
    {q:'描述项目或产品属性、用于验证符合程度的可测量指标（如缺陷率、按时完成百分比），属于（ ）', o:['质量管理计划','质量测量指标','质量方针','过程改进计划'], a:1, k:'规划质量管理', e:'质量管理计划回答"怎么管质量"（程序、角色、工具）；质量测量指标回答"衡量什么"（缺陷率、客户满意度分数、按时完成百分比等数值标准）。'},
    {q:'关于RACI矩阵，正确的说法是（ ）', o:['R表示负责，A表示执行','每个活动可以有两个以上A','A表示负责，每个活动只能有一个A','C表示知情，I表示咨询'], a:2, k:'RACI矩阵', e:'RACI：R执行（干活）、A负责（对成果负最终责任，每个活动只能有一个A）、C咨询、I知情。A的唯一性与WBS唯一负责人原则一脉相承。'},
    {q:'某项目团队有10名成员（含项目经理），潜在沟通渠道数量为（ ）', o:['45','50','90','100'], a:0, k:'沟通渠道计算', e:'潜在沟通渠道=n(n-1)/2=10×9÷2=45条。n=6时为15条，n=5时为10条。人数线性增加、沟通复杂度平方级增长。（2025年真题）'},
    {q:'将项目信息发布在企业内网门户网站上，供干系人按需自主访问，这种沟通方法是（ ）', o:['互动沟通','推式沟通','拉式沟通','垂直沟通'], a:2, k:'沟通方法', e:'拉式沟通适用于大量复杂信息，接收方自主访问：门户网站、企业内网、在线课程、经验教训数据库、知识库。推式沟通（邮件、报告）不确保被理解；互动沟通（会议、电话）双向实时。'},
    {q:'只有损失机会、没有获利可能的风险属于（ ）', o:['投机风险','纯粹风险','可预测风险','总体风险'], a:1, k:'风险分类', e:'按后果分：纯粹风险只有损失机会；投机风险既有损失机会又有获利机会。按可预测性分：已知风险、可预测风险、不可预测风险。'},
    {q:'可用于确定对项目结果影响最大的单个风险的定量分析技术是（ ），其输出图形为龙卷风图', o:['蒙特卡洛分析','敏感性分析','决策树分析','影响图'], a:1, k:'定量风险分析', e:'敏感性分析确定单个风险对项目结果的影响程度，输出龙卷风图。蒙特卡洛模拟输出直方图和S曲线；决策树分析输出预期货币价值EMV。工具与图形的配对是高频考法。'},
    {q:'某项目成功概率为60%，成功可获利100万元；失败概率为40%，失败将损失50万元，该项目的预期货币价值（EMV）为（ ）', o:['60万元','40万元','30万元','10万元'], a:1, k:'EMV计算', e:'EMV=Σ(价值×概率)=0.6×100+0.4×(-50)=60-20=40万元。规则：机会取正值、威胁取负值，损失务必带负号参与计算。'},
    {q:'某政务云平台核心数据库原计划从国外采购，因汇率波动剧烈，项目组改用国产数据库，该风险应对策略是（ ）', o:['转移','规避','减轻','接受'], a:1, k:'风险应对策略', e:'放弃原方案让风险事件不再发生=规避。若买汇率保险或签固定价合同=转移；提前锁汇降低波动影响=减轻。（2025年真题场景）'},
    {q:'为项目购买保险或将高风险模块分包给有资质的公司并约定责任，属于（ ）策略', o:['规避','转移','减轻','接受'], a:1, k:'风险应对策略', e:'转移的标志是风险责任转给第三方：保险、外包、固定价合同。减轻是自己动手降低概率或影响（增加测试、冗余备份）；规避是取消或替换让风险不发生。'},
    {q:'以下不属于整体项目风险应对策略的是（ ）', o:['开拓','接受','上报','转移或分享'], a:2, k:'整体项目风险应对策略', e:'整体项目风险应对策略5种：规避、开拓、转移或分享、减轻或提高、接受。"上报"是单个风险的应对措施（超出PM权限时交高层），不在整体风险策略之列。（2023年真题）'},
    {q:'范围明确、需求稳定的项目最适合采用的合同类型是（ ）', o:['固定总价合同','成本补偿合同','工料合同','成本加激励合同'], a:0, k:'规划采购管理', e:'固定总价合同（FFP）总价封死，风险主要由卖方承担，适用于范围明确、需求稳定的项目。范围不明用成本补偿（买方担险）；短期小额快速增员用工料合同。（2025年真题）'},
    {q:'干系人参与评估矩阵中，C和D分别表示（ ）', o:['当前参与度和所需参与度','支持者和反对者','内部干系人和外部干系人','成本和工期'], a:0, k:'干系人参与评估矩阵', e:'矩阵按不知晓、抵制、中立、支持、领导5级定位干系人，C标记当前参与度、D标记所需（期望）参与度，C与D的差距即参与计划要解决的问题。参与程度分级：不知晓→抵制→中立→支持→领导。'}
  ]},
  {id:12, title:'执行过程组',         sec:'pm',  page:465, cards:[
  {t:'执行过程组全貌——10个过程', f:'high', s:3, m:'整2质1资3，沟1风1采1干1；执行花钱最多。', b:`
<p><b>定位：</b>执行过程组包含<b>10个过程</b>，作用是<b>完成项目管理计划中确定的工作</b>，以满足项目要求。第11章规划"定计划"，本章执行"落实计划"——执行过程组会<b>耗费绝大多数的项目预算、资源和时间</b>。</p>
<figure class="kd-fig">
<div class="dg dg-3">
  <div class="dg-box" style="border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)"><b style="color:#cfc8ff">整合 ×2</b><span>指导与管理项目工作 · 管理项目知识</span></div>
  <div class="dg-box" style="border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.05)"><b style="color:#a5e8f5">质量 ×1</b><span>管理质量（旧称实施质量保证）</span></div>
  <div class="dg-box" style="border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.05)"><b style="color:#fde68a">资源 ×3</b><span>获取资源 · 建设团队 · 管理团队</span></div>
  <div class="dg-box"><b>沟通 ×1</b><span>管理沟通</span></div>
  <div class="dg-box" style="border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.04)"><b style="color:#fda4af">风险 ×1</b><span>实施风险应对（新大纲新增）</span></div>
  <div class="dg-box"><b>采购 ×1</b><span>实施采购</span></div>
  <div class="dg-box"><b>干系人 ×1</b><span>管理干系人参与</span></div>
</div>
<figcaption>过程数口诀：整2质1资3，沟1风1采1干1 = 10个</figcaption>
</figure>
<div class="pit"><b>坑点：</b>五大过程组过程数：启动<b>2</b>、规划<b>24</b>、执行<b>10</b>、监控<b>12</b>、收尾<b>1</b>（口诀"2-24-10-12-1"）。选择题爱把"管理项目知识""实施风险应对"误放入规划或监控——它们都在<b>执行</b>过程组。</div>`},
  {t:'指导与管理项目工作', f:'high', s:3, m:'成果数据问题日志，变更请求四件套。', b:`
<p><b>定义：</b>为实现项目目标而<b>领导和执行</b>项目管理计划中确定的工作，并<b>实施已批准的变更</b>。</p>
<p><b>四大输出（案例默写高频）：</b></p>
<ul>
<li><b>可交付成果</b>：某一过程、阶段或项目完成时必须产出的<b>独特并可核实</b>的产品、成果或服务能力。</li>
<li><b>工作绩效数据</b>：执行中收集的<b>原始</b>观察结果和测量值（如可交付成果状态、进度进展、已发生成本）。</li>
<li><b>问题日志</b>：记录并跟进所有问题——问题类型、提出者和提出时间、描述、优先级、负责人、目标解决日期、状态、最终解决情况。</li>
<li><b>变更请求</b>：四类见下方坑点。</li>
</ul>
<div class="pit"><b>坑点：</b>变更请求四类型对号入座——<b>纠正措施</b>（纠偏已发生的偏差）、<b>预防措施</b>（防患未然）、<b>缺陷补救</b>（修正不合格产品）、<b>更新</b>（对受控文件的变更）。变更请求由执行过程<b>提出</b>，但必须交给监控过程组的整体变更控制<b>审批</b>。</div>
<div class="tip"><b>案例话术：</b>凡问"执行中发现问题怎么办"——记入问题日志，明确优先级、责任人和目标解决日期，跟踪至关闭；需改基准的走变更流程。</div>`},
  {t:'管理项目知识：显性与隐性', f:'high', s:3, m:'显性写得出来，隐性只可意会。', b:`
<p><b>定义：</b>利用现有知识创造或改进项目成果，并把<b>新知识</b>总结出来供未来项目复用（新大纲新增过程，2024综合知识+2025年案例真题均考）。</p>
<table class="kt"><tr><th>类型</th><th>特征</th><th>例子</th></tr>
<tr><td><b>显性知识</b></td><td>易用<b>文字、图片、数字</b>编撰</td><td>设计文档、操作手册、模板、数据库</td></tr>
<tr><td><b>隐性知识</b></td><td><b>难以明确表达</b>的个体知识</td><td>信念、洞察力、经验、诀窍</td></tr></table>
<p><b>管理难点：</b>隐性知识分享——需营造<b>相互信任</b>的氛围，激励人们分享知识、关注他人知识。</p>
<p><b>核心输出：经验教训登记册</b>——项目<b>早期</b>创建，整个项目期间持续更新；记录遇到的挑战、问题、风险及应对情况。</p>
<div class="pit"><b>坑点：</b>"经验教训登记册属于组织过程资产"——错！项目进行期间它是<b>项目文件</b>，项目或阶段结束<b>归档后</b>才转化为组织过程资产。</div>
<div class="tip"><b>案例话术（隐性知识分享措施）：</b>导师制/传帮带、专题工作坊与面对面交流、建立实践社区、录制操作视频、轮岗与结对开发、编制FAQ知识库。</div>`},
  {t:'管理质量与质量审计', f:'high', s:3, m:'审计查过程，防患于未然。', b:`
<p><b>定义：</b>管理质量（旧称"实施质量保证"QA）是把组织的<b>质量政策用于项目</b>，将质量管理计划转化为<b>可执行的质量活动</b>——关注<b>过程</b>合规，预防为主。</p>
<p><b>质量审计：</b>确定项目活动是否<b>遵循组织的政策、过程和程序</b>的<b>结构化、独立</b>的过程。四大目标：</p>
<ul>
<li>识别全部良好实践与最佳实践；</li>
<li>识别全部违规做法、差距与不足；</li>
<li>分享良好实践（在组织内推广）；</li>
<li>积极主动地协助改进过程。</li>
</ul>
<p><b>其他工具：</b>数据分析（备选方案分析、文件分析、过程分析、根本原因分析）、决策（多标准决策分析）、数据表现（因果图、亲和图、流程图、直方图、矩阵图、散点图）、<b>面向X的设计（DfX）</b>、问题解决、质量改进方法（PDCA、六西格玛）。</p>
<div class="pit"><b>坑点：</b>QA管<b>过程</b>（执行过程组，审计合规）；QC管<b>结果</b>（监控过程组，检验产品）。"质量审计是控制质量的工具"——错，它是<b>管理质量</b>的工具。</div>
<div class="tip"><b>案例话术：</b>题干出现"过程不规范、质量体系未落实"，答"开展质量审计，识别违规差距与最佳实践，输出质量报告并提出改进与变更建议"。</div>`},
  {t:'获取资源：预分派与虚拟团队', f:'mid', s:2, m:'预分派先定，虚拟团队靠沟通。', b:`
<p><b>定义：</b>获取项目所需的团队成员、设施、设备、材料等资源。工具：决策（多标准决策分析）、谈判、预分派、虚拟团队。</p>
<ul>
<li><b>预分派</b>：资源<b>事先确定</b>——竞标时承诺分派、项目依赖特定人员的专有技能、项目章程已指定。</li>
<li><b>虚拟团队</b>：成员<b>不面对面集中办公</b>、靠沟通技术协作——必须有更完善的<b>沟通管理计划</b>，也需防范孤立感与误解。</li>
<li><b>谈判</b>：与职能经理、其他项目团队、外部组织谈判获取资源。</li>
</ul>
<p><b>输出：</b>物质资源分配单、项目团队派工单、<b>资源日历</b>——规定团队和实物资源<b>何时可用、可用多久</b>，包含工作日、班次、周末和节假日等限制。</p>
<div class="pit"><b>坑点：</b>资源日历回答"资源<b>何时</b>可用"；资源分解结构RBS回答资源"按<b>类别层级</b>如何展现"——两者常互为干扰项。</div>`},
  {t:'建设团队：塔克曼五阶段', f:'high', s:3, m:'形震规成散，震荡冲突多。', b:`
<p><b>定义：</b>提高工作能力、促进团队互动、改善整体氛围，以提高项目绩效。团队建设按<b>塔克曼阶梯</b>通常经历五阶段：</p>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-row">
    <div class="dg-box"><b>① 形成</b><span>相互认识 · 摸清职权</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box" style="border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.04)"><b style="color:#fda4af">② 震荡</b><span><b>冲突最频繁</b> · 各自为政</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>③ 规范</b><span>开始协同 · 互相信任</span></div>
  </div>
  <div class="dg-row" style="margin-top:8px">
    <div class="dg-box" style="border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.04)"><b style="color:#6ee7b7">④ 成熟（发挥）</b><span>组织有序 · 相互依靠 · 高效解决问题</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>⑤ 解散</b><span>工作完成 · 团队遣散</span></div>
  </div>
</div>
<figcaption>形成→震荡→规范→成熟→解散：可能停滞，也可能回退（成员变更时）</figcaption>
</figure>
<div class="pit"><b>坑点：</b>① 震荡阶段<b>冲突最多</b>是正常现象，不代表团队建设失败；② 阶段<b>不是严格线性</b>，人员变动可退回早期阶段；③ 成熟阶段的标志是<b>相互依靠、平稳高效</b>，不是"没有冲突"。</div>
<div class="tip"><b>建设手段（案例默写）：</b>集中办公（作战室）、虚拟团队、沟通技术、认可与奖励、培训、团队章程、个人和团队评估。</div>`},
  {t:'管理团队：冲突五法与激励', f:'high', s:3, m:'合作双赢是首选，强迫撤退慎用。', b:`
<p><b>定义：</b>跟踪团队成员表现、提供反馈、解决问题并管理团队变更，优化项目绩效。核心考点<b>冲突管理五法</b>：</p>
<table class="kt"><tr><th>方法</th><th>做法</th><th>结果</th></tr>
<tr><td><b>合作/解决问题</b></td><td>直面分歧、开放对话达成共识</td><td><b>双赢，首选</b></td></tr>
<tr><td><b>妥协/调解</b></td><td>双方各让一步</td><td>暂时或双输</td></tr>
<tr><td><b>缓和/包容</b></td><td>强调一致、淡化分歧</td><td>暂时缓解</td></tr>
<tr><td><b>强迫/命令</b></td><td>以权推行一方观点</td><td>赢-输（紧急时）</td></tr>
<tr><td><b>撤退/回避</b></td><td>推迟、退出或推给他人</td><td>暂缓/双输</td></tr></table>
<p><b>冲突源</b>（常考前几名）：<b>进度计划、项目优先级、资源</b>；冲突不可避免，适度冲突反而有益。</p>
<p><b>管人先懂人——激励理论三剑客：</b></p>
<ul>
<li><b>马斯洛需求层次：</b>生理→安全→社交→尊重→自我实现，逐级满足；</li>
<li><b>赫茨伯格双因素：</b><b>保健因素</b>（工资、工作条件）消除不满，<b>激励因素</b>（成就、认可、责任）带来满意；</li>
<li><b>麦格雷戈X-Y理论：</b>X理论人性消极需强制监督，Y理论人性积极可自我指导。</li>
</ul>
<div class="pit"><b>坑点：</b>"项目经理应尽量避免一切冲突"——错，应<b>尽早、私下、直接</b>处理；把工资当"激励因素"——错，它只是<b>保健因素</b>。</div>`},
  {t:'管理沟通：模型与5C', f:'mid', s:2, m:'编码解码防噪声，反馈确认保理解。', b:`
<p><b>定义：</b>确保项目信息<b>及时且恰当</b>地收集、生成、发布、存储、检索、管理、监督和最终处置——按沟通管理计划"落实沟通"。</p>
<p><b>沟通模型：</b>发送方→<b>编码</b>→信息→媒介→<b>解码</b>→接收方→<b>确认（已收到）</b>→<b>反馈（已理解）</b>，全程警惕<b>噪声</b>干扰。</p>
<p><b>5C书面沟通原则：</b>正确的语法和拼写、简洁的表述、清晰的目的、连贯的思维逻辑、控制语句和想法的流畅。</p>
<p><b>沟通渠道数 = N(N−1)/2</b>（N为参与人数）：6人=15条。人数线性增加，沟通复杂度<b>平方级</b>上升——执行期新成员加入后沟通量剧增，是找错题的常客。</p>
<div class="pit"><b>坑点：</b>① 管理沟通的输出是<b>项目沟通记录</b>（绩效报告、可交付成果的状态、进度成本等信息），"监督沟通"属监控过程组；② 沟通<b>方法</b>（互动/推式/拉式）的判断在第11章已详述，执行阶段仍按同一套标准选方法。</div>
<div class="tip"><b>案例话术：</b>信息传递失真 → 答优先采用<b>互动沟通</b>（会议、视频）并要求接收方反馈确认，重要事项书面留痕、更新项目沟通记录。</div>`},
  {t:'实施风险应对与干系人参与', f:'mid', s:2, m:'风险应对看落实，干系人参与靠引导。', b:`
<p><b>实施风险应对（新大纲新增）：</b>确保商定的<b>风险应对措施按计划执行</b>。要点：① 应对措施落实到<b>风险应对责任人</b>；② 必要时动用<b>应急储备</b>；③ 持续评估应对有效性，更新风险登记册、假设日志；④ 应对失效时升级处理。规划应对出"计划"，实施应对看"行动"，两者别混。</p>
<p><b>管理干系人参与：</b>与干系人沟通和协作，<b>满足其需求与期望、处理问题</b>，并促进干系人<b>合理参与</b>项目。工具：沟通技能、人际关系与团队技能（冲突管理、文化意识、谈判、观察/交谈、政治意识）、基本规则、会议。</p>
<div class="pit"><b>坑点：</b>"管理干系人参与"（执行）做的是<b>日常引导互动</b>；复核参与度评估矩阵C与D差距、调整参与策略的是"监督干系人参与"（监控过程组）——一字之差，过程组不同。</div>
<div class="tip"><b>案例话术：</b>关键干系人消极抵制 → 对照干系人参与计划主动沟通，了解其顾虑并解决实际问题，记录问题日志，必要时调整参与策略并提变更请求。</div>`},
  {t:'实施采购：招投标四环节', f:'high', s:3, m:'招标投标评授标，选商不看最低价。', b:`
<p><b>定义：</b>获取卖方应答、选择卖方并授予合同（签订协议）。主线四环节：<b>招标→投标→评标→授标</b>。</p>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-row">
    <div class="dg-box"><b>① 招标</b><span>编制发布招标文件（含SOW、评价标准）</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>② 投标</b><span>投标人会议澄清 · 提交建议书</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>③ 评标</b><span>建议书评价（加权打分）· 专家判断</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>④ 授标</b><span>谈判 · 签订合同（协议）</span></div>
  </div>
</div>
<figcaption>实施采购四环节——评分依据是规划采购输出的供方选择标准</figcaption>
</figure>
<ul>
<li><b>投标人会议</b>（承包商会议/供应商大会）：在<b>提交建议书之前</b>召开，确保潜在卖方对采购要求有<b>清晰一致</b>的理解，保证公平竞争。</li>
<li><b>建议书评价技术</b>：按供方选择标准加权评分，选<b>综合最优</b>而非报价最低。</li>
<li><b>输出：</b>选中的卖方、<b>协议（合同）</b>、变更请求。</li>
</ul>
<div class="pit"><b>坑点：</b>"选报价最低的投标人"是经典错误表述——应按<b>供方选择标准</b>综合评价；投标人会议在<b>投标前</b>而非评标后召开；"开标""废标"都不是实施采购的独立环节——法定招投标流程含开标，但教材四环节就是招标→投标→评标→授标（真题考过）。</div>
<div class="tip"><b>案例话术：</b>招投标找错题套法定数字——招标文件发出至投标截止<b>不少于20日</b>；评标委员会<b>5人以上单数</b>、技术经济专家不少于<b>2/3</b>（详见第17章法律法规）。</div>`}
  ], quiz:[
    {q:'执行过程组共包含（ ）个过程，其作用是完成项目管理计划中确定的工作，以满足项目要求', o:['8','10','12','24'], a:1, k:'执行过程组概述', e:'执行过程组包含10个过程：整合2（指导与管理项目工作、管理项目知识）、质量1（管理质量）、资源3（获取资源、建设团队、管理团队）、沟通1、风险1、采购1、干系人1。规划24个、监控12个，注意区分。'},
    {q:'项目执行过程中，测试发现某模块编码不符合设计要求，需要修正该不一致的产品组件，由此提出的变更请求属于（ ）', o:['纠正措施','预防措施','缺陷补救','计划更新'], a:2, k:'变更请求类型', e:'缺陷补救用于修正不一致的产品或产品组件。纠正措施是使工作绩效重新与计划一致；预防措施是确保未来绩效不偏离计划；更新是对受控文件或计划的正式变更。抓关键词"修正不合格产品"。'},
    {q:'下列各项中，属于隐性知识的是（ ）', o:['已归档的系统操作手册','资深工程师头脑中难以言传的排障诀窍','需求规格说明书','知识库中的设计模板'], a:1, k:'显性与隐性知识', e:'隐性知识是难以明确表达的个体知识，如信念、洞察力、经验和诀窍；显性知识则易于用文字、图片和数字编撰，如手册、文档、模板、数据。管理项目知识的难点正在于隐性知识的分享。'},
    {q:'关于质量审计的说法，正确的是（ ）', o:['质量审计是确定项目活动是否遵循组织政策和程序的结构化、独立的过程','质量审计应由实施具体工作的人员自行开展，以保证熟悉情况','质量审计属于控制质量过程的工具，用于检验产品是否合格','质量审计的主要目标是找出报价最低的供应商'], a:0, k:'质量审计', e:'质量审计是管理质量（旧称实施质量保证）过程的工具，特点为结构化、独立，目标是识别良好/最佳实践、发现违规差距、分享良好实践、协助过程改进。它管过程合规，不是控制质量的检验工具，更与选供应商无关。'},
    {q:'某项目团队组建后，成员相互认识并了解各自职责，随后进入冲突频发、各自为政、气氛紧张的阶段。按塔克曼阶梯理论，该团队当前所处阶段是（ ）', o:['形成阶段','规范阶段','成熟阶段','震荡阶段'], a:3, k:'塔克曼五阶段', e:'震荡阶段团队开始执行任务，但个体之间冲突频繁、互相较劲、各自为政。形成阶段是相互认识期；规范阶段开始建立信任、协同工作；成熟阶段组织有序、相互依靠。五阶段顺序：形成→震荡→规范→成熟→解散。'},
    {q:'项目两名骨干工程师就技术方案争执不下，项目经理组织两人开诚布公地分析利弊，最终达成双方都认可的方案。该冲突解决方法是（ ）', o:['强迫/命令','撤退/回避','合作/解决问题','缓和/包容'], a:2, k:'冲突解决方法', e:'合作/解决问题通过直面分歧、开放对话达成共识，是双赢的理想方法，也是项目经理的首选。强迫是赢-输；撤退是暂缓回避；缓和是强调一致、淡化分歧，属暂时性措施。'},
    {q:'按照赫茨伯格双因素理论，下列属于保健因素的是（ ）', o:['工作条件与工资待遇','成就感','责任感','晋升与个人成长'], a:0, k:'双因素理论', e:'保健因素（工资、工作条件、公司政策等）只能消除员工的不满，不能带来满意；激励因素（成就、认可、责任、成长）才能真正激励员工。"涨工资就等于激励"是典型误区，注意与马斯洛需求层次区分。'},
    {q:'某项目干系人原为5人（含项目经理），现新增2人变为7人，潜在沟通渠道数将增加（ ）条', o:['12','21','10','11'], a:3, k:'沟通渠道计算', e:'渠道数=N(N-1)/2：5人时为10条，7人时为21条，增加21-10=11条。人数线性增加，沟通复杂度呈平方级增长，这也是团队扩大后沟通问题增多的原因。'},
    {q:'关于实施采购过程中投标人会议的说法，正确的是（ ）', o:['投标人会议在评标结束后召开，用于宣布中标结果','投标人会议在潜在卖方提交建议书之前召开，确保各方对采购要求有清晰一致的理解','投标人会议由最终中标的卖方主持','召开投标人会议的目的是让所有投标人报出最低价格'], a:1, k:'投标人会议', e:'投标人会议（又称承包商会议、供应商大会）在投标前召开，保证所有潜在卖方对采购要求理解一致、公平竞争，避免因理解偏差导致的不合理报价。选卖方依据供方选择标准综合评价，而非只看最低价。'}
  ]},
  {id:13, title:'监控过程组',         sec:'pm',  page:497, cards:[
  {t:'监控过程组全貌——12个过程', f:'high', s:3, m:'整2范2，进成质资沟风采购干各1，合计12。', b:`
<p><b>定位：</b>监控过程组包含<b>12个过程</b>，作用是<b>跟踪、审查和调整</b>项目进展与绩效，识别必要的变更并启动变更。规划"定计划"、执行"落实计划"，监控则是"<b>对照基准找偏差、分析原因促纠偏</b>"，且<b>贯穿项目始终</b>。</p>
<figure class="kd-fig">
<div class="dg dg-3">
  <div class="dg-box" style="border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)"><b style="color:#cfc8ff">整合 ×2</b><span>监控项目工作 · 实施整体变更控制</span></div>
  <div class="dg-box" style="border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.05)"><b style="color:#a5e8f5">范围 ×2</b><span>确认范围 · 控制范围</span></div>
  <div class="dg-box"><b>进度 ×1</b><span>控制进度</span></div>
  <div class="dg-box" style="border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.05)"><b style="color:#fde68a">成本 ×1</b><span>控制成本（挣值管理）</span></div>
  <div class="dg-box"><b>质量 ×1</b><span>控制质量</span></div>
  <div class="dg-box"><b>资源 ×1</b><span>控制资源（新大纲新增）</span></div>
  <div class="dg-box"><b>沟通 ×1</b><span>监督沟通</span></div>
  <div class="dg-box" style="border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.04)"><b style="color:#fda4af">风险 ×1</b><span>监督风险</span></div>
  <div class="dg-box"><b>采购 ×1</b><span>控制采购</span></div>
  <div class="dg-box"><b>干系人 ×1</b><span>监督干系人参与</span></div>
</div>
<figcaption>过程数口诀：整2范2，进成质资沟风采购干各1 = 12个</figcaption>
</figure>
<div class="pit"><b>坑点：</b>① 过程名带"控制/监督"字样的基本都在监控组，但"<b>确认范围</b>"不带"控制"也属监控组（高频陷阱）；② 监控贯穿项目始终，不是执行完才开始；③ 唯一能<b>审批变更</b>的是整体变更控制，其余过程只<b>提出</b>变更请求。</div>`},
  {t:'监控项目工作：数据→信息→报告', f:'high', s:3, m:'执行产数据，控制加工成信息，汇总为报告。', b:`
<p><b>定义：</b>跟踪、审查和报告整体项目进展，以实现项目管理计划中确定的绩效目标。2025年案例真题考过本过程。</p>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-row">
    <div class="dg-box"><b>工作绩效数据</b><span>执行过程组产生的<b>原始</b>观察值与测量值</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>工作绩效信息</b><span>各控制过程对比基准后<b>加工</b>出的偏差结论</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>工作绩效报告</b><span>监控项目工作<b>汇编</b>，供干系人决策</span></div>
  </div>
</div>
<figcaption>三层递进：数据（原料）→信息（半成品）→报告（成品）</figcaption>
</figure>
<ul>
<li><b>工具：</b>专家判断、数据分析（备选方案分析、成本效益分析、挣值分析、根本原因分析、趋势分析、偏差分析）、决策、会议。</li>
<li><b>输出：</b>工作绩效报告、变更请求（含纠正措施、预防措施、缺陷补救）、项目管理计划与项目文件更新。</li>
</ul>
<div class="pit"><b>坑点：</b>"工作绩效报告由执行过程组产生"——错！执行产生<b>数据</b>，控制过程产生<b>信息</b>，只有监控项目工作才输出<b>报告</b>。三者的产生过程是选择题经典陷阱。</div>`},
  {t:'整体变更控制：流程与CCB', f:'high', s:3, m:'申请评估审批实施，验证记录六步走。', b:`
<p><b>定义：</b>审查所有变更请求、批准变更、管理变更并对变更结果沟通。<b>基准一经批准，任何修改必须走变更流程</b>。</p>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-row">
    <div class="dg-box"><b>① 提出申请</b><span>书面变更请求，说明内容与理由</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>② 评估影响</b><span>PM组织评估对范围/进度/成本/质量的影响</span></div>
  </div>
  <div class="dg-row" style="margin-top:8px">
    <div class="dg-box" style="border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)"><b style="color:#cfc8ff">③ CCB审批</b><span>批准、否决或搁置</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>④ 实施变更</b><span>更新基准与计划文件</span></div>
  </div>
  <div class="dg-row" style="margin-top:8px">
    <div class="dg-box"><b>⑤ 验证实施</b><span>检查变更是否落实并通知相关方</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>⑥ 记录归档</b><span>变更全过程的文档化留痕</span></div>
  </div>
</div>
<figcaption>变更六步：申请→评估→审批→实施→验证→记录（顺序是找错题高频）</figcaption>
</figure>
<p><b>CCB（变更控制委员会）：</b>由项目主要干系人组成，正式组织体，职责是<b>批准或否决变更请求</b>；对紧急变更同样要补齐审批与记录。</p>
<div class="pit"><b>坑点：</b>① 项目经理<b>无权</b>直接批准对基准的变更，只能组织评估、提交CCB；② "客户口头要求就直接改"是案例找错题标配错误——必须<b>书面申请、评估影响、CCB审批</b>后实施；③ 变更流程走完要<b>更新受控文件并通知</b>所有相关干系人。</div>
<div class="tip"><b>案例话术：</b>判断变更管理问题四步——看有没有书面变更请求、有没有影响评估、有没有CCB审批、有没有更新基准并通知相关方，缺一即错。</div>`},
  {t:'确认范围 vs 控制质量', f:'high', s:3, m:'QC先自查合格，客户再正式验收。', b:`
<p>两者都检查可交付成果，但<b>对象、主体、目的</b>不同——超高频辨析题：</p>
<table class="kt"><tr><th>维度</th><th>确认范围</th><th>控制质量</th></tr>
<tr><td><b>目的</b></td><td><b>正式验收</b>可交付成果</td><td><b>核实</b>正确性、符合质量要求</td></tr>
<tr><td><b>执行主体</b></td><td>客户/发起人等<b>外部</b>验收</td><td>项目团队/质量部门<b>内部</b>检查</td></tr>
<tr><td><b>时序</b></td><td>在控制质量<b>之后</b></td><td>在确认范围<b>之前</b></td></tr>
<tr><td><b>依据</b></td><td>范围基准（需求文件、验收标准）</td><td>质量管理计划、质量测量指标</td></tr>
<tr><td><b>输出</b></td><td>验收的可交付成果、变更请求</td><td>核实的可交付成果、质量控制测量结果</td></tr></table>
<div class="pit"><b>坑点：</b>① 顺序不能反——<b>先内部质检合格，再交客户正式验收</b>（"先质检验收前"）；② 确认范围属于<b>监控</b>过程组，不属于收尾（阶段交付物在阶段末验收）；③ 控制质量未通过的产品<b>不应</b>提交确认范围。</div>
<div class="tip"><b>案例话术：</b>客户拒收交付物 → 先查控制质量环节是否核实合格，再核对话术"依据需求跟踪矩阵与验收标准开展确认范围，形成正式验收文件，不合格项走缺陷补救变更"。</div>`},
  {t:'控制范围：蔓延与镀金', f:'high', s:3, m:'蔓延是客户偷偷加，镀金是团队自作多情。', b:`
<p><b>定义：</b>监督项目和产品的范围状态，管理范围基准变更。核心工具：偏差分析（对照范围基准）、趋势分析。</p>
<table class="kt"><tr><th>现象</th><th>含义</th><th>典型场景</th></tr>
<tr><td><b>范围蔓延</b></td><td>未经<b>正式变更控制</b>批准，项目范围逐渐扩大</td><td>客户陆续口头加"小需求"，团队顺手都做了</td></tr>
<tr><td><b>镀金</b></td><td>项目团队<b>主动</b>交付客户<b>未要求</b>的额外功能</td><td>程序员自作主张给界面加动画特效</td></tr></table>
<div class="pit"><b>坑点：</b>① 范围蔓延是"<b>未经批准</b>的范围扩大"，与<b>渐进明细</b>（正常细化）、<b>经批准的变更</b>（合规）要区分；② 镀金是范围蔓延的一种团队自发形式，两种都要制止——客户没要的免费功能同样消耗成本与工期。</div>
<div class="tip"><b>案例话术：</b>发现范围蔓延 → "暂停相关开发，补提书面变更请求，评估影响后提交CCB审批；未获批准前不实施，并向客户说明范围基准的严肃性"。</div>`},
  {t:'控制进度：纠偏工具箱', f:'mid', s:2, m:'先找关键路径，再赶工或跟进。', b:`
<p><b>定义：</b>监督项目活动状态、管理进度基准变更。先判断状态（是否落后、落后多少），再对症纠偏。</p>
<p><b>判断工具：</b>挣值分析（SV/SPI）、关键路径法（总浮动时间为零的活动延误直接拖期项目）、进度压缩、资源优化、绩效审查、偏差分析、假设情景分析、<b>迭代燃尽图</b>（敏捷，剩余工作量随时间递减）。</p>
<table class="kt"><tr><th>纠偏手段</th><th>做法</th><th>代价</th></tr>
<tr><td><b>赶工</b></td><td>给<b>关键活动</b>增加资源（加班、加人）</td><td>成本和风险上升</td></tr>
<tr><td><b>快速跟进</b></td><td>顺序活动改<b>并行</b></td><td>返工风险上升</td></tr>
<tr><td>资源优化</td><td>资源平衡/平滑调整安排</td><td>平衡可能延长工期</td></tr>
<tr><td>调整提前量滞后量</td><td>压缩逻辑关系中的等待</td><td>依赖关系允许才行</td></tr></table>
<div class="pit"><b>坑点：</b>① 纠偏只对<b>关键路径</b>上的活动赶工才有意义——压缩非关键活动不缩短总工期；② 网络图计算（ES/EF/LS/LF、总浮动时间）在第11章已详讲，监控阶段用它来<b>复盘状态</b>；③ SPI&lt;1说明进度落后，但还需结合关键路径判断是否影响总工期。</div>`},
  {t:'挣值指标：三值四指标', f:'high', s:3, m:'偏差用减EV在前，指数用除EV在上。', b:`
<p><b>挣值管理（EVM）</b>是案例必考计算。三个基础值：</p>
<table class="kt"><tr><th>指标</th><th>名称</th><th>含义</th></tr>
<tr><td><b>PV</b></td><td>计划价值</td><td>到检查点<b>计划完成</b>工作的预算（该干的活值多少钱）</td></tr>
<tr><td><b>EV</b></td><td>挣值</td><td>到检查点<b>实际完成</b>工作的预算（干完的活值多少钱）</td></tr>
<tr><td><b>AC</b></td><td>实际成本</td><td>到检查点实际花费（干这些活实际花了多少钱）</td></tr></table>
<table class="kt"><tr><th>指标</th><th>公式</th><th>判断</th></tr>
<tr><td><b>SV</b> 进度偏差</td><td>EV − PV</td><td>&gt;0 提前，&lt;0 落后</td></tr>
<tr><td><b>CV</b> 成本偏差</td><td>EV − AC</td><td>&gt;0 节约，&lt;0 超支</td></tr>
<tr><td><b>SPI</b> 进度绩效指数</td><td>EV / PV</td><td>&gt;1 提前，&lt;1 落后</td></tr>
<tr><td><b>CPI</b> 成本绩效指数</td><td>EV / AC</td><td>&gt;1 节约，&lt;1 超支</td></tr></table>
<div class="pit"><b>坑点：</b>① <b>EV永远做被减数/被除数</b>，减谁除谁看下标——SV看PV、CV看AC；② EV按<b>预算</b>计价已完工作，与实际花费AC无关；③ 判断口诀"<b>正大好，负小坏；指数过1好，不到1坏</b>"。</div>
<div class="tip"><b>案例话术：</b>算完指标必须下结论+给措施："CPI=0.8&lt;1，成本超支；SPI≈0.89&lt;1，进度落后。建议对关键路径活动赶工或快速跟进，并加强成本控制与偏差分析"。</div>`},
  {t:'完工估算EAC/ETC/TCPI', f:'high', s:3, m:'非典型补差，典型除率；TCPI剩余活除剩余钱。', b:`
<p>预测完工时的成本（设项目总预算BAC）：</p>
<table class="kt"><tr><th>指标</th><th>公式</th><th>适用</th></tr>
<tr><td><b>EAC 非典型</b></td><td>AC + BAC − EV</td><td>当前偏差属偶发，剩余仍按计划执行</td></tr>
<tr><td><b>EAC 典型</b></td><td>BAC / CPI</td><td>偏差将持续到完工（最常考）</td></tr>
<tr><td><b>ETC</b></td><td>EAC − AC</td><td>完工尚需估算（非典型即BAC−EV）</td></tr>
<tr><td><b>VAC</b></td><td>BAC − EAC</td><td>完工偏差，&lt;0为超支</td></tr>
<tr><td><b>TCPI</b></td><td>(BAC−EV)/(BAC−AC)</td><td>按原预算完成的剩余绩效要求，&gt;1更难</td></tr></table>
<p><b>完整例题（逐步代入）：</b>某项目BAC=100万元，工期10个月，第4个月末检查：PV=45万，EV=40万，AC=50万。</p>
<ul>
<li><b>第一步 基础指标：</b>CV=EV−AC=40−50=<b>−10万</b>（超支）；SV=EV−PV=40−45=<b>−5万</b>（落后）；CPI=EV/AC=40/50=<b>0.8</b>；SPI=40/45≈<b>0.89</b>。</li>
<li><b>第二步 预测：</b>典型EAC=BAC/CPI=100/0.8=<b>125万</b>；非典型EAC=AC+BAC−EV=50+100−40=<b>110万</b>；典型ETC=EAC−AC=125−50=<b>75万</b>；VAC=BAC−EAC=100−125=<b>−25万</b>（预计超支25万）。</li>
<li><b>第三步 完工难度：</b>TCPI=(BAC−EV)/(BAC−AC)=(100−40)/(100−50)=60/50=<b>1.2</b>——剩余工作每花1元须挣1.2元，按原预算完成很吃力。</li>
</ul>
<div class="pit"><b>坑点：</b>① 典型/非典型别用反——题干说"偏差将持续/按当前绩效继续"用<b>BAC/CPI</b>，说"偶发/剩余按原计划"用<b>AC+BAC−EV</b>；② TCPI分母是<b>BAC−AC</b>（剩余的钱），不是BAC−EAC（那是按EAC完成时的公式）。</div>`},
  {t:'控制质量：七种质量工具', f:'high', s:3, m:'鱼骨找因，帕累托排队，控制图看线，散点看相关。', b:`
<p><b>定义：</b>为评估绩效、监督具体可交付成果，确保其<b>完整、正确且符合客户期望</b>。核心考点<b>老七样工具</b>：</p>
<table class="kt"><tr><th>工具</th><th>用途</th><th>识别题眼</th></tr>
<tr><td><b>因果图</b></td><td>追溯问题根本原因</td><td>鱼骨图/石川图/"为什么"</td></tr>
<tr><td><b>流程图</b></td><td>展示过程步骤、找改进环节</td><td>SIPOC、过程流向</td></tr>
<tr><td><b>核查表</b></td><td>计数收集缺陷类型与频次</td><td>核对单、计数统计</td></tr>
<tr><td><b>帕累托图</b></td><td>按频率排序抓"关键的少数"</td><td>80/20、柱状+累计曲线</td></tr>
<tr><td><b>直方图</b></td><td>展示数据分布形态</td><td>柱状分布、对称/偏态</td></tr>
<tr><td><b>控制图</b></td><td>判断过程是否失控</td><td>控制限/规格限、七点规则</td></tr>
<tr><td><b>散点图</b></td><td>显示两变量相关性</td><td>点阵、相关关系</td></tr></table>
<div class="pit"><b>坑点：</b>① 帕累托图与直方图都画柱——帕累托按<b>频率降序</b>排列；② 控制图判断<b>过程</b>稳定性（控制限），规格限判断<b>产品</b>是否合格——两者不同；③ 核查表用于"计数收集"，核对单（checklist）用于"逐项核对"——注意翻译差异，教材以核查表为准。</div>
<div class="tip"><b>案例话术：</b>问"用什么工具分析缺陷原因"——因果图（找根因）+帕累托图（排主次）；问"过程是否稳定"——控制图。输出记住"核实的可交付成果、质量控制测量结果"。</div>`},
  {t:'控制资源与监督沟通', f:'mid', s:2, m:'资源管实物够不够，沟通管信息到没到。', b:`
<p><b>控制资源（新大纲新增）：</b>确保按计划为项目<b>分配实物资源</b>（设备、材料、设施），监督实际使用情况，必要时纠偏。工具：数据分析（备选方案分析、成本效益分析、绩效审查、趋势分析）、问题解决、人际关系与团队技能（谈判、影响力）、PMIS。</p>
<p><b>监督沟通：</b>确保满足项目及其干系人的<b>信息需求</b>——按沟通管理计划检查信息是否及时、恰当地送达并被理解，未满足则调整沟通策略并提变更请求。2024年案例考过沟通问题找错。</p>
<div class="pit"><b>坑点：</b>控制资源管的是<b>实物资源</b>的分配与使用（人力资源问题在管理团队，属执行过程组）；监督沟通的重点是"<b>信息需求是否被满足</b>"，不是重新编制沟通计划（那是规划过程组的事）。</div>
<div class="tip"><b>案例话术：</b>干系人抱怨收不到报告 → 核对沟通管理计划要求的频次、渠道与责任人，检查执行偏差，调整沟通方式并记录到项目沟通记录，必要时走变更。</div>`},
  {t:'监督风险', f:'high', s:3, m:'再评估、风险审计、储备分析，全程盯风险。', b:`
<p><b>定义：</b>在整个项目期间监督商定的风险应对计划的实施、跟踪已识别风险、识别和分析新风险、评估风险管理有效性。</p>
<ul>
<li><b>风险再评估：</b>识别新风险、重新分析现有风险、删除已过时风险——<b>常做常新</b>。</li>
<li><b>风险审计：</b>检查和记录<b>风险应对措施的有效性</b>、风险管理过程的规范性。</li>
<li><b>储备分析：</b>比较剩余应急储备与剩余风险量，判断储备够不够用。</li>
<li><b>技术绩效分析：</b>对比技术成果与计划指标的偏差，发现潜在风险。</li>
</ul>
<div class="pit"><b>坑点：</b>① <b>风险审计</b>在监督风险（监控组），检查应对有效性；<b>质量审计</b>在管理质量（执行组），检查过程合规——"审计"二字撞车，主体和对象完全不同；② 监督风险的输出之一是<b>变更请求</b>（应对失效时要改计划）。</div>
<div class="tip"><b>案例话术：</b>问"风险监督做了什么"——定期风险再评估、开展风险审计验证应对效果、储备分析核对余粮、更新风险登记册与风险报告，失效应对及时提变更。</div>`},
  {t:'控制采购与监督干系人参与', f:'mid', s:2, m:'合同绩效要盯紧，参与矩阵勤复评。', b:`
<p><b>控制采购：</b>管理采购关系、监督合同绩效、实施必要的变更与纠正，并在适当时候<b>关闭合同</b>。要点：</p>
<ul>
<li><b>工具：</b>专家判断、索赔管理（争议解决：谈判→调解→仲裁/诉讼）、数据分析（绩效审查、挣值分析、趋势分析）、检查与审计、支付系统。</li>
<li>买卖双方都要开展控制采购；合同提前终止按合同条款处理并形成文档。</li>
</ul>
<p><b>监督干系人参与：</b>监督干系人关系并调整参与策略——用<b>干系人参与度评估矩阵</b>复评当前（C）与期望（D）参与度的差距，通过沟通和变更请求引导参与。</p>
<div class="pit"><b>坑点：</b>① 新大纲已删除"结束采购"过程，合同收尾融入控制采购的<b>采购关闭</b>与收尾活动；② 索赔解决的先后：先<b>谈判</b>，谈不成再走替代争议解决（调解、仲裁）或诉讼。</div>

  {t:'本章易错易混速查表', f:'high', s:3, m:'数据信息报告三层，QC确认先与后，典型非典型两条EAC。', b:`
<table class="kt"><tr><th>易混点</th><th>辨析关键</th></tr>
<tr><td>监控组过程数</td><td>12个：整2范2，进成质资沟风采购干各1</td></tr>

<tr><td>变更六步</td><td>申请→评估→CCB审批→实施→验证→记录；基准变更PM无权直接批</td></tr>
<tr><td>确认范围 vs 控制质量</td><td>QC先（内部核实正确性）、确认范围后（客户正式验收）</td></tr>
<tr><td>范围蔓延 vs 镀金 vs 渐进明细</td><td>蔓延=未经批准扩范围；镀金=团队自加功能；渐进明细=正常细化</td></tr>
<tr><td>赶工 vs 快速跟进</td><td>赶工加资源→成本↑；快速跟进并行→返工风险↑；都只对关键路径</td></tr>
<tr><td>挣值公式</td><td>减出偏差（SV=EV−PV、CV=EV−AC），除出指数（SPI=EV/PV、CPI=EV/AC）</td></tr>
<tr><td>EAC两版本</td><td>典型=BAC/CPI；非典型=AC+BAC−EV；ETC=EAC−AC</td></tr>
<tr><td>TCPI</td><td>(BAC−EV)/(BAC−AC)，剩余活除剩余钱，&gt;1难</td></tr>
<tr><td>七工具配对</td><td>找根因=因果图；排主次=帕累托；过程稳定=控制图；相关性=散点图</td></tr>
<tr><td>风险审计 vs 质量审计</td><td>风险审计在监督风险；质量审计在管理质量（执行组）</td></tr>
<tr><td>控制资源</td><td>管实物资源；人力资源问题找管理团队（执行组）</td></tr>
<tr><td>监督沟通</td><td>查信息需求是否满足，不是重编沟通计划</td></tr>
<tr><td>索赔解决顺序</td><td>谈判→调解→仲裁→诉讼（先谈后裁）</td></tr></table>
<div class="tip"><b>考情：</b>本章是全书最高频章之一——每年每批次案例必有一道18~25分计算大题（挣值+关键路径为核心）；变更控制、七工具、监督风险是找错/简答常客。挣值两卡务必做到"闭眼默公式"。</div>`}
  ], quiz:[
    {q:'监控过程组共包含（ ）个过程', o:['10','12','24','13'], a:1, k:'监控过程组概述', e:'监控过程组包含12个过程：整合2（监控项目工作、实施整体变更控制）、范围2（确认范围、控制范围），进度、成本、质量、资源、沟通、风险、采购、干系人各1个。执行10个、规划24个，注意区分。'},
    {q:'关于工作绩效数据、工作绩效信息和工作绩效报告，下列说法正确的是（ ）', o:['工作绩效数据是执行过程收集的原始观察值，经各控制过程加工后形成工作绩效信息，再由监控项目工作过程汇编为工作绩效报告','工作绩效报告由执行过程组直接产生并发布','工作绩效数据与工作绩效信息含义相同，可以互换使用','三者均由实施整体变更控制过程产生'], a:0, k:'绩效数据与报告', e:'三层递进关系：执行过程组产生原始的工作绩效数据；各控制过程将其与基准对比加工成工作绩效信息；监控项目工作过程再汇编成工作绩效报告供干系人决策。产生过程的对应关系是高频考点。'},
    {q:'某项目客户提出一项范围变更请求，正确的处理流程是（ ）', o:['项目经理直接修改范围基准后通知客户','项目经理评估影响后自行决定是否实施','提出书面变更申请，评估对范围、进度、成本等的影响，提交CCB审批，批准后实施并验证，更新基准与文档','为维护基准严肃性，一律拒绝客户的变更请求'], a:2, k:'整体变更控制', e:'变更六步：申请→评估→审批→实施→验证→记录。项目经理无权直接批准基准变更；一概拒绝也不对——变更是否接受由CCB决策。书面申请、影响评估、CCB审批缺一不可。'},
    {q:'关于确认范围与控制质量的区别，下列说法不正确的是（ ）', o:['确认范围由客户或发起人对可交付成果进行正式验收','控制质量核实可交付成果是否正确并符合质量要求','通常先完成控制质量，再开展确认范围','确认范围必须在控制质量之前完成'], a:3, k:'确认范围vs质量控制', e:'顺序是"先内部质检、后客户验收"：控制质量先核实产品正确性，合格后再提交确认范围由客户正式验收。D把顺序说反了。确认范围属于监控过程组，不要误选到收尾过程组。'},
    {q:'项目执行过程中，客户陆续口头提出增加一些小功能，团队未走变更流程就直接实现了，导致范围不断扩大。这种现象称为（ ）', o:['镀金','范围蔓延','渐进明细','滚动式规划'], a:1, k:'范围蔓延', e:'范围蔓延指未经正式变更控制批准的范围扩大，常由零星口头需求累积而成。镀金是团队主动交付客户未要求的功能；渐进明细是随信息增加正常细化计划；滚动式规划是近期细远期粗的规划方法。'},
    {q:'某项目预算BAC为100万元，计划工期10个月。第4个月末统计：计划价值PV为45万元，挣值EV为40万元，实际成本AC为50万元。则当前的CV和SPI分别为（ ）', o:['CV=+10万元，SPI=0.8','CV=-10万元，SPI=1.125','CV=-10万元，SPI约为0.89','CV=+5万元，SPI约为0.89'], a:2, k:'挣值指标计算', e:'CV=EV-AC=40-50=-10万元（成本超支）；SPI=EV/PV=40/45≈0.89（进度落后）。口诀：偏差用减EV在前，指数用除EV在上；CV看AC、SV看PV。正大好、负小坏。'},
    {q:'（接上题）假设项目剩余工作将按当前成本绩效指数继续执行，完工估算EAC为（ ）万元', o:['125','110','100','75'], a:0, k:'挣值预测计算', e:'题干说按当前绩效继续，属典型偏差：EAC=BAC/CPI=100/0.8=125万元（CPI=EV/AC=40/50=0.8）。若按非典型（剩余按原计划执行），EAC=AC+BAC-EV=50+100-40=110万元。典型用除率、非典型用补差。'},
    {q:'（接上题）若要求项目最终仍按原预算BAC=100万元完成，完工尚需绩效指数TCPI为（ ）', o:['0.8','0.89','1.0','1.2'], a:3, k:'TCPI计算', e:'TCPI=(BAC-EV)/(BAC-AC)=(100-40)/(100-50)=60/50=1.2。含义是剩余工作每花1元必须产出1.2元价值；TCPI大于1说明按原预算完成难度大，小于1则相对轻松。'},
    {q:'为找出产品缺陷的主要原因，将各类缺陷按发生频率从高到低排序并识别关键的少数，应采用的质量工具是（ ）', o:['因果图','帕累托图','控制图','散点图'], a:1, k:'质量七工具', e:'帕累托图按发生频率降序排列柱状并叠加累计曲线，体现80/20法则，用于抓主要矛盾。因果图（鱼骨图）用于追溯根本原因；控制图判断过程是否失控；散点图显示两变量的相关性。'},
    {q:'监督风险过程中，用于检查和记录风险应对措施实施有效性的工具是（ ）', o:['风险审计','质量审计','蒙特卡洛分析','挣值分析'], a:0, k:'监督风险工具', e:'风险审计检查风险应对措施的有效性和风险管理过程的规范性，是监督风险的工具。质量审计属管理质量过程；蒙特卡洛分析是定量风险分析工具；挣值分析用于成本进度监控。两个审计的归属是经典陷阱。'},
