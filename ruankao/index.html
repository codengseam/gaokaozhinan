  {id:3,  title:'信息技术服务',       sec:'it',  page:95, cards:[
  {t:'什么是IT服务', f:'mid', s:2, m:'供方运用信息技术，交付成果满足需方。', b:`
<p><b>一句话定义：</b>IT服务是供方为满足需方业务需求，运用信息技术知识和能力，通过人员、过程、技术和资源等要素的组合，向需方交付的服务成果。</p>
<ul>
<li><b>三个角色记牢：</b>供方（提供服务的组织）、需方（接受服务的组织或个人）、服务本身（交付的成果与价值）。</li>
<li><b>IT服务的外延（数字化转型背景下四类）：</b>基础服务（咨询设计、开发、集成实施、运行维护、云服务、数据中心）、技术创新服务（智能化、数字服务、数字内容处理、区块链服务）、数字化转型服务（成熟度推进、评估评价）、业务融合服务（信息技术与政务、教育、应急等行业融合）。</li>
<li><b>IT服务内涵的7个特征：</b>本质特征、形态特征、过程特征、阶段特征、效益特征、内部关联性特征、外部关联性特征。</li>
</ul>
<div class="pit"><b>坑点：</b>选择题问"IT服务内涵的7个特征"时，"可扩展性特征""安全性特征"这类不在名单里的词是干扰项；7特征口诀记"本形过、效阶、内外联"。</div>`},
  {t:'服务的四大典型特征', f:'mid', s:2, m:'无形、不可分离、可变、不可储存。', b:`
<p>服务与实物产品不同，具有四个典型特征——判断题就爱拿它们做文章：</p>
<table class="kt"><tr><th>特征</th><th>含义</th><th>生活化理解</th></tr>
<tr><td>无形性</td><td>服务很大程度上是抽象、无形的，购买前无法看到、触摸</td><td>买运维服务前，你摸不到它</td></tr>
<tr><td>不可分离性（同步性）</td><td>服务的生产与消费<b>同时进行</b>，需方要参与生产过程</td><td>剪发时你必须在场</td></tr>
<tr><td>可变性（异质性）</td><td>质量受操作者、时间、地点、心态等因素影响而变化</td><td>同一个工程师状态好坏服务不同</td></tr>
<tr><td>不可储存性（易逝性）</td><td>无法储藏备用、不能转售或退货</td><td>今天没用的服务工时不能存到明天</td></tr></table>
<div class="pit"><b>坑点：</b>① 题干出现"生产与消费同步进行"→ 选<b>不可分离性</b>；出现"服务质量因人而异"→ 选<b>可变性</b>。② "服务可以库存以备将来使用"是错误表述，对应干扰项常写"可储存性"。</div>`},
  {t:'IT服务组成要素PPTR', f:'high', s:3, m:'人过技资：选人、做事、高效、保障。', b:`
<p><b>核心考点：</b>IT服务由<b>人员（People）、过程（Process）、技术（Technology）、资源（Resource）</b>四个要素组成，又称能力要素，简称<b>PPTR</b>。</p>
<figure class="kd-fig">
<div class="dg dg-2">
  <div class="dg-box" style="border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.05)"><b style="color:#a5e8f5">人员 People</b><span>提供服务所需的知识、技能和经验要求 · 指导供方<b>正确选人</b></span></div>
  <div class="dg-box" style="border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)"><b style="color:#cfc8ff">过程 Process</b><span>将输入转化为输出的一组相互关联、结构化的活动 · 可重复、可度量 · 指导人员<b>正确做事</b></span></div>
  <div class="dg-box" style="border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.05)"><b style="color:#fde68a">技术 Technology</b><span>发现和解决问题的能力、风险控制能力 · 确保供方<b>高效做事</b></span></div>
  <div class="dg-box" style="border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.05)"><b style="color:#6ee7b7">资源 Resource</b><span>提供服务所依存和产生的有形及无形资产 · 知识库、工具库、备件库 · 确保<b>保障做事</b></span></div>
</div>
<figcaption>PPTR四要素：选人靠人员，规范靠过程，效率靠技术，兜底靠资源</figcaption>
</figure>
<div class="pit"><b>坑点：</b>① 题目问"确保高效做事的要素"→ 技术；"保障做事"→ 资源，四个动词配对是必考。② 资源不只是硬件设备——<b>知识库、工具库、备件库</b>才是教材点名的代表，选"资金"就上当了。</div>`},
  {t:'ITSS体系框架', f:'mid', s:2, m:'我国自主制定，质量成本效能风险四收益。', b:`
<p><b>ITSS（信息技术服务标准）：</b>在工业和信息化部、国家标准化管理委员会联合指导下，由ITSS工作组研究制定的<b>我国自主的</b>信息技术服务标准体系，是我国IT服务行业最佳实践的总结与提升。</p>
<ul>
<li><b>定位双属性：</b>既是一套成体系、综合配套的标准库，又是一套选择和提供IT服务的方法论。</li>
<li><b>对供需双方的价值：</b>在<b>质量、成本、效能、风险</b>四个方面带来潜在收益——提升服务质量、优化服务成本、强化服务效能、降低服务风险。</li>
</ul>
<table class="kt"><tr><th>体系</th><th>来源</th><th>身份判别题眼</th></tr>
<tr><td>ITSS</td><td>中国（工信部+国标委指导）</td><td>我国自主的IT服务标准体系</td></tr>
<tr><td>ITIL</td><td>英国</td><td>IT服务管理最佳实践框架</td></tr>
<tr><td>COBIT</td><td>ISACA</td><td>IT治理与管理框架</td></tr>
<tr><td>CMMI</td><td>美国</td><td>软件能力成熟度模型</td></tr></table>
<div class="pit"><b>坑点：</b>"ITSS是国际标准化组织发布的国际标准""ITSS源于英国商务部"均为张冠李戴——ITSS姓"中"，这是判别题的一票答案。</div>`},
  {t:'IT服务生命周期SDOR', f:'high', s:3, m:'战设运退：战略规划、设计实现、运营提升、退役终止。', b:`
<p><b>核心考点：</b>IT服务生命周期由四个阶段组成，简称<b>SDOR</b>——改变了各阶段相互割裂的局面，形成良性循环的整体。</p>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-box" style="border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.05)"><b style="color:#fde68a">① 战略规划</b><span>从业务战略出发、以需求为中心，对IT服务进行全面系统规划 · 输出服务策略、资源预算与风险策略</span></div>
  <div class="dg-varrow">▼</div>
  <div class="dg-box" style="border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)"><b style="color:#cfc8ff">② 设计实现</b><span>把规划落成方案：服务目录、服务级别协议、技术架构与部署实施</span></div>
  <div class="dg-varrow">▼</div>
  <div class="dg-box" style="border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.05)"><b style="color:#a5e8f5">③ 运营提升</b><span>持续提供服务并监控优化：事件处理、性能优化、知识沉淀、定期评审改进</span></div>
  <div class="dg-varrow">▼</div>
  <div class="dg-box" style="border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.05)"><b style="color:#fda4af">④ 退役终止</b><span>有序退出：数据迁移、用户通知、系统下线、资产回收与处置、文档存档</span></div>
</div>
<figcaption>SDOR四阶段闭环：规划在前、设计紧随、运营居中、退役收尾</figcaption>
</figure>
<div class="pit"><b>坑点：</b>① 顺序不能乱——<b>设计实现</b>在<b>运营提升</b>之前。② 旧教材/ITSS早期资料为五阶段（规划设计、部署实施、服务运营、持续改进、监督管理），第3版按四阶段SDOR掌握，选项出现"部署实施""持续改进"时警惕是旧版干扰。③ 退役终止≠项目结项，它要求完成数据清理、用户通知、资产处置并存档。</div>`},
  {t:'服务质量五大特性', f:'mid', s:2, m:'安可响有友，质量五特性。', b:`
<p>评价IT服务质量，从五个特性入手（每个特性还有子特性，选择题常考归属）：</p>
<table class="kt"><tr><th>特性</th><th>子特性</th><th>一句话理解</th></tr>
<tr><td>安全性</td><td>保密性、完整性、可用性</td><td>服务不被非授权访问、数据不被破坏、需要时能用</td></tr>
<tr><td>可靠性</td><td>完备性、连续性、稳定性、有效性、可追溯性</td><td>服务持续稳定、出了事能追查</td></tr>
<tr><td>响应性</td><td>及时性、互动性</td><td>响应快、沟通畅</td></tr>
<tr><td>有形性</td><td>可视性、专业性、合规性</td><td>看得见的专业形象与规范</td></tr>
<tr><td>友好性</td><td>灵活性、主动性、礼貌性</td><td>体验好、态度好</td></tr></table>
<div class="pit"><b>坑点：</b>① "安全性"的子特性就是信息安全CIA三件套（保密性、完整性、可用性），考"安全性的子特性包括"时"可追溯性"是干扰项——它属于可靠性。② "及时性"属于响应性，不是可靠性；顶层五大特性里没有"经济性""可维护性"。</div>`},
  {t:'服务集成四要素', f:'low', s:1, m:'需方、供方、环境、过程。', b:`
<p>信息系统服务的<b>服务集成</b>方法，围绕四个核心要素展开：</p>
<ul>
<li><b>需方：</b>提出需求、验收服务的客户方——集成围绕需方业务目标展开。</li>
<li><b>供方：</b>提供服务、组织资源的服务提供方。</li>
<li><b>环境：</b>服务的支撑条件，包括软硬件环境、组织环境等。</li>
<li><b>过程：</b>将各方能力串联成交付结果的流程与活动。</li>
</ul>
<div class="tip">记忆抓两个字——"谁"（需方、供方）+"在哪、怎么干"（环境、过程）。选择题里出现"工具、技术、人员"这类PPTR词，就是拿四要素混淆视听。</div>`},
  {t:'IT服务产业化三阶段', f:'low', s:1, m:'产品服务化、服务标准化、服务产品化。', b:`
<p>IT服务产业化有三个必然阶段，顺序是考点：</p>
<table class="kt"><tr><th>阶段</th><th>含义</th><th>举例</th></tr>
<tr><td>产品服务化</td><td>产品附带服务，服务围绕产品展开</td><td>卖服务器附送安装维保</td></tr>
<tr><td>服务标准化</td><td>服务形成统一规范与标准</td><td>依据ITSS规范服务流程</td></tr>
<tr><td>服务产品化</td><td>服务被打包成可复制、可规模销售的产品</td><td>标准化的运维服务包按年订阅</td></tr></table>
<div class="pit"><b>坑点：</b>顺序是"产品服务化 → 服务标准化 → 服务产品化"，先有服务、再定标准、最后成产品；选项把"服务产品化"排最前是常见陷阱。另注意：服务标准化是服务产品化的前提。</div>`},
  {t:'本章易错易混速查表', f:'mid', s:2, m:'四要素、四阶段、五特性，三组数字要分清。', b:`
<table class="kt"><tr><th>易混点</th><th>辨析关键</th></tr>
<tr><td>PPTR vs SDOR</td><td>PPTR是能力四要素（人员/过程/技术/资源）；SDOR是生命周期四阶段（战略规划/设计实现/运营提升/退役终止）——一个管"资源维度"、一个管"时间维度"</td></tr>
<tr><td>服务4特征 vs 质量5特性</td><td>4特征描述服务本身（无形/不可分离/可变/不可储存）；5特性评价服务质量（安/可/响/有/友）</td></tr>
<tr><td>ITSS vs ITIL/COBIT/CMMI</td><td>ITSS是我国自主标准体系；ITIL英国服务管理实践；COBIT治理框架；CMMI成熟度模型</td></tr>
<tr><td>四动词配对</td><td>人员=正确选人；过程=正确做事；技术=高效做事；资源=保障做事</td></tr>
<tr><td>资源要素内容</td><td>知识库、工具库、备件库——选"资金、设备清单"是干扰</td></tr>
<tr><td>数字速记</td><td>能力要素4个、生命周期阶段4个、质量特性5个、服务特征4个、内涵特征7个</td></tr></table>
<div class="tip"><b>考情：</b>本章约1~3分，只考上午选择题，多为"组成/顺序/不包括"类送分题——把三组数字背准即可稳拿。</div>`}
], quiz:[
  {q:'ITSS给出了IT服务的基本原理，IT服务的能力要素由（ ）组成', o:['人员、技术、设备、资金','人员、过程、技术、资源','人员、过程、工具、方法','人员、技术、资金、环境'], a:1, k:'IT服务组成要素', e:'IT服务由人员、过程、技术、资源四个能力要素组成，简称PPTR。资源指提供服务所依存和产生的有形及无形资产，如知识库、工具库、备件库，选项中的设备、资金、工具等均为干扰项。'},
  {q:'在IT服务能力要素中，确保供方能够"高效做事"的要素是（ ）', o:['人员','过程','技术','资源'], a:2, k:'四要素动词配对', e:'技术指发现和解决问题的能力、风险控制能力，确保供方高效做事；人员对应正确选人，过程对应正确做事，资源对应保障做事。四个动词与四要素的配对是高频考法。'},
  {q:'IT服务生命周期由四个阶段组成，正确的顺序是（ ）', o:['战略规划、部署实施、运营提升、退役终止','战略规划、设计实现、运营提升、退役终止','设计实现、战略规划、运营提升、退役终止','规划设计、部署实施、服务运营、持续改进'], a:1, k:'IT服务生命周期', e:'IT服务生命周期为战略规划、设计实现、运营提升、退役终止四阶段，简称SDOR。选项A的部署实施与选项D的旧五阶段表述均为干扰项，第3版教材按四阶段SDOR掌握。'},
  {q:'IT服务进入退役终止阶段时，供方开展的主要工作不包括（ ）', o:['制定数据迁移方案，保障数据安全移交','通知用户并安排服务过渡事宜','回收与处置相关资产并存档必要文档','招募更多工程师以扩大服务团队规模'], a:3, k:'退役终止阶段', e:'退役终止阶段的工作围绕有序退出展开：数据迁移、用户通知、系统下线、资产回收处置与文档存档。扩大团队属于运营提升或战略规划阶段的资源安排，与退役退出背道而驰。'},
  {q:'以下不属于IT服务质量五大特性的是（ ）', o:['安全性','响应性','灵活性','友好性'], a:2, k:'服务质量特性', e:'IT服务质量五大特性为安全性、可靠性、响应性、有形性、友好性。灵活性只是友好性的子特性之一，不是顶层特性；选项用它迷惑对层级掌握不牢的考生。'},
  {q:'服务的生产与消费同时进行、需方须参与生产过程才能享受到服务，这体现服务的（ ）', o:['无形性','不可分离性','可变性','不可储存性'], a:1, k:'服务四大特征', e:'不可分离性又称同步性，指服务的生产和消费同时进行。无形性指购买前无法感知，可变性指质量随操作者、时间、地点、心态变化，不可储存性指服务无法储藏备用。'},
  {q:'关于ITSS，以下叙述正确的是（ ）', o:['ITSS是我国自主研究制定的信息技术服务标准体系','ITSS是英国推出的IT服务管理最佳实践框架','ITSS由美国卡内基梅隆大学研究制定','ITSS是国际标准化组织发布的强制性国际标准'], a:0, k:'ITSS判别', e:'ITSS在工业和信息化部、国家标准化管理委员会联合指导下由ITSS工作组研究制定，是我国自主的IT服务标准体系。英国的最佳实践框架是ITIL，卡内基梅隆大学对应CMMI，张冠李戴是本题的干扰手法。'},
  {q:'IT服务产业化需要经历三个必然阶段，正确的顺序是（ ）', o:['服务标准化、产品服务化、服务产品化','服务产品化、产品服务化、服务标准化','产品服务化、服务标准化、服务产品化','产品服务化、服务产品化、服务标准化'], a:2, k:'产业化三阶段', e:'三个阶段的顺序为产品服务化、服务标准化、服务产品化：先让服务从产品中长出来，再用标准把服务规范住，最后把标准化的服务打包成可复制的产品。服务标准化是服务产品化的前提。'}
]},
  {id:4,  title:'信息系统架构',       sec:'it',  page:136, cards:[
  {t:'架构本质与总体参考框架', f:'high', s:3, m:'架构即决策；框架四层：战、业、用、信。', b:`
<p><b>架构的本质是决策</b>——在权衡方向、结构、关系以及原则等方面因素后进行的决策。信息系统架构体现信息系统相关组件、关系以及系统的设计和演化原则。</p>
<p><b>信息系统体系架构总体参考框架</b>由四部分组成，与管理金字塔相一致：</p>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-box" style="border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.05)"><b style="color:#fde68a">战略系统 · 第一层</b><span>战略管理：战略制定与高层决策的计算机辅助系统 · 向业务、应用系统提出要求</span></div>
  <div class="dg-varrow">▼</div>
  <div class="dg-box" style="border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)"><b style="color:#cfc8ff">业务系统 · 第二层</b><span>战术管理：完成一定业务功能的系统，在战略系统指导下采用业务流程重组（BPR）优化</span></div>
  <div class="dg-varrow">▼</div>
  <div class="dg-box" style="border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.05)"><b style="color:#a5e8f5">应用系统 · 第二层</b><span>战术管理：信息系统中的应用软件部分（TPS、MIS、DSS等）· 含内部功能实现与外部界面两部分</span></div>
  <div class="dg-varrow">▼</div>
  <div class="dg-box" style="border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.05)"><b style="color:#6ee7b7">信息基础设施 · 第三层</b><span>运行管理：组织信息化的基础 · 三大组成——<b>技术基础设施、信息资源设施、管理基础设施</b></span></div>
</div>
<figcaption>总体参考框架四层：战略系统在顶、信息基础设施在底、业务与应用居中</figcaption>
</figure>
<div class="pit"><b>坑点：</b>① "信息基础设施的组成"必背三件套：技术、信息资源、管理——选"硬件、软件、网络"是望文生义。② 战略系统是最顶层，别与应用系统（软件部分）混淆；口诀"战业用信"自上而下记。</div>`},
  {t:'物理架构：集中式与分布式', f:'mid', s:2, m:'集中好管理，分布易扩展。', b:`
<p><b>物理架构</b>不考虑功能，只抽象考察硬件系统的空间分布，分两类：</p>
<table class="kt"><tr><th>维度</th><th>集中式架构</th><th>分布式架构</th></tr>
<tr><td>资源分布</td><td>资源集中配置于主机</td><td>资源分散在多节点</td></tr>
<tr><td>优点</td><td>管理便利、资源利用率高</td><td>扩展方便、故障影响隔离</td></tr>
<tr><td>缺点</td><td>单点故障风险（主机瘫则全瘫）、维护成本高、扩展性差</td><td>管理复杂、多节点标准不易统一</td></tr>
<tr><td>典型场景</td><td>早期银行柜面、工厂控制主机</td><td>云计算、微服务、物联网</td></tr></table>
<p><b>逻辑架构</b>是信息系统各功能子系统的综合体，融合方式三种：<b>横向融合</b>（同一层次综合）、<b>纵向融合</b>（上下级沟通整合）、<b>纵横融合</b>（建立公用数据体系）。</p>
<div class="pit"><b>坑点：</b>① "集中式架构不存在单点故障"是错误选项——单点风险正是它被分布式取代的主因。② "分布式架构管理更简单"也是反话——分布式以管理复杂度为代价换扩展性。</div>`},
  {t:'C/S、B/S与MVC模式', f:'mid', s:2, m:'C/S胖客户端，B/S零安装，MVC三分离。', b:`
<p>软件架构模式从简单到复杂一路演进：</p>
<ul>
<li><b>单机应用模式：</b>运行在一台物理机上的独立程序，不依赖网络。</li>
<li><b>两层C/S：</b>客户端 + 数据库服务器，界面与业务逻辑都压在客户端——"胖客户端"，部署升级要挨个装机。</li>
<li><b>三层C/S与B/S：</b>表现层、业务逻辑层、数据层分离；<b>B/S（浏览器/服务器）是三层C/S最典型的实现</b>，客户端只需浏览器、以HTTP通信，升级只改服务端。</li>
<li><b>MVC模式：</b>Model模型（业务逻辑+数据持久化）、View视图（界面展示）、Controller控制器（接收请求、协调模型与视图）——多层C/S结构的标准化模式。</li>
</ul>
<div class="pit"><b>坑点：</b>① B/S最大卖点是<b>客户端零安装</b>，"服务器负荷更低"不是它的特征。② MVC的Model不只是"存数据"，还包含业务逻辑；View与Model必须分离——"视图直接读写数据库"是找错题常见描述。</div>`},
  {t:'SOA与微服务对比', f:'high', s:3, m:'SOA靠总线，微服务去中心。', b:`
<p><b>SOA面向服务架构：</b>把功能封装成可复用的服务，通过服务注册、发现、调用实现松耦合集成；其本质是<b>消息机制或远程过程调用（RPC）</b>，<b>Web Service是SOA最典型的应用</b>（SOAP负责通信、WSDL负责服务描述、UDDI负责注册发现）。</p>
<table class="kt"><tr><th>维度</th><th>SOA</th><th>微服务</th></tr>
<tr><td>服务粒度</td><td>粗粒度，服务偏大</td><td>细粒度，小而专</td></tr>
<tr><td>通信方式</td><td>企业服务总线ESB集中转发</td><td>轻量协议（HTTP/REST、gRPC）直接调用</td></tr>
<tr><td>治理模式</td><td>中心化（依赖ESB）</td><td>去中心化</td></tr>
<tr><td>部署与伸缩</td><td>整体部署较重</td><td>独立部署、独立伸缩</td></tr>
<tr><td>技术栈</td><td>倾向统一</td><td>各服务可异构</td></tr></table>
<div class="pit"><b>坑点：</b>① "微服务依赖企业服务总线ESB"是典型错误选项——ESB是SOA的标志，微服务恰恰去中心化。② 见到SOAP/WSDL/Web Service→SOA；见到独立部署、细粒度、去中心化→微服务。</div>`},
  {t:'企业架构与TOGAF ADM', f:'mid', s:2, m:'业务、数据应用、技术，BCD顺序不乱。', b:`
<p><b>企业架构四大子架构：</b>业务架构、应用架构、数据架构、技术架构——从业务出发逐层落到技术实现。</p>
<p><b>TOGAF</b>是开放式企业架构框架，核心是<b>ADM架构开发方法</b>：</p>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-row">
    <div class="dg-box"><b>预备阶段</b><span>确定原则与工具</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>A 架构愿景</b><span>明确范围与目标</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box" style="border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.05)"><b style="color:#fde68a">B 业务架构</b><span>业务流程建模</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box" style="border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)"><b style="color:#cfc8ff">C 信息系统架构</b><span>数据架构+应用架构</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box" style="border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.05)"><b style="color:#a5e8f5">D 技术架构</b><span>支撑软硬件选型</span></div>
  </div>
  <div class="dg-varrow">▼ 后续阶段</div>
  <div class="dg-box"><b>E机会及解决方案 → F迁移规划 → G实施治理 → H架构变更管理</b><span>需求管理贯穿全程、位于中心</span></div>
</div>
<figcaption>ADM核心顺序：B业务 → C信息系统 → D技术，先业务后技术</figcaption>
</figure>
<div class="pit"><b>坑点：</b>① B→C→D的顺序是"业务架构→信息系统架构→技术架构"，选项把技术架构提到C位即错。② C阶段是"信息系统架构"，内含<b>数据架构与应用架构</b>两个子架构，别被拆开后的表述绕晕。</div>`},
  {t:'网络架构：三层组网与SDN', f:'mid', s:2, m:'核心快转发、汇聚做策略、接入连终端。', b:`
<p>园区网络经典三层架构：</p>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-box" style="border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.05)"><b style="color:#fde68a">核心层 · 高速骨干</b><span>高速数据转发与骨干互联 · 通常双机冗余设计，可靠性要求最高 · 做得越少越稳</span></div>
  <div class="dg-varrow">▼ 上联</div>
  <div class="dg-box" style="border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)"><b style="color:#cfc8ff">汇聚层 · 策略枢纽</b><span>汇聚接入层流量 · VLAN间路由 · 实施ACL、QoS等策略控制</span></div>
  <div class="dg-varrow">▼ 上联</div>
  <div class="dg-box" style="border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.05)"><b style="color:#a5e8f5">接入层 · 终端门户</b><span>终端设备接入网络 · 端口密度大 · 端口安全、接入认证、PoE供电</span></div>
</div>
<figcaption>三层自上而下：核心管转发、汇聚管策略、接入管终端</figcaption>
</figure>
<p><b>SDN软件定义网络：</b>控制平面与数据平面分离，由控制器集中统一下发流表、设备只负责转发，OpenFlow是其代表性南向协议——网络像软件一样可编程。</p>
<div class="pit"><b>坑点：</b>① "接入层承担高速骨干转发"错——接入层面向终端，速度与策略要求最低。② SDN的核心特征是<b>控制与转发分离、集中控制</b>，选项写成"转发与控制合一、分布式决策"即反向陷阱。</div>`},
  {t:'安全架构：WPDRRC模型', f:'high', s:3, m:'预保检应恢反六环节，人策技三要素。', b:`
<p><b>WPDRRC</b>是我国863信息安全专家组提出的、适合中国国情的信息安全保障体系模型，有<b>6个环节和3大要素</b>。</p>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-row">
    <div class="dg-box"><b>W 预警</b><span>提前发现威胁</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>P 保护</b><span>加固防护措施</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>D 检测</b><span>发现攻击行为</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>R 响应</b><span>应急处置告警</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>R 恢复</b><span>还原系统运行</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box" style="border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.05)"><b style="color:#fda4af">C 反击</b><span>溯源与反制</span></div>
  </div>
  <div class="dg-varrow">▼ 三大要素支撑六大环节</div>
  <div class="dg dg-3">
    <div class="dg-box" style="border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.05)"><b style="color:#a5e8f5">人员 · 核心</b><span>决定安全文化的第一道防线</span></div>
    <div class="dg-box" style="border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)"><b style="color:#cfc8ff">策略 · 桥梁</b><span>把管理要求转化为可执行规则</span></div>
    <div class="dg-box" style="border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.05)"><b style="color:#6ee7b7">技术 · 保证</b><span>让策略真正落地为防护能力</span></div>
  </div>
</div>
<figcaption>六环节具时序性与动态性；三要素把安全策略变为安全现实</figcaption>
</figure>
<div class="pit"><b>坑点：</b>① 三要素是<b>人员、策略、技术</b>——"人员是核心、策略是桥梁、技术是保证"；选项换成"人员、组织、技术"或"管理、制度、流程"即错。② 模型是在PDRR基础上前后增加了<b>预警和反击</b>，"反击"环节别漏。</div>`},
  {t:'云原生架构七原则', f:'high', s:3, m:'服弹观韧动，零信任，持续演进。', b:`
<p><b>定义：</b>云原生架构是基于云原生技术的一组<b>架构原则和设计模式</b>的集合，把应用中的非业务代码最大化剥离，让云设施接管弹性、韧性、安全、可观测等非功能特性，使应用具备<b>轻量、敏捷、高度自动化</b>的特点。</p>
<p><b>七大设计原则（列举题原题考过）：</b></p>
<table class="kt"><tr><th>原则</th><th>要点</th></tr>
<tr><td>服务化</td><td>拆分为微服务、小服务架构</td></tr>
<tr><td>弹性</td><td>部署规模随业务量变化自动伸缩</td></tr>
<tr><td>可观测</td><td>靠日志、链路跟踪、度量看清每次调用</td></tr>
<tr><td>韧性</td><td>抵御软硬件异常，提升平均无故障时间</td></tr>
<tr><td>所有过程自动化</td><td>软件交付与运维全流程自动化</td></tr>
<tr><td>零信任</td><td>默认不信任网络内外部任何人、设备、系统，以身份为中心</td></tr>
<tr><td>架构持续演进</td><td>架构随业务高速迭代持续演化</td></tr></table>
<p><b>常用架构模式：</b>服务化架构、Mesh化架构、Serverless、存储计算分离、分布式事务、可观测、事件驱动。</p>
<div class="pit"><b>坑点：</b>① 列举题的杜撰干扰项："集中化管控原则""数据本地化原则"都不在七原则之列。② 弹性讲<b>自动伸缩</b>、韧性讲<b>故障抵御</b>，两者别混；"零信任"不是"只防外网"，内网同样默认不信任。</div>`},
  {t:'本章易错易混速查表', f:'mid', s:2, m:'四层、三层、六环节、七原则，数字排排站。', b:`
<table class="kt"><tr><th>易混点</th><th>辨析关键</th></tr>
<tr><td>总体框架四层</td><td>战略系统、业务系统、应用系统、信息基础设施（技术/信息资源/管理三设施）</td></tr>
<tr><td>集中式 vs 分布式</td><td>集中式管理便利但单点故障；分布式扩展方便但管理复杂</td></tr>
<tr><td>C/S vs B/S</td><td>胖客户端要装软件；B/S零安装、升级只改服务端、HTTP通信</td></tr>
<tr><td>SOA vs 微服务</td><td>SOA靠ESB总线集中转发；微服务细粒度、去中心化、独立部署</td></tr>
<tr><td>TOGAF ADM</td><td>B业务架构→C信息系统架构（数据+应用）→D技术架构，先业务后技术</td></tr>
<tr><td>网络三层</td><td>核心高速转发、汇聚策略路由、接入终端门户；SDN=控制转发分离</td></tr>
<tr><td>WPDRRC</td><td>6环节（预警保护检测响应恢复反击）+3要素（人员核心、策略桥梁、技术保证）</td></tr>
<tr><td>云原生7原则</td><td>服务化、弹性、可观测、韧性、所有过程自动化、零信任、架构持续演进</td></tr>
<tr><td>数字速记</td><td>参考框架4层、组网3层、WPDRRC 6+3、云原生7原则、ADM核心BCD</td></tr></table>
<div class="tip"><b>考情：</b>本章约3~5分，只考上午选择题；SOA与微服务、云原生七原则、WPDRRC是近两年新大纲的稳定考点，速查表过一遍即可应试。</div>`}
], quiz:[
  {q:'信息系统体系架构总体参考框架中，信息基础设施分为（ ）', o:['技术基础设施、信息资源设施、管理基础设施','硬件设施、软件设施、网络设施','计算设施、存储设施、安全设施','机房设施、服务器设施、数据库设施'], a:0, k:'总体参考框架', e:'信息基础设施是组织信息化的基础，由技术基础设施、信息资源设施、管理基础设施三部分组成。业务系统、应用系统、战略系统与其共同构成总体参考框架四个部分，硬件软件网络是望文生义的干扰项。'},
  {q:'以下关于微服务架构特点的描述中，不正确的是（ ）', o:['服务粒度细，每个服务小而专','服务治理去中心化','每个服务可独立部署和伸缩','依赖企业服务总线ESB集中转发消息'], a:3, k:'SOA与微服务', e:'ESB企业服务总线是SOA架构集中式治理的标志；微服务恰恰强调去中心化治理，采用HTTP/REST、gRPC等轻量协议点对点通信，并支持独立部署、独立伸缩和异构技术栈。'},
  {q:'WPDRRC信息安全体系架构模型的三要素是（ ）', o:['人员、组织、技术','人员、策略、技术','管理、制度、流程','人员、流程、设备'], a:1, k:'WPDRRC三要素', e:'WPDRRC模型有6个环节（预警、保护、检测、响应、恢复、反击）和3大要素——人员是核心、策略是桥梁、技术是保证。把策略换成组织或制度是常见干扰手法。'},
  {q:'以下不属于云原生架构设计原则的是（ ）', o:['服务化原则','弹性原则','集中化管控原则','可观测原则'], a:2, k:'云原生七原则', e:'云原生架构七大原则为服务化、弹性、可观测、韧性、所有过程自动化、零信任、架构持续演进。集中化管控原则属于杜撰干扰项，与云原生去中心化的演进方向相悖。'},
  {q:'与两层C/S架构相比，B/S架构最突出的优点是（ ）', o:['客户端零安装，通过浏览器即可访问','客户端需要安装专用软件才能使用','系统只能部署在局域网内部使用','服务器端的处理负荷显著更低'], a:0, k:'B/S与C/S', e:'B/S是三层C/S最典型的实现，客户端只需浏览器、以HTTP通信，应用升级只需更新服务器端，维护成本大幅降低。它并非必须限定局域网，且大量逻辑集中到服务端反而使服务器负荷更高。'},
  {q:'园区网络三层架构中，核心层的主要功能是（ ）', o:['为终端设备提供网络接入端口','高速数据转发与骨干互联','实施VLAN划分和访问控制策略','对上网用户进行身份认证与计费'], a:1, k:'网络三层架构', e:'核心层是网络的高速骨干，负责高速转发与设备互联，通常做冗余设计且尽量少叠加策略；接入层面向终端提供端口并做端口安全，汇聚层负责VLAN间路由和ACL、QoS等策略控制。'},
  {q:'TOGAF的ADM架构开发方法中，阶段B、C、D依次开发的架构是（ ）', o:['业务架构、技术架构、信息系统架构','信息系统架构、业务架构、技术架构','业务架构、信息系统架构、技术架构','技术架构、业务架构、信息系统架构'], a:2, k:'TOGAF ADM', e:'ADM的核心开发顺序为先业务后技术：阶段B业务架构、阶段C信息系统架构（内含数据架构与应用架构）、阶段D技术架构。此顺序体现业务驱动IT的设计思想，选项乱序即为陷阱。'},
  {q:'云原生架构零信任原则的核心含义是（ ）', o:['默认信任内网流量以提升效率','仅对来自外网的访问进行认证','依靠防火墙构筑边界即可高枕无忧','默认不信任网络内外部的任何人与设备'], a:3, k:'云原生零信任', e:'零信任原则要求默认不信任网络内部和外部的任何人员、设备与系统，基于认证和授权重构访问控制的信任基础，架构从网络中心化走向身份中心化。只防外网、依赖边界的说法均违背其本意。'}
]},
  {id:5,  title:'软件工程',           sec:'it',  page:202, cards:[
  {t:'软件过程模型对比', f:'high', s:3, m:'瀑布直顺序、原型先出样、螺旋带风险、增量分批交。', b:`
<table class="kt"><tr><th>模型</th><th>核心思想</th><th>特点/坑点</th></tr>
<tr><td><b>瀑布模型</b></td><td>需求→设计→编码→测试→维护，严格阶段顺序，文档驱动</td><td>里程碑清晰；要求需求明确稳定，<b>难以适应需求变化</b></td></tr>
<tr><td><b>原型模型</b></td><td>先构造可运行原型，经用户反馈迭代完善</td><td>分抛弃型/演化型；适合需求模糊场景</td></tr>
<tr><td><b>螺旋模型</b></td><td>每轮含制定计划、风险分析、实施工程、客户评估</td><td>强调<b>风险分析</b>，适合大型复杂高风险项目</td></tr>
<tr><td><b>增量模型</b></td><td>分批次交付可运行构件，逐步累积成完整系统</td><td>用户能早期使用部分功能；要求架构开放易融合</td></tr>
<tr><td><b>敏捷 Scrum</b></td><td>以人为核心、迭代增量，短周期冲刺+每日站会</td><td>响应变化重于遵循计划，适合需求多变场景</td></tr></table>
<div class="tip">判别题眼：出现"风险驱动/每轮评审"→螺旋；"早期可用/分批交付"→增量；"冲刺/站会/待办列表"→敏捷；"阶段顺序严格/文档驱动"→瀑布。</div>
<div class="pit"><b>坑点：</b>"原型模型适用于需求明确的场景"错——原型正是为<b>需求不明确</b>而生；"瀑布模型适用于需求易变的项目"也是反的。</div>`},
  {t:'需求工程五子过程', f:'high', s:3, m:'获分规确管；规格写SRS，确认成基线。', b:`
<p><b>需求工程</b>分<b>需求开发</b>（获取→分析→规格→确认）与<b>需求管理</b>（变更控制、需求跟踪）两大主线。</p>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-row">
    <div class="dg-box"><b>需求获取</b><span>访谈 · 问卷 · 观察 · 原型 · JAD</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>需求分析</b><span>提炼 · 建模 · 消除冲突歧义</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>需求规格</b><span>写成 SRS 需求规格说明书</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>需求确认</b><span>评审验证，形成需求基线</span></div>
  </div>
  <div class="dg-varrow">▼ 贯穿全程</div>
  <div class="dg-box" style="border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.05)"><b style="color:#fda4af">需求管理</b><span>变更控制 · 需求跟踪 · 版本与状态管理</span></div>
</div>
<figcaption>需求开发四子过程 + 需求管理 = 需求工程五子过程</figcaption>
</figure>
<ul>
<li><b>需求获取</b>：识别用户真正需要什么，常用访谈、问卷调查、观察、原型法、JAD 联合需求开发会议。</li>
<li><b>需求分析</b>：对获取的需求提炼、建模、抽象，消除歧义与冲突。</li>
<li><b>需求规格</b>：把分析结果写成<b>需求规格说明书（SRS）</b>——设计的依据、验收的依据。</li>
<li><b>需求确认</b>：评审验证需求是否正确完整可行，通过后形成<b>需求基线</b>。</li>
<li><b>需求管理</b>：管理需求变更、跟踪、版本与状态，不是单独阶段而是贯穿全程。</li>
</ul>
<div class="pit"><b>坑点：</b>"需求规格"是写 SRS 的活动，<b>不是</b>测试需求；"需求确认"是评审需求本身，<b>不是</b>写文档；需求管理是<b>贯穿全程的活动</b>，不是最后一个阶段。</div>`},
  {t:'需求层次与SRS特性', f:'mid', s:2, m:'业用系三层；SRS无二义。', b:`
<p>软件需求分三个层次，从抽象到具体：</p>
<table class="kt"><tr><th>层次</th><th>定义</th><th>来源/例子</th></tr>
<tr><td><b>业务需求</b></td><td>反映组织机构或客户对系统的高层次目标要求</td><td>来自高层/发起人，如"实现网上办税"</td></tr>
<tr><td><b>用户需求</b></td><td>描述用户使用系统必须完成什么任务</td><td>来自最终用户，如"用户能查询本月账单"</td></tr>
<tr><td><b>系统需求</b></td><td>详细描述系统必须做什么</td><td>含功能需求与非功能需求，如"响应≤2秒"</td></tr></table>
<p><b>SRS 必须满足的特性</b>：正确、完整、一致、<b>无二义</b>、可验证、可跟踪、可修改。其中<b>无二义性</b>（同一需求只能有一种解释）最高频。</p>
<div class="pit"><b>坑点：</b>"用户需求=系统需求"错——用户需求描述用户要完成的任务，系统需求描述系统必须做什么；SRS 核心特性是无二义性，不是"简洁性"。</div>`},
  {t:'结构化与面向对象', f:'mid', s:2, m:'结构化面向过程DFD，面向对象封继多。', b:`
<table class="kt"><tr><th>维度</th><th>结构化方法</th><th>面向对象方法（OO）</th></tr>
<tr><td>思想核心</td><td>面向过程，自顶向下逐步求精</td><td>面向对象，以对象为基本单位</td></tr>
<tr><td>分解单位</td><td>功能模块/过程</td><td>对象（数据+操作封装）</td></tr>
<tr><td>建模工具</td><td>数据流图 DFD、数据字典 DD、结构图</td><td>UML 图（类图、用例图、顺序图等）</td></tr>
<tr><td>复用能力</td><td>较弱，难以复用</td><td>通过继承、多态实现高复用</td></tr>
<tr><td>稳定性</td><td>需求变化时改动大（主要缺点）</td><td>封装使需求变化影响局部化</td></tr></table>
<p><b>面向对象四大特征</b>：<b>封装</b>（隐藏内部实现）、<b>继承</b>（复用父类属性方法）、<b>多态</b>（同一消息不同实现）、<b>抽象</b>（忽略非本质细节）。</p>
<div class="tip">判别技巧：题干出现 DFD/数据流图/模块化→结构化；出现类图/继承/多态→面向对象。</div>
<div class="pit"><b>坑点：</b>"结构化方法的优点是稳定性强"错——面向过程导致需求一变就多处改动，稳定性差是它的<b>主要缺点</b>。</div>`},
  {t:'UML图分类速记', f:'high', s:3, m:'静类对包构部，行用顺状协活。', b:`
<p><b>UML（统一建模语言）</b>统一了 Booch、OMT、OOSE 三种方法，是面向对象建模的事实标准。UML 图分<b>静态图（结构图）</b>和<b>行为图（动态图）</b>两大类，常考 10 种。</p>
<figure class="kd-fig">
<div class="dg dg-2">
  <div class="dg-box" style="border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.05)"><b style="color:#a5e8f5">静态图（结构图）</b><span>类图 · 对象图 · 包图 · 构件图 · 部署图 —— 描述系统静态结构</span></div>
  <div class="dg-box" style="border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)"><b style="color:#cfc8ff">行为图（动态图）</b><span>用例图 · 顺序图 · 状态图 · 活动图 · 协作图 —— 描述系统动态行为</span></div>
</div>
<figcaption>UML 两大类图：静态看结构骨架，行为看交互动作</figcaption>
</figure>
<ul>
<li><b>类图</b>：描述类的结构与类间关系，最常用。</li>
<li><b>用例图</b>：从用户视角描述系统功能（参与者与用例）。</li>
<li><b>顺序图（序列图）</b>：按时间顺序描述对象间消息传递。</li>
<li><b>状态图</b>：描述<b>单个对象</b>的状态转换。</li>
<li><b>活动图</b>：描述<b>工作流/业务流程</b>，类似流程图。</li>
<li><b>协作图（通信图）</b>：描述对象间消息往来的组织结构，与顺序图等价。</li>
</ul>
<div class="pit"><b>坑点：</b>用例图是<b>行为图</b>不是结构图，常被反向混淆；状态图管"单对象状态转换"，活动图管"工作流"，两者别混。</div>`},
  {t:'高内聚低耦合', f:'low', s:1, m:'内聚越高越好，耦合越低越好。', b:`
<p><b>软件设计</b>分<b>概要设计</b>（体系结构、模块划分、接口、全局数据）与<b>详细设计</b>（每个模块的算法与数据结构）。衡量模块独立性的两个核心指标：</p>
<table class="kt"><tr><th>指标</th><th>含义</th><th>目标</th><th>极端情况</th></tr>
<tr><td>内聚</td><td>模块<b>内部</b>各元素结合的紧密程度</td><td><b>越高越好</b></td><td>功能内聚最好 / 偶然内聚最差</td></tr>
<tr><td>耦合</td><td>模块<b>之间</b>相互依赖的程度</td><td><b>越低越好</b></td><td>数据耦合最好 / 内容耦合最差</td></tr></table>
<ul>
<li><b>高内聚</b>：一个模块只做一件事，内部元素紧密相关。</li>
<li><b>低耦合</b>：模块间接口简单、依赖少，改动互不牵连。</li>
<li>两者结合提高模块独立性、可维护性、可复用性。</li>
</ul>
<div class="pit"><b>坑点：</b>"提高耦合以增强模块联系"错——耦合越低越好；"降低内聚以减少复杂度"也错——内聚越高越好。内聚看"自己紧不紧"，耦合看"牵连多不多"。</div>`},
  {t:'软件测试四级', f:'high', s:3, m:'单集系验四级；桩在下、驱在上。', b:`
<table class="kt"><tr><th>测试级</th><th>测试对象</th><th>谁来测/关注点</th></tr>
<tr><td><b>单元测试</b></td><td>最小可测试单元（模块/函数）</td><td>通常由开发人员自测</td></tr>
<tr><td><b>集成测试</b></td><td>模块间的接口与组装</td><td>验证模块间交互与接口</td></tr>
<tr><td><b>系统测试</b></td><td>集成后的整个系统</td><td>独立测试组，验证是否满足需求</td></tr>
<tr><td><b>验收测试</b></td><td>交付前的系统</td><td>用户/客户参与，确认可接受性</td></tr></table>
<p><b>集成测试两种策略</b>：</p>
<ul>
<li><b>自顶向下</b>：从主模块向下集成，下层未完成模块用<b>桩模块（stub）</b>模拟。</li>
<li><b>自底向上</b>：从底层模块向上集成，上层未完成调用用<b>驱动模块（driver）</b>模拟。</li>
</ul>
<div class="tip">口诀：<b>桩在下、驱在上</b>——自顶向下缺下层用桩，自底向上缺上层用驱动，一句话秒杀。</div>
<div class="pit"><b>坑点：</b>"自顶向下集成需要驱动模块"是高频反考——自顶向下用<b>桩模块</b>；驱动模块是<b>自底向上</b>的辅助工具。"系统测试由开发人员完成"也错——系统测试由<b>独立测试组</b>执行。</div>`},
  {t:'白盒与黑盒测试', f:'high', s:3, m:'覆盖类是白盒，划分边界是黑盒。', b:`
<table class="kt"><tr><th>维度</th><th>白盒测试</th><th>黑盒测试</th></tr>
<tr><td>视角</td><td>程序内部逻辑结构</td><td>程序外部功能表现</td></tr>
<tr><td>关注</td><td>代码路径、分支、条件</td><td>输入与输出的对应关系</td></tr>
<tr><td>常用方法</td><td>语句覆盖、判定覆盖、条件覆盖、路径覆盖</td><td>等价类划分、边界值分析、因果图、错误推测法</td></tr>
<tr><td>适用阶段</td><td>单元测试</td><td>系统测试、验收测试</td></tr></table>
<p><b>白盒覆盖由弱到强</b>：语句覆盖 &lt; 判定覆盖（分支） &lt; 条件覆盖 &lt; 判定/条件覆盖 &lt; 条件组合覆盖 &lt; 路径覆盖（最强）。<b>灰盒测试</b>介于两者之间，常用于集成测试。</p>
<div class="pit"><b>坑点：</b>"等价类划分是白盒方法"错——等价类划分、边界值分析都是<b>黑盒</b>方法；"语句覆盖是黑盒方法"也反了。记住：<b>凡带"覆盖"是白盒，凡带"划分/边界"是黑盒</b>。</div>`},
  {t:'DevOps与净室工程', f:'mid', s:2, m:'DevOps破壁快交付，净室预防零缺陷。', b:`
<p><b>DevOps</b>（Development + Operations）强调<b>开发与运维紧密协作</b>，通过<b>自动化</b>（持续集成 CI、持续交付 CD、基础设施即代码）打破部门墙，实现软件<b>快速、频繁、可靠</b>交付；开发对交付负责、运维参与设计、全过程度量驱动改进。</p>
<p><b>净室软件工程（CSE）</b>是<b>以预防缺陷为主</b>的开发方法：在设计阶段通过<b>形式化规约、数学证明、统计测试</b>把缺陷消灭在产生之前，目标是<b>交付零缺陷软件</b>。开发先写规约再写代码，用数学方法保证正确性，统计测试评估使用可靠性。</p>
<div class="tip">对比记忆：DevOps 重"快"（自动化、破墙、频繁交付）；净室重"准"（形式化规约、数学证明、零缺陷）。</div>
<div class="pit"><b>坑点：</b>"净室软件工程靠大量测试发现缺陷"错——净室是<b>预防缺陷</b>为主，缺陷应在产生前被消灭，不是靠后期测试发现。"DevOps 只是运维自动化"也错——核心是<b>开发与运维协作</b>的文化与流程。</div>`},
  {t:'维护四类与软件质量', f:'high', s:3, m:'完善五成最大头，改适完预按因分。', b:`
<p>软件维护按触发原因分四类：</p>
<table class="kt"><tr><th>类型</th><th>触发原因</th><th>记忆点</th></tr>
<tr><td><b>改正性维护</b></td><td>改正在开发阶段产生、测试阶段未发现的错误</td><td>修 bug</td></tr>
<tr><td><b>适应性维护</b></td><td>适应外部环境变化（新 OS/硬件/法规/数据环境）</td><td>环境变了</td></tr>
<tr><td><b>完善性维护</b></td><td>扩充功能、增强性能、改进可维护性</td><td><b>占比最大（约50%）</b></td></tr>
<tr><td><b>预防性维护</b></td><td>为提高可维护性、可靠性而主动改造</td><td>占比最小</td></tr></table>
<p><b>软件质量</b>指软件与明确地叙述的功能和性能需求一致、与文档一致、与隐含需求一致。<b>验证</b>（Verification）：是否正确地构造了产品（查过程）；<b>确认</b>（Validation）：是否构造了正确的产品（查结果/需求）。</p>
<div class="pit"><b>坑点：</b>"完善性维护是改正错误"错——完善性是<b>扩充功能提升性能</b>；占比最大的是<b>完善性</b>维护，不是改正性。验证看过程、确认看结果，两者别混。</div>`},
  {t:'本章易错易混速查表', f:'high', s:3, m:'四级测试桩驱分，四类维护占比明。', b:`
<table class="kt"><tr><th>易混点</th><th>辨析关键</th></tr>
<tr><td>瀑布 vs 原型 vs 螺旋 vs 增量</td><td>瀑布严格阶段；原型需求不明；螺旋含风险分析；增量分批交付</td></tr>
<tr><td>需求规格 vs 需求确认</td><td>前者写 SRS；后者评审验证需求是否正确</td></tr>
<tr><td>业务/用户/系统需求</td><td>业务=高层目标；用户=用户任务；系统=系统必须做什么</td></tr>
<tr><td>状态图 vs 活动图</td><td>状态图描述单对象状态转换；活动图描述工作流</td></tr>
<tr><td>自顶向下 vs 自底向上</td><td>前者用桩（在下）；后者用驱动（在上）</td></tr>
<tr><td>白盒 vs 黑盒</td><td>凡带"覆盖"→白盒；凡带"划分/边界"→黑盒</td></tr>
<tr><td>验证 vs 确认</td><td>验证查过程；确认查结果</td></tr>
<tr><td>四类维护占比</td><td>完善最大（约50%），预防最小</td></tr>
<tr><td>DevOps vs 净室</td><td>DevOps 重快与协作；净室重形式化预防缺陷</td></tr></table>
<div class="tip"><b>考情：</b>本章约 3~5 分选择题，UML 图分类、白盒黑盒方法归属、四类维护、需求层次与需求工程子过程是高频；DevOps、净室为新增考点，掌握概念辨析即可。</div>`}
], quiz:[
  {q:'下列关于软件过程模型的叙述中，不正确的是（ ）', o:['瀑布模型要求需求明确且稳定，难以适应需求变化','原型模型先构造可运行原型，经用户反馈迭代完善','螺旋模型每一轮都包含风险分析，适合大型复杂高风险项目','增量模型要求软件架构封闭，否则后期构件融合困难'], a:3, k:'软件过程模型', e:'增量模型分批交付可运行构件，要求软件架构开放（而非封闭），以便后续构件能顺利集成。选项D说"封闭"与教材表述相反，其余三项均正确。'},
  {q:'某信息系统建设初期用户只能描述大致的业务期望，无法给出明确功能清单，此时最适宜采用的软件开发模型是（ ）', o:['原型模型','瀑布模型','V模型','增量模型'], a:0, k:'过程模型选择', e:'原型模型专门应对需求模糊场景：先快速构造原型让用户试用，通过反馈逐步明确需求。瀑布和V模型都要求需求明确稳定；增量模型适合可分批交付的场景。'},
  {q:'软件需求工程中，把分析后的需求写成需求规格说明书（SRS）的活动属于（ ）', o:['需求获取','需求分析','需求规格','需求确认'], a:2, k:'需求工程子过程', e:'需求开发含获取、分析、规格、确认四个子过程。"需求规格"是把分析结果文档化写成SRS的活动；"需求确认"是评审验证需求是否正确。注意"规格"指文档化，不是测试。'},
  {q:'编写需求规格说明书（SRS）时，要求同一需求只能有一种解释，不能有多种理解，这体现的特性是（ ）', o:['正确性','无二义性','可验证性','可跟踪性'], a:1, k:'SRS特性', e:'无二义性指每条需求只能有一种解释，是SRS最核心的特性。正确性指需求准确反映用户意图；可验证性指需求可测试；可跟踪性指需求可正向反向追溯。'},
  {q:'在UML图中，描述单个对象在生命周期内状态转换的图是（ ）', o:['活动图','顺序图','状态图','用例图'], a:2, k:'UML图分类', e:'状态图描述单个对象的状态及其转换；活动图描述工作流/业务流程；顺序图按时间顺序描述对象间消息；用例图从用户视角描述系统功能。状态图与活动图最易混淆。'},
  {q:'衡量模块独立性的两个核心指标是内聚和耦合，软件设计的目标是（ ）', o:['提高内聚、提高耦合','降低内聚、降低耦合','降低内聚、提高耦合','提高内聚、降低耦合'], a:3, k:'高内聚低耦合', e:'内聚越高模块内部结合越紧密，耦合越低模块间依赖越少，二者结合才能提高模块独立性、可维护性和可复用性。目标是高内聚、低耦合。'},
  {q:'在软件集成测试中，自顶向下集成策略需要用（ ）来模拟下层尚未完成的模块', o:['驱动模块','桩模块','接口模块','调度模块'], a:1, k:'集成测试策略', e:'自顶向下从主模块开始向下集成，下层未完成模块用桩模块（stub）模拟；自底向上集成用驱动模块（driver）模拟上层调用。口诀"桩在下、驱在上"。'},
  {q:'下列测试方法中，全部属于黑盒测试的一组是（ ）', o:['语句覆盖、判定覆盖、条件覆盖','等价类划分、边界值分析、错误推测法','路径覆盖、边界值分析、因果图','语句覆盖、等价类划分、因果图'], a:1, k:'白盒黑盒测试', e:'等价类划分、边界值分析、错误推测法、因果图都是黑盒方法，关注输入输出而不看内部结构。语句覆盖、判定覆盖、条件覆盖、路径覆盖都是白盒的逻辑覆盖方法。'},
  {q:'软件交付使用后，为适应运行环境变化（如操作系统升级、数据环境改变）而进行的修改属于（ ）', o:['改正性维护','适应性维护','完善性维护','预防性维护'], a:1, k:'软件维护四类', e:'适应性维护针对外部环境变化（操作系统、硬件、法规、数据环境）而修改软件；改正性维护修错误；完善性维护扩充功能提升性能（占比最大约50%）；预防性维护为提高可维护性主动改造。'}
]},
  {id:6,  title:'数据工程',           sec:'it',  page:234, cards:[
  {t:'数据建模四阶段', f:'high', s:3, m:'需概逻物四步走：E-R画圈、转表、落地。', b:`
<p><b>数据建模</b>是数据工程的核心工作，描述数据从业务需求到物理存储的抽象过程，分四个阶段：</p>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-row">
    <div class="dg-box"><b>数据需求分析</b><span>明确业务流程与数据需求，产出数据需求说明书</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>概念模型设计</b><span>E-R图：确定实体、属性、实体间联系</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>逻辑模型设计</b><span>E-R图转换为关系模式，规范化处理</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>物理模型设计</b><span>确定表结构、索引、分区、存储结构</span></div>
  </div>
</div>
<figcaption>数据建模四阶段：先抽象后落地，先全局后细节</figcaption>
</figure>
<ul>
<li><b>概念模型</b>：面向用户的模型，用<b>E-R图</b>（实体-联系图）描述，与具体数据库产品无关。</li>
<li><b>逻辑模型</b>：把概念模型转换为<b>关系模式</b>（一张张表），并做规范化（消冗余、满足范式）。</li>
<li><b>物理模型</b>：面向具体 DBMS，确定存储结构、索引、聚簇、分区。</li>
</ul>
<div class="pit"><b>坑点（2025真题）：</b><b>概念模型设计的核心任务是确定实体、属性及实体之间的联系</b>——不是"设计索引"、"消除冗余"（那是物理/逻辑模型的事）；"E-R图转换为关系模式"发生在<b>逻辑模型设计</b>阶段，别前移。</div>`},
  {t:'三模型与数据预处理', f:'mid', s:2, m:'概念面向用户、逻辑面向设计、物理面向机器。', b:`
<table class="kt"><tr><th>模型</th><th>视角</th><th>核心内容</th></tr>
<tr><td>概念模型</td><td>用户视角</td><td>实体、属性、联系（E-R图），与DBMS无关</td></tr>
<tr><td>逻辑模型</td><td>设计者视角</td><td>关系模式（表、字段、键、约束），满足范式</td></tr>
<tr><td>物理模型</td><td>机器视角</td><td>存储结构、索引、分区、表空间</td></tr></table>
<p><b>数据预处理四步</b>（数据进入分析前的清洗动作）：</p>
<ul>
<li><b>数据清洗</b>：处理缺失值、噪声数据、重复数据。</li>
<li><b>数据集成</b>：把多个数据源合并存入一致的数据存储。</li>
<li><b>数据变换</b>：规范化、离散化、聚集。</li>
<li><b>数据规约</b>：在保持数据完整性的前提下压缩数据量。</li>
</ul>
<div class="pit"><b>坑点：</b>"概念模型与具体DBMS相关"错——概念模型恰恰<b>独立于DBMS</b>；数据清洗≠数据变换：清洗是"去脏"（缺失/噪声/重复），变换是"变形"（规范化/离散化）。</div>`},
  {t:'关系数据库三范式', f:'high', s:3, m:'一原子、二消部分、三消传递。', b:`
<p>范式是关系模式规范化的等级，级别越高冗余越小、异常越少：</p>
<table class="kt"><tr><th>范式</th><th>条件</th><th>一句话理解</th></tr>
<tr><td><b>第一范式 1NF</b></td><td>每个属性都不可再分（原子性）</td><td>每个单元格只放一个值</td></tr>
<tr><td><b>第二范式 2NF</b></td><td>在1NF基础上，消除非主属性对码的<b>部分</b>函数依赖</td><td>非主属性必须依赖<b>整个</b>主键</td></tr>
<tr><td><b>第三范式 3NF</b></td><td>在2NF基础上，消除非主属性对码的<b>传递</b>函数依赖</td><td>非主属性不能依赖其他非主属性</td></tr></table>
<ul>
<li><b>典型反例：</b>学生表（学号，姓名，系名，系主任）——系名依赖学号、系主任又依赖系名，存在"学号→系名→系主任"传递依赖，不满足3NF。</li>
<li><b>BCNF</b>：3NF的加强版，进一步消除主属性对码的部分与传递依赖。</li>
</ul>
<div class="tip">记忆链：1NF管"原子"、2NF管"部分依赖"（联合主键场景）、3NF管"传递依赖"。判断题给"学号→系名→系主任"要立刻认出传递依赖。</div>
<div class="pit"><b>坑点：</b>"2NF消除传递依赖"错——2NF消除<b>部分</b>依赖，3NF才消除<b>传递</b>依赖，两个动词最爱互换。</div>`},
  {t:'NoSQL四大类型', f:'high', s:3, m:'键列文图四大家；CAP三选二。', b:`
<p><b>NoSQL</b>（非关系型数据库）面向大规模数据与高并发场景，分四大类型：</p>
<table class="kt"><tr><th>类型</th><th>数据模型</th><th>代表产品</th><th>适用场景</th></tr>
<tr><td><b>键值型</b></td><td>Key-Value pairs</td><td>Redis</td><td>缓存、会话管理，读写极快</td></tr>
<tr><td><b>列族型</b></td><td>按列族组织</td><td>HBase</td><td>海量数据存储、批量读写</td></tr>
<tr><td><b>文档型</b></td><td>类JSON文档</td><td>MongoDB</td><td>结构灵活多变的Web应用</td></tr>
<tr><td><b>图型</b></td><td>节点+边</td><td>Neo4j</td><td>社交网络、关系挖掘</td></tr></table>
<p><b>CAP理论：</b>一致性（Consistency）、可用性（Availability）、分区容忍性（Partition tolerance）三者<b>最多同时满足两个</b>，分布式系统通常在CP与AP之间取舍。</p>
<div class="tip">配对记忆：Redis=键值，HBase=列族，MongoDB=文档，Neo4j=图。产品与类型的配对是高频选择题。</div>
<div class="pit"><b>坑点：</b>"MongoDB是键值型数据库"错——MongoDB是<b>文档型</b>；"CAP三者可同时满足"错——<b>最多同时满足两个</b>。</div>`},
  {t:'数据仓库四大特征', f:'high', s:3, m:'主题集成、相对稳定、反映历史。', b:`
<p><b>数据仓库（DW）</b>是<b>面向主题的、集成的、相对稳定的、反映历史变化的</b>数据集合，用于支持管理决策。</p>
<table class="kt"><tr><th>特征</th><th>含义</th><th>反面陷阱</th></tr>
<tr><td><b>面向主题</b></td><td>围绕分析主题（如客户、销售）组织数据</td><td>≠面向事务/面向应用</td></tr>
<tr><td><b>集成</b></td><td>多源数据经抽取、清洗、转换后统一</td><td>≠简单堆积原始数据</td></tr>
<tr><td><b>相对稳定（非易失）</b></td><td>数据一旦进入仓库基本不再修改删除</td><td>≠频繁增删改</td></tr>
<tr><td><b>反映历史变化（时变）</b></td><td>包含历史数据，体现时间维度变化</td><td>≠只存当前最新数据</td></tr></table>
<ul>
<li><b>OLTP vs OLAP：</b>数据库面向事务处理（OLTP，操作当前详细数据）；数据仓库面向分析处理（OLAP，分析历史汇总数据）。</li>
<li><b>ETL：</b>抽取Extract、转换Transform、加载Load——数据进仓库的必经流程。</li>
<li><b>数据集市：</b>面向部门级的主题数据仓库，是数据仓库的子集。</li>
</ul>
<div class="pit"><b>坑点：</b>选项把"相对稳定"偷换成"频繁更新删除"、把"反映历史变化"偷换成"反映当前实时状态"，见到即错。数据仓库<b>不是</b>更大的数据库——两者面向的目标（分析vs事务）不同。</div>`},
  {t:'数据湖与数据仓库', f:'mid', s:2, m:'仓库先定义后写入，湖先存后用再定义。', b:`
<table class="kt"><tr><th>对比项</th><th>数据仓库</th><th>数据湖</th></tr>
<tr><td>数据类型</td><td>以结构化数据为主</td><td>结构化+半结构化+非结构化</td></tr>
<tr><td>模式</td><td><b>写时模式</b>（先定义结构，清洗转换后入库）</td><td><b>读时模式</b>（原始数据先入库，使用时再定结构）</td></tr>
<tr><td>数据处理</td><td>入库前清洗转换，质量高</td><td>原始数据原样保存，灵活但治理难</td></tr>
<tr><td>主要用户</td><td>业务分析、管理决策层</td><td>数据科学家、开发者（探索分析）</td></tr></table>
<div class="tip">一句话区分：数据仓库是"先整容再进家门"（写时模式），数据湖是"原样住进来，出门再打扮"（读时模式）。</div>
<div class="pit"><b>坑点：</b>"数据湖要求数据入库前先清洗建模"错——那是<b>数据仓库</b>的做法；数据湖恰恰<b>保存原始数据</b>。数据湖缺乏治理会沦为"数据沼泽"。</div>`},
  {t:'数据治理', f:'mid', s:2, m:'标准元主安质命，治理六抓手。', b:`
<p><b>数据治理</b>是对数据资产管理行使权力和控制的活动集合（规划、监督、执行），目标是提升数据价值、控制数据风险。</p>
<ul>
<li><b>元数据管理：</b>管理"描述数据的数据"——数据的来源、含义、结构、责任人。</li>
<li><b>主数据管理：</b>管理企业核心共享数据（客户、产品、供应商）的统一"黄金视图"。</li>
<li><b>数据质量管理：</b>保证数据的完整性、准确性、一致性、及时性。</li>
<li><b>数据标准管理：</b>统一数据的命名、编码、格式与业务规则。</li>
<li><b>数据安全管理：</b>分级分类、脱敏、访问权限控制。</li>
<li><b>数据生命周期管理：</b>从产生到销毁的全过程管理。</li>
</ul>
<div class="pit"><b>坑点：</b>主数据≠元数据——主数据是业务实体本身（如统一的客户信息），元数据是"关于数据的数据"（数据说明书）；"元数据就是大容量数据"是杜撰干扰项。</div>`},
  {t:'DCMM成熟度模型', f:'mid', s:2, m:'五级八域：初始受稳量优。', b:`
<p><b>DCMM（数据管理能力成熟度评估模型）</b>是我国数据管理领域国家标准（GB/T 36073-2018），含<b>8个能力域、5个成熟度等级</b>。</p>
<table class="kt"><tr><th>等级（低→高）</th><th>特征</th></tr>
<tr><td>1级 初始级</td><td>项目级运作，无序被动管理</td></tr>
<tr><td>2级 受管理级</td><td>部门级意识到数据管理，初步规范</td></tr>
<tr><td>3级 稳健级</td><td>组织级统一管理，流程显性化可复用</td></tr>
<tr><td>4级 量化管理级</td><td>用数据量化度量过程，持续监控</td></tr>
<tr><td>5级 优化级</td><td>行业标杆，持续优化与创新</td></tr></table>
<p><b>8个能力域：</b>数据战略、数据治理、数据架构、数据应用、数据安全、数据质量、数据标准、数据生存周期。</p>
<div class="tip">等级口诀：<b>初始、受管理、稳健、量化、优化</b>——第三级叫"稳健级"，与CMMI第三级"已定义级"区分开。</div>
<div class="pit"><b>坑点：</b>"DCMM第三级是已定义级"错——那是CMMI的说法；DCMM第三级是<b>稳健级</b>。两套成熟度模型都考，名称别串。</div>`},
  {t:'数据资产化三化', f:'low', s:1, m:'资源化提值、资产化换值、资本化配置。', b:`
<p>数据作为新型生产要素，其价值释放经历"三化"：</p>
<table class="kt"><tr><th>阶段</th><th>本质</th><th>关键动作</th></tr>
<tr><td><b>数据资源化</b></td><td>形成<b>使用价值</b></td><td>把无序原始数据加工为有序可用的数据资源</td></tr>
<tr><td><b>数据资产化</b></td><td>形成<b>交换价值</b>（核心）</td><td>数据通过流通交易带来经济利益，数据入表</td></tr>
<tr><td><b>数据资本化</b></td><td>实现<b>社会化配置</b></td><td>数据信贷融资、数据证券化</td></tr></table>
<ul>
<li>数据要素与土地、劳动力、资本、技术并列为五大生产要素。</li>
<li>数据资产化的实现核心是让数据<b>可确权、可计量、可交易</b>。</li>
</ul>
<div class="pit"><b>坑点：</b>"数据商品化"是杜撰干扰项；顺序永远是<b>资源化→资产化→资本化</b>，顺序颠倒即错。</div>`}
], quiz:[
  {q:'数据建模过程中，概念模型设计阶段的核心任务是（ ）', o:['确定实体、属性及实体之间的联系','设计索引与分区等存储结构','将E-R图转换为关系模式','消除冗余与传递依赖'], a:0, k:'数据建模四阶段', e:'概念模型设计用E-R图描述业务世界，核心任务是确定实体、属性及实体间联系（2025年真题考点）。E-R图转关系模式属于逻辑模型设计，索引分区属于物理模型设计，消除传递依赖是规范化（逻辑模型阶段）内容。'},
  {q:'在满足第二范式的基础上，消除非主属性对主键的传递函数依赖，这属于（ ）', o:['第一范式','第二范式','第三范式','BC范式'], a:2, k:'三范式', e:'1NF要求属性不可再分；2NF消除非主属性对码的部分函数依赖；3NF在2NF基础上消除传递函数依赖；BCNF进一步消除主属性对码的部分与传递依赖。'},
  {q:'某电商系统需要存储结构灵活多变的商品评论（类JSON文档），最适合选用的数据库是（ ）', o:['关系型数据库Oracle','图型数据库Neo4j','键值型数据库Redis','文档型数据库MongoDB'], a:3, k:'NoSQL类型', e:'MongoDB是文档型数据库，以类JSON文档存储，适合结构灵活多变的数据。Neo4j是图型数据库（社交关系挖掘），Redis是键值型数据库（缓存），Oracle是传统关系型数据库。'},
  {q:'以下不属于数据仓库基本特征的是（ ）', o:['数据频繁修改和删除','面向主题','数据集成','反映历史变化'], a:0, k:'数据仓库特征', e:'数据仓库四大特征为面向主题、集成、相对稳定（非易失，数据一旦入库基本不修改删除）、反映历史变化。"频繁修改删除"与"相对稳定"相反，是数据库OLTP的特点。'},
  {q:'关于数据湖与数据仓库的区别，下列叙述正确的是（ ）', o:['数据湖采用写时模式，入库前先定义结构','数据湖只存储结构化数据','数据湖保存原始数据，采用读时模式','数据仓库更适合数据科学探索分析'], a:2, k:'数据湖', e:'数据湖保存结构化、半结构化、非结构化的原始数据，采用读时模式（使用时再定义结构）；数据仓库采用写时模式，以结构化数据为主，面向业务分析。数据科学探索分析更适合用数据湖。'},
  {q:'DCMM数据管理能力成熟度模型中，第三级的名称是（ ）', o:['已定义级','稳健级','量化管理级','受管理级'], a:1, k:'DCMM', e:'DCMM五个等级为初始级、受管理级、稳健级、量化管理级、优化级，第三级是稳健级。"已定义级"是CMMI第三级的名称，两套模型常被拿来交叉设错。'},
  {q:'描述数据的来源、含义、结构、责任人等信息的数据称为（ ）', o:['主数据','元数据','参考数据','数据样本'], a:1, k:'元数据', e:'元数据是描述数据的数据，说明数据的来源、含义、结构、责任人等。主数据是企业核心业务实体（客户、产品等）的统一数据；参考数据是用于分类或编码的基础数据。'},
  {q:'数据通过流通交易带来经济利益、形成交换价值，这是实现数据价值的核心环节，该阶段称为（ ）', o:['数据资源化','数据资本化','数据商品化','数据资产化'], a:3, k:'数据资产化', e:'数据价值化三化为资源化（形成使用价值）、资产化（形成交换价值，实现价值的核心）、资本化（信贷融资与证券化，社会化配置）。"数据商品化"是杜撰干扰项。'}
]},
  {id:7,  title:'软硬件系统集成',     sec:'it',  page:259, cards:[
  {t:'系统集成的概念与分类', f:'high', s:3, m:'信息为目标、功能为结构、平台为基础、人员为保证。', b:`
<p><b>软硬件系统集成</b>是一种系统的思想和方法，具有工程思维——按用户需求把分散的软硬件产品、网络、数据与应用整合成一体化系统。</p>
<table class="kt"><tr><th>分类</th><th>集成内容</th></tr>
<tr><td><b>软件集成</b></td><td>操作系统、数据库、中间件、应用软件的集成</td></tr>
<tr><td><b>硬件集成</b></td><td>服务器、存储、网络设备等基础设施的集成</td></tr>
<tr><td><b>网络集成</b></td><td>传输、交换、安全、网管、服务子系统</td></tr>
<tr><td><b>数据集成</b></td><td>异构数据源的整合、共享与交换</td></tr>
<tr><td><b>业务应用集成</b></td><td>EAI：数据级、功能级（接口/API）、流程级集成</td></tr></table>
<div class="tip">四句配对口诀：信息的集成为<b>目标</b>、功能的集成为<b>结构</b>、平台的集成为<b>基础</b>、人员的集成为<b>保证</b>。</div>
<div class="pit"><b>坑点：</b>选项最爱交叉错位——"信息的集成为基础、平台的集成为目标"即错。记住目标（信息）、结构（功能）、基础（平台）、保证（人员）的固定搭配。</div>`},
  {t:'系统集成项目六大特点', f:'high', s:3, m:'成果越友好，实施运维越复杂。', b:`
<p>典型的系统集成项目具有以下特点：</p>
<ul>
<li><b>队伍与人员：</b>集成交付队伍庞大，且往往<b>连续性不是很强</b>；设计人员高度专业化，需要多元化的知识体系。</li>
<li><b>组织分布：</b>涉及众多承包商或服务组织，且普遍分散在多个地区。</li>
<li><b>研发要求：</b>通常需要研制或开发一定量的软硬件系统，尤其是<b>信创产品和信创系统的适配与系统优化</b>。</li>
<li><b>技术采用：</b>通常采用大量新技术、前沿技术，乃至颠覆性技术。</li>
<li><b>使用与运维：</b><b>集成成果使用越来越友好，集成实施和运维往往变得更加复杂</b>。</li>
</ul>
<div class="pit"><b>坑点（2025年真题）：</b>"集成成果越来越友好，集成实施和运维越来越<b>容易</b>"——错误！教材原话是变得<b>更加复杂</b>。"越来越容易"这类与教材相反的绝对化表述就是错误选项的信号。</div>
<div class="tip">记忆钩子：界面越傻瓜（用户友好），后台越复杂（技术耦合多、厂商多、接口多）。</div>`},
  {t:'中间件分类', f:'high', s:3, m:'消息异步解耦，事务保ACID，数据访问屏蔽差异。', b:`
<p><b>中间件</b>是独立的系统级软件，位于<b>操作系统与应用程序之间</b>，屏蔽底层差异、提供统一接口。三大功能：<b>通信支持、应用支持、公共服务</b>。</p>
<table class="kt"><tr><th>类型</th><th>特点与场景</th><th>代表</th></tr>
<tr><td><b>消息中间件</b></td><td>异步消息传递、应用解耦</td><td>Kafka、RabbitMQ</td></tr>
<tr><td><b>事务（交易）中间件</b></td><td>分布式事务管理、高并发联机交易</td><td>Tuxedo</td></tr>
<tr><td><b>数据访问中间件</b></td><td>屏蔽异构数据库差异，统一访问</td><td>ODBC</td></tr>
<tr><td><b>远程过程调用中间件</b></td><td>像调用本地过程一样调用远程</td><td>RPC</td></tr>
<tr><td><b>对象中间件</b></td><td>分布式对象调用</td><td>CORBA/ORB</td></tr>
<tr><td><b>Web应用服务器</b></td><td>Web应用运行容器</td><td>Tomcat、WebLogic</td></tr></table>
<div class="tip">场景题眼："异步解耦/削峰填谷"→消息中间件；"银行联机交易/分布式事务"→事务中间件；"统一访问多种数据库"→数据访问中间件。</div>
<div class="pit"><b>坑点：</b>"中间件提供网络支持"是错的——网络支持是<b>操作系统</b>层面的功能，中间件三大功能只有<b>通信支持、应用支持、公共服务</b>。</div>`},
  {t:'网络集成与设备选型', f:'mid', s:2, m:'传输公路交换站，安全网管服务端。', b:`
<p><b>网络集成体系框架五大子系统：</b></p>
<ul>
<li><b>传输子系统</b>：网络信息的"公路"和"血管"，介质含无线（无线电波、微波、红外线）与有线（双绞线、同轴电缆、光纤）。</li>
<li><b>交换子系统</b>：局域网交换、城域网交换、广域网交换（电路交换、报文交换、分组交换、混合交换）。</li>
<li><b>安全子系统</b>：防火墙、数据加密、访问控制。</li>
<li><b>网管子系统</b>：保证网络良好运行，找出并解决网络"瓶颈"。</li>
<li><b>服务子系统</b>：网络应用最核心的问题。</li>
</ul>
<p><b>网络设备选型</b>要点：核心层设备重性能与冗余（高端交换机/路由器），汇聚层重策略（三层交换机），接入层重端口密度与性价比；还需考虑可靠性、可扩展性、可管理性、安全性、售后服务与厂商实力。</p>
<div class="pit"><b>坑点：</b>"接入层负责高速数据转发"错——高速骨干转发是<b>核心层</b>职责，接入层管终端接入与端口密度；选型"只选最贵最新"违背性价比与适用原则。</div>`},
  {t:'综合布线六大子系统', f:'high', s:3, m:'工水干管设建：工作区、水平、干线、管理、设备间、建筑群。', b:`
<figure class="kd-fig">
<div class="dg dg-2">
  <div class="dg-box"><b>工作区子系统</b><span>信息插座到终端设备之间的连接</span></div>
  <div class="dg-box"><b>水平（配线）子系统</b><span>楼层配线架到工作区信息插座</span></div>
  <div class="dg-box"><b>垂直干线子系统</b><span>设备间主配线架到各楼层配线架的干线</span></div>
  <div class="dg-box"><b>管理子系统</b><span>楼层配线间，跳线与标识管理</span></div>
  <div class="dg-box"><b>设备间子系统</b><span>核心机房，进出线设备与主配线架</span></div>
  <div class="dg-box"><b>建筑群子系统</b><span>连接两栋及以上建筑物之间的布线</span></div>
</div>
<figcaption>综合布线六大子系统——口诀：工水干管设建</figcaption>
</figure>
<ul>
<li>传输介质：双绞线（水平子系统最常用，一般不超过90米）、光纤（干线与建筑群主干）、同轴电缆。</li>
</ul>
<div class="pit"><b>坑点：</b>范围题最爱在<b>水平</b>与<b>垂直干线</b>之间互换——"楼层配线架到信息插座"是水平子系统；"设备间到楼层配线架"是垂直干线；"楼与楼之间"是建筑群子系统。</div>`},
  {t:'机房工程', f:'mid', s:2, m:'A容错B冗余C基本；气体灭火、联合接地。', b:`
<p>机房按可靠性由高到低分为三级：<b>A级（容错型，最高）</b>、<b>B级（冗余型）</b>、<b>C级（基本型）</b>。机房建设是综合性专业技术系统工程，涉及装修、供配电、空调、消防、接地防雷等多个专业。</p>
<ul>
<li><b>供配电：</b>UPS不间断电源保障供电连续，A级还需双路市电加柴油发电机备份。</li>
<li><b>空调：</b>精密空调控温控湿，典型要求温度18~27℃、相对湿度40%~60%，并保持温湿度变化率平稳。</li>
<li><b>消防：</b>采用<b>气体灭火系统</b>（如七氟丙烷、IG541），禁止水喷淋直接喷洒设备。</li>
<li><b>接地防雷：</b>采用联合接地系统时，接地电阻一般要求<b>不大于1Ω</b>；配备防静电地板、等电位联结。</li>
<li><b>承重与布局：</b>机柜间距、冷热通道分离，机房地面承重满足设备要求。</li>
</ul>
<div class="pit"><b>坑点：</b>"机房采用自动水喷淋灭火"错——机房用<b>气体灭火</b>；"C级要求最高"反了——<b>A级最高（容错）</b>；联合接地电阻1Ω常被改成4Ω迷惑。</div>`},
  {t:'数据中心集成与PUE', f:'low', s:1, m:'机柜服务器存储网络安全五集成；PUE越接近1越绿色。', b:`
<p><b>数据中心集成</b>通常包括五类设备集成：</p>
<ul>
<li><b>机柜集成</b>：机柜布局、冷热通道、承重。</li>
<li><b>服务器集成</b>：考虑CPU、内存、总线、磁盘容量/性能/容错、接口等。</li>
<li><b>存储集成</b>：考虑RAID控制结构、IOPS读写性能等。</li>
<li><b>网络设备集成</b>：交换机、路由器、负载均衡。</li>
<li><b>安全设备集成</b>：防火墙、入侵检测/防御等。</li>
</ul>
<p><b>PUE（电能使用效率）</b>=数据中心总能耗 ÷ IT设备能耗，越接近<b>1</b>能效越高，是绿色数据中心的核心指标。PUE=1是理论极限（全部电能都给IT设备），数值越大说明制冷、照明等辅助耗电越多。</p>
<div class="tip">弱电工程一般指交流220V、50Hz以下的用电系统，含电话通信、计算机网络、视频监控、消防报警、出入口控制、楼宇自控等。</div>`},
  {t:'应用集成与EAI', f:'mid', s:2, m:'EAI三要求：互操作、可移植、透明。', b:`
<p><b>业务应用集成（EAI）</b>把不同应用系统连接起来协同工作，其技术要求是<b>互操作性、可移植性、透明性</b>。</p>
<table class="kt"><tr><th>集成层次</th><th>方式</th><th>特点</th></tr>
<tr><td><b>数据级集成</b></td><td>数据库之间直接共享/同步数据</td><td>最底层，耦合松但实时性差</td></tr>
<tr><td><b>API/功能级集成</b></td><td>通过接口调用对方功能（REST、Web Service）</td><td>主流方式，松耦合</td></tr>
<tr><td><b>界面级集成</b></td><td>整合多个系统的展示界面（门户）</td><td>用户统一入口</td></tr>
<tr><td><b>流程级集成</b></td><td>跨系统业务流程编排（BPM/ESB）</td><td>最高层次，端到端流程</td></tr></table>
<div class="tip">ESB（企业服务总线）是SOA架构下实现应用集成的常用基础设施，提供消息路由、协议转换、服务编排等能力。</div>
<div class="pit"><b>坑点：</b>EAI三个技术要求是<b>互操作性、可移植性、透明性</b>——选项偷换成"可靠性、高效性、安全性"即错，这是固定搭配题。</div>`},
  {t:'信创与国产化适配', f:'low', s:1, m:'信创：自主可控为根基，成熟匹配按场景。', b:`
<p><b>信创（信息技术应用创新）</b>是数据安全、网络安全的基础，是我国强化网络安全与信息安全的重要手段。信创集成相对于传统系统集成，需重点关注三点：</p>
<ul>
<li><b>成熟度匹配：</b>信创技术与产品创新多、成熟度不同，需把握好选型，做好与应用场景的匹配融合。</li>
<li><b>迭代周期：</b>信创技术产品迭代快，需基于场景化需求程度合理使用。</li>
<li><b>自主可控：</b>具有较强的自主可控能力，可充分调动厂商进行场景化创新。</li>
</ul>
<div class="pit"><b>坑点：</b>"信创集成与传统集成完全相同"错——信创集成要额外投入<b>产品适配与系统优化</b>精力；"信创产品成熟度完全一致"也错——恰恰存在成熟度差异，需要场景匹配。</div>`}
], quiz:[
  {q:'软硬件系统集成是一种系统的思想和方法，其中（ ）是系统集成的目标。', o:['信息的集成','功能的集成','平台的集成','人员的集成'], a:0, k:'系统集成概念', e:'教材表述：以信息的集成为目标，功能的集成为结构，平台的集成为基础，人员的集成为保证。目标、结构、基础、保证四个定位与四个集成对象的配对是固定考点，选项常交叉错位。'},
  {q:'关于系统集成项目特点的描述中，不正确的是（ ）', o:['设计人员高度专业化，且需要多元化的知识体系','涉及众多承包商或服务组织，且普遍分散在多个地区','通常采用大量新技术、前沿技术，乃至颠覆性技术','集成成果使用越来越友好，集成实施和运维也越来越容易'], a:3, k:'集成项目特点', e:'教材原话是"集成成果使用越来越友好，集成实施和运维往往变得更加复杂"，选项D把"复杂"偷换成"容易"，与教材相反（2025年真题考点）。其余三项均为教材原文表述。'},
  {q:'分布式系统中，需要将订单消息异步投递给多个下游系统并实现应用解耦，应选用的中间件是（ ）', o:['事务中间件','消息中间件','数据访问中间件','Web应用服务器'], a:1, k:'中间件分类', e:'消息中间件提供异步消息传递机制，实现生产者与消费者解耦，是电商订单异步处理的首选。事务中间件管分布式事务（如银行联机交易），数据访问中间件屏蔽异构数据库差异，Web应用服务器是应用运行容器。'},
  {q:'中间件位于操作系统和应用程序之间，其主要功能不包括（ ）', o:['通信支持','应用支持','公共服务','网络协议路由'], a:3, k:'中间件功能', e:'中间件三大功能是通信支持、应用支持、公共服务。网络协议路由与转发是网络设备/操作系统层面的职责，不属于中间件功能——这是经典反向选择题。'},
  {q:'综合布线系统中，负责连接楼层配线架与工作区信息插座的是（ ）', o:['垂直干线子系统','水平子系统','建筑群子系统','设备间子系统'], a:1, k:'综合布线', e:'水平（配线）子系统连接楼层配线架与工作区信息插座；垂直干线子系统连接设备间与各楼层配线架；建筑群子系统连接建筑物与建筑物；设备间子系统位于核心机房。水平与干线的范围最易互换。'},
  {q:'某产业园区需要将两栋办公楼的综合布线系统连接起来，应采用的是（ ）', o:['工作区子系统','管理子系统','建筑群子系统','设备间子系统'], a:2, k:'综合布线', e:'建筑群子系统实现两栋及以上建筑物之间的布线连接，通常采用光纤作主干。管理子系统是楼层配线间的跳线管理，设备间子系统是核心机房的进出线与主配线架。'},
  {q:'关于数据中心机房工程的叙述中，不正确的是（ ）', o:['机房分为A、B、C三级，A级容错型要求最高','机房消防应采用气体灭火系统','机房可采用自动水喷淋系统直接灭火','机房采用联合接地时接地电阻一般不大于1欧姆'], a:2, k:'机房工程', e:'机房消防采用气体灭火（如七氟丙烷），水喷淋会损坏电子设备，禁止直接用于机房灭火。A级容错型最高、联合接地电阻不大于1欧姆均为正确表述。'},
  {q:'业务应用集成（EAI）的技术要求包括互操作性、可移植性和（ ）', o:['高可靠性','高可用性','高安全性','透明性'], a:3, k:'EAI技术要求', e:'EAI三个技术要求是互操作性、可移植性、透明性，固定搭配。可靠性、可用性、安全性虽是系统常见属性，但不是EAI技术要求的组成部分，属于典型干扰项。'}
]},
  {id:8,  title:'信息安全工程',       sec:'it',  page:279, cards:[
  {t:'信息安全五属性', f:'high', s:3, m:'保完可，控抵赖；前三CIA是核心。', b:`
<p>信息安全的基本属性包括五个，前三项合称<b>CIA三要素</b>，是最核心、最常考的：</p>
<table class="kt"><tr><th>属性</th><th>含义</th><th>典型威胁/手段</th></tr>
<tr><td><b>保密性</b></td><td>信息不被非授权访问、泄露</td><td>窃听；用加密、访问控制防护</td></tr>
<tr><td><b>完整性</b></td><td>信息不被非授权篡改、保持一致</td><td>篡改；用哈希校验、数字签名防护</td></tr>
<tr><td><b>可用性</b></td><td>授权者能及时可靠地访问信息与服务</td><td>拒绝服务DoS；用冗余、备份防护</td></tr>
<tr><td><b>可控性</b></td><td>对信息的传播及内容具有控制能力</td><td>失控传播；用审计、监管防护</td></tr>
<tr><td><b>不可抵赖性</b></td><td>行为人不能否认自己的操作</td><td>抵赖；用数字签名防护</td></tr></table>
<div class="pit"><b>坑点：</b>攻击类型与属性的对应最爱考——<b>窃听破坏保密性、篡改破坏完整性、DoS破坏可用性、抵赖对应不可抵赖性</b>。"防抵赖靠加密"错——防抵赖靠<b>数字签名</b>。</div>`},
  {t:'主动攻击与被动攻击', f:'mid', s:2, m:'被动偷听不改数据，主动篡改假冒重放。', b:`
<table class="kt"><tr><th>类型</th><th>常见手段</th><th>特点</th></tr>
<tr><td><b>被动攻击</b></td><td>窃听（截获）、流量分析、口令嗅探</td><td>只获取信息<b>不修改</b>数据，难以察觉，目标是保密性</td></tr>
<tr><td><b>主动攻击</b></td><td>篡改、伪装/假冒、重放、拒绝服务DoS、拒绝</td><td>篡改或破坏数据流/正常服务，可被检测</td></tr></table>
<ul>
<li><b>重放攻击</b>：把截获的合法报文原样再发一遍以骗取信任，防重放用<b>随机数（挑战-响应）、时间戳、序列号</b>。</li>
<li><b>拒绝服务DoS</b>：让合法用户无法获得服务，破坏的是<b>可用性</b>。</li>
</ul>
<div class="pit"><b>坑点：</b>"流量分析是主动攻击"错——流量分析只观察流量规律不改动数据，是<b>被动</b>攻击；"重放攻击是被动攻击"也错——重放会改变系统状态，属于<b>主动</b>攻击。这两个互换是高频陷阱。</div>`},
  {t:'对称加密体制', f:'high', s:3, m:'一钥加密解密快，分发管理是难题。', b:`
<p><b>对称加密</b>：加密与解密<b>使用同一把密钥</b>（或可互相推导）。优点是算法公开、计算量小、<b>加解密速度快</b>，适合加密大量数据；缺点是<b>密钥分发与管理困难</b>、多用户时密钥数量爆炸、无法实现数字签名。</p>
<table class="kt"><tr><th>算法</th><th>密钥/分组长度</th><th>备注</th></tr>
<tr><td><b>DES</b></td><td>有效密钥56位、分组64位</td><td>最经典的分组密码，现已不够安全</td></tr>
<tr><td><b>3DES</b></td><td>三重DES</td><td>对DES的加强版</td></tr>
<tr><td><b>AES</b></td><td>密钥128/192/256位、分组128位</td><td>取代DES的国际标准</td></tr>
<tr><td><b>IDEA</b></td><td>密钥128位</td><td>用于PGP等</td></tr>
<tr><td><b>SM4</b></td><td>分组与密钥均128位</td><td><b>国密对称</b>分组密码</td></tr>
<tr><td><b>SM1</b></td><td>算法不公开</td><td>国密对称算法，以硬件芯片形式提供</td></tr></table>
<p>另有<b>序列密码（流密码）</b>如祖冲之算法ZUC，逐位加密，用于移动通信。</p>
<div class="pit"><b>坑点：</b>SM1、SM4是<b>对称</b>算法，别与SM2（非对称）混淆；"对称加密能实现数字签名"错——签名依赖公私钥体系（非对称）；DES密钥是<b>56位</b>有效（常被改成64位迷惑，64位是分组长度）。</div>`},
  {t:'非对称加密体制', f:'high', s:3, m:'公钥加密私钥解密保密；私钥签名公钥验证。', b:`
<p><b>非对称加密</b>：密钥成对出现——<b>公钥公开、私钥保密</b>。公钥加密的数据只有私钥能解（用于<b>保密</b>）；私钥签名的数据人人可用公钥验证（用于<b>签名</b>）。缺点是加解密<b>速度慢</b>，适合密钥交换与签名，不适合加密大量数据。</p>
<table class="kt"><tr><th>算法</th><th>数学基础</th><th>备注</th></tr>
<tr><td><b>RSA</b></td><td>大整数分解难题</td><td>最常用，既能加密又能签名</td></tr>
<tr><td><b>ECC</b></td><td>椭圆曲线离散对数难题</td><td>同等安全下密钥更短、更快</td></tr>
<tr><td><b>SM2</b></td><td>椭圆曲线</td><td><b>国密非对称</b>算法</td></tr>
<tr><td><b>SM9</b></td><td>标识密码</td><td>用身份标识（如邮箱）直接作公钥</td></tr>
<tr><td><b>ElGamal/DSA</b></td><td>离散对数难题</td><td>DSA常用于签名</td></tr></table>
<div class="tip">对比记忆：对称=一把钥匙+快+难分发；非对称=两把钥匙+慢+可签名可分发。实际系统常混合使用：非对称传密钥，对称传数据。</div>
<div class="pit"><b>坑点：</b>"私钥加密、公钥解密用于保密"错——公钥人人可得，任何人都能解开，那只用于<b>签名</b>；保密必须"公钥加密、私钥解密"。"SM2基于大整数分解"错——SM2基于<b>椭圆曲线</b>，RSA才基于大整数分解。</div>`},
  {t:'哈希算法与数字信封', f:'high', s:3, m:'定长单向抗碰撞；信封=对称加密数据+公钥加密密钥。', b:`
<p><b>哈希（散列/摘要）算法</b>：任意长度输入→<b>固定长度</b>输出，单向不可逆、抗碰撞、对输入敏感（改一个比特摘要大变）。它<b>不是加密算法</b>，无法还原原文。用途：完整性校验、口令存储、生成数字签名摘要。</p>
<table class="kt"><tr><th>算法</th><th>摘要长度</th><th>备注</th></tr>
<tr><td><b>MD5</b></td><td>128位</td><td>已被碰撞攻击攻破，不再安全</td></tr>
<tr><td><b>SHA-1</b></td><td>160位</td><td>理论上已被破解</td></tr>
<tr><td><b>SHA-256</b></td><td>256位</td><td>SHA-2系列，广泛使用</td></tr>
<tr><td><b>SM3</b></td><td>256位</td><td><b>国密杂凑</b>算法</td></tr></table>
<p><b>数字信封</b>：用对称密钥加密大批量数据（取其快），再用接收方<b>公钥</b>加密这把对称密钥（解决分发难题）——两者结合兼顾效率与安全。</p>
<div class="pit"><b>坑点：</b>"MD5是加密算法"错——哈希是<b>摘要</b>，单向不可逆；"SM3用于数据加密"错——SM3只产生摘要；数字信封里加密对称密钥用的是<b>接收方的公钥</b>，不是发送方的。</div>`},
  {t:'数字签名', f:'high', s:3, m:'发方私钥签，收方公钥验；保完保真保抵赖，不保保密。', b:`
<figure class="kd-fig">
<div class="dg">
  <div class="dg-row">
    <div class="dg-box"><b>发送方签名</b><span>对明文做哈希得摘要，用<b>自己的私钥</b>加密摘要，得到签名</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>传输</b><span>明文+签名一起发送</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>接收方验证</b><span>用发送方<b>公钥</b>解出摘要，再对明文做哈希，两者比对</span></div>
  </div>
</div>
<figcaption>数字签名流程：私钥签名、公钥验证</figcaption>
</figure>
<ul>
<li><b>保证：</b>完整性（摘要比对发现篡改）、身份认证（私钥只有持有人）、不可抵赖性（签名无法否认）。</li>
<li><b>不保证保密性</b>——明文仍是明文发送；需要保密时叠加数字信封或加密。</li>
</ul>
<div class="pit"><b>坑点：</b>签名用<b>发送方</b>的密钥对，保密加密用<b>接收方</b>的公钥——"用自己的公钥签名""用对方的私钥加密"都是典型错误选项。"数字签名同时保证保密性"也是高频错项。</div>`},
  {t:'数字证书与PKI', f:'high', s:3, m:'证书绑身份与公钥；CA签发、RA受理、CRL吊销。', b:`
<p><b>数字证书</b>由CA签发，把<b>主体身份与其公钥</b>绑定在一起，遵循X.509标准。主要内容：版本、序列号、签名算法、颁发者、有效期、主体（持有者）信息、<b>主体公钥</b>、CA的数字签名。</p>
<ul>
<li><b>PKI（公钥基础设施）</b>主要组成：<b>CA认证中心</b>（证书的签发与管理，核心）、<b>RA注册机构</b>（受理申请、审核身份）、证书库（目录服务）、密钥管理与备份恢复、<b>证书撤销列表CRL</b>（发布已作废证书）、应用接口API。</li>
<li>证书生命周期：申请→审核→签发→使用/更新→撤销（吊销）。</li>
</ul>
<div class="tip">分工口诀：<b>RA受理、CA签发</b>。RA不能签发证书，CA不直接面对海量申请者。</div>
<div class="pit"><b>坑点：</b>"证书中包含私钥"错——证书只含<b>公钥</b>和CA签名，私钥由持有者自己保管；"RA负责签发证书"错——签发是<b>CA</b>的职责；"证书过期作废不用管"错——吊销证书要通过<b>CRL</b>发布。</div>`},
  {t:'身份认证技术', f:'mid', s:2, m:'所知所有所是；两类组合是双因素。', b:`
<p>身份认证依据三类因素：</p>
<table class="kt"><tr><th>因素</th><th>含义</th><th>例子</th></tr>
<tr><td><b>所知（知道什么）</b></td><td>知识型凭证</td><td>口令、PIN码、密保问题</td></tr>
<tr><td><b>所有（拥有什么）</b></td><td>持有型凭证</td><td>USB Key、智能卡、动态令牌</td></tr>
<tr><td><b>所是（是什么）</b></td><td>生物特征</td><td>指纹、虹膜、人脸、声纹</td></tr></table>
<ul>
<li><b>双因素认证：</b>两个<b>不同类别</b>的因素组合，如USB Key（所有）+PIN码（所知）。</li>
<li><b>挑战-响应认证：</b>服务器发随机数（挑战），客户端用口令摘要计算应答，口令不在网上明文传输，可<b>防重放</b>。</li>
<li><b>Kerberos：</b>基于<b>对称加密</b>的第三方认证协议（KDC分发票据）；基于<b>PKI/数字证书</b>的认证则用非对称体系。</li>
</ul>
<div class="pit"><b>坑点：</b>"口令+密保问题"是两个<b>所知</b>，不算严格双因素——双因素必须是<b>不同类别</b>的组合；"Kerberos基于非对称加密"错——它基于<b>对称加密</b>与可信第三方。</div>`},
  {t:'等保2.0分级与定级', f:'high', s:3, m:'公民一二、社会二三四、国家三四五。', b:`
<p><b>网络安全等级保护2.0</b>核心标准是《信息安全技术 网络安全等级保护基本要求》（GB/T 22239-2019），定级由<b>受侵害客体</b>与<b>侵害程度</b>两要素决定。</p>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-row">
    <div class="dg-box"><b>公民法人合法权益</b><span>一般损害→一级 · 严重/特别严重→二级</span></div>
    <div class="dg-box"><b>社会秩序、公共利益</b><span>一般→二级 · 严重→三级 · 特别严重→四级</span></div>
    <div class="dg-box"><b>国家安全</b><span>一般→三级 · 严重→四级 · 特别严重→五级</span></div>
  </div>
</div>
<figcaption>定级矩阵：受侵害客体 × 侵害程度 → 五个等级</figcaption>
</figure>
<table class="kt"><tr><th>等级</th><th>名称</th><th>监管强度</th></tr>
<tr><td>第一级</td><td><b>自主保护级</b></td><td>运营者自主保护</td></tr>
<tr><td>第二级</td><td><b>指导保护级</b></td><td>公安机关指导</td></tr>
<tr><td>第三级</td><td><b>监督保护级</b></td><td>公安机关监督（最常见）</td></tr>
<tr><td>第四级</td><td><b>强制保护级</b></td><td>公安机关强制监管</td></tr>
<tr><td>第五级</td><td><b>专控保护级</b></td><td>指定专门部门专控</td></tr></table>
<div class="pit"><b>坑点：</b>"社会秩序+严重损害"=<b>第三级</b>（高频真题）；"国家安全+一般损害"=<b>第三级</b>；只侵害公民合法权益的再严重也<b>到不了三级</b>（上限二级）。等级名称别用等保1.0的"系统审计保护级"等旧名。</div>`},
  {t:'等保2.0框架与流程', f:'mid', s:2, m:'定备建测监五动作；一个中心三重防护。', b:`
<ul>
<li><b>五大规定动作：</b><b>定级 → 备案 → 建设整改 → 等级测评 → 监督检查</b>，顺序固定不能乱。</li>
<li><b>一个中心、三重防护：</b><b>安全管理中心</b>（一个中心）；<b>安全通信网络、安全区域边界、安全计算环境</b>（三重防护）。</li>
<li><b>安全要求结构：</b>安全<b>通用</b>要求 + 安全<b>扩展</b>要求。扩展要求覆盖四类场景：<b>云计算、移动互联、物联网、工业控制系统</b>。</li>
<li><b>技术要求五类：</b>安全物理环境、安全通信网络、安全区域边界、安全计算环境、安全管理中心；<b>管理要求五类：</b>安全管理制度、安全管理机构、安全管理人员、安全建设管理、安全运维管理。</li>
<li><b>测评周期：</b>第三级系统<b>每年至少一次</b>、第四级系统<b>每半年至少一次</b>等级测评。</li>
</ul>
<div class="pit"><b>坑点：</b>"定级→测评→备案→建设"顺序错乱是高频错项；"扩展要求包含区块链扩展要求"错——扩展要求目前为云计算、移动互联、物联网、工控<b>四类</b>；三重防护中"安全物理环境"属于技术要求但不属于三重防护。</div>`},
  {t:'防火墙与IDS、IPS', f:'mid', s:2, m:'防火墙守边界；IDS旁路报警，IPS串联阻断。', b:`
<table class="kt"><tr><th>技术</th><th>部署方式</th><th>作用</th><th>局限/特点</th></tr>
<tr><td><b>防火墙</b></td><td>网络边界（串联）</td><td>按规则过滤流量，隔离内外网</td><td>难防内部攻击与绕过它的连接</td></tr>
<tr><td><b>IDS入侵检测</b></td><td><b>旁路</b>（镜像端口）</td><td>监测并<b>报警</b>，不阻断</td><td>特征检测发现已知攻击（漏报多）；异常检测发现未知攻击（误报多）</td></tr>
<tr><td><b>IPS入侵防御</b></td><td><b>串联在线</b></td><td>发现攻击<b>主动阻断</b></td><td>实时处置；自身故障可能影响链路</td></tr></table>
<ul>
<li><b>防火墙类型：</b>包过滤（网络层，检查IP/端口）、应用代理（应用层，内外网隔离）、状态检测（跟踪连接状态）。</li>
<li><b>安全审计：</b>对系统活动进行记录、检查与审查，功能包括审计自动响应、数据生成、分析、浏览、事件选择、事件存储。</li>
</ul>
<div class="pit"><b>坑点：</b>"IDS能主动切断攻击连接"错——主动阻断是<b>IPS</b>的职责，IDS只检测报警；"防火墙能防内部攻击/所有攻击"错；"异常检测误报率低"错——异常检测能发现未知攻击但<b>误报率高</b>，特征检测则漏报多。</div>`}
], quiz:[
  {q:'攻击者向某在线服务发起海量请求使其无法为正常用户提供服务，这种攻击主要破坏信息安全的（ ）', o:['保密性','完整性','可用性','不可抵赖性'], a:2, k:'安全属性', e:'拒绝服务攻击（DoS）使合法用户无法及时获得服务，破坏的是可用性。窃听破坏保密性，篡改破坏完整性，抵赖对应不可抵赖性。攻击类型与属性的对应是高频考点。'},
  {q:'以下属于被动攻击的是（ ）', o:['流量分析','篡改报文内容','假冒他人身份','重放截获的报文'], a:0, k:'攻击类型', e:'流量分析只观察通信流量规律、不修改数据，属于被动攻击。篡改、假冒、重放都会改变数据流或系统状态，属于主动攻击。"流量分析是主动攻击"与"重放是被动攻击"是最常见的互换陷阱。'},
  {q:'下列全部属于对称加密算法的一组是（ ）', o:['RSA、ECC、SM2','DES、3DES、AES、SM4','MD5、SHA-1、SM3','RSA、DES、SM4'], a:1, k:'对称加密', e:'DES、3DES、AES、IDEA、SM4、SM1均为对称加密算法。RSA、ECC、SM2是非对称算法；MD5、SHA-1、SM3是哈希（摘要）算法。D组混合了非对称RSA与对称算法，是典型干扰项。'},
  {q:'在国密算法系列中，用于产生消息摘要（杂凑）的算法是（ ）', o:['SM1','SM2','SM3','SM4'], a:2, k:'国密算法', e:'国密算法归类：SM1与SM4是对称加密，SM2是非对称加密（椭圆曲线），SM3是密码杂凑（哈希）算法，SM9是标识密码。国密算法与体制的配对是选择题高频题型。'},
  {q:'关于密码算法与其体制、用途的对应关系，正确的是（ ）', o:['SM4是非对称算法，主要用于数字签名','SM3是对称算法，主要用于数据加密','ECC基于大整数分解难题','RSA基于公私钥体系，可实现加密与数字签名'], a:3, k:'算法配对', e:'RSA基于大整数分解难题，采用公私钥体系，既能加密又能签名，D正确。SM4是对称算法；SM3是哈希算法不用于加密；ECC基于椭圆曲线离散对数难题而非大整数分解。算法-体制-用途三联配对是高频题型。'},
  {q:'数字签名过程中，发送方使用（ ）对消息摘要进行签名', o:['自己的公钥','自己的私钥','接收方的公钥','接收方的私钥'], a:1, k:'数字签名', e:'签名用发送方自己的私钥加密摘要，接收方用发送方公钥验证，保证完整性、身份认证与不可抵赖性。用自己的公钥签名或用接收方密钥签名都是典型错误，签名永远用发送方的私钥。'},
  {q:'在PKI体系中，负责受理证书申请并审核申请者身份的机构是（ ）', o:['认证中心CA','注册机构RA','证书撤销列表CRL','密钥管理中心'], a:1, k:'PKI组成', e:'RA注册机构负责受理申请与审核申请者身份，CA负责证书的签发与管理。分工口诀"RA受理、CA签发"。CRL用于发布已作废证书，密钥管理中心负责密钥的生成备份恢复。'},
  {q:'某信息系统受到破坏后会对社会秩序和公共利益造成严重损害，但不损害国家安全，其安全保护等级应定为（ ）', o:['第二级','第三级','第四级','第五级'], a:1, k:'等保定级', e:'定级矩阵：社会秩序/公共利益+一般损害=二级、+严重损害=三级、+特别严重损害=四级。本题"严重损害"对应第三级（监督保护级），这也是实践中最常见的等级。'},
  {q:'网络安全等级保护2.0强调"一个中心、三重防护"，其中三重防护是指（ ）', o:['安全物理环境、安全通信网络、安全区域边界','安全管理中心、安全计算环境、安全物理环境','安全通信网络、安全区域边界、安全计算环境','防火墙、入侵检测、入侵防御'], a:2, k:'等保2.0', e:'一个中心是安全管理中心，三重防护是安全通信网络、安全区域边界、安全计算环境。安全物理环境属于技术要求五类之一但不属于三重防护；D组是具体安全设备不是防护体系表述。'},
  {q:'关于入侵检测系统IDS与入侵防御系统IPS的区别，正确的是（ ）', o:['IDS串联部署可主动阻断攻击','IPS旁路部署只检测报警','两者部署方式与功能完全相同','IDS旁路检测报警，IPS串联在线主动阻断'], a:3, k:'IDS与IPS', e:'IDS旁路（镜像端口）部署，只监测报警不阻断；IPS串联在线部署，发现攻击可主动阻断。A、B恰好把两者的部署方式说反，C则完全抹杀区别，均为典型干扰项。'}
]},
  {id:9,  title:'项目管理概论',       sec:'pm',  page:303, cards:[
    {t:'项目是什么——一句话定义', f:'high', s:3, m:'临时 + 独特 = 项目；项目会散场，成果留得长。', b:`
<p><b>官方定义：</b>项目是为创造<b>独特的产品、服务或成果</b>而进行的<b>临时性</b>工作。</p>
<p>把定义拆成三个关键词来理解：</p>
<ul>
<li><b>独特</b>：做出来的东西是独一无二的。哪怕两个项目很相似，因为时间、地点、干系人不同，它们依然是两个不同的项目。</li>
<li><b>临时</b>：有明确的起点和终点，干完就"散场"。注意：临时 ≠ 工期短，有的项目要干好几年，但它依然是临时性工作。</li>
<li><b>成果</b>：可以是一件<b>产品</b>（一套信息系统）、一项<b>服务</b>（运维外包服务），也可以是一个<b>成果</b>（一份研究报告）。</li>
</ul>
<div class="pit"><b>新手坑：</b>"临时"说的是项目<b>工作</b>是临时的，不是成果临时的。"开发一套 OA 系统"是项目（临时），但系统建成后要长期运行使用（成果长久）。</div>
<div class="tip"><b>秒判技巧：</b>判断"是不是项目"就看两点——<b>有明确的起止时间吗（临时）？做出来的东西独一无二吗（独特）？</b>两个都满足才是项目。</div>`},
    {t:'项目的三大特性', f:'high', s:3, m:'一独渐：临时、独特、渐进明细。', b:`
<ul>
<li><b>临时性（一次性）</b>：有明确起点终点，团队随项目组建、随结束解散。</li>
<li><b>独特性</b>：可交付成果独一无二，没有完全相同的两个项目。</li>
<li><b>渐进明细</b>：随着信息逐渐增加，计划和文档<b>逐步细化</b>。项目早期"看不清"是正常现象，不是失职。</li>
</ul>
<table class="kt"><tr><th>特性</th><th>一句话理解</th><th>考试坑点</th></tr>
<tr><td>临时性</td><td>有头有尾，干完散场</td><td>临时 ≠ 时间短；成果可以是长期的</td></tr>
<tr><td>独特性</td><td>成果独一无二</td><td>常与"重复性运营"对比出题</td></tr>
<tr><td>渐进明细</td><td>计划随进展逐步细化</td><td>≠ 范围蔓延（未经批准擅自加需求）</td></tr></table>`},
    {t:'项目 vs 运营——一张表分清', f:'high', s:3, m:'项目干一次，运营天天见。', b:`
<table class="kt"><tr><th>维度</th><th>项目</th><th>运营</th></tr>
<tr><td>持续时间</td><td>临时性，有终点</td><td>持续进行，周而复始</td></tr>
<tr><td>工作性质</td><td>独特、创新</td><td>重复、标准化</td></tr>
<tr><td>目标</td><td>实现特定目标后结束</td><td>维持业务正常运转</td></tr>
<tr><td>组织形式</td><td>临时组建的团队</td><td>固定的职能部门</td></tr>
<tr><td>结果</td><td>渐进明细，逐步清晰</td><td>结果可预测、可复制</td></tr></table>
<p>举例对照：</p>
<ul>
<li><b>是项目：</b>开发一套管理系统 / 一次系统大版本升级改造 / 承办一届运动会。</li>
<li><b>是运营：</b>每天的日常运维巡检 / 流水线装配 / 每月例行财务报表。</li>
</ul>
<div class="pit"><b>易混点：</b>同样是"运维"，日常巡检处理是<b>运营</b>；"对系统进行一次升级改造工程"是<b>项目</b>。看它是"重复进行"还是"一次性完成"。</div>`},
    {t:'什么是项目管理', f:'mid', s:2, m:'范围、进度、成本三支柱，质量压舱心不慌。', b:`
<p><b>定义：</b>在项目活动中综合运用<b>知识、技能、工具与技术</b>，使项目在<b>有限资源</b>约束下实现甚至超过设定的需求和期望。</p>
<p><b>核心矛盾：</b>资源有限（人、钱、时间），期望无限。项目管理本质上是一门<b>平衡的艺术</b>。</p>
<p><b>三重约束（铁三角）：</b>范围（S）、时间（T）、成本（C）构成三角形的三条边，任何一边变化都会牵动其他两边，<b>质量</b>居于中心随权衡而波动。</p>
<figure class="kd-fig">
<svg class="tri" viewBox="0 0 400 264" role="img" aria-label="项目三重约束铁三角示意图">
  <polygon points="200,34 74,212 326,212" fill="rgba(139,92,246,.08)" stroke="#8b5cf6" stroke-width="1.6" stroke-opacity=".65"/>
  <circle cx="200" cy="34" r="5" fill="#a78bfa"/>
  <circle cx="74" cy="212" r="5" fill="#67e8f9"/>
  <circle cx="326" cy="212" r="5" fill="#fbbf24"/>
  <text x="200" y="20" text-anchor="middle" fill="#cfc8ff" font-size="15" font-weight="600">时间 T</text>

<div class="tip">考试常见表述："项目经理的职责就是在范围、进度、成本之间进行权衡，同时保证质量"——理解这句话就能秒杀相关选择题。</div>`},
    {t:'PMBOK 发展史：第6版 vs 第7版', f:'high', s:3, m:'6版"5+10+49"，7版"12原则+8绩效域"。', b:`
<ul>
<li>PMBOK 是美国项目管理协会（<b>PMI</b>）发布的《项目管理知识体系指南》，是全球项目管理的权威标准。</li>
<li><b>第6版（2017）</b>：5 大过程组 + 10 大知识领域 + 49 个过程——典型的<b>过程导向</b>思维。</li>
<li><b>第7版（2021）</b>：12 项项目管理原则 + 8 大绩效域——转向<b>原则导向 + 价值交付</b>。</li>
</ul>
<div class="tip">中项第3版教材按第7版理念编写：第10–14章按<b>五大过程组</b>展开，同时保留了第6版的经典过程知识。两套框架的数字都要记牢，选择题最爱考数字对应关系。</div>`},
    {t:'项目成功的标准', f:'mid', s:2, m:'铁三角只是及格线，干系人点头才算赢。', b:`
<p>新手最容易以为"按期、按预算、达范围、合质量 = 成功"，考试中这种说法<b>太绝对</b>。</p>
<p>项目成功的标准是<b>多维的</b>，通常包括：</p>
<ul>
<li>达成商业目标和预期收益；</li>
<li>干系人的认可与满意度；</li>
<li>成果被实际使用并产生价值；</li>
<li>团队成员的成长等。</li>
</ul>
<p>两个要点：① 成功标准<b>因项目而异</b>，没有统一模板；② 应<b>尽早与干系人达成共识</b>，并在项目过程中持续复审。</p>`},
    {t:'项目 / 项目集 / 项目组合——三层结构', f:'high', s:3, m:'组合对战略，项目集求协同，项目干具体。', b:`
<ul>
<li><b>项目</b>：创造独特成果的一次性工作——战术执行层。</li>
<li><b>项目集</b>：一组<b>相互关联</b>的项目（含子项目集和活动），通过<b>协调管理</b>获得单独管理时无法获得的效益，追求 <b>1+1&gt;2</b> 的协同效应。例：智慧城市项目集下的交通、政务、医疗等子项目。</li>
<li><b>项目组合</b>：项目、项目集、子组合和<b>运营</b>工作的集合，为实现<b>战略目标</b>服务。组合内的项目之间<b>可以毫不相关</b>，组合层面对项目有取舍（做 / 不做 / 缓做）。</li>
</ul>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-box" style="border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.05)">
    <b style="color:#fde68a">项目组合</b><span>对齐战略目标 · 内部项目可互不相关 · 有取舍（做 / 不做 / 缓做）</span>
  </div>
  <div class="dg-varrow">▼ 包含</div>
  <div class="dg-box" style="border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.07)">
    <b style="color:#cfc8ff">项目集</b><span>相互关联的项目 · 协调管理 · 追求 1+1＞2 的协同效益</span>
  </div>
  <div class="dg-varrow">▼ 包含</div>
  <div class="dg-box" style="border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.05)">
    <b style="color:#a5e8f5">项目</b><span>临时性工作 · 创造独特成果</span>
  </div>
</div>
<figcaption>自上而下：战略取舍 → 协同管理 → 一次性执行</figcaption>
</figure>
<div class="pit"><b>区分题眼：</b>看到"相互关联、协调管理、协同效益"→ 选<b>项目集</b>；看到"战略目标、战略价值"→ 选<b>项目组合</b>。</div>`},
    {t:'事业环境因素（EEF）', f:'high', s:3, m:'控制不了的都是环境。', b:`
<p><b>定义：</b>项目团队<b>通常无法控制</b>、但会影响项目各种效果的条件，存在于组织内部和外部。</p>
<p><b>内部 EEF（常见）：</b></p>
<ul>
<li>组织文化、组织结构、治理框架；</li>
<li>设施与物理资源、现有软硬件系统（如 ERP）；</li>
<li>人事管理制度（如员工休假政策）。</li>
</ul>
<p><b>外部 EEF（常见）：</b></p>
<ul>
<li>法律法规、行业标准与监管；</li>
<li>市场条件、经济环境；</li>
<li>商业数据库、学术研究与技术趋势；物理环境（气候、地理）。</li>
</ul>
<div class="tip">EEF 不全是约束，也是可以利用的<b>输入</b>——比如商业数据库可以辅助估算，技术趋势可以指导方案选型。</div>`},
    {t:'组织过程资产（OPA）', f:'high', s:3, m:'家底能用又能改，用完记得还回去。', b:`
<p><b>定义：</b>执行组织使用的<b>政策、流程、模板、程序和知识库</b>，项目团队可以<b>主动使用、更新和贡献</b>。</p>
<ul>
<li><b>流程资产</b>：标准流程、政策、模板、指南、变更控制程序等。</li>
<li><b>数据与知识资产</b>：历史项目档案、经验教训库、度量数据、估算数据库等。</li>
</ul>
<p>OPA 是组织多年积累的"家底"，越用越厚——项目结束后，经验教训要<b>归档回馈</b>给 OPA，供后来的项目复用。</p>`},
    {t:'EEF vs OPA 一秒判别法', f:'high', s:3, m:'改不了的是环境，改得了的是家底。', b:`
<p>拿到题目先问三个问题：</p>
<ul>
<li>团队<b>改得动</b>吗？改不动 → EEF；改得动 → OPA。</li>
<li>来自<b>外部</b>（政府、市场、行业）？→ 基本都是 EEF。</li>
<li>是<b>内部积累</b>的模板 / 流程 / 历史资料？→ OPA。</li>
</ul>
<figure class="kd-fig">
<div class="dg dg-2">
  <div class="dg-box" style="text-align:left;border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.04)">
    <b style="color:#fda4af">EEF · 事业环境因素</b>
    <span style="display:block;margin:2px 0 8px">改不动 · 只能去适应和利用</span>
    <span style="display:block;line-height:1.9">· 政府法规、行业标准<br>· 市场与经济环境<br>· 组织文化、结构、人事制度</span>
  </div>
  <div class="dg-box" style="text-align:left;border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.04)">
    <b style="color:#6ee7b7">OPA · 组织过程资产</b>
    <span style="display:block;margin:2px 0 8px">用得了 · 还能更新和回馈</span>
    <span style="display:block;line-height:1.9">· 模板、流程、变更控制程序<br>· 历史项目档案<br>· 经验教训库、估算数据</span>
  </div>
</div>
<figcaption>一句口诀：改不了的是"环境"，改得了的是"家底"</figcaption>
</figure>
<table class="kt"><tr><th>条目</th><th>归属</th></tr>
<tr><td>政府法规、行业标准、市场条件</td><td>EEF（外部）</td></tr>
<tr><td>组织文化、组织结构、人事制度</td><td>EEF（内部）</td></tr>
<tr><td>模板、流程、指南、变更控制程序</td><td>OPA</td></tr>
<tr><td>历史项目档案、经验教训库</td><td>OPA</td></tr></table>`},
    {t:'组织结构类型与项目经理权力', f:'high', s:3, m:'权力看"型"号：职能最小，项目最大；矩阵居中分弱平强。', b:`
<table class="kt"><tr><th>组织类型</th><th>项目经理角色</th><th>PM 权力</th></tr>
<tr><td>职能型</td><td>兼职协调员，几乎无权</td><td>极小</td></tr>
<tr><td>弱矩阵</td><td>兼职联络员 / 协调员</td><td>小</td></tr>
<tr><td>平衡矩阵</td><td>与职能经理权力相当</td><td>中</td></tr>
<tr><td>强矩阵</td><td>全职项目经理</td><td>较大</td></tr>
<tr><td>项目型</td><td>全职项目经理，直接掌控资源</td><td>最大</td></tr></table>
<figure class="kd-fig">
<div class="dg">

<p>记忆主线：从职能型到项目型，<b>项目经理的权力一路变大</b>；矩阵型资源利用率高，但存在"双重汇报"的管理复杂性。另有复合型（多种结构混合）。</p>`},
    {t:'PMO 的三种类型', f:'mid', s:2, m:'支持给服务，控制定规矩，指令直接管。', b:`
<p>PMO（项目管理办公室）按<b>控制程度</b>从低到高分三类：</p>
<ul>
<li><b>支持型</b>：扮演顾问角色，提供模板、培训、经验教训，控制度<b>最低</b>。</li>
<li><b>控制型</b>：定规矩——要求使用统一流程、模板、合规框架，控制度<b>中等</b>。</li>
<li><b>指令型</b>：直接管理和指挥项目，控制度<b>最高</b>。</li>
</ul>
<figure class="kd-fig">

  <div class="dg-box" style="border-color:rgba(139,92,246,.5);background:rgba(139,92,246,.08)">

  </div>
  <div class="dg-box" style="border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.05)">
    <b style="color:#fde68a">指令型</b><span>直接管理项目</span><i class="dg-lv">控制度 █</i>
  </div>
</div>
<figcaption>PMO 控制程度：支持型 ＜ 控制型 ＜ 指令型</figcaption>
</figure>`},
    {t:'项目经理的角色与能力', f:'mid', s:2, m:'项目经理是"整合者"和"沟通者"，不是"超级员工"。', b:`
<p>项目经理是项目成功的<b>第一责任人</b>：通过领导团队、沟通协调、整合资源，在约束条件下达成项目目标。</p>
<ul>
<li>对<b>上</b>：向发起人和管理层负责，管理期望、争取资源。</li>
<li>对<b>内</b>：领导项目团队、营造协作环境，而不是事必躬亲。</li>
<li>对<b>外</b>：与干系人持续沟通，维护关系。</li>
</ul>
<p><b>PMI 人才三角：</b>技术项目管理能力、领导力、战略与商业管理能力——三者兼备才是新时代的项目经理。</p>`},
    {t:'项目生命周期与阶段关口', f:'high', s:3, m:'投入像山峰，风险先高后低，变更代价先低后高。', b:`
<ul>
<li><b>生命周期</b>：项目从启动到结束所经历的一系列阶段。</li>
<li><b>阶段</b>：一组逻辑相关的项目活动，以一个或多个可交付成果的完成为标志。</li>
<li><b>阶段关口</b>：阶段结束时的<b>正式审查决策点</b>——决定项目继续、调整还是提前终止。</li>
</ul>
<div class="pit"><b>阶段关口 ≠ 里程碑：</b>里程碑只是时间轴上的<b>事件标记</b>；关口是正式的<b>决策审查</b>，可能决定项目生死。</div>
<p><b>三条经典曲线（高频考点）：</b></p>
<ul>
<li>成本与人力投入：开始低 → 执行期达到峰值 → 收尾降低，呈"山峰"形。</li>
<li>风险与不确定性：开始<b>最高</b>，随进展逐渐降低。</li>
<li>变更的代价：开始<b>最低</b>，随进展逐渐升高（后期改动代价巨大）。</li>
</ul>
