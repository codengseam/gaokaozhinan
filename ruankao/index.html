  {id:14, title:'收尾过程组',         sec:'pm',  page:537, cards:[
  {t:'结束项目或阶段——收尾全流程', f:'high', s:3, m:'验收移交报经验，归档放人更新资产。', b:`
<p><b>定位：</b>收尾过程组只有<b>1个过程——结束项目或阶段</b>，作用是正式结束项目、阶段或合同义务。五大过程组过程数"2-24-10-12-1"的最后那个"1"。</p>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-row">
    <div class="dg-box"><b>① 成果验收</b><span>对照验收标准正式验收可交付成果</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>② 移交</b><span>产品、文档、培训移交客户/运营方</span></div>
  </div>
  <div class="dg-row" style="margin-top:8px">
    <div class="dg-box"><b>③ 总结</b><span>经验教训整理 · 编制最终报告</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>④ 归档</b><span>项目文件更新进组织过程资产</span></div>
  </div>
  <div class="dg-row" style="margin-top:8px">
    <div class="dg-box" style="border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)"><b style="color:#cfc8ff">⑤ 释放资源</b><span>遣散团队 · 归还设备 · 关闭合同</span></div>
  </div>
</div>
<figcaption>收尾五件事：验收→移交→总结→归档→释放资源（口诀"验收移交报经验，归档放人更新资产"）</figcaption>
</figure>
<div class="pit"><b>坑点：</b>① 项目<b>提前终止</b>（如市场变化、资金断供）同样必须走收尾流程——记录终止原因、验收已完成的可交付成果、总结归档；② 收尾不是"散伙走人"，<b>经验教训总结和归档</b>是必做项；③ 新大纲已删除"结束采购"过程，合同收尾融入收尾活动与控制采购的采购关闭。</div>`},
  {t:'合同收尾 vs 行政收尾', f:'high', s:3, m:'合同逐个关，行政最后收。', b:`
<p>收尾工作按对象分两条线，对比记忆（经典考点）：</p>
<table class="kt"><tr><th>维度</th><th>合同收尾</th><th>行政收尾</th></tr>
<tr><td><b>对象</b></td><td>每个<b>合同</b>（逐个关闭）</td><td><b>项目或阶段</b></td></tr>
<tr><td><b>核心内容</b></td><td><b>产品核实</b>（是否满足合同要求）+ 合同结算、解决未尽事项（索赔）、关闭合同</td><td>成果验收、经验教训总结、最终报告、文档归档、释放资源</td></tr>
<tr><td><b>执行者</b></td><td>买方与卖方<b>双方</b>（合同/采购管理员为主）</td><td>项目团队（<b>项目经理主导</b>）</td></tr>
<tr><td><b>时点</b></td><td>合同履行完毕或提前终止时</td><td>每个阶段末和项目结束时</td></tr></table>
<p><b>时序关系：</b>通常<b>先完成各合同收尾，再进行项目行政收尾</b>——合同没关完，项目关不了。</p>
<div class="pit"><b>坑点：</b>① "行政收尾由客户负责执行"——错！行政收尾由<b>项目经理主导</b>，客户参与验收确认；② 合同提前终止也需合同收尾，按合同中的<b>终止条款</b>处理并形成文档；③ 行政收尾<b>不可省略</b>——即使失败或中途取消的项目也要总结归档。</div>
<div class="tip"><b>案例话术：</b>判断收尾问题时按"验收了没有、移交了没有、合同全关了没有、经验教训总结了没有、档案归了没有、人放了没有"六问逐项排查。</div>`},
  {t:'可交付成果验收', f:'high', s:3, m:'对照验收标准，客户签字确认。', b:`
<p><b>验收依据：</b>项目范围说明书中的<b>验收标准</b>、需求文件（需求跟踪矩阵）和合同条款——不是"客户口头说满意"。</p>
<p><b>验收动作：</b></p>
<ul>
<li>客户或发起人<b>正式确认</b>可交付成果（形成书面验收文件/验收报告并签字）；</li>
<li>验收通过：交付成果转入移交环节；验收不通过：记录缺陷，走<b>缺陷补救</b>变更流程整改后重新验收；</li>
<li><b>确认范围</b>过程贯穿项目各阶段（阶段成果逐批验收），收尾时做<b>最终整体验收</b>。</li>
</ul>
<div class="pit"><b>坑点：</b>① 最终验收<b>必须有书面验收文件</b>，口头/邮件随口认可在案例题中视为不合规；② 验收标准在<b>规划阶段</b>的范围说明书/需求文件中就已明确，收尾只是照单执行——"收尾时才和客户商量验收标准"是典型设错点。</div>
<div class="tip"><b>案例话术：</b>客户拒签验收 → 依据需求跟踪矩阵逐条对照验收标准，组织正式验收评审，形成书面结论；有争议的条目按合同争议条款处理，缺陷项限期整改后复验。</div>`},
  {t:'最终报告与经验教训', f:'high', s:3, m:'报告说清目标达成，教训归档变资产。', b:`
<p><b>最终报告</b>（结束项目或阶段的输出，2025年案例真题考过）典型内容：</p>
<ul>
<li>项目或阶段的概述；</li>
<li><b>范围、进度、成本、质量</b>目标的实现程度（各基准的偏差情况）；</li>
<li>最终产品/服务/成果的确认与验收情况；</li>
<li>未能实现的目标及其原因；</li>
<li>风险与问题的最终状态、经验教训总结。</li>
</ul>
<p><b>经验教训总结：</b>经验教训登记册在项目期间持续更新，收尾时经审查整理，<b>归档进入组织过程资产</b>——这是项目留给组织最值钱的"遗产"，供未来项目估算、决策复用。</p>
<div class="pit"><b>坑点：</b>① "经验教训登记册归档后属于项目文件"——错，归档后转化为<b>组织过程资产</b>；② 经验教训要覆盖<b>做得好与做得差</b>两面（最佳实践+失败教训），只写成绩不算完整总结。</div>`},
  {t:'项目后评价', f:'mid', s:2, m:'目标过程效益持续，四维评价回头看。', b:`
<p><b>定义：</b>项目建成并投入运营一段时间后，由立项单位或第三方对项目的<b>目的、执行过程、效益、作用和影响</b>进行的系统、客观的分析总结。</p>
<table class="kt"><tr><th>评价维度</th><th>回答的问题</th></tr>
<tr><td><b>目标评价</b></td><td>立项时定的目标实现了没有？偏离了多少？</td></tr>
<tr><td><b>过程评价</b></td><td>立项、实施、管理过程是否规范有效？</td></tr>
<tr><td><b>效益评价</b></td><td>财务与经济效益是否达到预期（投资回收等）？</td></tr>
<tr><td><b>持续性评价</b></td><td>项目成果能否长期持续发挥效益？</td></tr></table>
<div class="pit"><b>坑点：</b>① 后评价发生在<b>收尾之后、运营一段时间后</b>，不是收尾阶段内部的动作；② 后评价常用<b>前后对比、有无对比</b>等方法；③ "项目后评价就是验收测试"——错，验收在收尾前，后评价看<b>长期效果</b>，两者时点与目的都不同。</div>`},
  {t:'成果移交与文档归档', f:'mid', s:2, m:'移产品移文档，培训跟上；档案全移交，资源全释放。', b:`
<p><b>成果移交：</b>把最终产品、服务或成果正式移交给客户/接收方（如运营部门），移交不只是"给东西"，通常包括：</p>
<ul>
<li><b>产品/系统</b>本体及其<b>文档</b>（操作手册、维护手册、设计文档）；</li>
<li><b>培训</b>与知识转移（教会对方用和运维）；</li>
<li>必要的<b>运维过渡支持</b>安排。</li>
</ul>
<p><b>文档归档：</b>按组织规定将全部项目文件（计划、基准、变更记录、验收文件、经验教训）完整移交档案管理部门，更新组织过程资产（历史信息库、经验教训库、模板流程），供后续项目复用。</p>
<p><b>释放资源：</b>遣散团队成员（做好绩效反馈与感谢）、归还设备与场地、解除租赁与账号权限。</p>
<div class="pit"><b>坑点：</b>"开发完成就等于移交完成"——错！没有<b>正式移交手续与文档交接</b>，项目不算结束；团队成员应<b>有序释放</b>（绩效评价、去向安排），而不是一哄而散。</div>`},
  {t:'本章易错易混速查表', f:'mid', s:2, m:'一组一对比：合同关在前，行政收在后。', b:`
<table class="kt"><tr><th>易混点</th><th>辨析关键</th></tr>
<tr><td>收尾过程数</td><td>仅1个：结束项目或阶段（"结束采购"已删除）</td></tr>
<tr><td>合同收尾 vs 行政收尾</td><td>合同收尾逐个关合同（产品核实+结算索赔）；行政收尾关项目（验收+总结+归档）；先合同后行政</td></tr>
<tr><td>行政收尾执行者</td><td>项目经理主导，不是客户主导</td></tr>
<tr><td>验收依据</td><td>范围说明书验收标准+需求文件+合同条款，书面验收文件为准</td></tr>
<tr><td>最终报告</td><td>概述+四目标实现程度+验收情况+未达目标原因+经验教训</td></tr>
<tr><td>经验教训去向</td><td>项目期间是项目文件，归档后成为组织过程资产</td></tr>
<tr><td>项目后评价</td><td>收尾后运营一段时间进行：目标/过程/效益/持续性四维评价</td></tr>
<tr><td>提前终止</td><td>同样要走收尾：记录原因、验收已完成成果、总结归档</td></tr></table>
<div class="tip"><b>考情：</b>本章分值不高（约2~4分）但极易得分，常作为整合类案例的子问题出现（最终报告、经验教训、行政收尾程序），务必把"合同 vs 行政收尾"对比表背熟。</div>`}
  ], quiz:[
    {q:'收尾过程组共包含（ ）个过程', o:['1','2','3','5'], a:0, k:'收尾过程组概述', e:'收尾过程组仅包含"结束项目或阶段"1个过程。新大纲已删除旧版的"结束采购"过程，合同收尾相关活动融入控制采购的采购关闭与收尾工作。五大过程组过程数口诀：2-24-10-12-1。'},
    {q:'关于合同收尾与行政收尾，下列说法不正确的是（ ）', o:['合同收尾针对单个合同，需核实产品是否满足合同要求并处理未尽事项','行政收尾只能由客户负责执行，项目经理不得参与','项目存在多个合同时，通常先逐一完成合同收尾，再进行行政收尾','行政收尾包括经验教训总结、最终报告编制和项目档案归档'], a:1, k:'合同收尾vs行政收尾', e:'行政收尾由项目经理主导、项目团队执行，客户与发起人参与验收确认，并非客户负责。合同收尾逐个关闭合同（产品核实、结算、索赔处理），通常先于行政收尾完成。'},
    {q:'某项目因市场环境重大变化被发起人宣布提前终止，正确的做法是（ ）', o:['直接解散团队，不再开展任何收尾活动','把已完成的工作成果封存即可，无需移交和归档','由项目经理自行决定是否需要总结经验教训','仍应开展收尾工作：记录终止原因，验收已完成的可交付成果，总结经验教训并归档，释放资源'], a:3, k:'提前终止的收尾', e:'项目无论正常结束还是提前终止，都必须走收尾流程：记录终止原因与决定文件、对已完成的可交付成果进行验收和移交、总结经验教训归档、释放剩余资源。一散了之是典型案例设错点。'},
    {q:'下列各项中，不属于项目最终报告典型内容的是（ ）', o:['项目或阶段的概述以及范围、进度、成本、质量目标的实现程度','最终产品或服务的确认与验收情况','团队成员的绩效排名与内部薪酬明细','未能实现的目标及其原因、经验教训总结'], a:2, k:'最终报告内容', e:'最终报告面向项目干系人概述项目成果与目标实现程度、偏差分析、验收情况、经验教训等。团队成员绩效排名与薪酬明细属人力资源管理内部信息，不属于最终报告内容。（2025年案例真题考点）'},
    {q:'项目结束时，经验教训登记册经整理归档后的去向是（ ）', o:['作为项目团队成员的私人资料各自留存','提交给客户作为产品验收的凭证','更新到组织过程资产，供未来项目参考使用','随项目结束直接销毁'], a:2, k:'经验教训总结', e:'经验教训登记册在项目期间是项目文件，收尾时经整理审查后归档，转化为组织过程资产（经验教训知识库），供未来项目的估算、决策和培训复用。这是项目留给组织最重要的遗产之一。'},
    {q:'关于项目后评价，下列说法正确的是（ ）', o:['项目后评价由项目经理在收尾阶段自行完成并出具结论','项目后评价就是可交付成果的验收测试','项目后评价的结果只能对项目团队内部公开','项目后评价通常在项目完成并投入运营一段时间后进行，内容包括目标评价、过程评价、效益评价和持续性评价等'], a:3, k:'项目后评价', e:'后评价在收尾之后、成果运营一段时间后，由立项单位或第三方对项目的目标、过程、效益、持续性进行系统客观的评价，常用前后对比、有无对比等方法，成果用于反馈决策。验收测试是收尾前的工作，两者不同。'}
  ]},
  {id:15, title:'组织保障',           sec:'aux', page:546, cards:[
  {t:'组织结构三类型总览', f:'high', s:3, m:'职能稳、项目专、矩阵两头沾。', b:`
<p><b>一句话本质：</b>公司怎么摆人，决定了项目经理手里有多大权。教材把组织结构分为<b>职能型、项目型、矩阵型</b>三大类，矩阵型再细分为弱、平衡、强三种。</p>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-row">
    <div class="dg-box" style="border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.05)"><b style="color:#a5e8f5">职能型</b><span>按专业设部门 · 项目在部门内干 · 项目经理是兼职的"协调员"，权力很小</span></div>
    <div class="dg-box" style="border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.05)"><b style="color:#6ee7b7">项目型</b><span>按项目设组织 · 成员全职干项目 · 项目经理权力很大 · 项目结束团队解散</span></div>
    <div class="dg-box" style="border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)"><b style="color:#cfc8ff">矩阵型</b><span>职能线+项目线双头汇报 · 又分弱矩阵 / 平衡矩阵 / 强矩阵</span></div>
  </div>
</div>
<figcaption>组织结构三类型——考试常给一段"汇报关系"描述让你归类</figcaption>
</figure>
<table class="kt"><tr><th>维度</th><th>职能型</th><th>项目型</th><th>矩阵型</th></tr>
<tr><td>项目经理权力</td><td>很小或没有</td><td>很大</td><td>弱矩阵小 → 强矩阵大</td></tr>
<tr><td>团队成员</td><td>兼职做项目</td><td>全职做项目</td><td>部分全职</td></tr>
<tr><td>项目结束后</td><td>回原部门</td><td>团队解散，人员需重新安置</td><td>回职能部门</td></tr>
<tr><td>突出优缺点</td><td>专业深耕但横向协调难</td><td>目标聚焦但资源重复浪费</td><td>资源共享但双头汇报易冲突</td></tr></table>
<div class="pit"><b>坑点：</b>题干说"项目经理只是协调员、成员仍听职能经理的"→这是<b>弱矩阵</b>而不是职能型；职能型的标志是<b>没有全职项目经理</b>。"项目结束人员无家可归"是<b>项目型</b>独有的缺点。</div>`},
  {t:'矩阵三兄弟：弱/平衡/强', f:'mid', s:2, m:'弱是联络员，平衡五五开，强里PM大。', b:`
<p><b>判断题眼：</b>看项目经理的头衔和权力——<b>协调员/联络员=弱矩阵；与职能经理平起平坐=平衡矩阵；项目经理说了算=强矩阵</b>。</p>
<table class="kt"><tr><th>特征</th><th>弱矩阵</th><th>平衡矩阵</th><th>强矩阵</th></tr>
<tr><td>项目经理角色</td><td>协调员 / 联络员</td><td>正式任命的经理</td><td>权力很大的经理</td></tr>
<tr><td>项目经理权力</td><td>低</td><td>中（与职能经理均衡）</td><td>中高</td></tr>
<tr><td>预算控制者</td><td>职能经理</td><td>职能经理与项目经理共同</td><td>项目经理</td></tr>
<tr><td>全职项目经理</td><td>无（兼职）</td><td>有，但行政人员兼职</td><td>有，且有全职行政人员</td></tr></table>
<div class="pit"><b>坑点：</b>①"平衡矩阵由项目经理全权管预算"错——是<b>共同管理</b>；②"强矩阵中职能经理权力更大"错——矩阵越强，项目经理权力越大；③"<b>全职行政人员</b>"只在强矩阵出现，是判断强矩阵的题眼。</div>
<div class="tip">记忆：矩阵像拔河——弱矩阵职能赢，强矩阵项目赢，平衡矩阵僵持不下。</div>`},
  {t:'PMO三类型：支持控制指令', f:'high', s:3, m:'支持当顾问，控制要合规，指令直接管。', b:`
<p><b>PMO（项目管理办公室）</b>是组织中集中协调管理项目的常设部门。按<b>控制程度</b>从低到高分为三种：</p>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-row">
    <div class="dg-box" style="border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.05)"><b style="color:#6ee7b7">支持型</b><span>控制程度低 · 顾问角色 · 提供模板、最佳实践、培训、其他项目的经验教训</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box" style="border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.05)"><b style="color:#fde68a">控制型</b><span>控制程度中 · 不仅支持，还要求服从（规定模板/流程/工具，合规检查）</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box" style="border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.05)"><b style="color:#fda4af">指令型</b><span>控制程度高 · 直接管理和控制项目 · 可直接委派项目经理</span></div>
  </div>
</div>
<figcaption>PMO三类型：从"顾问"到"司令"，控制程度递增</figcaption>
</figure>
<div class="pit"><b>坑点：</b>①"支持型PMO有权审批项目计划"错——支持型只当顾问，无强制力；②"指令型PMO取代项目经理"不准确——指令型<b>直接管理项目并可委派项目经理</b>；③本考点与第9章PMO内容同源，常给特征描述反向判断类型。</div>`},
  {t:'组织文化及其对项目的影响', f:'low', s:1, m:'文化是土壤，项目是庄稼。', b:`
<p><b>组织文化</b>是组织在长期实践中形成、为全体成员普遍认可并遵循的<b>价值观、行为规范和思维方式</b>的总和，相当于组织的"性格"。</p>
<ul>
<li><b>构成：</b>价值观（核心层）、规章制度与行为规范（制度层）、组织形象与仪式（表层）。</li>
<li><b>对项目的影响：</b>直接影响沟通风格、风险偏好、对变更的接受度和团队合作氛围。开放、信任、鼓励创新的文化能降低项目管理难度；等级森严、排斥变革的文化会抬高协调成本。</li>
<li><b>对项目经理的启示：</b>先读懂文化再推动工作，"顺势而为"比"硬碰硬"有效。</li>
</ul>
<div class="pit"><b>坑点：</b>选择题问"组织文化包括什么"时，<b>不属于</b>组织文化的干扰项常是"薪酬结构""办公场所"这类硬件安排——组织文化是共识层面的"软件"，不是物理条件。</div>`},
  {t:'配置管理与配置项', f:'high', s:3, m:'给成果上户口：状态草正修。', b:`
<p><b>配置管理（CM）</b>：通过技术或行政手段，对配置项及其变更进行系统性监督和控制的活动，目标是<b>记录并报告配置项的状态，验证其完整性和正确性</b>。说人话：给项目所有"成果物"上户口、管版本、防乱改。</p>
<p><b>配置项（CI）</b>：纳入配置管理的工作产品，包括交付给客户的产品（需求规格说明书、设计文档、源代码、可执行程序、测试报告、用户手册）和内部工作产品（项目计划、数据、会议纪要）等。</p>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-row">
    <div class="dg-box"><b>草稿</b><span>版本 0.YZ · 编制中，可自由修改</span></div>
    <div class="dg-harrow">→评审通过→</div>
    <div class="dg-box"><b>正式</b><span>版本 X.Y · 冻结成基线，改动须走变更</span></div>
    <div class="dg-harrow">→批准变更→</div>
    <div class="dg-box"><b>修改</b><span>版本 X.YZ · 修改完成后回到正式的新版本</span></div>
  </div>
</div>
<figcaption>配置项三种状态与版本号规则（案例考过版本号找错）</figcaption>
</figure>
<div class="pit"><b>坑点：</b>①不是所有文件都是配置项，只有<b>纳入配置管理</b>的才是；②"正式状态就不能再改"错——可以改，但必须<b>先走变更控制流程</b>；③版本号口诀：草稿零打头（0.YZ），正式取整点（X.Y），修改加尾巴（X.YZ）。</div>`},
  {t:'基线：正式变更的分界线', f:'mid', s:2, m:'评审过了成基线，再改必走CCB。', b:`
<p><b>基线</b>：一组经过<b>正式评审和批准</b>的规格说明或工作产品，作为后续开发的<b>起点</b>，只能通过<b>正式的变更控制程序</b>修改。基线是一张"快照"——冻结的不是"不能改"，而是"不能<b>悄悄</b>改"。</p>
<table class="kt"><tr><th>三种基线</th><th>形成时点</th><th>标志性文件</th></tr>
<tr><td>功能基线</td><td>系统分析与软件定义阶段结束</td><td>经正式评审批准的系统规格说明（分配给软件的系统需求）</td></tr>
<tr><td>分配基线</td><td>软件需求分析阶段结束</td><td>经正式评审批准的软件需求规格说明书（SRS）</td></tr>
<tr><td>产品基线</td><td>集成与系统测试阶段结束</td><td>交付软件产品的全部配置项的规格说明</td></tr></table>
<ul>
<li>基线存放于<b>受控库</b>；基线变更必须经<b>CCB批准</b>。</li>
<li>建立基线的好处：版本可控、责任可溯、强制变更受控。</li>
</ul>
<div class="pit"><b>坑点：</b>"基线一旦确定就不可变更"是经典错误说法——基线<b>可以</b>变更，只是必须走正式变更控制程序；把基线存放在开发库或产品库也是错的。</div>`},
  {t:'配置库三类型（案例超高频）', f:'high', s:3, m:'开发随手写，受控要审批，产品锁柜里。', b:`
<p>配置库分三类，按"成熟度"从左到右安置，<b>2023-2025年案例反复考</b>：</p>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-row">
    <div class="dg-box" style="border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.05)"><b style="color:#a5e8f5">开发库（动态库）</b><span>开发人员的个人工作区 · 存开发过程中的半成品 · 频繁修改 · 控制宽松</span></div>
    <div class="dg-harrow">→评审通过→</div>
    <div class="dg-box" style="border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.05)"><b style="color:#fde68a">受控库（主库）</b><span>存放阶段结束的成熟产物与<b>基线</b> · 检入检出控制 · 修改须经变更流程批准</span></div>
    <div class="dg-harrow">→测试通过→</div>
    <div class="dg-box" style="border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.05)"><b style="color:#fda4af">产品库（静态库）</b><span>存放最终发布版本 · 等待交付或已交付 · 控制最严格，一般只读</span></div>
  </div>
</div>
<figcaption>开发库→受控库→产品库：越往右越"金贵"，权限越紧</figcaption>
</figure>
<ul>
<li><b>建库方法两种：</b>按<b>配置项类型</b>建库，适用于通用软件的开发组织；按<b>任务</b>建库，适用于专业软件的开发组织（2024年真题考过）。</li>
<li><b>权限原则：</b>开发库归开发人员自由读写；受控库的变更由配置管理员按批准结果执行；产品库通常由配置管理员/发布管理人员管理，其他人只读。</li>
</ul>
<div class="pit"><b>坑点：</b>①案例找错标配："<b>基线放在开发库</b>""程序员直接改受控库里的基线"——都错；②三库别名别混：开发库又叫动态库、受控库又叫主库、产品库又叫静态库；③"受控库只能看不能改"不准确——能改，但必须<b>检入检出+变更审批</b>。</div>`},
  {t:'配置管理六活动（默写高频）', f:'high', s:3, m:'计标控、报审发——六步一个不能少。', b:`
<p>案例题考过"列出配置管理的主要活动"，背熟六步及顺序：</p>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-row">
    <div class="dg-box"><b>①制订配置管理计划</b><span>定流程、定角色、定工具，一切的前提</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>②配置标识</b><span>识别配置项、编号命名、确定基线计划</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>③配置控制</b><span>版本控制+变更控制，基线管理核心</span></div>
  </div>
  <div class="dg-row">
    <div class="dg-box"><b>④配置状态报告</b><span>记录并报告配置项的状态变化</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>⑤配置审计</b><span>功能配置审计+物理配置审计</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>⑥发布管理和交付</b><span>正式发布、交付客户、归档备份</span></div>
  </div>
</div>
<figcaption>口诀：计（计划）标（标识）控（控制）、报（报告）审（审计）发（发布）</figcaption>
</figure>
<div class="pit"><b>坑点：</b>①六活动里<b>没有</b>"需求管理""质量管理"——干扰项常混入；②"配置审核"不规范，正式名称是<b>配置审计</b>；③顺序坑：先有计划才能标识，先标识才能控制，<b>审计在发布之前</b>（保证交付的东西是对的）。</div>`},
  {t:'配置审计与配置管理员', f:'mid', s:2, m:'功能查达标，物理查齐套；CCB决策，CMO执行。', b:`
<p><b>配置审计</b>验证配置管理的有效性，分两种：</p>
<table class="kt"><tr><th>类型</th><th>审什么</th><th>一句话</th></tr>
<tr><td>功能配置审计（FCA）</td><td>配置项的实际功能是否与需求规格一致（结合测试结果核验）</td><td>查"<b>好不好用</b>"——一致性</td></tr>
<tr><td>物理配置审计（PCA）</td><td>配置项的物理组成是否齐全、文档与实物是否对应（清单、版本、介质）</td><td>查"<b>全不全</b>"——完整性</td></tr></table>
<p><b>配置管理员（CMO）职责：</b>编制配置管理计划；建立和维护配置库并分配权限；识别配置项、建立基线；执行变更控制（落实CCB的决定）；编制配置状态报告；组织配置审计；执行发布、交付与备份归档。</p>
<div class="pit"><b>坑点：</b>①配置管理员<b>不是</b>变更决策者——<b>CCB决策、CMO执行</b>，案例爱考角色分工；②"功能审计查文档、物理审计查功能"正好说反——<b>功能对功能，物理对文档</b>；③审计的目的是验证完整性和正确性，不是"找开发人员谈话"。</div>`},
  {t:'CCB与变更流程', f:'high', s:3, m:'申请-评估-审批-实施-验证-记录，CCB只批不做。', b:`
<p><b>CCB（变更控制委员会）</b>是项目主要干系人代表组成的<b>正式决策机构</b>，负责审议变更申请并作出<b>批准或否决</b>的决定。成员通常包括项目经理、建设单位（用户）代表、质量保证人员、配置管理员、技术专家等；<b>可以是几个人甚至一个人，也可全部兼职</b>，视项目规模而定。</p>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-row">
    <div class="dg-box"><b>变更申请</b><span>书面提出，说明内容与理由</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>变更评估</b><span>评价影响范围、成本、进度与风险</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box" style="border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.05)"><b style="color:#fda4af">CCB审批</b><span>批准或否决（基准变更必须经CCB）</span></div>
  </div>
  <div class="dg-row">
    <div class="dg-box"><b>变更实施</b><span>项目经理组织团队执行更新</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>变更验证</b><span>验证实施结果，确认达到预期</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>记录归档</b><span>更新基线与文档，通知干系人</span></div>
  </div>
</div>
<figcaption>变更六步主干流程（与第13章整体变更控制一致）</figcaption>
</figure>
<ul>
<li><b>变更分级：</b>重大变更、一般变更、微小变更；<b>微小变更可由项目经理审批</b>，涉及基准的变更必须上CCB。</li>
<li><b>实施分工：</b>CCB只决策不实施；实施由<b>项目经理</b>组织项目团队完成。</li>
</ul>
<div class="pit"><b>坑点：</b>①"变更由CCB实施"错——CCB<b>只批不做</b>；②"所有变更都必须由CCB批准"错——微小变更可由项目经理审批；③变更完成后"不更新基线、不通知干系人、不留记录"是案例找错的三大高频扣分点。</div>`}
  ], quiz:[
    {q:'某项目中，团队成员平时主要向职能部门经理汇报，项目经理仅以协调员和联络员的角色推动工作，则该组织结构最可能是（ ）', o:['职能型组织','弱矩阵型组织','平衡矩阵型组织','强矩阵型组织'], a:1, k:'矩阵型组织', e:'弱矩阵中项目经理扮演协调员/联络员角色，权力低，成员主要听命于职能经理。职能型的标志是没有全职项目经理；强矩阵中项目经理权力中高；平衡矩阵两者权力均衡。'},
    {q:'PMO的三种类型中，控制程度最高、可以直接管理和控制项目的是（ ）', o:['指令型','支持型','控制型','顾问型'], a:0, k:'PMO三类型', e:'指令型PMO控制程度最高，直接管理和控制项目，可委派项目经理。支持型只当顾问提供模板与培训，控制型要求遵守规定流程但不管项目本身。选项"顾问型"是杜撰的干扰项。'},
    {q:'信息系统项目完成后形成的最终发布版本，应存放于（ ）', o:['开发库','受控库','知识库','产品库'], a:3, k:'配置库三类型', e:'产品库（静态库）存放最终发布的产品版本，等待交付或已交付，控制最严格。开发库存放开发过程中的半成品，受控库存放阶段结束的成熟产物与基线，知识库不属于配置库分类。'},
    {q:'关于基线的叙述中，正确的是（ ）', o:['基线一旦确定就不能再变更','基线变更必须通过正式的变更控制程序','基线应存放在开发库中便于修改','基线由配置管理员批准后即可变更'], a:1, k:'基线管理', e:'基线是经过正式评审批准的工作产品，只能通过正式的变更控制程序修改，并非绝对不可变更。基线存放于受控库而非开发库；其变更由CCB决策，配置管理员只负责执行。'},
    {q:'配置管理的六项主要活动中，排在"配置标识"之后、"配置状态报告"之前的是（ ）', o:['制订配置管理计划','配置审计','配置控制','发布管理和交付'], a:2, k:'配置管理六活动', e:'六活动顺序为：制订配置管理计划、配置标识、配置控制、配置状态报告、配置审计、发布管理和交付。口诀"计标控、报审发"，配置控制居第三位，位于标识之后、状态报告之前。'},

    {q:'关于变更控制委员会（CCB）的说法，正确的是（ ）', o:['CCB负责实施批准后的变更','CCB必须是常设的多人正式机构','CCB是变更管理的决策机构，负责批准或否决变更','所有变更无论大小都必须提交CCB审批'], a:2, k:'CCB职责', e:'CCB是决策机构，负责审议并批准或否决变更申请，不负责具体实施，实施由项目经理组织完成。CCB可以是几个人甚至一个人，也可全部兼职；微小变更可由项目经理审批。'},

    {q:'适用于通用软件开发组织的配置库建库方法是（ ）', o:['按任务建库','按组织部门建库','按配置项类型建库','按项目阶段建库'], a:2, k:'配置库建库', e:'按配置项类型建库适用于通用软件的开发组织，按任务建库适用于专业软件的开发组织，这是2024年真题考点。"按部门建库""按阶段建库"均为干扰项。'}

  {id:16, title:'监理基础知识',       sec:'aux', page:569, cards:[
  {t:'监理是什么：独立第三方', f:'high', s:3, m:'甲方出钱，乙方干活，丙方监理。', b:`
<p><b>一句话本质：</b>信息系统工程监理，就是<b>建设单位（甲方）出钱请的专业"监工"</b>——依法设立并具备相应资质的监理单位，受建设单位委托，对承建单位（乙方）实施工程的过程进行监督管理，替甲方看住<b>质量、进度、投资</b>。</p>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-row">
    <div class="dg-box" style="border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.05)"><b style="color:#a5e8f5">建设单位（甲方）</b><span>出资方、业主 · 委托监理并支付监理费</span></div>
    <div class="dg-harrow">←委托→</div>
    <div class="dg-box" style="border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)"><b style="color:#cfc8ff">监理单位（丙方）</b><span>独立第三方 · 受甲方委托实施监理 · 不得与乙方有隶属或利益关系</span></div>
    <div class="dg-harrow">←监督→</div>
    <div class="dg-box" style="border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.05)"><b style="color:#6ee7b7">承建单位（乙方）</b><span>承包工程 · 接受监理的监督检查</span></div>
  </div>
</div>
<figcaption>监理三方关系：丙方替甲方盯着乙方，但立场独立、办事公正</figcaption>
</figure>
<p><b>监理的特点：</b>服务性（提供专业管理服务）、独立性（不隶属甲乙任何一方）、公正性（站在项目整体利益处理问题）、科学性（用专业方法说话）。</p>
<div class="pit"><b>坑点：</b>①监理费由<b>建设单位</b>支付，但监理不代表甲方"整"乙方，必须公正；②"监理可以参与工程开发施工"错——监理与承建必须分离；③监理<b>不代替</b>建设单位做决策（如验收由建设单位组织）。</div>`},
  {t:'三控两管一协调+安全', f:'high', s:3, m:'质进投三控，合与信两管，组织协调；安全别混进两管。', b:`
<p>这是监理工作的总纲，<b>2025年第4批首次进入案例题</b>，必须一字不差记住：</p>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-row">
    <div class="dg-box" style="border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.05)"><b style="color:#a5e8f5">三控</b><span>质量控制 · 进度控制 · 投资控制</span></div>
    <div class="dg-box" style="border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)"><b style="color:#cfc8ff">两管</b><span>合同管理 · 信息管理</span></div>
    <div class="dg-box" style="border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.05)"><b style="color:#fde68a">一协调</b><span>组织协调（协调建设、承建、设备供应商等各方）</span></div>
    <div class="dg-box" style="border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.05)"><b style="color:#fda4af">安全职责</b><span>网络与信息安全监督贯穿全过程——注意：安全不属"两管"，信息安全属监理对象之一</span></div>
  </div>
</div>
<figcaption>口诀：三控"质进投"，两管"合与信"，一协调"组织"——安全管理不是"两管"</figcaption>
</figure>
<table class="kt"><tr><th>工作</th><th>典型内容</th></tr>
<tr><td>质量控制</td><td>设备到货开箱检验、开发过程检查、测试见证、阶段成果评审</td></tr>
<tr><td>进度控制</td><td>审查进度计划、跟踪实际进展、分析偏差并督促纠偏</td></tr>
<tr><td>投资控制</td><td>工程量计量、按合同与进度审核付款、投资偏差分析</td></tr>
<tr><td>合同管理</td><td>协助订立合同、监督合同履行、处理变更与索赔</td></tr>
<tr><td>信息管理</td><td>工程文档资料收集、整理、归档，编制监理文件</td></tr></table>
<div class="pit"><b>坑点：</b>"三控 vs 两管"是最爱挖的坑——<b>合同管理、信息管理属于"两管"，不属于"三控"</b>；"协调"专指<b>组织协调</b>，选项写成"进度协调""利益协调"都错；"安全管理"是高频干扰项——两管只有合同管理与信息管理，安全监督是贯穿全过程的监理职责，信息安全与运行维护属<b>监理对象</b>之一。</div>`},
  {t:'监理的四类依据', f:'mid', s:2, m:'法规、标准、监理合同、承包合同。', b:`
<p>监理"凭什么管"？四类依据缺一不可：</p>
<table class="kt"><tr><th>依据</th><th>说明与举例</th></tr>
<tr><td>法律法规与政策</td><td>国家有关法律、行政法规与政策（如招标投标法、民法典合同编相关规定）</td></tr>
<tr><td>技术标准与规范</td><td>国家标准、行业标准及相应的工程技术规范</td></tr>
<tr><td>监理合同</td><td>建设单位与监理单位签订的委托监理合同——监理权限的直接来源</td></tr>
<tr><td>工程承包合同与设计文件</td><td>建设单位与承建单位签订的承包合同、经批准的设计文件与实施方案</td></tr></table>
<div class="tip"><b>理解：</b>前两类管"底线"（合法合规），后两类管"范围"（合同约定的具体工程目标），四个一起构成监理的工作依据。</div>
<div class="pit"><b>坑点：</b>①监理的权力来自<b>监理合同</b>（甲方委托），不是来自承建单位授权；②"<b>承建单位的内部管理制度</b>"不是监理依据——选择题常拿它当干扰项；③监理依据里没有"行业惯例"，惯例不能替代标准与合同。</div>`},
  {t:'监理三阶段的主要工作', f:'high', s:3, m:'准备审方案，实施三控忙，验收帮组档。', b:`
<table class="kt"><tr><th>阶段</th><th>主要监理工作</th></tr>
<tr><td>工程准备阶段</td><td>协助建设单位招标与选择承建单位；评审需求与承建方案（技术方案、实施方案）；审查开工条件（人员、设备、计划是否就绪）；编制监理规划和监理实施细则</td></tr>
<tr><td>工程实施阶段</td><td>三控两管一协调的主战场：设备到货检验、阶段成果评审、进度跟踪与纠偏、付款审核、变更控制、测试见证、安全监督</td></tr>
<tr><td>工程验收阶段</td><td>审查验收资料与文档的完整性；协助建设单位组织验收；评估工程质量；提交监理总结报告</td></tr></table>
<div class="tip"><b>案例答题模板：</b>问"某阶段监理应做什么"——按<b>质量+进度+投资+合同+信息+协调+安全</b>逐条套，每条给一句具体动作，不易漏分。</div>
<div class="pit"><b>坑点：</b>①"验收由监理单位组织"错——验收由<b>建设单位</b>组织，监理只是<b>协助</b>；②监理规划在<b>准备阶段</b>就要编制完成，不是实施阶段才补；③"监理直接给工程下验收结论"错——监理提交评估意见，验收结论由建设单位确认。</div>`},
  {t:'监理机构与人员职责', f:'mid', s:2, m:'总监管全面，专业管一行，监理员跑现场。', b:`
<figure class="kd-fig">
<div class="dg">
  <div class="dg-row">

<p>这是<b>2025年第4批案例真题考点</b>（考监理规划的编制与审批部门），必须精确到"谁编谁批"：</p>
<table class="kt"><tr><th>文件</th><th>定位</th><th>谁编制</th><th>谁审批</th></tr>
<tr><td>监理规划</td><td>开展监理工作的总体纲领性文件</td><td><b>总监理工程师主持</b>编制</td><td><b>监理单位技术负责人</b>审批</td></tr>
<tr><td>监理实施细则</td><td>针对具体专业或分项的操作性文件</td><td><b>专业监理工程师</b>编制</td><td><b>总监理工程师</b>批准</td></tr></table>
<ul>
<li><b>编制时点：</b>签订监理合同、收到设计与工程文件后编制监理规划；专业性较强的项目，在监理规划指导下再编制实施细则。</li>
<li><b>从粗到细：</b>规划是"纲"（全局怎么干），细则是"目"（具体专业怎么干）。</li>
</ul>
<div class="pit"><b>坑点：</b>①"监理规划由总监审批"是经典错误——总监只主持<b>编制</b>，审批权在<b>监理单位技术负责人</b>；②"监理细则由监理单位技术负责人批准"错——由<b>总监理工程师</b>批准；③两个文件的编制人、批准人正好"上下交错"，靠口诀区分：规划上头是单位，细则上头是总监。</div>`},
  {t:'监理工作程序与找错模板', f:'mid', s:2, m:'签合同、派总监、编规划、干三控、助验收、交报告。', b:`
<p><b>监理工作程序主线：</b>签订监理合同 → 任命总监、组建监理机构 → 编制监理规划（监理单位技术负责人审批）→ 按规划实施监理（必要时编制细则）→ 实施阶段开展三控两管一协调 → 验收阶段协助建设单位验收 → 提交监理报告，资料归档。</p>
<p><b>案例找错万金油（2025年真题套路）：</b></p>
<ul>
<li><b>编制审批错：</b>监理规划由监理员/项目经理编制、由总监审批——都错（总监主持编制+单位技术负责人审批）。</li>
<li><b>角色越位错：</b>监理代替承建单位修改方案、代替建设单位拍板决策——监理只能提建议、出意见。</li>
<li><b>利益关系错：</b>监理单位与承建单位同属一个集团或持有股份——违反独立性要求。</li>
<li><b>程序缺失错：</b>未编制监理规划即开工、验收未审查文档资料即通过。</li>
</ul>
<div class="pit"><b>坑点：</b>①"监理是甲方的下属部门"错——监理是<b>独立第三方</b>企业；②"监理提出整改建议后可直接实施"错——整改由<b>承建单位</b>执行，监理负责复核；③联动考点：国家标准实施后复审周期一般<b>不超过5年</b>（与第17章标准化法联动，2025年案例考过）。</div>`}

    {q:'以下不属于信息系统工程监理依据的是（ ）', o:['国家有关法律法规与政策','信息技术标准与规范','监理合同与工程承包合同','承建单位的内部管理制度'], a:3, k:'监理依据', e:'监理依据包括法律法规与政策、技术标准与规范、监理合同、工程承包合同及经批准的设计文件。承建单位内部管理制度对监理方没有约束力，不是监理依据。'},

  {id:17, title:'法律法规和标准规范', sec:'aux', page:580, cards:[
  {t:'必须招标的情形与招标方式', f:'high', s:3, m:'公益、国资、外资三类必招；公开为主、邀请为例外。', b:`
<p>《招标投标法》第3条：在境内进行下列<b>工程建设项目</b>（含勘察、设计、施工、监理及与工程建设有关的重要设备、材料采购）<b>必须招标</b>：</p>
<ul>
<li><b>①公益安全类：</b>大型基础设施、公用事业等关系社会公共利益、公众安全的项目；</li>
<li><b>②国资类：</b>全部或者部分使用国有资金投资或者国家融资的项目；</li>
<li><b>③外资类：</b>使用国际组织或者外国政府贷款、援助资金的项目。</li>
</ul>
<table class="kt"><tr><th>方式</th><th>做法</th><th>对象</th></tr>
<tr><td>公开招标</td><td>发布招标公告</td><td>不特定的法人或其他组织（主要方式）</td></tr>
<tr><td>邀请招标</td><td>发出投标邀请书</td><td>特定的法人或其他组织（<b>3个以上</b>）</td></tr></table>
<p>招投标活动应遵循<b>公开、公平、公正和诚实信用</b>原则；任何单位和个人不得将必须招标的项目<b>化整为零或以其他方式规避招标</b>。</p>
<div class="pit"><b>坑点：</b>①"民营企业项目一律必须招标"错——是否必须招标看上述三类情形，不看所有制；②邀请招标邀请对象<b>不得少于3个</b>；③案例找错高频：把项目拆成多个小合同规避招标——违法。</div>`},
  {t:'招投标关键数字（选择题常客）', f:'high', s:3, m:'等标二十、三家开标、五人单三二、通知三十签。', b:`
<p>本卡片全是数字考点，2023年案例大题就靠这些数字找错（等标期不足、评标委员会仅2人、按低价定标）：</p>
<figure class="kd-fig">
<div class="dg">
  <div class="dg-row">
    <div class="dg-box"><b>招标公告</b><span>公开招标发布招标公告</span></div>
    <div class="dg-harrow">→等标期≥20日→</div>
    <div class="dg-box"><b>投标截止+开标</b><span>投标人≥3家，否则重新招标</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>评标</b><span>委员会5人以上单数，技术经济专家≥2/3</span></div>
  </div>
  <div class="dg-row">
    <div class="dg-box"><b>确定中标人</b><span>评标委员会推荐中标候选人</span></div>
    <div class="dg-harrow">→</div>
    <div class="dg-box"><b>中标通知书</b><span>发出即对双方有法律约束力</span></div>
    <div class="dg-harrow">→30日内→</div>
    <div class="dg-box"><b>订立书面合同</b><span>按招标文件和投标文件签订</span></div>
  </div>
</div>
<figcaption>招投标主线流程与关键数字：20日、3家、5人单数2/3、30日</figcaption>
</figure>
<ul>
<li><b>等标期：</b>自招标文件开始发出之日起至投标截止之日止，最短不得少于<b>20日</b>。</li>
<li><b>重新招标：</b>投标人<b>少于3个</b>的，招标人应当重新招标。</li>
<li><b>评标委员会：</b>成员人数为<b>5人以上单数</b>，技术、经济专家<b>不得少于成员总数的2/3</b>，一般项目从专家库随机抽取。</li>
<li><b>签约：</b>自中标通知书<b>发出之日起30日内</b>订立书面合同。</li>
<li><b>报告：</b>依法必须招标的项目，自确定中标人之日起<b>15日内</b>向行政监督部门提交招投标情况的书面报告。</li>
</ul>
<div class="pit"><b>坑点：</b>①"等标期从发布招标公告起算"错——从<b>招标文件开始发出之日</b>起算；②"中标通知书发出30日内"是<b>订立合同</b>的时限，别与"20日等标期""15日报告"混淆；③招标人与中标人不得再行订立背离合同<b>实质性内容</b>的其他协议。</div>`},
  {t:'评标委员会与中标规则', f:'high', s:3, m:'标准招标文件定，最低报价未必赢。', b:`
<p><b>评标委员会：</b>由招标人负责组建，由招标人或其委托的招标代理机构熟悉相关业务的代表和有关<b>技术、经济等方面的专家</b>组成；成员名单在中标结果确定前<b>保密</b>；评标专家应从事相关专业领域工作<b>满8年</b>并具有<b>高级职称或同等专业水平</b>。</p>
<p><b>评标规则：</b>按照<b>招标文件确定的评标标准和方法</b>对投标文件进行评审和比较；招标文件中没有规定的标准和方法<b>不得作为评标依据</b>；评标委员会可以要求投标人对含义不明确的内容作必要澄清或说明，但<b>不得超出投标文件的范围或者改变投标文件的实质性内容</b>。</p>
<p><b>中标人的确定：</b>评标委员会推荐中标候选人或按招标人授权直接确定；中标人的投标应符合下列条件之一：①能够<b>最大限度地满足招标文件规定的各项综合评价标准</b>；②能够满足招标文件的实质性要求，并且<b>经评审的投标价格最低</b>，但<b>投标价格低于成本的除外</b>。</p>
<div class="pit"><b>坑点：</b>①"<b>报价最低者中标</b>"是经典错误——低于成本报价被排除，且可采用综合评价法；②"评标委员会自行制定评标标准"错——标准只能来自招标文件；③"澄清说明时可以补充报价"错——不得改变实质性内容。这三点是2023年案例招投标找错的原型。</div>`},
  {t:'政府采购法：五种方式', f:'high', s:3, m:'公开邀谈询单一；询价只管货。', b:`
<p>《政府采购法》规定采购方式共<b>五种</b>，<b>公开招标是主要方式</b>：</p>
<table class="kt"><tr><th>方式</th><th>适用情形</th></tr>
<tr><td>公开招标</td><td>主要方式；采购货物服务超过限额标准的必须公开招标，改用其他方式须报<b>设区的市、自治州以上政府财政部门</b>批准</td></tr>
<tr><td>邀请招标</td><td>具有特殊性只能从有限范围供应商处采购；或公开招标成本占合同金额比例过大</td></tr>
<tr><td>竞争性谈判</td><td>招标后无供应商投标、无合格标的或重新招标未能成立；技术复杂或性质特殊，不能确定详细规格或具体要求；招标所需时间不能满足用户紧急需要；<b>不能事先计算出价格总额</b></td></tr>
<tr><td>单一来源采购</td><td>只能从<b>唯一</b>供应商处采购；发生不可预见的紧急情况；添购且添购金额不超过原合同采购金额的<b>10%</b></td></tr>
<tr><td>询价</td><td>采购的货物<b>规格标准统一、现货货源充足且价格变化幅度小</b></td></tr></table>
<div class="pit"><b>坑点：</b>①<b>询价只适用于货物</b>采购，不能用于工程和服务——高频陷阱；②"单一来源需要3家报价"错——只有一家，正是其特征；③竞争性谈判四种情形里"不能事先计算出价格总额"最爱考，别与询价（价格稳定）混；④"竞争性磋商""框架协议采购"是财政部规章确立的<b>其他采购方式</b>，不属于法定的五种——政府采购法修订草案尚在审议中，考试按现行法与教材作答。</div>`},
  {t:'民法典合同编：要约与承诺', f:'mid', s:2, m:'招标邀请，投标要约，中标是承诺。', b:`
<p>合同订立的两步走：<b>要约邀请→要约→承诺，承诺生效时合同成立</b>。</p>
<table class="kt"><tr><th>概念</th><th>含义</th><th>招投标中的对应</th></tr>
<tr><td>要约</td><td>希望与他人订立合同的意思表示（内容具体确定+表明经承诺即受约束）</td><td><b>投标文件</b></td></tr>
<tr><td>要约邀请</td><td>希望他人向自己发出要约的表示</td><td><b>招标公告（招标文件）</b></td></tr>
<tr><td>承诺</td><td>受要约人同意要约的意思表示</td><td><b>中标通知书</b></td></tr></table>
<ul>
<li><b>典型的要约邀请：</b>拍卖公告、招标公告、招股说明书、债券募集办法、基金招募说明书、商业广告和宣传、寄送的价目表；商业广告内容符合要约条件的构成要约。</li>
<li><b>实质性变更：</b>受要约人对标的、数量、质量、价款、履行期限地点方式、违约责任、争议解决方法的变更，视为<b>新要约</b>。</li>
</ul>
<div class="pit"><b>坑点：</b>①"招标公告是要约"错——是<b>要约邀请</b>；②"中标通知书是新的要约"错——是<b>承诺</b>，发出后对招标人和中标人具有法律约束力；③"商业广告一律是要约邀请"不准确——内容符合要约条件的构成要约。</div>`},
  {t:'违约责任三种形式', f:'mid', s:2, m:'继续履行、补救措施、赔偿损失；定金违约金二选一。', b:`
<p>当事人一方不履行合同义务或者履行不符合约定的，应当承担<b>继续履行、采取补救措施或者赔偿损失</b>等违约责任：</p>
<ul>
<li><b>继续履行：</b>守约方可要求违约方按约定继续履行义务（法律上或事实上不能履行的除外）。</li>
<li><b>采取补救措施：</b>修理、重作、更换、退货、减少价款或者报酬等。</li>
<li><b>赔偿损失：</b>损失赔偿额应相当于因违约造成的损失，包括合同履行后可以获得的利益，但<b>不得超过违约方订立合同时预见或应当预见</b>的损失。</li>
</ul>
<p><b>违约金与定金：</b>当事人可约定违约金，约定的违约金低于或过分高于造成损失的，可请求法院或仲裁机构予以增加或适当减少；当事人可约定定金，定金<b>不得超过主合同标的额的20%</b>；既约定违约金又约定定金的，守约方<b>只能选择其一</b>适用。</p>
<div class="pit"><b>坑点：</b>①"违约金与定金可以同时适用"错——<b>只能二选一</b>；②定金上限是主合同标的额的<b>20%</b>；③赔偿损失有"可预见规则"限制，不是漫天要价。</div>`},
  {t:'著作权：保护期与职务作品', f:'high', s:3, m:'人身权无限期，财产终身加五十，法人发表五十。', b:`
<p><b>著作权自作品创作完成之日起自动产生</b>，无需登记。权利分两块：<b>人身权</b>（发表权、署名权、修改权、保护作品完整权）和<b>财产权</b>（复制权、发行权、信息网络传播权等）。</p>
<table class="kt"><tr><th>权利</th><th>保护期</th></tr>
<tr><td>署名权、修改权、保护作品完整权</td><td><b>不受限制</b></td></tr>
<tr><td>自然人作品的发表权及财产权</td><td><b>作者终生及其死亡后50年</b>（截止于作者死亡后第50年的12月31日；合作作品以最后死亡的作者为准）</td></tr>
<tr><td>法人或非法人组织的作品、职务作品（署名权除外）</td><td><b>首次发表后50年</b>；作品自创作完成后50年内未发表的，不再保护</td></tr></table>
<p><b>职务作品：</b>自然人为完成法人工作任务所创作的作品。一般职务作品著作权归<b>作者</b>，法人有权在其业务范围内优先使用；<b>主要利用法人物质技术条件创作并由法人承担责任</b>的（如计算机软件、工程设计图），作者仅享有<b>署名权</b>，其他权利由法人享有。</p>
<div class="pit"><b>坑点：</b>①"著作权自登记之日起产生"错——<b>自动产生</b>；②50年有两种算法：自然人是<b>终生+死后50年</b>，法人是<b>首次发表后50年</b>，选项最爱互换；③软件著作权同样适用"创作完成自动产生"，登记只是证据。</div>`},
  {t:'专利与商标：期限与起算', f:'high', s:3, m:'发明二十实十外十五，专利申请日起；商标十年核准日起可续展。', b:`
<table class="kt"><tr><th>权利</th><th>期限</th><th>起算点</th><th>能否续展</th></tr>
<tr><td>发明专利权</td><td><b>20年</b></td><td>自<b>申请日</b>起</td><td>不能</td></tr>
<tr><td>实用新型专利权</td><td><b>10年</b></td><td>自<b>申请日</b>起</td><td>不能</td></tr>
<tr><td>外观设计专利权</td><td><b>15年</b></td><td>自<b>申请日</b>起</td><td>不能</td></tr>
<tr><td>注册商标专用权</td><td><b>10年</b></td><td>自<b>核准注册日</b>起</td><td><b>可无限次续展</b>，每次10年</td></tr></table>
<ul>
<li><b>专利授予条件：</b>发明和实用新型要求<b>新颖性、创造性、实用性</b>；专利实行<b>先申请原则</b>（同样发明创造授予最先申请人）。</li>
<li><b>商标续展：</b>期满前12个月内办理续展（有6个月宽展期），每次续展有效期10年，次数不限。</li>
</ul>
<div class="pit"><b>坑点：</b>①专利自<b>申请日</b>起算、商标自<b>核准注册日</b>起算——起算点不同；②"专利到期可续展"错——专利<b>不可续展</b>，商标才可无限续展；③外观设计是<b>15年</b>（2021年专利法修改后），别选成10年。</div>`},
  {t:'标准化法与软件工程国标', f:'mid', s:2, m:'国标分强制推荐，行标地标皆推荐；复审不超五年。', b:`
<p><b>标准的层级：</b>国家标准、行业标准、地方标准、团体标准、企业标准。</p>
<table class="kt"><tr><th>层级</th><th>要点</th></tr>
<tr><td>国家标准</td><td>代号GB（强制性）/ GB/T（推荐性）；<b>强制性标准只能是国家标准</b>，对保障人身健康和生命财产安全、国家安全、生态环境安全等的技术要求制定</td></tr>
<tr><td>行业标准</td><td>没有国标时制定，代号含行业缩写（如通信YD），为推荐性标准</td></tr>
<tr><td>地方标准</td><td>代号DB，在本行政区域内适用，为推荐性标准</td></tr>
<tr><td>团体标准</td><td>由学会、协会等社会团体协调相关市场主体共同制定</td></tr>
<tr><td>企业标准</td><td>代号Q，企业自行制定，仅在企业内部适用</td></tr></table>
<ul>
<li><b>抵触规则：</b>在公布国家标准之后，该项行业标准、地方标准<b>即行废止</b>；下位标准不得与上位标准相抵触。</li>
<li><b>复审：</b>国家标准实施后应适时复审，复审周期一般<b>不超过5年</b>（2025年监理案例考过）。</li>
<li><b>软件工程国标代表作：</b>GB/T 8567《计算机软件文档编制规范》（软件文档）、GB/T 8566《软件生存周期过程》、GB/T 9385《计算机软件需求规格说明规范》、GB/T 9386《计算机软件测试文档编制规范》。</li>
</ul>
<div class="pit"><b>坑点：</b>①"行业标准也可以是强制性标准"错——现行标准化法下<b>强制标准只留国家标准</b>；②"国标全是推荐性"错——GB（无/T）即强制性；③软件文档编制规范记<b>GB/T 8567</b>，软件生存周期过程记<b>GB/T 8566</b>，编号相邻最易互串。</div>`}

  {id:18, title:'职业道德规范',       sec:'aux', page:595, cards:[
  {t:'职业道德五项基本规范', f:'mid', s:2, m:'爱诚办服奉，一个不能少。', b:`
<p><b>一句话本质：</b>职业道德是各行各业的从业者在本职工作中应遵守的行为总和。社会主义职业道德的五项基本规范：</p>
<table class="kt"><tr><th>规范</th><th>内涵</th></tr>
<tr><td>爱岗敬业</td><td>热爱本职岗位，勤勉尽责，是职业道德的<b>基础</b></td></tr>
<tr><td>诚实守信</td><td>言行一致、恪守承诺，是职业道德的<b>核心</b>，也是项目管理最看重的品质</td></tr>
<tr><td>办事公道</td><td>公平公正处理事务，不偏私、不徇情</td></tr>
<tr><td>服务群众</td><td>倾听群众需求，为服务对象提供优质服务</td></tr>
<tr><td>奉献社会</td><td>把职业工作与社会责任结合，是职业道德的<b>最高层次</b></td></tr></table>
<p>对系统集成项目管理从业者而言，落到三个关键词：<b>守法</b>（遵守法律法规）、<b>诚信</b>（不弄虚作假）、<b>公正</b>（不因私利偏袒任何一方）。</p>
<div class="pit"><b>坑点：</b>选择题考"基本规范包括哪些"，干扰项爱用"<b>精益求精</b>""追求卓越""效率优先"这类听起来很正的词——五项规范里<b>没有</b>它们，记口诀"爱诚办服奉"逐字核对；《新时代公民道德建设实施纲要》将第四项表述为"热情服务"，考试以教材"<b>服务群众</b>"为准。</div>`},
  {t:'职业行为准则四个面向', f:'mid', s:2, m:'对职业、对组织、对公众、对同行。', b:`
<p>职业行为准则把"道德要求"落成"具体动作"，按<b>四个面向</b>组织：</p>
<figure class="kd-fig">
<div class="dg dg-2">
  <div class="dg-box" style="border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.05)"><b style="color:#a5e8f5">对职业</b><span>维护职业声誉 · 持续学习提升专业能力 · 不做有损职业形象的事</span></div>
  <div class="dg-box" style="border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.08)"><b style="color:#cfc8ff">对组织（雇主）</b><span>忠于职守 · 保守商业秘密 · <b>利益冲突主动申报回避</b> · 不利用职务之便谋取私利</span></div>
  <div class="dg-box" style="border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.05)"><b style="color:#fde68a">对客户与公众</b><span>诚实不欺 · 不发布虚假信息 · 保护用户数据与个人隐私 · 对社会负责</span></div>
  <div class="dg-box" style="border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.05)"><b style="color:#6ee7b7">对同行</b><span>公平竞争不诋毁 · 尊重他人知识产权与劳动成果 · 乐于知识分享</span></div>
</div>
<figcaption>职业行为准则四个面向——案例情境题按"面向"逐条对照找错</figcaption>
</figure>
<div class="pit"><b>坑点：</b>①"项目经理可以收受供应商小额礼金"错——收受可能影响公正判断的财物即违规，<b>没有金额豁免</b>；②"发现数据造假但为了项目验收先隐瞒"错——诚实守信优先，应如实反映并推动整改；③利益冲突时"继续参与决策但不表态"仍不合规——正确做法是<b>主动声明并回避</b>。</div>`},
  {t:'知识产权保护与保密义务', f:'low', s:1, m:'职务成果归单位，商业秘密离岗不清零。', b:`
<p>IT从业者天天与"别人的智力成果"和"单位的秘密"打交道，两条红线：</p>
<ul>
<li><b>尊重知识产权：</b>不使用盗版软件，不剽窃他人代码与方案；使用开源软件须<b>遵守其许可证</b>约定（如保留版权声明、遵守分发条件）；主要利用单位物质技术条件完成的<b>职务作品、职务发明</b>，权利归<b>单位</b>。</li>
<li><b>保守秘密：</b>保守国家秘密、企业商业秘密和客户隐私数据；保密义务<b>不因离职而免除</b>——离职后仍不得泄露、使用在职期间知悉的商业秘密；对外发布信息须经授权。</li>
</ul>
<div class="pit"><b>坑点：</b>①"开源软件可以随便商用"错——须遵守许可协议，且开源不等于无版权；②"保密义务只约束在职员工"错——离职后对商业秘密仍负保密义务；③"把单位开发的管理软件当个人作品去参赛/售卖"错——职务成果权利属于单位。</div>`},
  {t:'职业素养的构成', f:'low', s:1, m:'德为魂、识为纲、才为器、学为本。', b:`
<p><b>职业素养</b>是职业人在职业活动中表现出的综合品质，可拆成四块：</p>
<ul>
<li><b>职业道德：</b>价值观层面的底线与操守（上一张卡的内容）。</li>
<li><b>职业意识：</b>责任意识、大局意识、风险意识、服务意识——"眼里有活、心里有责"。</li>
<li><b>职业技能：</b>专业技术与管理能力（进度、成本、质量、沟通协调的方法论）。</li>
<li><b>职业行为习惯：</b>守时、文档化、闭环反馈、持续学习等日常动作。</li>
</ul>
<p>对项目经理的额外要求：<b>诚信正直</b>（敢于报告坏消息）、<b>全局观</b>（平衡范围、进度、成本、质量）、<b>沟通协调</b>（对上对下对客户）、<b>持续学习</b>（技术与标准更新快）。</p>
<div class="pit"><b>坑点：</b>"职业素养=技术能力"是常见误解——技术只是<b>职业技能</b>一块，职业道德与职业意识才是"魂"，考题常以"以下属于职业素养的是"来考完整构成。</div>`},
  {t:'本章坑点速查与答题模板', f:'mid', s:2, m:'道-规-行三层：道德为纲，准则为绳，素养为用。', b:`
<figure class="kd-fig">

const SKEY='zx_v1';
let S;
try{ S=JSON.parse(localStorage.getItem(SKEY))||null }catch(e){ S=null }
if(!S) S={mastered:{},fav:{},wrong:{},qstats:{att:0,right:0},streak:{days:0,last:''},today:{d:'',n:0},lastCh:9};
function save(){ localStorage.setItem(SKEY,JSON.stringify(S)) }
function today(){ return new Date().toISOString().slice(0,10) }
function initDaily(){
  const t=today();
  if(S.today.d!==t){ S.today={d:t,n:0} }
  if(S.streak.last!==t){
    const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
    S.streak.days = (S.streak.last===y)? S.streak.days+1 : 1;
    S.streak.last=t;
  }
  save();
}

/* ================= 工具 ================= */
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/</g,'&lt;');
function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]} return r }
function chById(id){ return CHAPTERS.find(c=>c.id===id) }
function produced(){ return CHAPTERS.filter(c=>c.cards&&c.cards.length) }
function totalCards(){ return produced().reduce((n,c)=>n+c.cards.length,0) }
function chMastered(ch){ return ch.cards.filter((_,i)=>S.mastered[ch.id+'_'+i]).length }
function totalMastered(){ return produced().reduce((n,c)=>n+chMastered(c),0) }
function allQuestions(){ const r=[]; produced().forEach(c=>(c.quiz||[]).forEach((q,i)=>r.push({ch:c.id,qi:i,q}))); return r }
function fmtSec(ms){ const s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0') }
const LETTERS=['A','B','C','D'];

let L={filter:'all'};
function goChapter(id){ S.lastCh=id; save(); nav('learn') }
function goChapterCard(id,idx){
  S.lastCh=id; save(); nav('learn');
  setTimeout(()=>{ const el=document.getElementById('kd_'+id+'_'+idx);
    if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.add('flash');

function toggleMaster(ch,i){
  const k=ch+'_'+i;
  if(S.mastered[k]) delete S.mastered[k]; else S.mastered[k]=true;
  save(); renderLearn();
}
function toggleFav(ch,i){
  const k=ch+'_'+i;
  if(S.fav[k]) delete S.fav[k]; else S.fav[k]=true;
  save(); renderLearn();
}
function setFilter(f){ L.filter=f; renderLearn() }
function cardHtml(ch,c,i){
  const key=ch+'_'+i;
  const mastered=!!S.mastered[key], fav=!!S.fav[key];
  const stars='★'.repeat(c.s)+'☆'.repeat(3-c.s);
  const fname={high:'高频',mid:'中频',low:'低频'}[c.f];
  return `<div class="kd-card ${mastered?'mastered':''}" id="kd_${key}">
    <div class="kd-top">
      <span class="badge ${c.f}">${fname}</span>
      <span class="kd-title">${c.t}</span>
      <span class="stars">${stars}</span>
      <span class="kd-acts">
        <button class="${mastered?'m-on':''}" onclick="toggleMaster(${ch},${i})">${mastered?'✓ 已掌握':'掌握'}</button>
        <button class="${fav?'f-on':''}" onclick="toggleFav(${ch},${i})">${fav?'★ 已收藏':'☆ 收藏'}</button>
      </span>
    </div>
    <div class="kd-body">${c.b}</div>
    <div class="mnemo">${c.m}</div>
  </div>`;
}
function renderLearn(){
  const cur=chById(S.lastCh)||chById(9);
  /* 手机端章节选择器 */
  let opts='';
  SECTIONS.forEach(sec=>{
    opts+=`<optgroup label="${sec.name}（${sec.range}）">`;
    CHAPTERS.filter(c=>c.sec===sec.key).forEach(c=>{
      const st=(c.cards&&c.cards.length)?'':'（待产出）';
      opts+=`<option value="${c.id}" ${c.id===cur.id?'selected':''}>第${c.id}章 ${c.title}${st}</option>`;
    });
    opts+='</optgroup>';
  });
  const sel=`<div class="ch-select"><label>章节</label><select onchange="goChapter(+this.value)">${opts}</select></div>`;
  /* 上一章 / 下一章导航 */
  const ids=CHAPTERS.map(c=>c.id);
  const pi=ids.indexOf(cur.id);
  let prevBtn='<button disabled>已是第一章</button>';
  if(pi>0){ const p=chById(ids[pi-1]); prevBtn=`<button onclick="goChapter(${p.id})">◂ 第${p.id}章 ${p.title}</button>` }
  let nextBtn='<button disabled>已是最后一章</button>';
  if(pi<ids.length-1){ const n=chById(ids[pi+1]); nextBtn=`<button onclick="goChapter(${n.id})">第${n.id}章 ${n.title} ▸</button>` }
  const chnav=`<div class="chnav">${prevBtn}${nextBtn}</div>`;
  /* 侧栏 */
  let side='';
  SECTIONS.forEach(sec=>{
    side+=`<div class="side-group"><h4><span>${sec.name}</span><span>${sec.range}</span></h4>`;
    CHAPTERS.filter(c=>c.sec===sec.key).forEach(c=>{
      if(!c.cards){ side+=`<div class="side-item locked"><span class="num">${c.id}</span><span class="nm">${c.title}</span><span class="cnt">待产出</span></div>`; return }
      const m=chMastered(c), full=m===c.cards.length;
      side+=`<div class="side-item ${c.id===cur.id?'on':''} ${full?'done':''}" onclick="goChapter(${c.id})">
        <span class="num">${c.id}</span><span class="nm">${c.title}</span><span class="cnt">${full?'✓':m+'/'+c.cards.length}</span></div>`;
    });
    side+='</div>';
  });
  /* 内容 */
  let content;
  if(!cur.cards){
    content=`<div class="panel empty-ch">
      <b>第${cur.id}章 ${cur.title} · 内容待产出</b>
      本知识库按"项目管理优先"路线逐章充实中。<br>回到 AI 对话发送「继续第${cur.id}章」，即可解锁本章知识点与实战题库。
      <div><button class="btn primary" onclick="goChapter(9)">先去第9章看看效果</button></div>
    </div>`;
  }else{
    let cards=cur.cards.map((c,i)=>({c,i}));
    if(L.filter==='high') cards=cards.filter(x=>x.c.f==='high');
    if(L.filter==='mid') cards=cards.filter(x=>x.c.f==='mid');
    if(L.filter==='fav') cards=cards.filter(x=>S.fav[cur.id+'_'+x.i]);
    const m=chMastered(cur);
    content=`<div class="ch-head">
      <div>
        <h2><span class="chno">第 ${cur.id} 章</span>${cur.title}</h2>
        <div class="ch-meta">
          <span>教材页码 P${cur.page}</span><span>知识点 ${cur.cards.length} 个</span>
          <span>实战题库 ${cur.quiz.length} 道</span><span>已掌握 ${m}/${cur.cards.length}</span>
        </div>
      </div>
      <div class="ch-prog">
        <div class="sec-bar"><i style="width:${m/cur.cards.length*100}%;background:linear-gradient(90deg,#6d5ae0,#22d3ee)"></i></div>
        <button class="btn primary" onclick="startQuiz('ch',${cur.id})">刷本章 ${cur.quiz.length} 题</button>
      </div>
    </div>
    <div class="filters">
      <button class="fchip ${L.filter==='all'?'on':''}" onclick="setFilter('all')">全部 ${cur.cards.length}</button>
      <button class="fchip ${L.filter==='high'?'on':''}" onclick="setFilter('high')">高频 ${cur.cards.filter(c=>c.f==='high').length}</button>
      <button class="fchip ${L.filter==='mid'?'on':''}" onclick="setFilter('mid')">中频 ${cur.cards.filter(c=>c.f==='mid').length}</button>
      <button class="fchip ${L.filter==='fav'?'on':''}" onclick="setFilter('fav')">收藏 ${Object.keys(S.fav).filter(k=>k.startsWith(cur.id+'_')).length}</button>
    </div>
    ${cards.length?cards.map(x=>cardHtml(cur.id,x.c,x.i)).join(''):'<div class="panel blank"><b>该筛选下暂无卡片</b></div>'}`;
  }
  $('#v-learn').innerHTML=`<div class="learn-wrap"><div class="sidebar">${side}</div><div>${sel}${content}${chnav}</div></div>`;
}

/* ================= 刷题实战 ================= */
let Q=null, timerInt=null;
function stopTimer(){ if(timerInt){clearInterval(timerInt);timerInt=null} }
function startQuiz(mode,ch){
  let pool=[], label='';
  if(mode==='ch'){ const c=chById(ch); pool=(c.quiz||[]).map((_,i)=>({ch:c.id,qi:i})); label='第'+c.id+'章 '+c.title; }
  if(mode==='mix'){ pool=shuffle(allQuestions()).slice(0,20).map(x=>({ch:x.ch,qi:x.qi})); label='随机混合 · 模拟实战'; }
  if(mode==='wrong'){ pool=Object.keys(S.wrong).map(k=>{const [c,i]=k.split('_');return {ch:+c,qi:+i}}); label='错题重刷 · 直到清零'; }
  if(!pool.length){ Q=null; renderQuiz(); return }
  Q={mode,label,pool,idx:0,sel:null,results:Array(pool.length).fill(null),t0:Date.now(),phase:'run'};
  nav('quiz');
}

function quizRunner(){
  const entry=Q.pool[Q.idx];
  const c=chById(entry.ch), q=c.quiz[entry.qi];
  const answered=Q.sel!==null;
  let opts='';
  q.o.forEach((o,i)=>{
    let cls='';
    if(answered){
      if(i===q.a) cls='correct';
      else if(i===Q.sel) cls='wrong';
      else cls='dim';
    }
    opts+=`<div class="opt ${cls}" onclick="answerQ(${i})">
      <span class="ol">${LETTERS[i]}</span><span>${o}</span></div>`;
  });
  let explain='';
  if(answered){
    const ok=Q.sel===q.a;
    explain=`<div class="explain">
      <div class="er ${ok?'ok':'no'}">${ok?'✓ 回答正确':'✕ 回答错误 · 正确答案 '+LETTERS[q.a]}</div>
      <p>${q.e}</p>
      <span class="kpoint">考点 · ${q.k}</span>
      <span class="kpoint" style="margin-left:6px">第${c.id}章 ${c.title}</span>
    </div>`;
  }
  $('#v-quiz').innerHTML=`
  <div class="qbar">
    <span class="qm">${Q.label}</span>
    <span class="qi">第 ${Q.idx+1} / ${Q.pool.length} 题</span>
    <span class="qtimer" id="qtimer">${fmtSec(Date.now()-Q.t0)}</span>
    <button class="quit" onclick="quitQuiz()">放弃本次</button>
  </div>
  <div class="qprog"><i style="width:${Q.idx/Q.pool.length*100}%"></i></div>
  <div class="qcard">
    <div class="qtext">${q.q}</div>
    <div class="opts">${opts}</div>
    ${explain}
    ${answered?`<div class="qnext"><button class="btn primary" onclick="nextQ()">${Q.idx===Q.pool.length-1?'查看成绩 ▸':'下一题 ▸'}</button></div>
    <div class="kb-hint">回车键继续</div>`:''}
  </div>`;
  if(!timerInt) timerInt=setInterval(()=>{ const t=$('#qtimer'); if(t)t.textContent=fmtSec(Date.now()-Q.t0) },1000);
}
function quizSummary(){
  stopTimer();
  const total=Q.pool.length;
  const right=Q.results.filter(r=>r===true).length;
  const pct=Math.round(right/total*100);
  const used=fmtSec(Date.now()-Q.t0);
  const color=pct>=80?'#34d399':pct>=60?'#fbbf24':'#f87171';
  const comment=pct>=90?'漂亮！继续保持这个手感':pct>=70?'不错，把错题弄懂就稳了':pct>=50?'及格线附近，重点照顾错题':'别灰心，先回知识点卡片补一补再来';
  let review='';
  Q.pool.forEach((e,i)=>{
    const c=chById(e.ch), q=c.quiz[e.qi], r=Q.results[i];
    if(r===null) return;
    review+=`<div class="review-item ${r?'ok':'no'}">
      <div class="rq">${i+1}. ${q.q}</div>
      <div class="ra">${r?'<b class="good">✓ 正确</b>':'<b class="bad">✕ 错误</b>'} · 正确答案 ${LETTERS[q.a]} · 考点：${q.k} · 第${c.id}章</div>
    </div>`;
  });
  $('#v-quiz').innerHTML=`
  <div class="panel">
    <div class="sum-wrap">
      ${ring(pct/100,color)}
      <div class="sum-info">
        <h2>${pct>=60?'<span class="grad-text">本组战绩</span>':'<span style="color:#fda4af">本组战绩</span>'} · ${Q.label}</h2>
        <p style="color:#8a92b0;font-size:13.5px;margin-bottom:14px">${comment}</p>
        <div class="sum-stats">
          <div class="stat"><b>${right}</b><span>答对</span></div>
          <div class="stat"><b>${total-right}</b><span>答错</span></div>
          <div class="stat"><b>${pct}%</b><span>正确率</span></div>
          <div class="stat"><b>${used}</b><span>用时</span></div>
        </div>
      </div>
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px">
      <button class="btn primary" onclick="startQuiz('${Q.mode}',${Q.pool[0].ch})">再刷一轮</button>
      ${total-right?`<button class="btn" onclick="startQuiz('wrong')">只刷错题（${total-right} 道）</button>`:''}
      <button class="btn ghost" onclick="quitQuiz()">返回刷题首页</button>
    </div>
    ${Q.mode==='ch'?`<div style="font-size:14.5px;color:#c4cbe4;margin-bottom:10px">逐题回顾</div>`:''}
    ${review}
  </div>`;
}
function renderQuiz(){ stopTimer(); if(!Q){ quizEntry(); return } if(Q.phase==='run'){ quizRunner() } else { quizSummary() } }
function answerQ(i){
  if(!Q||Q.sel!==null) return;
  Q.sel=i;
  const entry=Q.pool[Q.idx];
  const c=chById(entry.ch), q=c.quiz[entry.qi];
  const ok=i===q.a;
  Q.results[Q.idx]=ok;
  S.qstats.att++; if(ok) S.qstats.right++;
  S.today.n++;
  const key=entry.ch+'_'+entry.qi;
  if(ok){ delete S.wrong[key] }
  else{ const w=S.wrong[key]||{ch:entry.ch,qi:entry.qi,times:0,ts:Date.now()}; w.times++; w.ts=Date.now(); S.wrong[key]=w }
  save(); updateBadge();
  quizRunner();
  setTimeout(()=>{ const ex=document.querySelector('.explain'); if(ex) ex.scrollIntoView({behavior:'smooth',block:'nearest'}) },80);
}
function nextQ(){
  if(!Q||Q.sel===null) return;
  Q.idx++; Q.sel=null;
  if(Q.idx>=Q.pool.length){ Q.phase='done'; }
  renderQuiz();
}
function quitQuiz(){ Q=null; stopTimer(); nav('quiz') }

/* ================= 错题本 ================= */
function removeWrong(k){ delete S.wrong[k]; save(); updateBadge(); renderWrong() }
function renderWrong(){
  const keys=Object.keys(S.wrong);
  if(!keys.length){
    $('#v-wrong').innerHTML=`<div class="panel blank"><b>错题本空空如也</b>
      刷题中答错的题目会自动收录到这里。<br>清零错题本 = 考场安全感拉满。
      <div><button class="btn primary" onclick="nav('quiz')">去刷题</button></div></div>`;
    return;
  }
  const items=keys.map(k=>{
    const w=S.wrong[k], c=chById(w.ch), q=c.quiz[w.qi];
    const d=new Date(w.ts); const ds=`${d.getMonth()+1}/${d.getDate()}`;
    return `<div class="wrong-item">
      <div class="wq">${q.q}
        <div class="wmeta">第${c.id}章 ${c.title} · 错 ${w.times} 次 · 最近 ${ds} · 正确答案 ${LETTERS[q.a]}</div>
      </div>
      <button class="del" onclick="removeWrong('${k}')">移除</button>
    </div>`;
  }).join('');
  $('#v-wrong').innerHTML=`
  <div class="ch-head">
    <div><h2>错题本 · ${keys.length} 道</h2>
    <div class="ch-meta"><span>答对后自动移出</span></div></div>
    <div class="ch-prog">
      <button class="btn primary" onclick="startQuiz('wrong')">一键重刷全部错题</button>
    </div>
  </div>${items}`;
}

/* ================= 搜索 ================= */
let SQ='';
function doSearch(v){ SQ=v; renderSearch() }
function hi(text,q){
  if(!q) return text;
  const idx=text.toLowerCase().indexOf(q.toLowerCase());
  if(idx<0) return esc(text.slice(0,80))+(text.length>80?'…':'');
  const s=Math.max(0,idx-30);
  const pre=text.slice(s,idx), match=text.slice(idx,idx+q.length), post=text.slice(idx+q.length,idx+q.length+70);
  return (s>0?'…':'')+esc(pre)+'<mark>'+esc(match)+'</mark>'+esc(post)+(idx+q.length+70<text.length?'…':'');
}
function plain(html){ return html.replace(/<[^>]+>/g,' ') }
function renderSearch(){
  $('#v-search').innerHTML=`
  <div class="search-box">
    <input id="searchInput" placeholder="搜索知识点，如：挣值 / 阶段关口 / EEF / 敏捷 …" value="${SQ.replace(/"/g,'&quot;')}"
      oninput="doSearch(this.value)">
  </div><div id="searchResults"></div>`;
  const inp=$('#searchInput');
  if(SQ) inp.setSelectionRange(SQ.length,SQ.length);
  if(!SQ){ $('#searchResults').innerHTML=`<div class="panel blank"><b>输入关键词，全库秒搜</b>支持标题和正文模糊搜索，点击结果直达知识点卡片。</div>`; return }
  const results=[];
  produced().forEach(c=>c.cards.forEach((cd,i)=>{
    const hay=(cd.t+plain(cd.b)+cd.m).toLowerCase();
    if(hay.includes(SQ.toLowerCase())) results.push({c,cd,i});
  }));
  if(!results.length){ $('#searchResults').innerHTML=`<div class="panel blank"><b>没有找到「${esc(SQ)}」</b>换个关键词试试，或去刷两道题冷静一下。</div>`; return }
  $('#searchResults').innerHTML=results.slice(0,30).map(r=>`
    <div class="result-item" onclick="goChapterCard(${r.c.id},${r.i})">
      <div class="rt">${hi(r.cd.t,SQ)}</div>
      <div class="rs">${hi(plain(r.cd.b),SQ)}</div>
      <div class="rmeta">第${r.c.id}章 ${r.c.title} · ${{high:'高频',mid:'中频',low:'低频'}[r.cd.f]}</div>
    </div>`).join('')+(results.length>30?`<div class="panel blank">共 ${results.length} 条结果，仅显示前 30 条，请用更精确的关键词</div>`:'');
}

/* ================= 键盘快捷键 ================= */
document.addEventListener('keydown',e=>{
  if(!Q||Q.phase!=='run') return;
  const inInput=/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if(inInput) return;
  if(Q.sel===null){
    const map={'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3};
    const k=e.key.toLowerCase();
    if(k in map){ e.preventDefault(); answerQ(map[k]) }
  }else{
    if(e.key==='Enter'||e.key==='ArrowRight'){ e.preventDefault(); nextQ() }
  }
});

/* ================= 启动 ================= */
initDaily();
updateBadge();
renderDash();
</script>
